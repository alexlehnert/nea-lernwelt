<!doctype html><html lang="de"><head><meta charset=utf8><script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/sync.js"></script><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lernwelt"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5B3FE6"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Bildergeschichte</title>
<style>
/* Bildergeschichte (Deutsch, Klasse 5): zu Bildern erzählen. Lernpfad mit 10 Kapiteln, jedes beginnt mit Erklär-Karten,
   danach eine Runde mit gemischten Aufgaben (Duell gut/schwach, Fehler-Detektiv, Dann-Monster, Redezeichen, Zeitlupe …).
   Entdecken = Geschichten-Bibliothek mit Röntgenblick und Schreibwerkstatt, Großer Test = Probe-GLN.
   Comic-Bilder: bilder/bg/*.svg (gezeichnet von tools/bildergeschichte_comics.py). Farben aus lernwelt-app.css. */
:root{color-scheme:light dark;
  --m-a:#FDE68A; --m-r:#BFDBFE; --m-j:#BBF7D0; --m-g:#FBCFE8; --m-f:#DDD6FE; --m-x:#FCA5A5}
@media (prefers-color-scheme:dark){:root{--m-a:#6B5410; --m-r:#1E4A80; --m-j:#1C5A36; --m-g:#6E2350; --m-f:#3D3270; --m-x:#7F1D1D}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--lw-bg);color:var(--lw-ink);font-family:var(--lw-f-b);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--lw-f-d);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.55rem}
h3{font-size:1.15rem}
p{margin:0}
b{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--lw-brand);outline-offset:2px}
svg{display:block}
.small{font-size:.88rem;color:var(--lw-muted)}
.lead{font-size:1.05rem}
.panel{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lw-de)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px}
.ghost svg,.go svg{width:18px;height:18px;flex:none}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* Startseite */
.hero{display:flex;flex-direction:column;gap:8px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.strip img,.pics img{width:100%;height:auto;display:block;border-radius:10px}
.stations{display:flex;flex-direction:column;gap:12px}
.st{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px;border-radius:22px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px}
.st:active{transform:translateY(3px);border-bottom-width:2px}
.st .ico{width:56px;height:56px;flex:none;border-radius:16px;background:var(--lw-de-s);color:var(--lw-de);display:grid;place-items:center;font:700 1.2rem/1 var(--lw-f-d)}
.st .ico svg{width:30px;height:30px}
.st h3{font-size:1.1rem}
.st p{font-size:.9rem;color:var(--lw-muted);line-height:1.3;margin-top:2px}
.st .n{font:700 12px var(--lw-f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--lw-de)}
.st.extra .ico{background:var(--lw-sun);color:#5B3A00}
.stars{display:flex;gap:2px;margin-top:6px}
.stars svg{width:20px;height:20px}
.toggle{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:18px;background:var(--lw-card);border:2px solid var(--lw-line)}
.toggle .sw{flex:none;width:48px;height:28px;border-radius:99px;background:var(--lw-line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--lw-de)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(20px)}

/* Erklär-Karten */
.chead{display:flex;align-items:center;gap:12px}
.backb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px 6px 10px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-muted)}
.backb svg{width:18px;height:18px}
.card-x{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.card-x h3{font-size:1.3rem;color:var(--lw-de)}
.card-x ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dotsnav{display:flex;gap:6px;justify-content:center}
.dotsnav i{width:9px;height:9px;border-radius:50%;background:var(--lw-line)}
.dotsnav i.on{background:var(--lw-de);width:22px;border-radius:99px}
.bsp{border-left:5px solid var(--lw-de);background:var(--lw-de-s);border-radius:0 14px 14px 0;padding:10px 12px;line-height:1.5}
.bsp.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg)}
.bsp small{display:block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lw-muted);margin-bottom:2px}
.kurve{width:100%;height:auto}
.spick{background:var(--lw-de-s);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.spick ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Runde */
.topbar{display:flex;align-items:center;gap:12px}
.track{flex:1;display:flex;gap:4px}
.track i{flex:1;height:12px;border-radius:99px;background:var(--lw-line)}
.track i.ok{background:var(--lw-ok)}
.track i.no{background:var(--lw-bad)}
.track i.now{background:var(--lw-de)}
.q b{display:block;font:700 1.25rem/1.25 var(--lw-f-d)}
.q .lk{display:inline-block;margin-bottom:6px;padding:3px 10px;border-radius:99px;background:var(--lw-de-s);color:var(--lw-de);font:700 .8rem/1.2 var(--lw-f-b);letter-spacing:.04em}
.stage{display:flex;flex-direction:column;gap:14px}
.pic{width:100%;max-width:440px;align-self:center;border-radius:12px;display:block}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.txt{background:var(--lw-card);border:2px solid var(--lw-line);border-radius:18px;padding:14px;font-size:1.05rem;line-height:1.65}
.txt p+p{margin-top:8px}
.txt .lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lw-muted)}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{width:100%;padding:12px 14px;display:flex;align-items:center;justify-content:flex-start;text-align:left;line-height:1.35}
.opt.c{justify-content:center;text-align:center}
.opt:disabled{cursor:default}
.opt .lt{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lw-de-s);color:var(--lw-de);display:grid;place-items:center;font:700 .95rem/1 var(--lw-f-d);margin-right:10px}
.duel{display:flex;flex-direction:column;gap:10px}
.duel .opt{flex-direction:column;align-items:stretch;gap:6px;font-family:var(--lw-f-b);font-weight:400;font-size:1rem;line-height:1.55}
.duel .opt b{font-family:var(--lw-f-d);font-size:.95rem;color:var(--lw-de)}
.why{display:flex;flex-direction:column;gap:8px}
.why p{font:700 1.05rem/1.3 var(--lw-f-d)}
.denk{background:var(--lw-sun);color:#3A2600;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.denk p{font:700 1rem/1.3 var(--lw-f-d)}
.denk .chips{display:flex;flex-wrap:wrap;gap:8px}
.denk .chip{background:#fff;color:#3A2600;border-color:#E8B400}
.denk .chip.ok{background:var(--lw-ok-bg);border-color:var(--lw-ok);color:var(--lw-ok-ink)}
.denk .chip.no{background:var(--lw-bad-bg);border-color:var(--lw-bad);color:var(--lw-bad-ink)}
.denk .tip{font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{font-size:1.02rem}
.chip.big{min-width:52px;min-height:52px;font:700 1.5rem/1 var(--lw-f-d);justify-content:center}
.chip:disabled{opacity:.4}
.chip.sel{background:var(--lw-de);border-color:var(--lw-de);color:#fff}
/* Lücken */
.gap{display:inline-block;min-width:2.2em;padding:0 .3em;border-radius:8px;border:2px dashed var(--lw-line);color:var(--lw-muted);text-align:center;line-height:1.3}
.gap.now{border-color:var(--lw-de);background:var(--lw-de-s);color:var(--lw-de);animation:blink 1.2s infinite}
.gap.ok{border-style:solid;border-color:var(--lw-ok);background:var(--lw-ok-bg);color:var(--lw-ok-ink);animation:none}
.gap.bad{border-style:solid;border-color:var(--lw-bad);background:var(--lw-bad-bg);color:var(--lw-bad-ink);animation:none}
.gap s{opacity:.7;margin-right:4px}
.gap.punct{min-width:1.4em;font-weight:700}
@keyframes blink{50%{opacity:.55}}
/* Bilder sortieren */
.ordergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ob{position:relative;padding:0;border:3px solid var(--lw-line);border-radius:14px;background:var(--lw-card);overflow:hidden}
.ob img{width:100%;display:block}
.ob .badge{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:var(--lw-de);color:#fff;display:grid;place-items:center;font:700 1.1rem/1 var(--lw-f-d);box-shadow:0 2px 0 var(--lw-de-d)}
.ob.on{border-color:var(--lw-de)}
.ob.ok{border-color:var(--lw-ok)}
.ob.bad{border-color:var(--lw-bad)}
.ob .hidenum{position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:var(--lw-card)}
/* Fehler-Detektiv */
.find{line-height:2}
.w{display:inline;border-radius:6px;padding:2px 1px;cursor:pointer;-webkit-user-select:none;user-select:none}
.w:active{background:var(--lw-soft)}
.w.miss{background:var(--lw-bad-bg);text-decoration:line-through;text-decoration-color:var(--lw-bad)}
.w.hit{background:var(--lw-ok-bg);color:var(--lw-ok-ink);font-weight:700}
.w.left{background:var(--lw-bad-bg);color:var(--lw-bad-ink);font-weight:700;outline:2px dashed var(--lw-bad)}
.fix{display:inline-block;font-size:.85rem;font-weight:700;color:var(--lw-ok-ink);background:var(--lw-card);border:2px solid var(--lw-ok);border-radius:8px;padding:0 6px;margin:0 3px;line-height:1.5}
.counter{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--lw-muted);font-size:.95rem}
.counter i{width:16px;height:16px;border-radius:50%;border:2px solid var(--lw-de)}
.counter i.on{background:var(--lw-de)}
.found{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.found div{background:var(--lw-ok-bg);border-radius:12px;padding:8px 10px}
/* Zeitlupe */
.blocks{display:flex;flex-direction:column;gap:8px}
.blk{width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);line-height:1.4;font-size:1rem}
.blk.sel{border-color:var(--lw-de);background:var(--lw-de-s)}
.blk.ok{border-color:var(--lw-ok);background:var(--lw-ok-bg)}
.blk.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg)}
.blk small{display:block;font-size:.78rem;font-weight:700;color:var(--lw-muted);margin-top:2px}
.meter{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.95rem}
.meter .bar{flex:1;height:12px;border-radius:99px;background:var(--lw-line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--lw-bad);transition:width .25s,background .25s}
.meter .bar i.good{background:var(--lw-ok)}
/* Jury */
.jury{display:flex;flex-direction:column;gap:10px}
.jr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.jr .nm{font-weight:700}
.jr .nm small{display:block;font-weight:400;color:var(--lw-muted);font-size:.8rem}
.jst{display:flex;gap:2px}
.jst button{width:40px;height:40px;padding:0;border:none;background:none;display:grid;place-items:center}
.jst svg{width:30px;height:30px}
.cmp{font-size:.88rem;font-weight:700}
.cmp.ok{color:var(--lw-ok-ink)}.cmp.no{color:var(--lw-bad-ink)}
/* Röntgenblick */
.m-a,.m-r,.m-j,.m-g,.m-f,.m-x{border-radius:4px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.xr .m-a{background:var(--m-a)}.xr .m-r{background:var(--m-r)}.xr .m-j{background:var(--m-j)}.xr .m-g{background:var(--m-g)}.xr .m-f{background:var(--m-f)}
.xr .m-x{background:var(--m-x);text-decoration:underline wavy var(--lw-bad);text-underline-offset:3px}
.xnote{display:none}
.xr .xnote{display:inline;font-size:.78rem;font-weight:700;color:var(--lw-bad-ink);margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.legend span{border-radius:6px;padding:2px 8px;background:var(--lw-soft)}
.legend .m-a{background:var(--m-a)}.legend .m-r{background:var(--m-r)}.legend .m-j{background:var(--m-j)}.legend .m-g{background:var(--m-g)}.legend .m-f{background:var(--m-f)}.legend .m-x{background:var(--m-x)}
.libitem{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:18px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:4px}
.libitem img{width:84px;flex:none;border-radius:8px}
.libitem h3{font-size:1.02rem}
.note{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px}
.note.n1{background:var(--lw-ok-bg);color:var(--lw-ok-ink)}.note.n3{background:var(--lw-soft);color:var(--lw-brand)}.note.n5{background:var(--lw-bad-bg);color:var(--lw-bad-ink)}
.reader{display:flex;flex-direction:column;gap:12px}
.reader .para{display:flex;flex-direction:column;gap:6px}
.reader .para img{width:100%;max-width:360px;border-radius:10px}
.reader .para p{font-size:1.08rem;line-height:1.7}
.reader h2{font-size:1.4rem}
.spk{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-de)}
.spk svg{width:20px;height:20px}
.spk.on{background:var(--lw-de);color:#fff;border-color:var(--lw-de-d)}
.kommentar{background:var(--lw-soft);border-radius:16px;padding:12px 14px;font-size:.95rem;display:flex;flex-direction:column;gap:4px}
/* Schreibwerkstatt */
textarea{width:100%;min-height:260px;border-radius:16px;border:2px solid var(--lw-line);background:var(--lw-card);color:var(--lw-ink);font:1.05rem/1.6 var(--lw-f-b);padding:12px}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--lw-card);border:2px solid var(--lw-line);font-size:.98rem;line-height:1.35}
.check input{width:22px;height:22px;flex:none;accent-color:var(--lw-de);margin:0}
.wc{font-size:.9rem;color:var(--lw-muted);font-weight:700}
/* Ergebnis */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:64px;height:64px}
.bigstars .s1{animation:pop .5s .1s both}.bigstars .s2{animation:pop .5s .35s both}.bigstars .s3{animation:pop .5s .6s both}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.result .go,.result .ghost{width:100%}
.chatbox{min-width:0}
.fb p{margin-top:4px}
.fb .better{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--lw-card);font-size:.95rem;line-height:1.5}
.lw-sheet .ghost{width:100%;min-height:50px}
@media (max-width:380px){.strip{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><!--lw-look--><link rel="stylesheet" href="/lernwelt-app.css"><script src="/lernwelt-app.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"><style id="lw-look">
/* Übungs-Bausteine im Lernwelt-Look (wie im Konzept: Antwortkacheln, grüne Rückmeldung, dicke Knöpfe) */
.go,.next,.check{background:var(--lw-c);color:#fff;border:none;border-radius:16px;min-height:54px;padding:12px 22px;
  font-family:var(--lw-f-d);font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 5px 0 var(--lw-cd)}
.go:active,.next:active,.check:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lw-cd)}
.ghost{background:var(--lw-card);color:var(--lw-ink);border:2px solid var(--lw-line);border-bottom-width:4px;border-radius:14px;min-height:44px;font-weight:700}
.chip{background:var(--lw-card);color:var(--lw-ink);border:2px solid var(--lw-line);border-radius:99px;min-height:40px;padding:6px 14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--lw-c);border-color:var(--lw-c);color:#fff}
.progress{height:14px;background:var(--lw-line);border-radius:99px}
.progress i{background:var(--lw-ok);border-radius:99px}
.card{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;box-shadow:none}
.card-top{background:none;color:var(--lw-c);padding:16px 18px 0;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.card-top .tag{font-size:.8rem}
.card-body{background-image:none}
.prompt{font-family:var(--lw-f-d);font-weight:700}
.opts{gap:12px}
.opt{background:var(--lw-card);color:var(--lw-ink);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:18px;min-height:60px;
  font-family:var(--lw-f-d);font-weight:600;font-size:1.12rem}
.opt:not(:disabled):active{transform:translateY(3px);border-bottom-width:2px}
.opt.ok{border:3px solid var(--lw-ok);border-bottom-width:6px;background:var(--lw-ok-bg);color:var(--lw-ok-ink)}
.opt.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg);color:var(--lw-bad-ink)}
.tile{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:4px;border-radius:12px;font-family:var(--lw-f-d);font-weight:700}
.slots{border-radius:16px}
.slots .tile{background:var(--lw-cs);border-color:var(--lw-c)}
.inp input,.field{border-radius:16px}
.fb{border-radius:22px;padding:16px 16px 18px;gap:8px}
.fb.ok{background:var(--lw-ok-bg);border:none;color:var(--lw-ink)}
.fb.bad{background:var(--lw-bad-bg);border:none;color:var(--lw-ink)}
.fb strong{font-family:var(--lw-f-d);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:10px}

<script>
"use strict";
/* ================= Grundlagen ================= */
const $=s=>document.querySelector(s);
const app=$("#app");
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IMG=id=>`bilder/bg/${id}.svg`;
const imgTag=(id,cls)=>`<img class="${cls||"pic"}" src="${IMG(id)}" alt="Bild ${id.split("-")[1]}" loading="lazy">`;
const STRIP=s=>`<div class="strip">${[1,2,3,4].map(n=>imgTag(s+"-"+n,"")).join("")}</div>`;
/* Spannungskurve für die Erklär-Karte */
const KURVE=`<svg class="kurve" viewBox="0 0 320 130" role="img" aria-label="Spannungskurve: Einleitung flach, Hauptteil steigt, Höhepunkt oben, Schluss fällt ab">
 <path d="M10 110 L70 104 Q150 92 200 22 Q228 60 300 104" fill="none" stroke="var(--lw-de)" stroke-width="5" stroke-linecap="round"/>
 <circle cx="200" cy="22" r="8" fill="var(--lw-sun)" stroke="var(--lw-ink)" stroke-width="2"/>
 <g font-family="Atkinson Hyperlegible,system-ui,sans-serif" font-size="12" font-weight="700" fill="var(--lw-ink)">
 <text x="12" y="126">Einleitung</text><text x="104" y="126">Hauptteil</text><text x="168" y="12">Höhepunkt</text><text x="256" y="126">Schluss</text></g></svg>`;

/* ================= Zustand ================= */
const KEY="bildergeschichte-v1";
const DEF={best:{},seen:{},denk:true,texte:[]};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return Object.assign(JSON.parse(JSON.stringify(DEF)),s)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* kurze Töne */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function beep(fs,len,type,vol){const a=ac();if(!a)return;let t=a.currentTime+.02;fs.forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type=type||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02);t+=len*.75})}
const sfxOk=()=>beep([1046.5,1318.5],.14);
const sfxBad=()=>beep([233,175],.18,"triangle",.12);
const sfxPop=()=>beep([784],.08,"sine",.12);

/* ================= Vorlesen (wie in Ethik: Sätze einzeln, nur Stimmen auf dem Gerät) ================= */
const TTS={ok:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window,v:null,run:0,keep:null,awake:false};
function pickVoices(){if(!TTS.ok)return;const all=speechSynthesis.getVoices()||[];
  let vs=all.filter(v=>/^de([-_]|$)/i.test(v.lang));const dd=vs.filter(v=>/de[-_]DE/i.test(v.lang));if(dd.length)vs=dd;
  const loc=vs.filter(v=>v.localService);if(loc.length)vs=loc;
  TTS.v=vs.find(v=>/anna|petra|helena|katja|marlene|vicki/i.test(v.name))||vs.find(v=>v.default)||vs[0]||null}
if(TTS.ok){pickVoices();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",pickVoices);else speechSynthesis.onvoiceschanged=pickVoices}
function wake(){if(!TTS.ok||TTS.awake)return;TTS.awake=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;u.lang="de-DE";TTS.keep=u;speechSynthesis.speak(u)}catch(e){}
  pickVoices()}
["touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,wake,{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(document.hidden)hush()});
const talking=()=>TTS.ok&&(speechSynthesis.speaking||speechSynthesis.pending);
function stopNow(){if(talking()){speechSynthesis.cancel();TTS.cut=Date.now()}}
function hush(){TTS.run++;stopNow();document.querySelectorAll(".spk.on").forEach(b=>{b.classList.remove("on");b.lastChild.textContent=" Vorlesen"})}
function chunks(t){const out=[];(t.match(/[^.!?…]+[.!?…]*["“”»«„]?\s*/g)||[t]).forEach(s=>{s=s.trim();if(!s)return;
  while(s.length>180){let k=s.lastIndexOf(", ",180);if(k<60)k=s.lastIndexOf(" ",180);if(k<1)k=180;out.push(s.slice(0,k+1));s=s.slice(k+1).trim()}
  if(s)out.push(s)});
  return out.reduce((a,s)=>{if(a.length&&(a[a.length-1].length+s.length<120))a[a.length-1]+=" "+s;else a.push(s);return a},[])}
function speak(text,onend){if(!TTS.ok){if(onend)setTimeout(onend,0);return false}
  const id=++TTS.run,parts=chunks(text);let k=0;
  const one=()=>{if(id!==TTS.run)return;if(k>=parts.length){if(onend)onend();return}
    const u=new SpeechSynthesisUtterance(parts[k++]);u.lang="de-DE";if(TTS.v)u.voice=TTS.v;u.rate=.95;TTS.keep=u;
    let fired=false;const fin=()=>{if(fired)return;fired=true;clearTimeout(wd);one()};
    u.onend=fin;u.onerror=fin;const wd=setTimeout(fin,2500+u.text.length*110);
    if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.speak(u)};
  stopNow();const wait=90-(Date.now()-(TTS.cut||0));wait>0?setTimeout(one,wait):one();return true}

{id:"farbe",t:"Farbe ins Bild",d:"Treffende Verben, Adjektive und Sinne",ico:"🎨",n:7,
 cards:[
  {h:"Treffende Verben",b:`<p>„gehen“, „sagen“, „machen“ sind blass. Zeig genau, <b>wie</b> etwas passiert.</p><p><b>gehen:</b> schleichen, rennen, stapfen, flitzen, schlendern, stürmen</p><p><b>sehen:</b> starren, entdecken, beobachten, blinzeln</p><div class="bsp bad"><small>blass</small>Die Katze ging zum Glas.</div><div class="bsp"><small>treffend</small>Die Katze schlich lautlos zum Glas.</div>`},
  {h:"Adjektive und Sinne",b:`<p>Adjektive malen Bilder im Kopf: der <b>rote</b> Drachen, die <b>knorrige</b> Eiche.</p><p>Was <b>hört</b>, <b>riecht</b>, <b>fühlt</b> die Figur? Die Äste knarrten. Der Schnee knirschte unter den Stiefeln.</p><div class="bsp bad"><small>Zu viel des Guten</small>Der große, rote, schöne, tolle, bunte Drachen.</div><p>Ein bis zwei passende Adjektive reichen.</p>`}],
 spick:["Treffende Verben statt ging, sagte, machte","1–2 passende Adjektive","Sinne: hören, riechen, fühlen"],

{id:"gefuehle",t:"Gefühle und Gedanken",d:"Innere Handlung zeigen statt nur nennen, Präteritum",ico:"💓",n:8,
 cards:[
  {h:"Zeigen statt nennen",b:`<p>Schreib nicht nur, <b>dass</b> eine Figur Angst hat. Zeig, <b>wie</b> man es merkt.</p><div class="bsp bad"><small>nur genannt</small>Lena war wütend.</div><div class="bsp"><small>gezeigt</small>Lena spürte, wie ihr das Blut in den Kopf stieg.</div><p><b>Angst:</b> Herz klopft, Knie zittern · <b>Schreck:</b> erstarren, Atem stockt · <b>Trauer:</b> Hals wird eng, Tränen · <b>Freude:</b> jubeln, strahlen · <b>Schlechtes Gewissen:</b> knallrot werden</p>`},
  {h:"Gedanken",b:`<p>Was denkt die Figur gerade? Das ist die <b>innere Handlung</b>. Daraus entsteht Spannung.</p><div class="bsp">Was würde Opa sagen? · Wie hatte sie Paul nur verdächtigen können? · „Bitte nicht Flossi!“, dachte Emma.</div>`},
  {h:"Präteritum",b:`<p>Geschichten stehen im <b>Präteritum</b>:</p><p>gehen → ging · rennen → rannte · rufen → rief · sehen → sah · fallen → fiel · springen → sprang · ziehen → zog</p><div class="bsp bad"><small>Falsch</small>Dann hat sie das Brot genommen. (Perfekt) · Sie rennt los. (Präsens)</div>`}],

{id:"hoehepunkt",t:"Der Höhepunkt in Zeitlupe",d:"Den spannendsten Moment auf 3–5 Sätze ausbauen",ico:"⏱️",n:7,
 cards:[
  {h:"Zeitlupe",b:`<p>Im Höhepunkt läuft die Zeit langsam, wie in Zeitlupe im Film. Du erzählst den spannendsten Moment <b>Schritt für Schritt</b>.</p><div class="bsp bad"><small>zu knapp</small>Ich zog an der Schnur, aber er bewegte sich nicht.</div>`},
  {h:"Die Höhepunkt-Formel",b:`<ul><li>👂 <b>Sinne:</b> Was sehe, höre, rieche ich? Die Äste knarrten.</li><li>💓 <b>Gefühl:</b> Mein Herz klopfte bis zum Hals.</li><li>💭 <b>Gedanke:</b> Wenn ich losließ, wäre er für immer weg.</li><li>💬 <b>Rede:</b> „Bitte, komm runter!“, flehte ich.</li><li>✋ <b>Handlung:</b> Ich suchte einen Ast zum Klettern.</li></ul><p><b>3 bis 5 Sätze</b> mehr als sonst. Der Höhepunkt ist der längste Absatz!</p>`}],

{id:"schluss",t:"Schluss und Überschrift",d:"Reaktionen vor dem Ende, runder Schluss, gute Überschrift",ico:"🏁",n:7,
 cards:[
  {h:"Erst reagieren, dann enden",b:`<p>Bevor die Geschichte gut ausgeht, zeigst du, wie die Figuren <b>reagieren</b>: erschrocken, erleichtert, beleidigt? Am besten mit wörtlicher Rede.</p><div class="bsp bad"><small>zu abrupt</small>Mit einem Ruck fiel der Drachen ins Gras. Wir gingen nach Hause.</div><div class="bsp"><small>mit Reaktion</small>Ich traute meinen Augen nicht. „Braver Hund!“, jubelte ich und drückte ihn ganz fest.</div>`},
  {h:"Ein guter Schluss",b:`<ul><li>ist <b>kurz</b> (1–3 Sätze)</li><li>rundet ab, zum Beispiel mit „Seitdem …“</li><li>greift gern den <b>Anfang</b> oder die Überschrift wieder auf</li><li><b>nicht:</b> „Dann bin ich aufgewacht.“ oder „Ende.“</li></ul>`},
  {h:"Die Überschrift",b:`<p>Sie macht neugierig, <b>verrät aber nicht das Ende</b>.</p><div class="bsp bad"><small>verrät alles</small>Die Krähe hat das Brot geklaut</div><div class="bsp"><small>macht neugierig</small>Wer hat mein Pausenbrot?</div>`}],
 spick:["Reaktion der Figuren vor dem Ende","Schluss kurz, rundet ab","Gern den Anfang aufgreifen","Kein „Ende“, kein Traum","Überschrift neugierig, ohne das Ende"],

  {k:"mc",q:"Welche Reaktion passt zwischen Bild 3 und dem Schluss?",img:"katze-4",o:["Erleichtert atmete Emma aus. „Das hast du jetzt davon“, sagte sie zu Minka.","Dann war alles wieder gut.","Emma ging ins Bett.","Ende."],ex:"Emmas Erleichterung und ihre Worte verbinden den Schreck mit dem guten Ende."},

  {k:"duel",q:"Welcher Schluss ist besser?",img:"drachen-4",A:"Am Abend erzählte ich Opa alles. Er lachte: „Gebaut haben wir ihn zusammen, aber gerettet hat ihn Fips.“",B:"Dann bin ich aufgewacht, und alles war nur ein Traum.",best:"A",why:["A greift Opa aus der Einleitung wieder auf.","B ist überraschender.","A ist länger."],ex:"Traum-Schlüsse machen die ganze Geschichte unwichtig. A rundet ab."},

  {k:"mc",q:"Was gehört NICHT in einen guten Schluss?",o:["Eine ganz neue spannende Handlung","Ein Rückgriff auf den Anfang","Ein kurzer Satz mit „Seitdem“","Eine lustige Pointe"],ex:"Im Schluss beginnt nichts Neues mehr."}

/* ================= Runde ================= */
let R=null;
function startRound(id){const c=chOf(id);hush();
  /* jede Aufgabenart möglichst einmal, Rest zufällig */
  const n=Math.min(c.tasks.length,lwFragen(c.n));const byK={};c.tasks.forEach(t=>(byK[t.k]=byK[t.k]||[]).push(t));
  let list=Object.values(byK).map(a=>pick(a));list=shuffle(list).slice(0,n);
  const rest=shuffle(c.tasks.filter(t=>!list.includes(t)));while(list.length<n&&rest.length)list.push(rest.pop());
  if(c.test){const o=c.tasks.filter(t=>list.includes(t));list=o}else list=shuffle(list);
  /* Reihenfolge-Aufgabe zuerst, wenn vorhanden (Bilder kennenlernen) */
  list.sort((a,b)=>(b.k==="order")-(a.k==="order"));
  R={id,i:0,ok:0,res:[],tasks:list,n:list.length};showTask()}
function track(){$("#track").innerHTML=Array.from({length:R.n},(_,i)=>`<i class="${i<R.res.length?(R.res[i]?"ok":"no"):(i===R.i?"now":"")}"></i>`).join("")}

function showTask(){const t=R.tasks[R.i];R.locked=false;hush();

    <div class="q"><span class="lk">${lk}</span><b>${esc(t.q||Q[t.k]||"")}</b></div>

  if(t.imgs)cb.insertAdjacentHTML("beforeend",`<div class="pics">${t.imgs.map(x=>imgTag(x,"")).join("")}</div>`);
  if(t.s&&!["gaps","dann","find","stretch"].includes(t.k))cb.insertAdjacentHTML("beforeend",`<div class="txt">${esc(t.s)}</div>`);

const Q={order:"Bring die Bilder in die richtige Reihenfolge. Tippe sie nacheinander an.",jury:"Lies die Geschichte und vergib Sterne. Wie streng ist die Lehrerin?"};

function done(ok,ex,extra){if(R.locked)return;R.locked=true;
  R.res.push(ok);if(ok)R.ok++;ok?sfxOk():sfxBad();track();
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Stark!"]):"Nicht ganz"}</strong>${ex?`<p>${ex}</p>`:""}${extra||""}`;
  const nx=document.createElement("button");nx.className="next";nx.type="button";nx.textContent=R.i+1>=R.n?"Ergebnis":"Weiter";
  nx.onclick=()=>{R.i++;R.i>=R.n?endRound():showTask()};
  lwSheet($("#cb"),ok,[fb,nx])}

/* Lücken nacheinander füllen */
function gapParse(s){const parts=[];let last=0;s.replace(/\[\[(.*?)\]\]/g,(m,inner,pos)=>{parts.push({txt:s.slice(last,pos)});parts.push({gap:inner.split("|")});last=pos+m.length;return m});parts.push({txt:s.slice(last)});return parts}
T.gaps=(t,cb)=>{const parts=gapParse(t.s),gaps=parts.filter(p=>p.gap);let gi=0,err=0;
  const txt=document.createElement("div");txt.className="txt";cb.appendChild(txt);
  const ch=document.createElement("div");ch.className="chips";cb.appendChild(ch);
  const draw=()=>{let k=0;txt.innerHTML=parts.map(p=>{if(!p.gap)return esc(p.txt);const j=k++;const g=gaps[j];
      const cls="gap"+(t.punct?" punct":"")+(j===gi?" now":g.v!=null?(g.v===g.gap[0]?" ok":" bad"):"");
      const inner=g.v!=null?(g.v===g.gap[0]?esc(g.v):`<s>${esc(g.v)}</s>${esc(g.gap[0])}`):(j===gi?"?":"&nbsp;");
      return `<span class="${cls}">${inner}</span>`}).join("");
    if(gi>=gaps.length){ch.innerHTML="";return}
    ch.innerHTML=shuffle(gaps[gi].gap).map(o=>`<button class="chip${t.punct?" big":""}">${esc(o)}</button>`).join("");
    ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(R.locked)return;const g=gaps[gi];g.v=b.textContent;if(g.v!==g.gap[0]){err++;sfxBad()}else sfxPop();gi++;draw();
      if(gi>=gaps.length)done(err===0,(err?`Richtig heißt es: <b>${esc(parts.map(p=>p.gap?p.gap[0]:p.txt).join(""))}</b><br>`:"")+esc(t.ex))})};
  draw()};
/* Dann-Monster: jede Lücke mit einem anderen Satzanfang */
T.dann=(t,cb)=>{const parts=gapParse(t.s),gaps=parts.filter(p=>p.gap);let gi=0,err=0;const used=new Set();
  const txt=document.createElement("div");txt.className="txt";cb.appendChild(txt);
  cb.insertAdjacentHTML("beforeend",`<p class="small">👾 „Dann“ füttert das Monster. Jeder Satzanfang darf nur einmal vorkommen.</p>`);
  const ch=document.createElement("div");ch.className="chips";cb.appendChild(ch);
  const opts=shuffle(t.pool.concat(t.bad));
  const draw=()=>{let k=0;txt.innerHTML=parts.map(p=>{if(!p.gap)return esc(p.txt);const j=k++,g=gaps[j];
      if(g.v!=null)return `<span class="gap ${g.bad?"bad":"ok"}">${g.bad?`<s>${esc(g.v)}</s>`:esc(g.v)}</span>`;
      return `<span class="gap${j===gi?" now":""}">${j===gi?"Dann?":"Dann"}</span>`}).join("");
    if(gi>=gaps.length){ch.innerHTML="";return}
    ch.innerHTML=opts.map(o=>`<button class="chip" ${used.has(o)&&!t.bad.includes(o)?"disabled":""}>${esc(o)}</button>`).join("");
    ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(R.locked)return;const v=b.textContent,g=gaps[gi];g.v=v;g.bad=t.bad.includes(v);
      if(g.bad){err++;sfxBad()}else{used.add(v);sfxPop()}gi++;draw();
      if(gi>=gaps.length)done(err===0,(err?"Das Monster hat ein „Dann“ gefressen. ":"Kein einziges Dann!")+" "+esc(t.ex))})};
  draw()};
/* Fehler-Detektiv: Wörter antippen */
T.find=(t,cb)=>{const toks=[];let last=0;
  t.s.replace(/\{x\|([^{}|]*)\|([^{}]*)\}/g,(m,w,fix,pos)=>{t.s.slice(last,pos).split(/(\s+)/).forEach(x=>x&&toks.push(/^\s+$/.test(x)?{sp:x}:{w:x}));toks.push({w,fix,err:1});last=pos+m.length;return m});
  t.s.slice(last).split(/(\s+)/).forEach(x=>x&&toks.push(/^\s+$/.test(x)?{sp:x}:{w:x}));
  const total=toks.filter(x=>x.err).length;let found=0,miss=0;
  cb.insertAdjacentHTML("beforeend",`<div class="counter" id="ctr"></div>`);
  const txt=document.createElement("div");txt.className="txt find";txt.innerHTML=toks.map((x,i)=>x.sp?x.sp:`<span class="w" data-i="${i}" role="button" tabindex="0">${esc(x.w)}</span>`).join("");cb.appendChild(txt);
  const ctr=()=>{$("#ctr").innerHTML=`Gefunden: ${Array.from({length:total},(_,i)=>`<i class="${i<found?"on":""}"></i>`).join("")} · Fehlversuche: ${miss}/3`};ctr();
  const finish=()=>{txt.querySelectorAll(".w").forEach(s=>{const x=toks[+s.dataset.i];if(x.err&&!x.hit){s.classList.add("left");s.insertAdjacentHTML("afterend",`<span class="fix">${esc(x.fix)}</span>`)}});
    done(found===total&&miss<=1,(found<total?"Die rot umrandeten Stellen hast du übersehen. ":"")+esc(t.ex))};
  txt.querySelectorAll(".w").forEach(s=>{const hit=()=>{if(R.locked)return;const x=toks[+s.dataset.i];if(x.hit||s.classList.contains("miss"))return;
    if(x.err){x.hit=1;found++;sfxPop();s.classList.add("hit");s.insertAdjacentHTML("afterend",`<span class="fix">${esc(x.fix)}</span>`)}else{miss++;sfxBad();s.classList.add("miss")}
    ctr();if(found===total||miss>=3)finish()};
    s.onclick=hit;s.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();hit()}}})};
/* Zeitlupe: passende Bausteine auswählen */
T.stretch=(t,cb)=>{const sel=new Set();const blocks=shuffle(t.blocks.map((b,i)=>Object.assign({i},b)));

  const upd=()=>{const ch=t.blocks.filter((b,i)=>sel.has(i));$("#para").textContent=[t.base].concat(ch.map(b=>b.t)).join(" ");
    const n=1+ch.length;$("#mn").textContent=n+(n===1?" Satz":" Sätze");const m=$("#mbar");m.style.width=Math.min(100,n*20)+"%";m.classList.toggle("good",n>=4);$("#chk").disabled=ch.length<1};
  cb.querySelectorAll(".blk").forEach(b=>b.onclick=()=>{if(R.locked)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle("sel",sel.has(i));b.setAttribute("aria-pressed",sel.has(i));sfxPop();upd()});
  $("#chk").onclick=()=>{if(R.locked)return;let bad=0,good=0;
    cb.querySelectorAll(".blk").forEach(b=>{const x=t.blocks[+b.dataset.i],on=sel.has(+b.dataset.i);b.disabled=true;
      if(x.ok){if(on){good++;b.classList.add("ok")}}else if(on){bad++;b.classList.add("bad")}
      b.insertAdjacentHTML("beforeend",`<small>${x.ok?"passt: "+esc(x.k):"passt nicht: "+esc(x.k)}</small>`)});
    $("#chk").remove();
    done(bad===0&&good>=3,(bad?"Einige Bausteine passen nicht. ":good<3?"Nimm mindestens drei passende Bausteine. ":"")+esc(t.ex))}};
/* Jury: Sterne pro Bereich, Vergleich mit der Lehrerin */
T.jury=(t,cb)=>{const tx=textOf(t.text);const v=JURY.map(()=>0);
  cb.insertAdjacentHTML("beforeend",`<div class="txt reader xr"><h3>${esc(tx.title)}</h3>${tx.parts.map(([l,s])=>`<p>${esc(plain(s))}</p>`).join("")}</div>
    <div class="panel jury" id="jury">${JURY.map((n,i)=>`<div class="jr"><span class="nm">${n}<small>${JURYS[i]}</small></span><span class="jst" data-r="${i}">${[1,2,3,4,5].map(k=>`<button data-k="${k}" aria-label="${k} Sterne">${I.star(false)}</button>`).join("")}</span></div>`).join("")}
    <button class="go" id="chk" disabled>Mit der Lehrerin vergleichen</button></div>`);
  cb.querySelectorAll(".jst").forEach(r=>r.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(R.locked)return;const i=+r.dataset.r,k=+b.dataset.k;v[i]=k;sfxPop();
    r.querySelectorAll("button").forEach(x=>x.innerHTML=I.star(+x.dataset.k<=k));$("#chk").disabled=v.some(x=>!x)}));
  $("#chk").onclick=()=>{if(R.locked)return;let near=0;
    cb.querySelectorAll(".jr").forEach((row,i)=>{const d=Math.abs(v[i]-tx.jury[i]);if(d<=1)near++;
      row.querySelector(".jst").insertAdjacentHTML("afterend",`<span class="cmp ${d<=1?"ok":"no"}" style="grid-column:1/-1">Lehrerin: ${tx.jury[i]} ★${d<=1?" ✓":""}</span>`)});
    $("#chk").remove();
    done(near>=JURY.length-1,`${near} von ${JURY.length} Bereichen wie die Lehrerin. ${esc(tx.komm)}`,`<div class="better">In der Bibliothek kannst du diesen Text mit Röntgenblick lesen.</div>`)}};
/* Chat */
T.chat=(t,cb)=>{if(!window.lwChat){done(true,"Der Chat lädt gerade nicht.");return}
  const box=document.createElement("div");box.className="chatbox";cb.appendChild(box);
  lwChat(box,{title:t.title,sub:t.sub,ava:t.ava,fach:"de",people:{Paul:"#4CAF6E"},lines:t.lines,
    onEnd:res=>done(res.every(r=>r.ok),"Wörtliche Rede: vorne Doppelpunkt, hinten Komma, Gedanken zählen auch.")})};

/* ================= Ergebnis ================= */
function endRound(){const c=chOf(R.id),n=R.n,ok=R.ok,q=ok/n;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[c.id]=Math.max(S.best[c.id]||0,st);save();
  const k=CH.indexOf(c),nxt=CH[k+1];
  const cheer=["Dranbleiben, das wird!","Gut gemacht!","Stark!","Super, du bist eine echte Erzählerin!"][st];
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    <p class="lead"><b>${ok} von ${n}</b> richtig</p>
    <div class="spick"><b>📌 Spickzettel: ${esc(c.t)}</b><ul>${c.spick.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    ${c.test?`<button class="go" id="wr">${I.pen}Jetzt selbst schreiben</button><button class="ghost" id="again">Test nochmal</button>`:`<button class="go" id="again">Nochmal üben</button>`}
    ${nxt&&st>=2&&!c.test?`<button class="ghost" id="nx">Weiter: ${esc(nxt.t)}</button>`:""}
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  const id=c.id;R=null;
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;if($("#nx"))$("#nx").onclick=()=>openCh(nxt.id);if($("#wr"))$("#wr").onclick=()=>write("katze");
  scrollTo(0,0)}

/* ================= Entdecken: Bibliothek, Leser, Schreibwerkstatt ================= */
function library(){R=null;hush();
  const nl=n=>`<span class="note n${n}">${n===1?"Note 1":n===3?"Note 3":"Note 5"}</span>`;
  const probeDone=(S.best.probe||0)>0||S.texte.some(x=>x.story==="katze");
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>
    <div><span class="eyebrow">Entdecken</span><h2>Geschichten-Bibliothek</h2><p class="small" style="margin-top:4px">Lies gute und schwache Geschichten. Mit dem Röntgenblick siehst du, was einen guten Text ausmacht.</p></div>
    <div class="stations">${TEXTS.filter(t=>!t.test||probeDone).map(t=>`<button class="libitem" data-t="${t.id}">${imgTag(t.story+"-1","")}<span class="grow"><h3>${esc(t.title)}</h3><span class="small">${esc(STORIES[t.story].t)} · ${t.form}</span><br>${nl(t.note)}</span></button>`).join("")}
    ${probeDone?"":`<p class="small">🔒 Die Mustergeschichte zur Probe-GLN erscheint, wenn du den Großen Test gemacht hast.</p>`}</div>
    <div><span class="eyebrow">Schreibwerkstatt</span><h2 style="font-size:1.3rem">Selbst schreiben</h2></div>
    <div class="stations">${Object.keys(STORIES).map(s=>`<button class="libitem" data-w="${s}">${imgTag(s+"-1","")}<span class="grow"><h3>${esc(STORIES[s].t)}</h3><span class="small">${esc(STORIES[s].figs)}</span></span></button>`).join("")}</div>
    ${S.texte.length?`<div><span class="eyebrow">Meine Geschichten</span></div><div class="stations">${S.texte.map((x,i)=>`<button class="libitem" data-m="${i}">${imgTag(x.story+"-1","")}<span class="grow"><h3>${esc(x.title||STORIES[x.story].t)}</h3><span class="small">${esc(x.d)} · ${wc(x.txt)} Wörter</span></span></button>`).reverse().join("")}</div>`:""}`;
  $("#cbk").onclick=home;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>reader(b.dataset.t));
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>write(b.dataset.w));
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>write(S.texte[+b.dataset.m].story,+b.dataset.m));
  scrollTo(0,0)}
function reader(id){hush();const t=textOf(id);let xr=true;
  const draw=()=>{app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Bibliothek</button></div>
    <div class="reader"><div><span class="eyebrow">${esc(STORIES[t.story].t)} · ${t.form}</span><h2>${esc(t.title)}</h2></div>
      <div class="row"><button class="toggle grow" id="xr" aria-pressed="${xr}"><span class="grow"><b>Röntgenblick</b></span><span class="sw" aria-hidden="true"></span></button><button class="spk" id="spk">${I.spk}<span> Vorlesen</span></button></div>
      ${xr?LEGEND:""}
      <div class="${xr?"xr":""}" style="display:flex;flex-direction:column;gap:14px">${paraHTML(t,true)}</div>
      <div class="kommentar"><b>Was die Lehrerin sagen würde (${t.note===1?"Note 1":t.note===3?"Note 3":"Note 5"})</b><span>${esc(t.komm)}</span></div></div>`;
    $("#cbk").onclick=library;$("#xr").onclick=()=>{xr=!xr;draw()};
    const sp=$("#spk");sp.onclick=()=>{if(sp.classList.contains("on")){hush();return}hush();wake();sp.classList.add("on");sp.lastChild.textContent=" Stopp";
      speak(t.title+". "+t.parts.map(p=>plain(p[1])).join(" "),()=>{sp.classList.remove("on");sp.lastChild.textContent=" Vorlesen"})}};
  draw();scrollTo(0,0)}
const wc=s=>(s.trim().match(/\S+/g)||[]).length;
const CHECK=["Überschrift macht neugierig und verrät nicht das Ende","Einleitung: wer, wo, wann","Jedes Bild hat einen eigenen Absatz","Der Leser versteht, warum alles passiert","Kein Satz beginnt mit „Dann“","In jedem Bild steht wörtliche Rede, richtig gesetzt","Gefühle und Gedanken sind gezeigt","Der Höhepunkt ist der längste Absatz","Die Figuren reagieren vor dem Schluss","Alles im Präteritum"];
function write(story,idx){hush();const old=idx!=null?S.texte[idx]:null;const draftKey="draft-"+story;
  let draft=old?old.txt:(S[draftKey]||"");let title=old?old.title:"";
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Bibliothek</button></div>
    <div><span class="eyebrow">Schreibwerkstatt</span><h2>${esc(STORIES[story].t)}</h2><p class="small" style="margin-top:4px">Figuren: ${esc(STORIES[story].figs)}. Schreib im Präteritum, jedes Bild ein Absatz.</p></div>
    <div class="pics">${[1,2,3,4].map(n=>imgTag(story+"-"+n,"")).join("")}</div>
    <input id="ti" class="field" style="width:100%;min-height:48px;border:2px solid var(--lw-line);background:var(--lw-card);color:var(--lw-ink);font:700 1.1rem var(--lw-f-d);padding:8px 12px" placeholder="Überschrift" value="${esc(title)}">
    <textarea id="ta" placeholder="Einleitung …&#10;&#10;Bild 1 …">${esc(draft)}</textarea>
    <div class="row"><span class="wc grow" id="wc"></span></div>
    <div class="panel"><b>Checkliste: Hake ab, was du geschafft hast</b><div class="check">${CHECK.map((c,i)=>`<label><input type="checkbox" id="c${i}">${esc(c)}</label>`).join("")}</div></div>
    <button class="go" id="sv">Geschichte speichern</button>
    ${TEXTS.some(t=>t.story===story&&t.note===1)?`<button class="ghost" id="ml">${I.book}Mustergeschichte lesen</button>`:""}`;
  const ta=$("#ta"),upd=()=>{const n=wc(ta.value),p=ta.value.split(/\n\s*\n/).filter(x=>x.trim()).length;$("#wc").textContent=`${n} Wörter · ${p} Absätze${n<150?" · Ziel: etwa 250 Wörter":""}`};upd();
  ta.oninput=()=>{upd();if(!old){S[draftKey]=ta.value;save()}};
  $("#cbk").onclick=library;
  $("#sv").onclick=()=>{const txt=ta.value.trim();if(!txt)return;const e={story,title:$("#ti").value.trim(),txt,d:new Date().toLocaleDateString("de-DE")};
    if(old)S.texte[idx]=e;else{S.texte.push(e);delete S[draftKey]}save();beep([523.25,659.25,783.99],.16);
    $("#sv").textContent="Gespeichert ✓";setTimeout(()=>{const b=$("#sv");if(b)b.textContent="Geschichte speichern"},1600)};
  if($("#ml"))$("#ml").onclick=()=>{const t=TEXTS.find(t=>t.story===story&&t.note===1);if(story==="katze"&&!(S.best.probe||0)&&!S.texte.some(x=>x.story==="katze")){$("#ml").textContent="Erst speichern oder den Großen Test machen";return}reader(t.id)};
  scrollTo(0,0)}
function writePick(){library()}

/* Lernwelt: direkt ins Kapitel (bildergeschichte.html#rede …), Anker stehen in hefte.js */
function kapitelSprung(){const id=location.hash.slice(1);if(id==="bibliothek"){library();return true}if(!chOf(id))return false;openCh(id);return true}
window.lwStart?lwStart('home',kapitelSprung):(kapitelSprung()||home());
</script>
