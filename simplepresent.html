<!doctype html><html lang="de"><head><meta charset=utf8><script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/sync.js"></script><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lernwelt"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5B3FE6"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Simple Present</title>
<style>
/* Simple Present (Englisch, Gymnasium Klasse 5): Vorbereitung auf die Klassenarbeit.
   Lernpfad mit 8 Kapiteln (Erklär-Karten, dann eine Runde mit Denkfrage „he/she/it?“), großer Übungsteil mit 6 Aufgabenarten
   wie auf den Arbeitsblättern G9a/G11a/Bingo (Text markieren, Lückentext, Fragen aus Stichworten, Kurzantworten, Fragewörter, Bingo-Sätze),
   Probe-Arbeit mit 6 Teilen und Punkten (Auswertung am Schluss), Entdecken = Regelheft. Nur Vokabeln, die Nea schon hatte. */
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--lw-bg);color:var(--lw-ink);font-family:var(--lw-f-b);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--lw-f-d);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.55rem}
h3{font-size:1.15rem}
p{margin:0}
b{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible,.u:focus-visible{outline:3px solid var(--lw-brand);outline-offset:2px}
svg{display:block}
.small{font-size:.9rem;color:var(--lw-muted)}
.lead{font-size:1.05rem}
.panel{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lw-en)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px}
.ghost svg,.go svg{width:20px;height:20px;flex:none}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* Startseite */
.hero{display:flex;flex-direction:column;gap:8px}
.hero .emo{font-size:2.4rem;line-height:1;letter-spacing:.1em}
.stations{display:flex;flex-direction:column;gap:12px}
.st{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px;border-radius:22px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px}
.st:active{transform:translateY(3px);border-bottom-width:2px}
.st .ico{width:56px;height:56px;flex:none;border-radius:16px;background:var(--lw-en-s);color:var(--lw-en);display:grid;place-items:center;font-size:1.7rem;line-height:1}
.st h3{font-size:1.12rem}
.st p{font-size:.92rem;color:var(--lw-muted);line-height:1.3;margin-top:2px}
.st .n{font:700 12px var(--lw-f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--lw-en)}
.st.extra .ico{background:var(--lw-sun);color:#5B3A00}
.sect{margin-top:6px}
.stars{display:flex;gap:2px;margin-top:6px}
.stars svg{width:20px;height:20px}
.toggle{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:18px;background:var(--lw-card);border:2px solid var(--lw-line)}
.toggle .sw{flex:none;width:48px;height:28px;border-radius:99px;background:var(--lw-line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--lw-en)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(20px)}

/* Erklär-Karten */
.chead{display:flex;align-items:center;gap:12px}
.backb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px 6px 10px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-muted)}
.backb svg{width:18px;height:18px}
.card-x{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.card-x h3{font-size:1.3rem;color:var(--lw-en)}
.card-x ul,.card-x ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.dotsnav{display:flex;gap:6px;justify-content:center}
.dotsnav i{width:9px;height:9px;border-radius:50%;background:var(--lw-line)}
.dotsnav i.on{background:var(--lw-en);width:22px;border-radius:99px}
.bsp{border-left:5px solid var(--lw-en);background:var(--lw-en-s);border-radius:0 14px 14px 0;padding:10px 12px;line-height:1.5}
.bsp.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg)}
.bsp small{display:block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lw-muted);margin-bottom:2px}
.spick{background:var(--lw-en-s);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.spick ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rfleg{display:flex;flex-direction:column;gap:6px}
.rfleg span{display:flex;gap:10px;align-items:baseline}
.rfleg i{font-style:normal;flex:none;min-width:30px;text-align:center;font-weight:700;border-radius:8px;padding:0 6px}

/* Text */
.txt{background:var(--lw-card);border:2px solid var(--lw-line);border-radius:18px;padding:14px 16px;font-size:1.12rem;line-height:1.75}
.txt p+p{margin-top:10px}
.txh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.txh .tico{font-size:2.2rem;line-height:1;flex:none}
.txh h3{font-size:1.25rem}
.lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lw-muted);line-height:1.3}
.txt p.mk{background:var(--lw-sun);color:#3A2600;border-radius:10px;margin-inline:-8px;padding:2px 8px}
.u{border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.u.now{background:var(--lw-sun);color:#3A2600}
.tap .u{cursor:pointer;padding:1px 2px;background:var(--lw-soft)}
.tap .u:active{background:var(--lw-en-s)}
.tap .u.hit{background:var(--lw-ok-bg);color:var(--lw-ok-ink);outline:2px solid var(--lw-ok)}
.tap .u.miss{background:var(--lw-bad-bg);color:var(--lw-bad-ink);text-decoration:line-through}
.tap .u.left{background:var(--lw-ok-bg);color:var(--lw-ok-ink);outline:2px dashed var(--lw-ok)}
details.ref{background:var(--lw-card);border:2px solid var(--lw-line);border-radius:18px}
details.ref>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;font-weight:700;color:var(--lw-en);cursor:pointer}
details.ref>summary::-webkit-details-marker{display:none}
details.ref>summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);transition:transform .2s}
details.ref[open]>summary::after{transform:rotate(-135deg)}
details.ref .txt{border:none;border-top:2px solid var(--lw-line);border-radius:0 0 16px 16px}
.beleg{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--lw-card);font-size:.98rem;line-height:1.5}

/* Hören */
.hear{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;text-align:center}
.hear .tico{font-size:3rem;line-height:1}
.play{width:112px;height:112px;border-radius:50%;border:none;background:var(--lw-en);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--lw-en-d)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lw-en-d)}
.play svg{width:52px;height:52px}
.play:disabled{opacity:.4;box-shadow:none}
.play.on{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--lw-en-d),0 0 0 14px var(--lw-en-s)}}
.ears{display:flex;gap:6px;justify-content:center;font-weight:700;color:var(--lw-muted)}
.ears i{font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid var(--lw-en);display:grid;place-items:center;font-size:.95rem}
.ears i.on{background:var(--lw-en);color:#fff}
.replay{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-radius:18px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-en);width:100%;justify-content:center}
.replay.on{background:var(--lw-en);color:#fff;border-color:var(--lw-en-d)}
.replay svg{width:22px;height:22px}
.vorher{text-align:left;align-self:stretch}
.vorher ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.spk{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-en)}
.spk svg{width:20px;height:20px}
.spk.on{background:var(--lw-en);color:#fff;border-color:var(--lw-en-d)}

/* Runde */
.topbar{display:flex;align-items:center;gap:12px}
.track{flex:1;display:flex;gap:4px}
.track i{flex:1;height:12px;border-radius:99px;background:var(--lw-line)}
.track i.ok{background:var(--lw-ok)}
.track i.no{background:var(--lw-bad)}
.track i.half{background:linear-gradient(90deg,var(--lw-ok) 50%,var(--lw-bad) 50%)}
.track i.now{background:var(--lw-en)}
.q b{display:block;font:700 1.3rem/1.25 var(--lw-f-d)}
.q .lk{display:inline-block;margin-bottom:6px;padding:3px 10px;border-radius:99px;background:var(--lw-en-s);color:var(--lw-en);font:700 .82rem/1.2 var(--lw-f-b);letter-spacing:.04em}
.stage{display:flex;flex-direction:column;gap:14px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{width:100%;padding:12px 14px;display:flex;align-items:center;justify-content:flex-start;text-align:left;line-height:1.35}
.opt:disabled{cursor:default}
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picgrid .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;min-height:118px;font-size:1rem}
.picgrid .opt .e{font-size:2.8rem;line-height:1}
.tipp{align-self:flex-start}
.denk{background:var(--lw-sun);color:#3A2600;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.denk p{font:700 1.02rem/1.3 var(--lw-f-d)}
.denk .chips{display:flex;flex-wrap:wrap;gap:8px}
.denk .chip{background:#fff;color:#3A2600;border-color:#E8B400}
.denk .chip.ok{background:var(--lw-ok-bg);border-color:var(--lw-ok);color:var(--lw-ok-ink)}
.denk .chip.no{background:var(--lw-bad-bg);border-color:var(--lw-bad);color:var(--lw-bad-ink)}
.denk .tip{font-size:.95rem}
.denk .chip:disabled{opacity:.55}
.denk .chip.ok,.denk .chip.no{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{font-size:1.05rem;min-height:46px}
.chip:disabled{opacity:.4}
/* richtig / falsch / steht nicht im Text */
.rf{display:flex;flex-direction:column;gap:12px}
.rfi{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:4px;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rfi.ok{border-color:var(--lw-ok);background:var(--lw-ok-bg)}
.rfi.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg)}
.rfi p{font-weight:700;line-height:1.35}
.rfb{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px}
.rfb button{min-height:50px;padding:4px 6px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font:700 .92rem/1.15 var(--lw-f-b);color:var(--lw-ink)}
.rfb button:disabled{cursor:default}
.rfb button.sel{background:var(--lw-en);border-color:var(--lw-en-d);color:#fff}
.rfb button.right{background:var(--lw-ok);border-color:var(--lw-ok);color:#fff}
.rfb button.wrong{background:var(--lw-bad);border-color:var(--lw-bad);color:#fff}
.rfi small{font-size:.88rem;font-weight:700}
/* Reihenfolge */
.ord{display:flex;flex-direction:column;gap:10px}
.oc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:58px;border-radius:18px;border:2px solid var(--lw-line);border-bottom-width:5px;background:var(--lw-card);line-height:1.35}
.oc .num{flex:none;width:34px;height:34px;border-radius:50%;border:2px dashed var(--lw-line);display:grid;place-items:center;font:700 1.1rem/1 var(--lw-f-d);color:var(--lw-muted)}
.oc.on{border-color:var(--lw-en)}
.oc.on .num{border:none;background:var(--lw-en);color:#fff}
.oc.ok{border-color:var(--lw-ok);background:var(--lw-ok-bg)}
.oc.ok .num{background:var(--lw-ok)}
.oc.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg)}
.oc.bad .num{background:var(--lw-bad)}
.oc small{display:block;font-size:.85rem;font-weight:700;color:var(--lw-ok-ink)}
/* Lücken */
.gap{display:inline-block;min-width:2.4em;padding:0 .3em;border-radius:8px;border:2px dashed var(--lw-line);color:var(--lw-muted);text-align:center;line-height:1.35}
.gap.now{border-color:var(--lw-en);background:var(--lw-en-s);color:var(--lw-en);animation:blink 1.2s infinite}
.gap.ok{border-style:solid;border-color:var(--lw-ok);background:var(--lw-ok-bg);color:var(--lw-ok-ink);animation:none}
.gap.bad{border-style:solid;border-color:var(--lw-bad);background:var(--lw-bad-bg);color:var(--lw-bad-ink);animation:none}
.gap s{opacity:.7;margin-right:4px}
@keyframes blink{50%{opacity:.55}}
/* Teil-Karte im Test */
.part{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.part .big{font-size:3rem;line-height:1}
/* Ergebnis */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:64px;height:64px}
.bigstars .s1{animation:pop .5s .1s both}.bigstars .s2{animation:pop .5s .35s both}.bigstars .s3{animation:pop .5s .6s both}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.result .go,.result .ghost{width:100%}
.teile{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.teile div{background:var(--lw-card);border:2px solid var(--lw-line);border-radius:16px;padding:10px}
.teile b{display:block;font:700 1.4rem/1.2 var(--lw-f-d)}
.libitem{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:18px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:4px}
.libitem .tico{font-size:2rem;line-height:1;flex:none;width:44px;text-align:center}
.libitem h3{font-size:1.05rem}
.fb p{margin-top:4px}
.lw-sheet .ghost{width:100%;min-height:50px}
@media (max-width:360px){.rfb{grid-template-columns:1fr}.picgrid .opt{min-height:100px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- Simple Present: eigene Bausteine ---- */
.kw{background:var(--lw-sun);color:#3A2600;border-radius:6px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent{font:600 1.22rem/1.5 var(--lw-f-d);background:var(--lw-card);border:2px solid var(--lw-line);border-radius:18px;padding:14px 16px}
.sent .hint{font:700 .95rem/1.2 var(--lw-f-b);color:var(--lw-muted);white-space:nowrap}
.sw-line{display:flex;gap:6px;flex-wrap:wrap;font:600 1.12rem/1.4 var(--lw-f-d)}
.sw-line span{background:var(--lw-soft);border-radius:10px;padding:2px 10px}
.inp{display:flex;flex-direction:column;gap:8px}
.field{width:100%;min-height:56px;font:600 1.18rem/1.3 var(--lw-f-d);padding:10px 14px;border:2px solid var(--lw-line);border-bottom-width:4px;border-radius:16px;background:var(--lw-card);color:var(--lw-ink)}
.field:focus{outline:none;border-color:var(--lw-en)}
.field.ok{border-color:var(--lw-ok);background:var(--lw-ok-bg);color:var(--lw-ok-ink)}
.field.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg);color:var(--lw-bad-ink)}
.keys{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keys .chip{min-width:48px;min-height:44px;font-size:1.2rem}
.keys .small{flex:1;min-width:140px}
.pre{font:700 1.15rem/1.3 var(--lw-f-d);color:var(--lw-muted)}
.line{min-height:62px;border:2px dashed var(--lw-line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--lw-card)}
.line.ok{border-style:solid;border-color:var(--lw-ok);background:var(--lw-ok-bg)}
.line.bad{border-style:solid;border-color:var(--lw-bad);background:var(--lw-bad-bg)}
.line .end{font:700 1.3rem/1 var(--lw-f-d);color:var(--lw-muted)}
.line .ph{color:var(--lw-muted);font-size:.95rem;padding:0 6px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:48px;padding:6px 14px;font-size:1.12rem;color:var(--lw-ink)}
.tile:disabled{opacity:.25}
.tap .u.sel{background:var(--lw-en-s);outline:2px solid var(--lw-en);color:var(--lw-ink)}
.txt.tap{line-height:2.1}
.yn{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font:700 1rem/1.2 var(--lw-f-b)}
.yn.y{background:var(--lw-ok-bg);color:var(--lw-ok-ink)}
.yn.n{background:var(--lw-bad-bg);color:var(--lw-bad-ink)}
.bcell{display:flex;align-items:center;gap:14px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:18px;padding:12px 14px}
.bcell .bico{font-size:2.2rem;line-height:1;flex:none}
.bcell b{font:700 1.2rem/1.2 var(--lw-f-d);display:block}
.bcell .who{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:1.25rem;color:#2D3F9E}
.tbl{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:1.05rem}
.tbl td{padding:6px 10px;background:var(--lw-soft)}
.tbl td:first-child{border-radius:10px 0 0 10px;font-weight:700;width:42%}
.tbl td:last-child{border-radius:0 10px 10px 0}
.tbl tr.hi td{background:var(--lw-sun);color:#3A2600}
.tbl em{font-style:normal;color:var(--lw-en);font-weight:700;text-decoration:underline;text-decoration-thickness:3px}
.tbl tr.hi em{color:#9A3412}
.gex{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:8px 10px;background:var(--lw-soft);line-height:1.4}
.gex .gpic{flex:none;font-weight:700;width:22px;text-align:center}
.gex small{display:block;font-size:.88rem;color:var(--lw-muted)}
.gex.gok{background:var(--lw-ok-bg)}.gex.gok .gpic{color:var(--lw-ok)}
.gex.gno{background:var(--lw-bad-bg)}.gex.gno .gpic{color:var(--lw-bad)}.gex.gno b{text-decoration:line-through;text-decoration-thickness:2px}
.card-x .gex b em,.gex b em{font-style:normal;color:var(--lw-en);text-decoration:underline;text-decoration-thickness:3px}

<script>

/* ================= Grundlagen ================= */
const $=s=>document.querySelector(s);
const app=$("#app");
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= Zustand ================= */
const KEY="simple-present-v1";
const DEF={best:{},seen:{},denk:true,probe:null};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return Object.assign(JSON.parse(JSON.stringify(DEF)),s)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02);t+=len*.75})}
const sfxOk=()=>beep([1046.5,1318.5],.14);
const sfxBad=()=>beep([233,175],.18,"triangle",.12);
const sfxPop=()=>beep([784],.08,"sine",.12);

  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`,

/* ================= Inhalte =================

   (G9a, G11a, Bingo). Geprüft per Skript (siehe PR).

     gap   s = Satz mit [[richtig|falsch|…]] → Antwort antippen
     mc    q = Auftrag (deutsch), e = englischer Satz (optional), o = Antworten (erste richtig), de:1 = Antworten deutsch
     type  s = Satz mit ___ , h = Hinweis in Klammern, a = richtige Lösungen → eintippen
     build w = Stichworte, a = Zielsatz, x = falsche Bausteine → Bausteine antippen
     write w = Stichworte, a = richtige Sätze → ganzen Satz eintippen (pre = Text davor, z. B. Antwort bei Fragewort-Fragen)
     short e = Frage, y = Ja/Nein, a = Kurzantwort, o = falsche Kurzantworten (dann zum Antippen, sonst eintippen)
     mark  tx = Text, {Wort} = gehört markiert
     fix   s = Satz, {Wort} = der Fehler, c = richtiger Satz

   <p>Steht ein <b>Vokal</b> vor dem y (ay, ey, oy, uy), kommt nur <b>s</b> dazu:</p>${EX("play → play<em>s</em>")}${EX("say → say<em>s</em>")}${EX("buy → buy<em>s</em>")}${EX("stay → stay<em>s</em>")}
   <p class="small">Aus Neas Heft: „The birds fly in the sky.“ Mehrere Vögel = they → kein s. Aber: A bird flies.</p>`,say:"hurries, flies, copies, worries. But: plays, says, buys, stays."},
  {h:"Der Sonderfall",b:`${EX("have → <em>has</em>","nicht haves!")}<p class="merk">-s · -es nach o und Zischlaut · Konsonant + y → ies · have → has</p>`,say:"has"}
 ],

{id:"not",sec:"pfad",ico:"🚫",t:"Verneinung mit don't und doesn't",d:"Das s wandert ins doesn't, das Verb bleibt in der Grundform",
 cards:[
  {h:"don't und doesn't",b:`<table class="tbl"><tr><td>I / you</td><td><em>don't</em> like cheese</td></tr><tr class="hi"><td>he / she / it</td><td><em>doesn't</em> like apples</td></tr><tr><td>we / you / they</td><td><em>don't</em> like bananas</td></tr></table>
   <p>don't = do not · doesn't = does not</p><p class="merk">don't / doesn't + Grundform</p>`,say:"I don't like cheese. He doesn't like apples. They don't like bananas."},
  {h:"Das s wandert!",b:`<p>Im verneinten Satz steckt das <b>s</b> schon in <b>does</b>n't. Das Verb bleibt deshalb <b>ohne s</b>.</p>
   ${EX("He like<em>s</em> cats. → He <em>doesn't</em> like cats.")}${NO("He doesn't likes cats.","zweimal s geht nicht")}${NO("He don't like cats.","he → doesn't")}${OK("He doesn't like cats.")}`,say:"He likes cats. He doesn't like cats."},
  {h:"Das Verb nicht vergessen!",b:`<p>Nach don't / doesn't muss immer noch das <b>Verb</b> kommen.</p>
   ${NO("He doesn't a sister.")}${OK("He doesn't <em>have</em> a sister.")}${NO("Mila doesn't has a brother.")}${OK("Mila doesn't <em>have</em> a brother.","has wird wieder zu have")}${OK("Ruby doesn't <em>do</em> her homework.","doesn't do ist richtig!")}`,say:"He doesn't have a sister. Mila doesn't have a brother. Ruby doesn't do her homework."},
  {h:"Nicht bei to be und can",b:`<p>Bei <b>am, is, are</b> und bei <b>can</b> brauchst du kein don't / doesn't:</p>
   ${OK("Ruby <em>isn't</em> crazy.")}${OK("They <em>aren't</em> at home.")}${OK("I <em>can't</em> sing.")}${NO("Ruby doesn't be crazy.")}${NO("I don't can sing.")}`,say:"Ruby isn't crazy. They aren't at home. I can't sing."}
 ],

{id:"frage",sec:"pfad",ico:"❓",t:"Fragen mit Do und Does",d:"Do/Does + Subjekt + Grundform",

   <p>Das s steckt in <b>Does</b>. Das Verb bleibt ohne s:</p>${NO("Does she likes cats?")}${OK("Does she <em>like</em> cats?")}${NO("Does Lisa gets up at 6.30?")}${OK("Does Lisa <em>get up</em> at 6.30?")}`,say:"Does she like cats? Does Lisa get up at six thirty?"},

 ],

{id:"kurz",sec:"pfad",ico:"💬",t:"Kurzantworten",d:"Yes, they do. No, he doesn't.",
 cards:[
  {h:"So geht die Kurzantwort",b:`<p class="merk">Yes / No + Personalpronomen + do / does (don't / doesn't)</p>
   ${EX("Do you like carrots? – Yes, I <em>do</em>.")}${EX("Do you like cheese? – No, I <em>don't</em>.")}${EX("Does Ryan like cats? – No, he <em>doesn't</em>.")}${EX("Does Sherlock like Ryan? – Yes, he <em>does</em>.")}`,say:"Do you like carrots? Yes, I do. Do you like cheese? No, I don't. Does Ryan like cats? No, he doesn't."},
  {h:"Personalpronomen statt Namen!",b:`<p>In der Kurzantwort steht <b>kein Name</b>, sondern I, you, he, she, it, we oder they.</p>
   ${EX("Do Ben and Sarah go to the same school?")}${NO("Yes, Ben and Sarah do.")}${OK("Yes, <em>they</em> do.")}
   ${EX("Does your father work on Sundays?")}${OK("No, <em>he</em> doesn't.")}`,say:"Do Ben and Sarah go to the same school? Yes, they do. Does your father work on Sundays? No, he doesn't."},
  {h:"Kein Verb in der Kurzantwort",b:`${NO("Yes, I like.")}${NO("Yes, I do like.")}${OK("Yes, I <em>do</em>.")}
   <p>Wer ist gefragt? Frage mit <b>you</b> → Antwort mit <b>I</b>. Frage mit <b>you and your friend</b> → <b>we</b>.</p>
   ${EX("Do you and your friend listen to the same music? – Yes, <em>we</em> do.")}`,say:"Yes, I do. Do you and your friend listen to the same music? Yes, we do."},
  {h:"Bei to be und can",b:`${EX("Is Ruby crazy? – No, she <em>isn't</em>.")}${EX("Are you busy? – Yes, I <em>am</em>.")}${EX("Can Karam sing? – Yes, he <em>can</em>.")}`,say:"Is Ruby crazy? No, she isn't. Can Karam sing? Yes, he can."}
 ],
 spick:["Yes, + Pronomen + do/does. No, + Pronomen + don't/doesn't.","Kein Name: Yes, they do. (nicht: Yes, Ben and Sarah do.)","Kein Verb: Yes, I do. (nicht: Yes, I like.)","you → I, you and your friend → we.","to be / can: No, she isn't. Yes, he can."],
 tasks:[
  {k:"short",e:"Do you like chocolate?",y:1,a:"Yes, I do.",o:["Yes, you do.","Yes, I like."],sub:"you",p:"I",ex:"Frage mit you → Antwort mit I."},
  {k:"short",e:"Does your father work on Sundays?",y:0,a:"No, he doesn't.",o:["No, he don't.","No, your father doesn't."],sub:"your father",p:"he",ex:"your father → he → doesn't."},
  {k:"short",e:"Do German children play hockey at school?",y:0,a:"No, they don't.",o:["No, they doesn't.","No, German children don't."],sub:"German children",p:"they",ex:"German children → they → don't."},
  {k:"short",e:"Do you and your friend listen to the same music?",y:1,a:"Yes, we do.",o:["Yes, you do.","Yes, I do."],sub:"you and your friend",p:"we",ex:"you and your friend → we."},
  {k:"short",e:"Do you do your homework after school?",y:1,a:"Yes, I do.",o:["Yes, I do my homework.","Yes, I does."],sub:"you",p:"I",ex:"Kurz: Yes, I do."},
  {k:"short",e:"Does your neighbour copy from you?",y:0,a:"No, he doesn't.",o:["No, they don't.","No, he don't."],sub:"your neighbour",p:"he",ex:"your neighbour = ein Nachbar → he (oder she) → doesn't."},
  {k:"short",e:"Does Sherlock like Lily's cat?",y:0,a:"No, he doesn't.",o:["No, Sherlock doesn't.","No, he don't."],sub:"Sherlock",p:"he",ex:"Sherlock → he → doesn't."},
  {k:"short",e:"Does Ruby do silly things?",y:1,a:"Yes, she does.",o:["Yes, she do.","Yes, Ruby does."],sub:"Ruby",p:"she",ex:"Ruby → she → does."},
  {k:"short",e:"Do Ryan and Ruby live in Greenwich?",y:1,a:"Yes, they do.",o:["Yes, they does.","Yes, Ryan and Ruby do."],sub:"Ryan and Ruby",p:"they",ex:"Ryan and Ruby → they → do."},
  {k:"short",e:"Is Sherlock crazy?",y:1,a:"Yes, he is.",o:["Yes, he does.","Yes, he do."],ex:"Frage mit Is → Antwort mit is."},
  {k:"short",e:"Does school start at nine o'clock?",y:1,a:"Yes, it does.",o:["Yes, it do.","Yes, school does."],sub:"school",p:"it",ex:"school → it → does."},
  {k:"short",e:"Do your parents watch TV?",y:0,a:"No, they don't.",o:["No, they doesn't.","No, they don't watch."],sub:"your parents",p:"they",ex:"your parents → they → don't."},
  {k:"short",e:"Can Karam sing?",y:1,a:"Yes, he can.",o:["Yes, he does.","Yes, he do."],ex:"Frage mit Can → Antwort mit can."},
  {k:"short",e:"Does Mila have a brother?",y:1,a:"Yes, she does.",sub:"Mila",p:"she",ex:"Mila → she → does."},
  {k:"short",e:"Do you like broccoli?",y:0,a:"No, I don't.",sub:"you",p:"I",ex:"you → I → don't."},
  {k:"short",e:"Does Jonas play football?",y:1,a:"Yes, he does.",sub:"Jonas",p:"he",ex:"Jonas → he → does."}
 ]},

{id:"fehler",sec:"pfad",ico:"🕵️",t:"Fehler-Detektivin",d:"Die typischen Fehler aus Arbeiten finden und verbessern",
 cards:[
  {h:"Die 6 häufigsten Fehler",b:`${NO("Mila have a brother.","→ Mila has a brother.")}${NO("My sister does like strawberries.","→ My sister likes strawberries.")}${NO("He doesn't likes cats.","→ He doesn't like cats.")}

/* ================= Kapitel und Sterne ================= */
const ALLCH=CH.concat([PROBE]);
const chOf=id=>ALLCH.find(c=>c.id===id);
const stars=c=>S.best[c.id]||0;
const THIRD=["he","she","it"];
const PRON=["i","you","he","she","it","we","they"];

/* ================= Text-Hilfen ================= */
const ap=s=>String(s).replace(/[’‘`´]/g,"'");
function norm(s){s=ap(s).toLowerCase().replace(/[“”"]/g," ").replace(/(\d)\.(\d)/g,"$1:$2").replace(/[.!?,;]/g," ").replace(/\s+/g," ").trim();
  return s.replace(/\bdoesn't\b/g,"does not").replace(/\bdon't\b/g,"do not").replace(/\bisn't\b/g,"is not").replace(/\baren't\b/g,"are not")
    .replace(/\bhasn't\b/g,"has not").replace(/\bhaven't\b/g,"have not").replace(/\bcan't\b|\bcannot\b/g,"can not").replace(/\bi'm\b/g,"i am")}
const sameAns=(typed,list)=>list.some(a=>norm(a)===norm(typed));
function third(b){if(b==="have")return "has";if(/(o|s|sh|ch|x|z)$/.test(b))return b+"es";if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+"ies";return b+"s"}
function base(w){if(w==="has")return "have";if(w==="does")return "do";if(w==="goes")return "go";if(/[^aeiou]ies$/.test(w))return w.slice(0,-3)+"y";if(/(ss|sh|ch|x|z)es$/.test(w))return w.slice(0,-2);if(/s$/.test(w)&&!/ss$/.test(w))return w.slice(0,-1);return w}
function hl(text,sub){const e=esc(text);if(!sub)return e;const i=e.toLowerCase().indexOf(esc(sub).toLowerCase());if(i<0)return e;
  return e.slice(0,i)+`<mark class="kw">${e.slice(i,i+esc(sub).length)}</mark>`+e.slice(i+esc(sub).length)}

/* Warum war es falsch? Ein Satz, der zum typischen Fehler passt (Vergleich getippt / richtig) */
const APO=s=>ap(s).replace(/\b(doesn|don|isn|aren|can|hasn|haven)t\b/gi,"$1't");
function hintFor(typed,target){
  if(APO(typed)!==ap(typed)){if(norm(APO(typed))===norm(target))return "Fast! Nur das Apostroph fehlt: doesn’t, don’t, isn’t. Unter dem Feld ist die ’-Taste.";
    return "Apostroph nicht vergessen (doesn’t, don’t)! "+hintFor(APO(typed),target)}
  const A=norm(typed).split(" ").filter(Boolean),B=norm(target).split(" ").filter(Boolean);
  if(!A.length)return "";
  const miss=B.filter(w=>!A.includes(w)),extra=A.filter(w=>!B.includes(w));
  if(B[0]==="yes"||B[0]==="no"){
    if(A[0]!==B[0]&&(A[0]==="yes"||A[0]==="no"))return "Schau auf das Zeichen: ✓ heißt Yes, ✗ heißt No.";
    if(A[1]&&!PRON.includes(A[1]))return "In der Kurzantwort steht kein Name, sondern ein Personalpronomen (I, you, he, she, it, we, they).";
    if(A[1]&&A[1]!==B[1])return B[1]==="i"?"Die Frage geht an dich (you), also antwortest du mit I.":B[1]==="we"?"Gefragt sind du und jemand anderes: we.":`Welches Pronomen passt? Hier: ${B[1]}.`;
    if(A.length>B.length)return "In der Kurzantwort steht kein Verb, nur do / does (don't / doesn't).";
  }
  const beCan=B.some(w=>["is","are","am","can"].includes(w));
  if(beCan&&(extra.includes("does")||extra.includes("do")))return "Bei am, is, are und can brauchst du kein do / does.";
  if(extra.includes("does")&&!B.includes("does"))return B.includes("do")?"I, you, we, they → do / don't.":"Im normalen Satz brauchst du kein does. Einfach das Verb mit s.";
  if(extra.includes("do")&&miss.includes("does"))return "he, she, it → does / doesn't.";
  if(extra.includes("you")&&miss.includes("your"))return "your = dein / deine. you = du.";
  for(const m of miss)for(const e of extra){
    if(e===base(m)&&e!==m)return e==="have"?"Bei he, she, it wird have zu has.":`He, she, it: das s muss mit! Richtig: ${m}.`;
    if(m===base(e)&&e!==m&&(A.includes("does")||A.includes("do")))return e==="has"?"Nach does / doesn't kommt have, nicht has.":`Nach do / does / doesn't kommt die Grundform ohne s: ${m}.`;
    if(m===base(e)&&e!==m)return `I, you, we, they: ohne s. Richtig: ${m}.`;
    if(base(m)===base(e)||(m.slice(0,3)===e.slice(0,3)&&/s$/.test(m)&&/s$/.test(e))){
      if(/[^aeiou]ies$/.test(m))return `Konsonant + y wird zu ies: ${m}.`;
      if(/oes$/.test(m))return `Nach o kommt -es: ${m}.`;
      if(/(ss|sh|ch|x)es$/.test(m))return `Nach einem Zischlaut (s, sh, ch, x) kommt -es: ${m}.`;
      if(/[aeiou]ys$/.test(m))return `Vokal + y: nur s anhängen: ${m}.`;
      if(m==="has")return "have → has.";
      return `Schau auf die Schreibweise: ${m}.`}
  }
  if(A.includes("not")&&miss.length&&!extra.length)return "Nach don't / doesn't fehlt noch das Verb.";
  if(miss.length&&!extra.length)return `Da fehlt etwas: ${miss.join(" ")}.`;
  return ""}

/* Form-Hinweise, wenn es inhaltlich stimmt */
function formNote(typed,target){const n=[];const t=typed.trim();
  if(/[A-Z]/.test(target[0])&&t[0]&&t[0]!==t[0].toUpperCase())n.push("Satzanfang groß schreiben");
  if(/\?$/.test(target.trim())&&!/\?\s*$/.test(t))n.push("Fragezeichen nicht vergessen");
  return n.length?`<p class="note">✏️ Kleiner Tipp: ${n.join(" und ")}.</p>`:""}

/* Englisch vorlesen */
const TTS={ok:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window,v:null};
function pickVoice(){if(!TTS.ok)return;const all=speechSynthesis.getVoices()||[];let vs=all.filter(v=>/^en[-_]GB/i.test(v.lang));if(!vs.length)vs=all.filter(v=>/^en/i.test(v.lang));
  const loc=vs.filter(v=>v.localService);if(loc.length)vs=loc;TTS.v=vs.find(v=>/daniel|kate|serena|arthur|martha/i.test(v.name))||vs[0]||null}
if(TTS.ok){pickVoice();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",pickVoice)}
function say(t){if(!TTS.ok)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ap(t).replace(/[✓✗→–]/g," "));u.lang="en-GB";if(TTS.v)u.voice=TTS.v;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{if(TTS.ok)speechSynthesis.cancel()}catch(e){}}
const sayBtn=(t,l)=>TTS.ok&&t?`<button class="sayb" type="button" data-say="${esc(t)}">${I.spk}${l||"Anhören"}</button>`:"";

/* ================= Erklär-Karten ================= */
function intro(c,i){R=null;hush();i=i||0;const n=c.cards.length,last=i>=n-1,seen=S.seen[c.id],k=CH.indexOf(c);

/* Regel als Blatt von unten (bei einem Fehler) */
function closeSheet(){document.querySelectorAll(".rsheet,.rsheet-bg").forEach(e=>e.remove())}
function ruleSheet(c){closeSheet();const bg=document.createElement("div");bg.className="rsheet-bg";const sh=document.createElement("div");sh.className="rsheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-label","Regel");
  sh.innerHTML=`<h3>📌 ${esc(c.t)}</h3>${c.cards.filter(x=>!/So geht/.test(x.h)).map(x=>`<section class="card-x" style="min-height:0"><h3>${x.h}</h3>${x.b}</section>`).join("")||`<div class="spick"><ul>${c.spick.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}<button class="go" id="shx">Zurück zur Aufgabe</button>`;
  document.body.append(bg,sh);bg.onclick=closeSheet;sh.querySelector("#shx").onclick=closeSheet}
function ruleChapter(t){if(R.c.sec==="pfad")return R.c;
  const tg=norm([].concat(t.a||t.c||"").join(" "));
  if(t.k==="short")return chOf("kurz");if(t.k==="fix")return chOf("fehler");
  if(t.k==="write"&&t.w&&/^(when|where|what|why)/i.test(t.w))return chOf("wh");
  if(t.k==="write"||t.k==="build")return chOf(/\bnot\b/.test(tg)?"not":"frage");
  if(/\bnot\b/.test(tg))return chOf("not");
  if(t.k==="mark")return chOf("wann");
  return /(ies|oes|ches|shes|sses)\b/.test(tg)?chOf("spell"):chOf("s")}

/* ================= Runde ================= */
let R=null;
const nFor=c=>{const d=c.n||10;return Math.min(c.tasks.length,window.lwFragen?lwFragen(d):d)};
function startRound(id){const c=chOf(id);hush();
  if(c.test){const tasks=[];c.parts.forEach((p,pi)=>{tasks.push({part:p,pi});
      const pool=p.pool.filter(x=>!x.neg),neg=p.pool.filter(x=>x.neg);
      const take=neg.length?shuffle(pool).slice(0,p.n-3).concat(shuffle(neg).slice(0,3)):shuffle(p.pool).slice(0,p.n);
      take.forEach(t=>tasks.push({t,pi,pts:p.pts}))});
    R={c,tasks,i:0,res:[],pts:0,max:0,byPart:c.parts.map(()=>[0,0]),log:[]};return showStep()}
  const n=nFor(c),pick=shuffle(c.tasks.map((t,i)=>i)).slice(0,n).sort((a,b)=>a-b);
  /* Lernpfad: in der Reihenfolge des Kapitels (vom Leichten zum Schweren), Übungsteil: gemischt */
  const order=c.sec==="pfad"?pick:shuffle(pick);
  R={c,tasks:order.map(i=>({t:c.tasks[i]})),i:0,res:[],n,again:0,pts:0,max:0};showStep()}
function track(){const t=$("#track");if(!t)return;const L=R.tasks.filter(x=>!x.part).length;let k=0;
  t.innerHTML=Array.from({length:L},(_,i)=>{const r=R.res[i];return `<i class="${r!=null?(R.c.test?"now":r===1?"ok":r>0?"half":"no"):(i===R.res.length?"now":"")}"></i>`}).join("")}
function topbar(){return `<div class="topbar"><button id="quit" aria-label="Runde beenden"></button><div class="track" id="track"></div></div>`}
function bindTop(){$("#quit").onclick=()=>{hush();home()};track()}
function nextStep(){hush();closeSheet();R.i++;R.i>=R.tasks.length?endRound():showStep()}
function showStep(){const st=R.tasks[R.i];R.locked=false;
  if(st.part)return partScreen(st);
  const t=st.t,test=!!R.c.test;
  app.innerHTML=`${topbar()}<div class="q"><span class="lk">${st.again?"Nochmal · ":""}${LK[t.k]}</span><b>${esc(t.q||QD[t.k])}</b></div><section class="stage" id="cb"></section>`;
  bindTop();const cb=$("#cb");
  const go=()=>T[t.k](t,cb);
  if(!test&&S.denk&&t.p&&t.k!=="mark"&&t.k!=="fix")denkStep(t,cb,go);else go();
  scrollTo(0,0)}
function partScreen(st){const p=st.part;
  app.innerHTML=`${topbar()}<section class="panel part"><span class="big" aria-hidden="true">${p.ico}</span><h2>${esc(p.h)}</h2><p class="lead">${esc(p.b)}</p>
    <p class="small">${p.n} Aufgaben, je ${p.pts} ${p.pts>1?"Punkte":"Punkt"}</p><button class="go" id="go" style="width:100%">Los</button></section>`;
  bindTop();$("#go").onclick=nextStep;scrollTo(0,0)}

const LK={mc:"Auswählen",gap:"Lücke füllen",type:"Verbform eintippen",build:"Satz bauen",write:"Satz schreiben",short:"Kurzantwort",mark:"Text markieren",fix:"Fehler finden",bingo:"Bingo"};
const QD={gap:"Welche Form passt?",type:"Setze das Verb in der richtigen Form ein.",build:"Bau den Satz aus den Bausteinen.",write:"Schreib den ganzen Satz.",short:"Wie lautet die Kurzantwort?",mark:"Markiere alle Simple-Present-Formen.",fix:"Tippe das falsche Wort an.",bingo:"Schreib einen Satz über die Bingo-Karte."};

/* Denkfrage: he, she, it oder nicht? (zählt nicht als Fehler) */
function denkStep(t,cb,go){const box=document.createElement("div");box.className="denk";const th=THIRD.includes(t.p);
  const shortQ=t.k==="short";
  if(shortQ){const opts=shuffle([t.p].concat(shuffle(PRON.map(x=>x==="i"?"I":x).filter(x=>x!==t.p)).slice(0,2)));
    box.innerHTML=`<p>💡 Erst überlegen: Welches Personalpronomen passt zu „${esc(t.sub)}“?</p><div class="chips">${opts.map(o=>`<button class="chip" data-k="${o}">${o}</button>`).join("")}</div>`;
    cb.appendChild(box);
    box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const ok=b.dataset.k===t.p;box.querySelectorAll(".chip").forEach(x=>{x.disabled=true;if(x.dataset.k===t.p)x.classList.add("ok")});if(!ok)b.classList.add("no");
      box.insertAdjacentHTML("beforeend",`<span class="tip">${ok?"Genau! ":""}<b>${esc(t.sub)}</b> → <b>${t.p}</b>${t.p==="I"?" (die Frage geht an dich)":""}.</span>`);ok?sfxPop():0;go()});return}
  const sub=t.k==="bingo"?t.n:t.sub;
  const isPr=PRON.includes(sub.toLowerCase());
  box.innerHTML=`<p>💡 Erst überlegen: ${isPr?`Gehört „${esc(sub)}“ zu he, she, it?`:`Kannst du „${esc(sub)}“ durch he, she oder it ersetzen?`}</p><div class="chips"><button class="chip" data-k="1">Ja: he / she / it</button><button class="chip" data-k="0">Nein: I / you / we / they</button></div>`;
  cb.appendChild(box);
  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const ok=(b.dataset.k==="1")===th;box.querySelectorAll(".chip").forEach(x=>{x.disabled=true;if((x.dataset.k==="1")===th)x.classList.add("ok")});if(!ok)b.classList.add("no");
    box.insertAdjacentHTML("beforeend",`<span class="tip">${ok?"Genau! ":""}${isPr?`<b>${esc(sub)}</b>`:`<b>${esc(sub)}</b> = <b>${t.p}</b>`} → ${dkTip(t,th)}</span>`);ok?sfxPop():0;go()})}
function dkTip(t,th){const tg=ap(t.k==="gap"?t.s.match(/\[\[(.*?)[|\]]/)[1]:[].concat(t.a||(t.o&&t.o[0])||"")[0]).toLowerCase();
  if(t.k==="bingo")return t.ask?"die Frage geht an das Kind selbst: Do you …?":t.y?(th?"Verb mit s.":"Verb ohne s."):(th?"doesn't + Grundform.":"don't + Grundform.");
  if(/doesn't|does not/.test(tg))return "doesn't + Grundform.";
  if(/don't|do not/.test(tg))return "don't + Grundform.";
  if(/^does\b|\bdoes\b.*\?/.test(tg)||/^does$/.test(tg))return "Does + Grundform.";
  if(/^do\b/.test(tg))return "Do + Grundform.";
  if(/^(when|where|what|why) (do|does)/.test(tg))return th?"does + Grundform.":"do + Grundform.";
  if(tg==="has"||/\bhas\b/.test(tg))return "have wird zu has.";
  return th?"Verb mit s.":"Verb ohne s (Grundform)."}

/* Ergebnis einer Aufgabe. ok: richtig, f: Anteil, right: richtige Lösung (Text), typed: Neas Antwort */
function done(ok,o){if(R.locked)return;R.locked=true;o=o||{};const st=R.tasks[R.i],t=st.t;const f=o.f!=null?o.f:(ok?1:0);
  if(R.c.test){const p=st.pts;let got=ok?p:(p>=2&&o.half?p/2:0);R.pts+=got;R.max+=p;R.byPart[st.pi][0]+=got;R.byPart[st.pi][1]+=p;R.res.push(got/p);
    if(got<p)R.log.push({pi:st.pi,t,typed:o.typed,right:o.right,why:o.why,got,p});
    track();sfxPop();
    const nx=document.createElement("button");nx.className="next";nx.type="button";const nxs=R.tasks[R.i+1];
    nx.textContent=!nxs?"Zur Auswertung":nxs.part?"Weiter zu "+nxs.part.h.split(":")[0]:"Weiter";nx.onclick=nextStep;
    const fb=document.createElement("div");fb.className="fb";fb.innerHTML=`<p class="small">Antwort gespeichert. Die Auswertung kommt am Schluss.</p>`;
    lwSheet($("#cb"),true,[fb,nx]);return}
  if(!st.again){R.res.push(f);R.pts+=f;R.max+=1}
  if(!ok&&!st.again&&R.again<3){R.again++;R.tasks.push({t,again:1})}
  ok?sfxOk():sfxBad();track();
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  const ex=t.ex?esc(t.ex):"";
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Stark!"]):f>0?"Fast!":"Nicht ganz"}</strong>
    ${!ok&&o.right?`<p>Richtig: <b>${esc(o.right)}</b></p>`:""}${!ok&&o.why?`<p>💡 ${esc(o.why)}</p>`:""}${ex&&(!ok||!o.why)?`<p>${ex}</p>`:""}${o.note||""}
    ${!ok&&!st.again&&R.again<=3?`<p class="small">Diese Aufgabe kommt am Ende der Runde nochmal.</p>`:""}
    <div class="row" style="margin-top:4px">${o.say?sayBtn(o.say):""}${!ok?`<button class="sayb" type="button" id="rl">📌 Regel ansehen</button>`:""}</div>`;
  const nx=document.createElement("button");nx.className="next";nx.type="button";nx.textContent=R.i+1>=R.tasks.length?"Ergebnis":"Weiter";nx.onclick=nextStep;
  lwSheet($("#cb"),ok,[fb,nx]);bindSay(fb);
  const rl=fb.querySelector("#rl");if(rl)rl.onclick=()=>ruleSheet(ruleChapter(t))}

/* ================= Aufgabenarten ================= */
const T={};
function optsBox(cb,list,onPick){const box=document.createElement("div");box.className="opts";
  const opts=shuffle(list.map((x,i)=>({x,i})));box.innerHTML=opts.map(o=>`<button class="opt" data-i="${o.i}">${esc(o.x)}</button>`).join("");cb.appendChild(box);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const ok=b.dataset.i==="0";
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.i==="0")x.classList.add("ok")});if(!ok)b.classList.add("bad");onPick(ok,list[+b.dataset.i])})}
T.mc=(t,cb)=>{if(t.e)cb.insertAdjacentHTML("beforeend",`<div class="sent">${hl(t.e,t.sub)}</div>`);
  optsBox(cb,t.o,(ok,v)=>done(ok,{right:t.o[0],why:!ok&&!t.de?hintFor(v,t.o[0]):"",say:t.de?t.e:t.o[0]}))};
T.gap=(t,cb)=>{const m=t.s.match(/\[\[(.*?)\]\]/),opts=m[1].split("|"),pre=t.s.slice(0,m.index),post=t.s.slice(m.index+m[0].length);
  const txt=document.createElement("div");txt.className="sent";cb.appendChild(txt);
  const full=v=>pre+v+post;
  const draw=g=>{txt.innerHTML=hl(t.s.replace(m[0],"\u0000"),t.sub).replace("\u0000",g)};draw(`<span class="gap now">?</span>`);
  const ch=document.createElement("div");ch.className="chips";cb.appendChild(ch);
  ch.innerHTML=shuffle(opts).map(o=>`<button class="chip">${esc(o)}</button>`).join("");
  ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(R.locked)return;const v=b.textContent,ok=v===opts[0];
    draw(ok?`<span class="gap ok">${esc(v)}</span>`:`<span class="gap bad"><s>${esc(v)}</s>${esc(opts[0])}</span>`);
    ch.querySelectorAll(".chip").forEach(x=>x.disabled=true);
    done(ok,{why:ok?"":hintFor(full(v),full(opts[0])),say:full(opts[0])})})};
/* Eingabefeld mit Apostroph-Taste */
function inputBox(cb,o){const w=document.createElement("div");w.className="inp";
  w.innerHTML=`${o.pre?`<span class="pre">${esc(o.pre)}</span>`:""}<input class="field" id="fld" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="${o.sentence?"sentences":"none"}" enterkeyhint="done" aria-label="Antwort" placeholder="${esc(o.ph||"hier eintippen")}">
    <div class="keys"><button class="chip" type="button" data-ins="’" aria-label="Apostroph einfügen">’</button>${o.sentence?`<button class="chip" type="button" data-ins="?" aria-label="Fragezeichen einfügen">?</button>`:""}<span class="small">’ für don’t und doesn’t</span></div>
    <button class="go" id="chk" disabled>Prüfen</button>`;
  cb.appendChild(w);const f=w.querySelector("#fld"),chk=w.querySelector("#chk");
  f.oninput=()=>{chk.disabled=!f.value.trim()};
  w.querySelectorAll("[data-ins]").forEach(b=>b.onclick=()=>{const s=f.selectionStart??f.value.length,e=f.selectionEnd??s;f.value=f.value.slice(0,s)+b.dataset.ins+f.value.slice(e);f.focus();f.setSelectionRange(s+1,s+1);f.oninput()});
  const fire=()=>{if(R.locked||!f.value.trim())return;f.blur();f.readOnly=true;w.querySelectorAll(".keys,#chk").forEach(x=>x.remove());o.check(f.value,f)};
  chk.onclick=fire;f.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();fire()}};
  if(!o.noFocus)setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},50);return f}
T.type=(t,cb)=>{const parts=t.s.split("___");
  cb.insertAdjacentHTML("beforeend",`<div class="sent">${hl(parts[0],t.sub)}<span class="gap now">___</span>${esc(parts[1]||"")} <span class="hint">(${esc(t.h)})</span></div>`);
  inputBox(cb,{check:(v,f)=>{const ok=sameAns(v,t.a);f.classList.add(ok?"ok":"bad");
    const full=x=>parts[0]+x+(parts[1]||"");
    cb.querySelector(".gap").outerHTML=ok?`<span class="gap ok">${esc(v.trim())}</span>`:`<span class="gap bad"><s>${esc(v.trim())}</s>${esc(t.a[0])}</span>`;
    done(ok,{right:t.a[0],typed:v,why:ok?"":hintFor(full(v),full(t.a[0])),say:full(t.a[0]),half:false})}})};
const stichHTML=w=>`<div class="sw-line">${w.split(" · ").map(x=>`<span>${esc(x)}</span>`).join("")}<span>?</span></div>`;
T.write=(t,cb)=>{const isQ=/\?$/.test(t.a[0]);
  if(t.w)cb.insertAdjacentHTML("beforeend",isQ?stichHTML(t.w):`<div class="sw-line">${t.w.split(" · ").map(x=>`<span>${esc(x)}</span>`).join("")}</div>`);
  if(t.pre&&t.w)cb.insertAdjacentHTML("beforeend",`<p class="small">${esc(t.pre)}</p>`);
  if(t.pre&&!t.w)cb.insertAdjacentHTML("beforeend",`<div class="sent">${esc(t.pre)}</div>`);
  inputBox(cb,{sentence:1,ph:isQ?"Frage hier eintippen":"Satz hier eintippen",check:(v,f)=>{const ok=sameAns(v,t.a);f.classList.add(ok?"ok":"bad");
    const A=norm(v).split(" "),B=norm(t.a[0]).split(" ");const d=wordDiff(A,B);
    done(ok,{right:t.a[0],typed:v,why:ok?"":hintFor(v,t.a[0]),note:ok?formNote(v,t.a[0]):"",say:t.a[0],half:d<=1})}})};
function wordDiff(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
T.build=(t,cb)=>{const end=t.a.slice(-1),words=t.a.slice(0,-1).replace(/"/g,"").split(" ");
  const bank=shuffle(words.concat(t.x||[]).map((w,i)=>({w,i})));let line=[];
  cb.insertAdjacentHTML("beforeend",stichHTML(t.w).replace(`<span>?</span>`,end==="?"?`<span>?</span>`:""));
  const L=document.createElement("div");L.className="line";const B=document.createElement("div");B.className="bank";cb.append(L,B);
  const ctl=document.createElement("div");ctl.className="row";ctl.innerHTML=`<button class="ghost grow" id="clr">Zurücksetzen</button><button class="go grow" id="chk" disabled>Prüfen</button>`;cb.appendChild(ctl);
  const draw=()=>{L.innerHTML=line.length?line.map((o,k)=>`<button class="tile" data-k="${k}">${esc(o.w)}</button>`).join("")+`<span class="end">${end}</span>`:`<span class="ph">Tippe die Bausteine in der richtigen Reihenfolge an.</span>`;
    B.innerHTML=bank.map(o=>`<button class="tile" data-i="${o.i}" ${line.includes(o)?"disabled":""}>${esc(o.w)}</button>`).join("");
    $("#chk").disabled=!line.length;
    L.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(R.locked)return;line.splice(+b.dataset.k,1);draw()});
    B.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(R.locked)return;line.push(bank.find(o=>o.i===+b.dataset.i));sfxPop();draw()})};
  draw();
  $("#clr").onclick=()=>{if(R.locked)return;line=[];draw()};
  $("#chk").onclick=()=>{if(R.locked)return;const v=line.map(o=>o.w).join(" ")+end,ok=norm(v)===norm(t.a);
    L.classList.add(ok?"ok":"bad");ctl.remove();B.remove();L.querySelectorAll(".tile").forEach(x=>x.disabled=true);
    done(ok,{right:t.a,why:ok?"":hintFor(v,t.a),say:t.a})}};
T.short=(t,cb)=>{cb.insertAdjacentHTML("beforeend",`<div class="sent">${hl(t.e,t.sub)}<div style="margin-top:8px"><span class="yn ${t.y?"y":"n"}">${t.y?"✓ Ja":"✗ Nein"}</span></div></div>`);
  if(t.o&&!R.c.test&&R.c.sec==="pfad"){optsBox(cb,[t.a].concat(t.o),(ok,v)=>done(ok,{right:t.a,why:ok?"":hintFor(v,t.a),say:t.e+" "+t.a}));return}
  inputBox(cb,{sentence:1,ph:t.y?"Yes, …":"No, …",check:(v,f)=>{let w=v.trim();const yn=t.y?"Yes":"No";
    if(!/^(yes|no)\b/i.test(w))w=yn+", "+w;const ok=sameAns(w,[t.a].concat(t.alt||[]));f.classList.add(ok?"ok":"bad");
    done(ok,{right:t.a,typed:v,why:ok?"":hintFor(w,t.a),say:t.e+" "+t.a})}})};
T.bingo=(t,cb)=>{cb.insertAdjacentHTML("beforeend",`<div class="bcell"><span class="bico" aria-hidden="true">${t.ico}</span><span class="grow"><b>${esc(t.it)}</b><span class="who">${esc(t.n)}</span></span><span class="yn ${t.y?"y":"n"}">${t.y?"✓":"✗"}</span></div>
    <p class="lead">${t.ask?`Frag <b>${esc(t.n)}</b> danach. Verb: <b>(to) ${esc(t.v)}</b>`:`Schreib einen Satz über <b>${esc(t.n)}</b>. Verb: <b>(to) ${esc(t.v)}</b>`}</p>`);
  inputBox(cb,{sentence:1,ph:t.ask?"Do you …?":t.n+" …",check:(v,f)=>{const ok=sameAns(v,t.a);f.classList.add(ok?"ok":"bad");
    const hg=ok&&/has got|hasn't got|have you got/i.test(v)?`<p class="note">Auch richtig! Im Simple Present heißt es: <b>${esc(t.a[0])}</b></p>`:"";
    done(ok,{right:t.a[0],typed:v,why:ok?"":hintFor(v,t.a[0]),note:ok?(hg||formNote(v,t.a[0])):"",say:t.a[0]})}})};
/* Text: {Wort} = Ziel */
function tokens(tx){return (tx.match(/\{[^}]+\}|[^\s{]+/g)||[]).map(w=>({w:w.replace(/[{}]/g,""),hit:w[0]==="{"}))}
T.mark=(t,cb)=>{const tk=tokens(t.tx),one=!!t.one;
  const box=document.createElement("div");box.className="txt tap";box.innerHTML=tk.map((o,i)=>`<span class="u" role="button" tabindex="0" data-i="${i}">${esc(o.w)}</span>`).join(" ");cb.appendChild(box);
  const need=tk.filter(o=>o.hit).length;
  if(!one)cb.insertAdjacentHTML("beforeend",`<p class="small" id="cnt">Markiert: 0</p><button class="go" id="chk" disabled>Prüfen</button>`);
  const sel=new Set();
  const finish=()=>{let hits=0,miss=0;box.querySelectorAll(".u").forEach(s=>{const i=+s.dataset.i,h=tk[i].hit;s.removeAttribute("tabindex");s.classList.remove("sel");
      if(sel.has(i)&&h){s.classList.add("hit");hits++}else if(sel.has(i)){s.classList.add("miss");miss++}else if(h)s.classList.add("left")});
    const ok=hits===need&&!miss,f=Math.max(0,(hits-miss)/need);if($("#chk"))$("#chk").remove();if($("#cnt"))$("#cnt").remove();
    done(ok,{f,why:ok?"":one?"Das grün umrandete Wort ist richtig.":`${hits} von ${need} gefunden${miss?`, ${miss} zu viel markiert`:""}. Grün umrandet = übersehen.`})};
  box.querySelectorAll(".u").forEach(s=>{const tap=()=>{if(R.locked)return;const i=+s.dataset.i;sfxPop();
      if(one){sel.add(i);finish();return}
      sel.has(i)?sel.delete(i):sel.add(i);s.classList.toggle("sel");$("#cnt").textContent="Markiert: "+sel.size;$("#chk").disabled=!sel.size};
    s.onclick=tap;s.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap()}}});
  if(!one)$("#chk").onclick=finish};
T.fix=(t,cb)=>{const tk=tokens(t.s);
  const box=document.createElement("div");box.className="txt tap";box.style.fontSize="1.25rem";box.innerHTML=tk.map((o,i)=>`<span class="u" role="button" tabindex="0" data-i="${i}">${esc(o.w)}</span>`).join(" ");cb.appendChild(box);
  box.querySelectorAll(".u").forEach(s=>{const tap=()=>{if(R.locked)return;const i=+s.dataset.i,ok=tk[i].hit;
      box.querySelectorAll(".u").forEach(x=>{x.removeAttribute("tabindex");if(tk[+x.dataset.i].hit)x.classList.add(ok?"hit":"left")});if(!ok)s.classList.add("miss");
      done(ok,{right:t.c,typed:tk[i].w,why:ok?"":`Der Fehler steckt in „${tk.find(o=>o.hit).w}“.`,say:t.c})};
    s.onclick=tap;s.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap()}}})};

/* ================= Ergebnis ================= */
function endRound(){const c=R.c,q=R.max?R.pts/R.max:0;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[c.id]=Math.max(S.best[c.id]||0,st);
  const fmt=x=>String(Math.round(x*2)/2).replace(".",",");
  if(c.test)S.probe={pts:R.pts,max:R.max,parts:R.byPart,d:new Date().toLocaleDateString("de-DE")};
  save();
  const k=CH.indexOf(c),nxt=CH[k+1];
  const cheer=c.test?["Weiter üben, du schaffst das!","Gut gemacht!","Stark!","Super, du bist bereit für die Arbeit!"][st]:["Dranbleiben, das wird!","Gut gemacht!","Stark!","Super, das sitzt!"][st];
  let body="";
  if(c.test){const weak=c.parts.map((p,i)=>({p,i,q:R.byPart[i][1]?R.byPart[i][0]/R.byPart[i][1]:1})).filter(x=>x.q<.8);
    body=`<p class="lead"><b>${fmt(R.pts)} von ${R.max} Punkten</b> (${Math.round(q*100)} %)</p>
      <div class="teile3">${c.parts.map((p,i)=>`<div><span class="small">${p.ico} ${esc(p.h.replace(/^Teil \d+: /,""))}</span><b>${fmt(R.byPart[i][0])} / ${R.byPart[i][1]}</b></div>`).join("")}</div>
      ${R.log.length?`<h3 style="align-self:flex-start;margin-top:6px">Das schauen wir uns nochmal an</h3><div class="rev">${R.log.map(l=>`<div class="ri"><span class="small">${esc(c.parts[l.pi].h)}${l.got?` · ${fmt(l.got)} von ${l.p} Punkten`:""}</span>
        <span>${esc(l.t.w||l.t.pre||l.t.e||l.t.s.replace(/[{}]/g,""))}${l.t.h?` (${esc(l.t.h)})`:""}</span>
        ${l.typed?`<span>Du: <s>${esc(l.typed)}</s></span>`:""}<span class="c">✔ ${esc(l.right)}</span>${l.why?`<span class="small">💡 ${esc(l.why)}</span>`:""}</div>`).join("")}</div>`:`<p>Alles richtig. Wow!</p>`}
      ${weak.length?`<p class="small" style="margin-top:4px">Übe nochmal:</p>${weak.map(x=>`<button class="ghost" data-ch="${x.p.ch}">${chOf(x.p.ch).ico} ${esc(chOf(x.p.ch).t)}</button>`).join("")}`:""}`}
  else body=`<p class="lead"><b>${R.res.filter(x=>x===1).length} von ${R.res.length}</b> Aufgaben gleich richtig</p>`;
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    ${body}
    <div class="spick"><b>📌 Spickzettel: ${esc(c.t)}</b><ul>${c.spick.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <button class="go" id="again">${c.test?"Neue Probe-Arbeit":"Nochmal üben"}</button>
    ${nxt&&st>=2&&!c.test?`<button class="ghost" id="nx">Weiter: ${esc(nxt.t)}</button>`:""}
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  const id=c.id;R=null;
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;if($("#nx"))$("#nx").onclick=()=>openCh(nxt.id);
  app.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>openCh(b.dataset.ch));
  scrollTo(0,0)}

/* ================= Entdecken: Regelheft ================= */
function regeln(){R=null;hush();
  const big=`<div class="spick"><b>📌 Der große Spickzettel</b><ul>
    <li>Simple Present: was immer wieder passiert und was man mag (always, often, never, every day).</li>
    <li>he, she, it: das s muss mit! He likes, she goes, it watches, he hurries, she has.</li>
    <li>Verneinung: don't / doesn't + Grundform. He doesn't like cats.</li>
    <li>Frage: Do / Does + Subjekt + Grundform? Does she like cats?</li>
    <li>Fragewort vorne: When does school start?</li>
    <li>Kurzantwort: Yes, they do. No, he doesn't. Pronomen, kein Verb!</li>
    <li>to be und can ohne do: She isn't … Is she …? Can you …?</li></ul></div>`;
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>

  bindSay();$("#cbk").onclick=home;scrollTo(0,0)}
