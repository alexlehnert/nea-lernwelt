<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/sync.js" data-hub="1"></script>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lernwelt"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5B3FE6">
<script src="/hefte.js"></script>
<title>Neas Lernwelt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout nach dem Mobile-Konzept: farbiger Kopf mit runder Unterkante, Karten darunter, Tab-Leiste unten.
   Breit: dieselben Seiten mit Seitenleiste links. Ebenen: Start → Fach → Heft · Merkzettel · Profil */
:root{
  --bg:#F4F2FF; --card:#FFFFFF; --ink:#1E1B3A; --muted:#5E5A7A; --line:#E4E0F5; --soft:#ECE8FB; --shadow:#DCD6F7;
  --brand:#5B3FE6; --brand-d:#4227B8; --sun:#FFC93C; --ok:#22A35A; --err:#C2410C;
  --new-bg:#FFF3CC; --new-fg:#8A5A00;
  --ma:#2563EB; --ma-d:#1E40AF; --en:#15803D; --en-d:#166534; --bio:#C2410C; --bio-d:#9A3412;
  --geo:#BE185D; --geo-d:#9D174D; --mu:#7C3AED; --mu-d:#5B21B6; --de:#0F766E; --de-d:#115E59;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15132A; --card:#1F1C3A; --ink:#F1EFFF; --muted:#B4AFD3; --line:#332E5A; --soft:#2A2650; --shadow:#0D0B1F;
  --brand:#6E55F0; --brand-d:#4A31C4; --ok:#3DBA70; --err:#F07A4A; --new-bg:#4A3B0E; --new-fg:#FFD970;
  --ma:#3B76F0; --ma-d:#2349B8; --en:#22994C; --en-d:#166534; --bio:#D9541A; --bio-d:#9A3412;
  --geo:#D42C72; --geo-d:#9D174D; --mu:#8B55F0; --mu-d:#5B21B6; --de:#169489; --de-d:#115E59; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15132A; --card:#1F1C3A; --ink:#F1EFFF; --muted:#B4AFD3; --line:#332E5A; --soft:#2A2650; --shadow:#0D0B1F;
  --brand:#6E55F0; --brand-d:#4A31C4; --ok:#3DBA70; --err:#F07A4A; --new-bg:#4A3B0E; --new-fg:#FFD970;
  --ma:#3B76F0; --ma-d:#2349B8; --en:#22994C; --en-d:#166534; --bio:#D9541A; --bio-d:#9A3412;
  --geo:#D42C72; --geo-d:#9D174D; --mu:#8B55F0; --mu-d:#5B21B6; --de:#169489; --de-d:#115E59; color-scheme:dark}
*{box-sizing:border-box}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.ma{--c:var(--ma);--cd:var(--ma-d)} .en{--c:var(--en);--cd:var(--en-d)} .bio{--c:var(--bio);--cd:var(--bio-d)}
.geo{--c:var(--geo);--cd:var(--geo-d)} .mu{--c:var(--mu);--cd:var(--mu-d)} .de{--c:var(--de);--cd:var(--de-d)}
.br{--c:var(--brand);--cd:var(--brand-d)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.55rem;color:var(--brand);padding:4px 12px 18px;line-height:1;text-decoration:none}
.logo small{display:block;font-family:var(--f-body);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.nav{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:.02em;padding:10px 12px;border-radius:12px;border:2px solid transparent;color:var(--muted)}
.nav svg{width:26px;height:26px;flex:none}
@media (hover:hover){.nav:hover{background:var(--soft)}}
.nav[aria-current="page"]{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.me{display:flex;align-items:center;gap:10px;text-decoration:none;margin-top:auto;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.me .av{width:44px;height:44px}
.me b{font-family:var(--f-display);display:block;line-height:1.1}
.me span{font-size:.78rem;color:var(--muted)}

main{min-width:0;display:flex;flex-direction:column;padding-bottom:110px}
.pad{padding:22px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;max-width:920px;width:100%}
@media (min-width:761px){.pad{padding-inline:32px}}

/* Farbiger Kopf */
.head{position:relative;overflow:hidden;background:var(--c);color:#fff;border-radius:0 0 32px 32px;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.head::before{content:"";position:absolute;right:-40px;top:-30px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.head>*{position:relative}
.head .deco{position:absolute;pointer-events:none}
@media (min-width:761px){.head{margin:18px 32px 0;border-radius:28px;padding-top:22px;max-width:856px}}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandname{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.01em}
.backbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;flex:none;text-decoration:none}
.backbtn svg{width:22px;height:22px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hello{display:flex;align-items:center;gap:14px;margin-top:20px}
.hello .av{width:68px;height:68px;border:3px solid #fff}
.hello h1{font-size:2rem;line-height:1.05}
.hello p{margin:4px 0 0;font-size:.95rem;opacity:.95}
.head.start{padding-bottom:30px}
.ftitle{display:flex;align-items:center;gap:14px;margin-top:14px}
.ftitle .ic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.2);box-shadow:none}
.ftitle h1{font-size:2rem;line-height:1}
.ftitle p,.head p.sub{margin:6px 0 0;font-size:.95rem;opacity:.95}

/* Avatar */
.av{display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--soft)}
.av svg,.av img{display:block;width:100%;height:100%;object-fit:cover}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:16px;border:none;cursor:pointer;text-decoration:none;
  font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;background:var(--c,var(--brand));color:#fff;box-shadow:0 5px 0 var(--cd,var(--brand-d));transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd,var(--brand-d))}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--card);color:var(--brand);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn svg{width:20px;height:20px}
h2.sh{font-size:1.25rem}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h a{font-weight:700;color:var(--brand);text-decoration:none;font-size:.9rem}
.rule{display:flex;align-items:center;gap:10px;font-size:1.12rem}
.rule::after{content:"";flex:1;height:2px;background:var(--line)}
.pill{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--cd)}
.pill.new{background:var(--new-bg);color:var(--new-fg)}
:root[data-theme="dark"] .pill.on{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.on{color:#fff}}

/* Anmelden */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:24px;padding:26px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login .logo{padding:0 0 4px;font-size:1.9rem}
.login img{width:84px;height:84px;border-radius:22px;align-self:flex-start}
.login label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
.login input{font-size:1.1rem;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);min-height:50px}
.err{color:var(--err);font-weight:700;margin:0;min-height:1.4em}

/* Weitermachen */
.resume{display:block;position:relative;overflow:hidden;text-decoration:none;background:var(--c);color:#fff;border-radius:22px;padding:16px 18px 18px;box-shadow:0 6px 0 var(--cd)}
.resume::before{content:"";position:absolute;right:-24px;top:-24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.10)}
.resume>*{position:relative}
.resume b{display:block;margin-top:4px;font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.15}
.resume p{margin:4px 0 0;font-size:.92rem;opacity:.95}
.resume .go{display:flex;justify-content:flex-end;margin-top:14px}
.resume .go span{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--cd);font-family:var(--f-display);font-weight:700;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;border-radius:14px;padding:10px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.resume .go svg{width:14px;height:14px}

/* Fächer */
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:761px){.subjects{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}
.subj{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px;min-width:0}
@media (hover:hover){.subj:hover{border-color:var(--c)}}
.ic{border-radius:13px;background:var(--c);display:grid;place-items:center;flex:none}
.subj .ic{width:42px;height:42px;box-shadow:0 3px 0 var(--cd)}
.ic svg{width:58%;height:58%}
.subj b{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.1;overflow-wrap:anywhere}
.subj span{font-size:.75rem;color:var(--muted)}

/* Fach */
.tools{display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0 14px;min-height:50px}
.search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.search input{flex:1;border:none;background:none;min-width:0;outline:none;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:700;font-size:.9rem;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.hefte{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.heft{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px 16px}
.heft.on{border-color:var(--c)}
@media (hover:hover){.heft:hover{border-color:var(--c)}}
.heft .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.heft b{font-family:var(--f-display);font-weight:600;font-size:1.2rem;line-height:1.15}
.heft p{margin:0;font-size:.9rem;color:var(--muted)}
.heft .meta{font-size:.82rem;color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ref{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;min-width:0}
@media (hover:hover){.ref:hover{border-color:var(--brand)}}
.ref .ri{width:36px;height:36px;border-radius:11px;background:#FCE7F6;display:grid;place-items:center}
.ref .ri svg{width:20px;height:20px}
.ref b{font-size:.9rem;line-height:1.25}
.ref span{font-size:.78rem;color:var(--muted)}

/* Heft: Kapitel-Pfad */
.path{display:flex;flex-direction:column;gap:18px;padding:6px 4px 0;position:relative}
.step{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;color:var(--ink);width:min(100%,360px)}
.step:nth-child(even){grid-template-columns:minmax(0,1fr) 72px;align-self:flex-end;text-align:right}
.step:nth-child(even) .dot{order:2}
@media (min-width:761px){.path{max-width:560px}}
.dot{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 5px 0 var(--cd);font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:#fff;transition:transform .08s;justify-self:center}
.step:active .dot{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.step b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.2}
.step small{display:block;font-size:.82rem;color:var(--muted)}
.goal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;width:min(100%,360px)}
.goal .dot{background:var(--new-bg);border:3px dashed #F0B400;box-shadow:none;border-radius:18px}
.goal .dot svg{width:30px;height:30px}
.cta{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-top:8px;z-index:5}
.cta .btn{width:100%;min-height:58px;font-size:1.15rem}
@media (min-width:761px){.cta{bottom:20px;max-width:420px}}

/* Profil */
.head.prof{text-align:center;padding-bottom:28px}
.bigav{position:relative;width:112px;height:112px;margin:8px auto 0}
.bigav .av{width:112px;height:112px;border:4px solid #fff}
.pen{position:absolute;right:-4px;bottom:-2px;width:44px;height:44px;border-radius:50%;border:3px solid var(--c);background:var(--sun);display:grid;place-items:center;cursor:pointer;color:#1E1B3A;text-decoration:none}
.pen svg{width:20px;height:20px}
.head.prof h1{margin-top:12px;font-size:1.8rem;line-height:1;overflow-wrap:anywhere}
.head.prof .motto{margin:6px 0 0;font-size:.95rem;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.row .ic{width:40px;height:40px;border-radius:12px}
.row div{flex:1;min-width:0}
.row span{display:block;font-size:.78rem;color:var(--muted)}
.row b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{font-size:1.05rem}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:none;background:none;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--brand);box-shadow:0 2px 0 var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{width:64px;height:64px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);cursor:pointer;display:grid;place-items:center;padding:4px}
.opt svg{width:52px;height:52px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card))}
.opt.sw{width:46px;height:46px;border-radius:50%;padding:0}
.opt.sw i{display:block;width:30px;height:30px;border-radius:50%}
.upload{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.upload .av{width:96px;height:96px;border:2px dashed var(--line)}
.upload input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
.fields input,.fields select{font-weight:400;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);min-height:48px;width:100%}
.fields .wide{grid-column:1/-1}
.saved{min-height:1.5em;margin:0;font-weight:700;color:var(--ok)}
.note{font-size:.88rem;color:var(--muted);margin:0;max-width:70ch}

/* Tab-Leiste mobil */
.tabs{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);
    padding:8px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:.8rem;color:var(--muted);padding:4px 0;border-radius:12px;min-height:52px;justify-content:center}
  .tabs a svg{width:26px;height:26px}
  .tabs a[aria-current="page"]{color:var(--brand)}
}
@media (max-width:420px){.fields{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap" hidden>
  <form class="login" id="login">
    <img src="/icons/icon-192.png" alt="">
    <div class="logo">Neas Lernwelt<small>Klasse 5</small></div>
    <label for="lname">Name<input id="lname" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label for="lpw">Passwort<input id="lpw" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="lbtn">Los geht's</button>
    <p class="err" id="lerr" role="alert"></p>
    <p class="note" id="noconfig" hidden>Die Lernwelt ist noch nicht mit Supabase verbunden. Trag in Vercel SUPABASE_URL und SUPABASE_ANON_KEY ein (siehe README).</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="Hauptmenü">
    <a class="logo" href="#start">Neas Lernwelt<small>Klasse 5</small></a>
    <nav id="sideNav" style="display:flex;flex-direction:column;gap:6px"></nav>
    <a class="me" href="#profil" id="meChip"></a>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" id="tabNav" aria-label="Hauptmenü" hidden></nav>

<script>
const FAECHER=window.LW_FAECHER||[],HEFTE=window.LW_HEFTE||[],LINKS=window.LW_LINKS||[];
const LAST='lernwelt-zuletzt',PROFIL='lernwelt-profil',BILD='lernwelt-avatar-bild';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if(c.figur==='baer') ears=`<circle cx="27" cy="34" r="11" fill="${f}"/><circle cx="73" cy="34" r="11" fill="${f}"/><circle cx="27" cy="34" r="5" fill="#fff" opacity=".4"/><circle cx="73" cy="34" r="5" fill="#fff" opacity=".4"/>`;
  if(c.figur==='hase') ears=`<rect x="30" y="4" width="13" height="38" rx="6.5" fill="${f}"/><rect x="57" y="4" width="13" height="38" rx="6.5" fill="${f}"/><rect x="33.5" y="10" width="6" height="26" rx="3" fill="#fff" opacity=".45"/><rect x="60.5" y="10" width="6" height="26" rx="3" fill="#fff" opacity=".45"/>`;
  if(c.figur==='monster') ears=`<path d="M38 32L34 14M62 32l4-18" stroke="${f}" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="13" r="5" fill="${f}"/><circle cx="66" cy="13" r="5" fill="${f}"/>`;
  const head=c.figur==='blob'?`<path d="M50 26c18 0 30 12 30 30s-12 28-30 28-30-10-30-28 12-30 30-30z" fill="${f}"/>`:`<circle cx="50" cy="58" r="30" fill="${f}"/>`;
  let eyes='';
  if(c.augen==='punkt') eyes=`<circle cx="39" cy="54" r="4" fill="${ink}"/><circle cx="61" cy="54" r="4" fill="${ink}"/>`;
  if(c.augen==='gross') eyes=`<circle cx="39" cy="53" r="8" fill="#fff"/><circle cx="61" cy="53" r="8" fill="#fff"/><circle cx="40.5" cy="54" r="4.5" fill="${ink}"/><circle cx="62.5" cy="54" r="4.5" fill="${ink}"/><circle cx="42" cy="52" r="1.6" fill="#fff"/><circle cx="64" cy="52" r="1.6" fill="#fff"/>`;
  if(c.augen==='froh') eyes=`<path d="M33 56q6-8 12 0M55 56q6-8 12 0" stroke="${ink}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  if(c.augen==='zwinker') eyes=`<circle cx="39" cy="53" r="8" fill="#fff"/><circle cx="40.5" cy="54" r="4.5" fill="${ink}"/><circle cx="42" cy="52" r="1.6" fill="#fff"/><path d="M55 55q6-6 12 0" stroke="${ink}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  let mouth='';
  if(c.mund==='laecheln') mouth=`<path d="M42 68q8 7 16 0" stroke="${ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  if(c.mund==='offen') mouth=`<path d="M41 66h18q-1 11-9 11t-9-11z" fill="${ink}"/><path d="M45 73q5 3 10 0" fill="#ff7a93"/>`;
  if(c.mund==='zunge') mouth=`<path d="M42 67q8 6 16 0" stroke="${ink}" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M49 70h7v4a3.5 3.5 0 01-7 0z" fill="#ff7a93"/>`;
  const cheeks=`<circle cx="30" cy="64" r="4.5" fill="#ff8fa8" opacity=".55"/><circle cx="70" cy="64" r="4.5" fill="#ff8fa8" opacity=".55"/>`;
  const nose=c.figur==='baer'?`<ellipse cx="50" cy="63" rx="4" ry="3" fill="${ink}"/>`:c.figur==='katze'?`<path d="M47 61h6l-3 3z" fill="#ff7a93"/>`:'';
  let ex='';
  if(c.extra==='schleife') ex=`<path d="M62 30l12-8v16zM62 30l-12-8v16z" fill="#ff4f8b"/><circle cx="62" cy="30" r="4" fill="#d63370"/>`;
  if(c.extra==='brille') ex=`<g fill="none" stroke="${ink}" stroke-width="2.6"><circle cx="39" cy="54" r="10"/><circle cx="61" cy="54" r="10"/><path d="M49 54h2M29 52l-7-3M71 52l7-3"/></g>`;
  if(c.extra==='kopfhoerer') ex=`<path d="M20 58a30 30 0 0160 0" fill="none" stroke="${ink}" stroke-width="5"/><rect x="13" y="52" width="12" height="20" rx="5" fill="#ff4f8b"/><rect x="75" y="52" width="12" height="20" rx="5" fill="#ff4f8b"/>`;

function avatar(cls){

  return `<span class="av ${cls||''}" role="img" aria-label="Avatar von ${esc(displayName())}">${b?`<img src="${esc(b)}" alt="">`:figur(ME)}</span>`;
}
// Bild verkleinern und quadratisch zuschneiden, damit es klein genug für das Konto ist.
function shrink(file){
  return new Promise((ok,fail)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const S=256,c=document.createElement('canvas');c.width=c.height=S;
      const m=Math.min(img.width,img.height),x=(img.width-m)/2,y=(img.height-m)/2;
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);g.drawImage(img,x,y,m,m,0,0,S,S);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.85))};
    img.onerror=()=>{URL.revokeObjectURL(url);fail()};
    img.src=url;
  });
}

        ${ME.art==='bild'?`
        <div class="grp"><div class="upload">${bild?`<span class="av"><img src="${esc(bild)}" alt="Dein Bild"></span>`:`<span class="av"></span>`}
            <div style="display:flex;flex-wrap:wrap;gap:10px"><label class="btn" for="file">${bild?'Anderes Bild':'Bild aussuchen'}</label>
            <input id="file" type="file" accept="image/*">${bild?'<button class="btn ghost" type="button" id="rmBild">Löschen</button>':''}</div></div>
          <p class="note">Das Bild wird rund zugeschnitten. Nimm etwas, das du magst, zum Beispiel dein Haustier oder eine Zeichnung.</p></div>`:`
        <div class="grp"><h3>Figur</h3><div class="opts">${AV.figur.map(([v,l])=>opt('figur',v,l)).join('')}</div></div>
        <div class="grp"><h3>Farbe</h3><div class="opts">${AV.farbe.map(v=>sw('farbe',v)).join('')}</div></div>
        <div class="grp"><h3>Augen</h3><div class="opts">${AV.augen.map(([v,l])=>opt('augen',v,l)).join('')}</div></div>
        <div class="grp"><h3>Mund</h3><div class="opts">${AV.mund.map(([v,l])=>opt('mund',v,l)).join('')}</div></div>
        <div class="grp"><h3>Extras</h3><div class="opts">${AV.extra.map(([v,l])=>opt('extra',v,l)).join('')}</div></div>
        <div class="grp"><h3>Hintergrund</h3><div class="opts">${AV.bg.map(v=>sw('bg',v)).join('')}</div></div>`}
        </section>
        <form class="panel" id="about"><h2 class="sh">Über mich</h2><div class="fields">
          <label for="pSpitz">So soll die Lernwelt mich nennen<input id="pSpitz" maxlength="20" value="${esc(ME.spitz)}" placeholder="${esc(USERNAME)}"></label>
          <label for="pFach">Lieblingsfach<select id="pFach"><option value="">Noch keins</option>${FAECHER.map(f=>`<option value="${f.id}" ${ME.fach===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>
          <label for="pMotto" class="wide">Mein Motto<input id="pMotto" maxlength="40" value="${esc(ME.motto)}" placeholder="Zum Beispiel: Schritt für Schritt zum Ziel"></label>
        </div><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><button class="btn" type="submit">Speichern</button><p class="saved" id="saved" role="status"></p></div></form>
        <section class="panel"><h2 class="sh">Mein Konto</h2><p class="small muted" style="margin:0">Angemeldet als <b>${esc(USERNAME)}</b>. Das Passwort ändern Mama oder Papa.</p>
          <button class="btn ghost" type="button" id="logout" style="align-self:flex-start">Abmelden</button></section>
      </div>`;
  }
};

const S={filt:'alle',q:''};
const VIEWS=['faecher','merkzettel','profil'];
function route(keepScroll){
  let h=(location.hash||'#start').slice(1),y=window.scrollY,html,act;
  if(h==='avatar'){h='profil'}
  if(h.startsWith('fach-')){html=V.fach(h.slice(5));act='faecher'}
  else if(h.startsWith('heft-')){html=V.heft(h.slice(5));act='faecher'}
  else if(VIEWS.includes(h)){html=V[h]();act=h}
  else{html=V.start();act='start'}
  $('view').innerHTML=html;drawNav(act);
  if(location.hash==='#avatar'){const a=$('avatar');if(a){a.scrollIntoView();return}}
  window.scrollTo(0,keepScroll?y:0);
}
function refocus(sel){const b=document.querySelector(sel);if(b)b.focus({preventScroll:true})}

document.addEventListener('click',e=>{
  const hl=e.target.closest('[data-heft]');
  if(hl){put(LAST,hl.dataset.heft);return}
  const c=e.target.closest('.chip[data-f]');
  if(c){S.filt=c.dataset.f;route(true);refocus(`.chip[data-f="${S.filt}"]`);return}
  const ar=e.target.closest('[data-art]');
  if(ar){ME.art=ar.dataset.art;saveMe();route(true);refocus(`[data-art="${ME.art}"]`);return}
  const a=e.target.closest('[data-av]');
  if(a){ME[a.dataset.av]=a.dataset.v;saveMe();route(true);refocus(`[data-av="${a.dataset.av}"][data-v="${a.dataset.v}"]`);return}
  if(e.target.id==='rmBild'){put(BILD,null);route(true);return}
  if(e.target.id==='logout'){LW.signOut().then(()=>{location.hash='';show(null)});return}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='file'||!e.target.files[0])return;
  shrink(e.target.files[0]).then(d=>{
    if(!put(BILD,d))throw 0;
    ME.art='bild';saveMe();route(true);
  }).catch(()=>{const s=$('saved');if(s){s.style.color='var(--err)';s.textContent='Das Bild konnte nicht geladen werden. Probier ein anderes.'}});
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='about')return;
  e.preventDefault();
  ME.spitz=$('pSpitz').value.trim();ME.motto=$('pMotto').value.trim();ME.fach=$('pFach').value;
  saveMe();route(true);const s=$('saved');if(s)s.textContent='Gespeichert!';
});
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  S.q=e.target.value;const pos=e.target.selectionStart;route(true);
  const n=$('q');if(n){n.focus({preventScroll:true});n.setSelectionRange(pos,pos)}
});
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#fach-')){S.filt='alle';S.q=''}route()});

function show(user){
  const inn=!!user;
  $('loginWrap').hidden=inn;$('app').hidden=!inn;$('tabNav').hidden=!inn;
  if(inn){
    const n=(user.email||'').replace(/@lernwelt\.local$/,'');
    USERNAME=n.charAt(0).toUpperCase()+n.slice(1);
    loadMe();route();
  }else setTimeout(()=>$('lname').focus(),0);
}
if(!window.LW||!LW.configured){$('noconfig').hidden=false;$('loginWrap').hidden=false;$('lbtn').disabled=true}
else{
  LW.ready.then(s=>show(s&&s.user),()=>show(null));
  $('login').addEventListener('submit',e=>{
    e.preventDefault();$('lerr').textContent='';$('lbtn').disabled=true;
    LW.signIn($('lname').value,$('lpw').value)
      .then(s=>{$('lpw').value='';show(s&&s.user)})
      .catch(()=>{$('lerr').textContent='Name oder Passwort stimmt nicht. Versuch es noch einmal.'})
      .finally(()=>{$('lbtn').disabled=false});
  });
}
</script>
</body>
</html>
