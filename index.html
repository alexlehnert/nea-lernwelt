<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/sync.js" data-hub="1"></script>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lernwelt"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5B3FE6">
<script src="/hefte.js"></script>
<title>Neas Lernwelt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout nach dem Mobile-Konzept: farbiger Kopf mit runder Unterkante, Karten darunter, Tab-Leiste unten.
   Breit: dieselben Seiten mit Seitenleiste links. Ebenen: Start → Fach → Heft · Merkzettel · Profil */
:root{
  --bg:#F4F2FF; --card:#FFFFFF; --ink:#1E1B3A; --muted:#5E5A7A; --line:#E4E0F5; --soft:#ECE8FB; --shadow:#DCD6F7;
  --brand:#5B3FE6; --brand-d:#4227B8; --sun:#FFC93C; --ok:#22A35A; --err:#C2410C;
  --new-bg:#FFF3CC; --new-fg:#8A5A00;
  --ma:#2563EB; --ma-d:#1E40AF; --en:#15803D; --en-d:#166534; --bio:#C2410C; --bio-d:#9A3412;
  --geo:#BE185D; --geo-d:#9D174D; --mu:#7C3AED; --mu-d:#5B21B6; --de:#0F766E; --de-d:#115E59;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15132A; --card:#1F1C3A; --ink:#F1EFFF; --muted:#B4AFD3; --line:#332E5A; --soft:#2A2650; --shadow:#0D0B1F;
  --brand:#6E55F0; --brand-d:#4A31C4; --ok:#3DBA70; --err:#F07A4A; --new-bg:#4A3B0E; --new-fg:#FFD970;
  --ma:#3B76F0; --ma-d:#2349B8; --en:#22994C; --en-d:#166534; --bio:#D9541A; --bio-d:#9A3412;
  --geo:#D42C72; --geo-d:#9D174D; --mu:#8B55F0; --mu-d:#5B21B6; --de:#169489; --de-d:#115E59; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15132A; --card:#1F1C3A; --ink:#F1EFFF; --muted:#B4AFD3; --line:#332E5A; --soft:#2A2650; --shadow:#0D0B1F;
  --brand:#6E55F0; --brand-d:#4A31C4; --ok:#3DBA70; --err:#F07A4A; --new-bg:#4A3B0E; --new-fg:#FFD970;
  --ma:#3B76F0; --ma-d:#2349B8; --en:#22994C; --en-d:#166534; --bio:#D9541A; --bio-d:#9A3412;
  --geo:#D42C72; --geo-d:#9D174D; --mu:#8B55F0; --mu-d:#5B21B6; --de:#169489; --de-d:#115E59; color-scheme:dark}
*{box-sizing:border-box}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.ma{--c:var(--ma);--cd:var(--ma-d)} .en{--c:var(--en);--cd:var(--en-d)} .bio{--c:var(--bio);--cd:var(--bio-d)}
.geo{--c:var(--geo);--cd:var(--geo-d)} .mu{--c:var(--mu);--cd:var(--mu-d)} .de{--c:var(--de);--cd:var(--de-d)}
.br{--c:var(--brand);--cd:var(--brand-d)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.55rem;color:var(--brand);padding:4px 12px 18px;line-height:1;text-decoration:none}
.logo small{display:block;font-family:var(--f-body);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.nav{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:.02em;padding:10px 12px;border-radius:12px;border:2px solid transparent;color:var(--muted)}
.nav svg{width:26px;height:26px;flex:none}
@media (hover:hover){.nav:hover{background:var(--soft)}}
.nav[aria-current="page"]{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.me{display:flex;align-items:center;gap:10px;text-decoration:none;margin-top:auto;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.me .av{width:44px;height:44px}
.me b{font-family:var(--f-display);display:block;line-height:1.1}
.me span{font-size:.78rem;color:var(--muted)}

main{min-width:0;display:flex;flex-direction:column;padding-bottom:110px}
.pad{padding:22px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;max-width:920px;width:100%}
@media (min-width:761px){.pad{padding-inline:32px}}

/* Farbiger Kopf */
.head{position:relative;overflow:hidden;background:var(--c);color:#fff;border-radius:0 0 32px 32px;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.head::before{content:"";position:absolute;right:-40px;top:-30px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.head>*{position:relative}
.head .deco{position:absolute;pointer-events:none}
@media (min-width:761px){.head{margin:18px 32px 0;border-radius:28px;padding-top:22px;max-width:856px}}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandname{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:.01em}
.backbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;flex:none;text-decoration:none}
.backbtn svg{width:22px;height:22px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hello{display:flex;align-items:center;gap:14px;margin-top:20px}
.hello .av{width:68px;height:68px;border:3px solid #fff}
.hello h1{font-size:2rem;line-height:1.05}
.hello p{margin:4px 0 0;font-size:.95rem;opacity:.95}
.ftitle{display:flex;align-items:center;gap:14px;margin-top:14px}
.ftitle .ic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.2);box-shadow:none}
.ftitle h1{font-size:2rem;line-height:1}
.ftitle p,.head p.sub{margin:6px 0 0;font-size:.95rem;opacity:.95}

/* Avatar */
.av{display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--soft)}
.av svg,.av img{display:block;width:100%;height:100%;object-fit:cover}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:16px;border:none;cursor:pointer;text-decoration:none;
  font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;background:var(--c,var(--brand));color:#fff;box-shadow:0 5px 0 var(--cd,var(--brand-d));transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd,var(--brand-d))}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--card);color:var(--brand);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn svg{width:20px;height:20px}
h2.sh{font-size:1.25rem}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h a{font-weight:700;color:var(--brand);text-decoration:none;font-size:.9rem}
.rule{display:flex;align-items:center;gap:10px;font-size:1.12rem}
.rule::after{content:"";flex:1;height:2px;background:var(--line)}
.pill{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--cd)}
.pill.new{background:var(--new-bg);color:var(--new-fg)}
:root[data-theme="dark"] .pill.on{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.on{color:#fff}}

/* Anmelden */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:24px;padding:26px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login .logo{padding:0 0 4px;font-size:1.9rem}
.login img{width:84px;height:84px;border-radius:22px;align-self:flex-start}
.login label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
.login input{font-size:1.1rem;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);min-height:50px}
.pw{position:relative;display:block}.pw input{width:100%;padding-right:54px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:12px}
.pw button svg{width:22px;height:22px}.pw button[aria-pressed="true"]{color:var(--brand,#5B3FE6)}
.err{color:var(--err);font-weight:700;margin:0;min-height:1.4em}

/* Serie, Tagesziel, Sterne */
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 12px 6px 8px;font-weight:700;font-size:.88rem;margin-right:64px}
.streak svg{width:18px;height:18px}
.head.start{padding-bottom:66px}
.goalcard{position:relative;margin-top:-66px;background:var(--card);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 var(--shadow),0 10px 24px rgba(66,39,184,.12)}
.goalcard svg{width:54px;height:54px;flex:none}
.goalcard b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.12rem}
.goalcard span{font-size:.88rem;color:var(--muted)}
.bar{display:block;height:10px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand))}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:15px;height:15px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
.stats.lift{margin-top:-60px;position:relative}

/* Weitermachen */
.resume{display:block;position:relative;overflow:hidden;text-decoration:none;background:var(--c);color:#fff;border-radius:22px;padding:16px 18px 18px;box-shadow:0 6px 0 var(--cd)}
.resume::before{content:"";position:absolute;right:-24px;top:-24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.10)}
.resume>*{position:relative}
.resume b{display:block;margin-top:4px;font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.15}
.resume p{margin:4px 0 0;font-size:.92rem;opacity:.95}
.resume .go{display:flex;align-items:center;gap:12px;margin-top:14px}
.resume .bar{background:rgba(255,255,255,.25)}
.resume .bar i{background:var(--sun)}
.resume .go span:not(.bar){display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--cd);font-family:var(--f-display);font-weight:700;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;border-radius:14px;padding:10px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.resume .go svg{width:14px;height:14px}

/* Fächer */
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:761px){.subjects{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}
.subj{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px;min-width:0}
@media (hover:hover){.subj:hover{border-color:var(--c)}}
.ic{border-radius:13px;background:var(--c);display:grid;place-items:center;flex:none}
.subj .ic{width:42px;height:42px;box-shadow:0 3px 0 var(--cd)}
.ic svg{width:58%;height:58%}
.subj b{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.1;overflow-wrap:anywhere}
.subj span{font-size:.75rem;color:var(--muted)}

/* Fach */
.tools{display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0 14px;min-height:50px}
.search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.search input{flex:1;border:none;background:none;min-width:0;outline:none;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:700;font-size:.9rem;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.hefte{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.heft{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px 16px}
.heft.on{border-color:var(--c)}
@media (hover:hover){.heft:hover{border-color:var(--c)}}
.heft .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.heft b{font-family:var(--f-display);font-weight:600;font-size:1.2rem;line-height:1.15}
.heft p{margin:0;font-size:.9rem;color:var(--muted)}
.heft .meta{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.heft .meta b{font-family:var(--f-body);font-size:.82rem;color:var(--cd);white-space:nowrap}
:root[data-theme="dark"] .heft .meta b{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .heft .meta b{color:#fff}}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ref{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;min-width:0}
@media (hover:hover){.ref:hover{border-color:var(--brand)}}
.ref .ri{width:36px;height:36px;border-radius:11px;background:#FCE7F6;display:grid;place-items:center}
.ref .ri svg{width:20px;height:20px}
.ref b{font-size:.9rem;line-height:1.25}
.ref span{font-size:.78rem;color:var(--muted)}

/* Heft: Kapitel-Pfad */
.path{display:flex;flex-direction:column;gap:18px;padding:6px 4px 0;position:relative}
.step{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;color:var(--ink);width:min(100%,360px)}
.step:nth-child(even){grid-template-columns:minmax(0,1fr) 72px;align-self:flex-end;text-align:right}
.step:nth-child(even) .dot{order:2}
@media (min-width:761px){.path{max-width:560px}}
.dot{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 5px 0 var(--cd);font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:#fff;transition:transform .08s;justify-self:center}
.step:active .dot{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.step b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.2}
.step small{display:block;font-size:.82rem;color:var(--muted)}
.step.done .dot{background:var(--ok);box-shadow:0 5px 0 #17703D}
.step.done .dot svg{width:30px;height:30px}
.step.open .dot{background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);color:var(--muted)}
.step.now .dot{outline:5px solid var(--sun);outline-offset:4px}
.here{display:inline-block;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;border-radius:10px;padding:3px 10px;margin-bottom:4px}
.hbar{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.9rem;font-weight:700}
.hbar .bar{background:rgba(255,255,255,.25)}
.hbar .bar i{background:var(--sun)}
.goal{border:none;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;width:min(100%,360px)}
.goal .dot{background:var(--new-bg);border:3px dashed #F0B400;box-shadow:none;border-radius:18px}
.goal .dot svg{width:30px;height:30px}
.goal b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.goal .small{display:block}
.cta{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-top:8px;z-index:5}
.cta .btn{width:100%;min-height:58px;font-size:1.15rem}
@media (min-width:761px){.cta{bottom:20px;max-width:420px}}

/* Profil */
.head.prof{text-align:center;padding-bottom:76px}
.bigav{position:relative;width:112px;height:112px;margin:8px auto 0}
.bigav .av{width:112px;height:112px;border:4px solid #fff}
.pen{position:absolute;right:-4px;bottom:-2px;width:44px;height:44px;border-radius:50%;border:3px solid var(--c);background:var(--sun);display:grid;place-items:center;cursor:pointer;color:#1E1B3A;text-decoration:none}
.pen svg{width:20px;height:20px}
.head.prof h1{margin-top:12px;font-size:1.8rem;line-height:1;overflow-wrap:anywhere}
.head.prof .motto{margin:6px 0 0;font-size:.95rem;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.row .ic{width:40px;height:40px;border-radius:12px}
.avrow .ic{overflow:hidden;border-radius:50%;flex:none}.avrow .ic > *,.avrow .ic svg{width:100%;height:100%}.avrow div{flex:1;min-width:0}.avrow .gems{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.row div{flex:1;min-width:0}
.row span{display:block;font-size:.78rem;color:var(--muted)}
.row b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{font-size:1.05rem}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:none;background:none;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--brand);box-shadow:0 2px 0 var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{width:64px;height:64px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);cursor:pointer;display:grid;place-items:center;padding:4px}
.opt svg{width:52px;height:52px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card))}
.opt.sw{width:46px;height:46px;border-radius:50%;padding:0}
.opt.sw i{display:block;width:30px;height:30px;border-radius:50%}
.upload{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.upload .av{width:96px;height:96px;border:2px dashed var(--line)}
.upload input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
.fields input,.fields select{font-weight:400;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);min-height:48px;width:100%}
.fields .wide{grid-column:1/-1}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;cursor:pointer;color:var(--ink);min-height:44px}
.badge b{font-size:.78rem;line-height:1.2;overflow-wrap:anywhere}
.badge.lock{background:transparent;border-style:dashed;color:var(--muted)}
.bi{width:52px;height:52px;border-radius:50%;background:var(--c);box-shadow:0 4px 0 var(--cd);display:grid;place-items:center;flex:none}
.bi svg{width:50%;height:50%}
.lock .bi{background:var(--soft);box-shadow:none}
.goal .dot.bi{width:64px;height:64px;border:none;border-radius:50%;background:var(--c);box-shadow:0 5px 0 var(--cd)}
dialog.sheet{border:none;border-radius:28px;padding:26px 22px 22px;width:min(340px,calc(100% - 32px));background:var(--card);color:var(--ink);text-align:center;box-shadow:0 8px 0 var(--shadow)}
dialog.sheet::backdrop{background:rgba(21,19,42,.6)}
.sheet .bi{width:104px;height:104px;margin:6px auto 14px;box-shadow:0 7px 0 var(--cd)}
.sheet .bi.lock{background:var(--soft);box-shadow:none}
.sheet .kick{display:inline-block;background:var(--sun);color:#1E1B3A;font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:4px 12px}
.sheet h2{font-size:1.5rem;margin:10px 0 6px}
.sheet p{margin:0 0 18px;color:var(--muted)}
.sheet .btn{width:100%}
.gems{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.gems svg{width:20px;height:20px}
.opt.shop{position:relative}
.price{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:0 6px;font-size:.72rem;font-weight:700;color:var(--ink);white-space:nowrap}
.price svg{width:12px;height:12px}
.shopopts{row-gap:20px;padding-bottom:10px}
.sheet .shopav{width:112px;height:112px;margin:12px auto 10px;border:4px solid var(--soft)}
.sheet .btns{display:flex;flex-direction:column;gap:10px}
.wk{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;height:150px;border-bottom:2px solid var(--line);margin-top:24px}
.wkc{position:relative;display:flex;align-items:flex-end;justify-content:center}
.wkc i{display:block;width:62%;max-width:28px;border-radius:4px 4px 0 0;background:var(--brand)}
.wkc b{position:absolute;transform:translateY(-4px);font-size:.8rem;color:var(--ink)}
.wkz{position:absolute;left:0;right:0;border-top:2px dashed var(--new-fg);z-index:1;pointer-events:none}
.wkz em{position:absolute;right:0;bottom:2px;font-style:normal;font-size:.75rem;font-weight:700;color:var(--muted);background:var(--card);padding:0 4px}
.wkl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px}
.erow{display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.erow .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.erow .top b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.erow .meta{display:flex;align-items:center;gap:10px;font-size:.85rem}
.erow .meta b{color:var(--c);white-space:nowrap}
.saved{min-height:1.5em;margin:0;font-weight:700;color:var(--ok)}
.note{font-size:.88rem;color:var(--muted);margin:0;max-width:70ch}

/* Tab-Leiste mobil */
.tabs{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);
    padding:8px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:.8rem;color:var(--muted);padding:4px 0;border-radius:12px;min-height:52px;justify-content:center}
  .tabs a svg{width:26px;height:26px}
  .tabs a[aria-current="page"]{color:var(--brand)}
}
@media (max-width:420px){.fields{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<div class="login-wrap" id="loginWrap" hidden>
  <form class="login" id="login">
    <img src="/icons/icon-192.png" alt="">
    <div class="logo">Neas Lernwelt<small>Klasse 5</small></div>
    <label for="lname">Name<input id="lname" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label for="lpw">Passwort<span class="pw"><input id="lpw" type="password" autocomplete="current-password" required><button type="button" id="pwShow" aria-label="Passwort anzeigen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <button class="btn" type="submit" id="lbtn">Los geht's</button>
    <p class="err" id="lerr" role="alert"></p>
    <p class="note" id="noconfig" hidden>Die Lernwelt ist noch nicht mit Supabase verbunden. Trag in Vercel SUPABASE_URL und SUPABASE_ANON_KEY ein (siehe README).</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="Hauptmenü">
    <a class="logo" href="#start">Neas Lernwelt<small>Klasse 5</small></a>
    <nav id="sideNav" style="display:flex;flex-direction:column;gap:6px"></nav>
    <a class="me" href="#profil" id="meChip"></a>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabs" id="tabNav" aria-label="Hauptmenü" hidden></nav>
<dialog class="sheet" id="abzDlg" aria-labelledby="abzT"></dialog>

<script>
const FAECHER=window.LW_FAECHER||[],HEFTE=window.LW_HEFTE||[],LINKS=window.LW_LINKS||[];
const LAST='lernwelt-zuletzt',PROFIL='lernwelt-profil',BILD='lernwelt-avatar-bild';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);return true}catch(e){return false}};
const fach=id=>FAECHER.find(f=>f.id===id);
const heft=id=>HEFTE.find(h=>h.id===id);
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;

/* ---------- Fortschritt ----------
   Die Apps melden ihre Kapitel über sync.js (lernwelt-fortschritt-<heft>: {k:[{t,p}]}, p = 0–1).
   Die Lernzeit pro Tag steht in lernwelt-zeit ({"2026-10-30": Sekunden}). */
const LERNTAG_S=5*60,EINST='lernwelt-einstellungen';
function einst(){let e={};try{e=JSON.parse(get(EINST)||'{}')||{}}catch(x){}return Object.assign({ziel:15},e)}
const zielMin=()=>+einst().ziel||15;
function kapitel(h){
  let r=null;try{r=JSON.parse(get('lernwelt-fortschritt-'+h.id)||'null')}catch(e){}
  const list=r&&Array.isArray(r.k)&&r.k.length?r.k:(h.kapitel||[]).map(t=>({t,p:0}));
  return list.map((k,i)=>({t:k.t,p:+k.p||0,a:(h.anker||[])[i]}));
}
function stand(h){
  const k=kapitel(h),done=k.filter(x=>x.p>=.999).length,cur=k.findIndex(x=>x.p<.999);
  return {k,done,n:k.length,cur:cur<0?null:cur,any:k.some(x=>x.p>0)};
}
const started=h=>!!(h.key&&get(h.key))||stand(h).any;
const sterne=p=>p>=.999?3:p>=2/3?2:p>=1/3?1:0;
const kapLink=(h,i)=>{const a=(h.anker||[])[i];return `${h.id}.html${a?'#'+a:''}`};
const dayKey=d=>d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
function zeit(){let z={};try{z=JSON.parse(get('lernwelt-zeit')||'{}')||{}}catch(e){}return z}
function heuteMin(){return Math.floor((zeit()[dayKey(new Date())]||0)/60)}
function serie(){
  const z=zeit(),d=new Date();let n=0;
  if((z[dayKey(d)]||0)<LERNTAG_S)d.setDate(d.getDate()-1);
  while((z[dayKey(d)]||0)>=LERNTAG_S){n++;d.setDate(d.getDate()-1)}
  return n;
}
function summe(){let st=0,done=0;HEFTE.forEach(h=>kapitel(h).forEach(k=>{st+=sterne(k.p);if(k.p>=.999)done++}));return {st,done}}
function sternSvg(on){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z" fill="${on?'#FFB800':'var(--line)'}"/></svg>`}
/* ---------- Abzeichen ----------
   Einmal verdient, bleibt ein Abzeichen: lernwelt-abzeichen = {id: "2026-10-30"} (Tag, an dem es dazukam).
   Heft-Abzeichen kommen aus hefte.js (Feld abzeichen), die übrigen stehen hier. */
const ABZ_KEY='lernwelt-abzeichen';
function besteSerie(){
  const z=zeit(),tage=Object.keys(z).filter(k=>z[k]>=LERNTAG_S).sort();let best=0,run=0,prev=null;
  tage.forEach(k=>{const d=new Date(k+'T12:00:00');run=prev&&Math.round((d-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=d});
  return best;
}
const gesamtMin=()=>Math.floor(Object.values(zeit()).reduce((a,b)=>a+(+b||0),0)/60);
function kapOk(id,titel){const h=heft(id);if(!h)return false;const k=kapitel(h).filter(x=>titel.includes(x.t));return k.length===titel.length&&k.every(x=>x.p>=.999)}
function abzeichenListe(){
  return [
    {id:'erster-stern',name:'Erster Stern',cls:'br',ic:'wstar',wie:'Hol dir in einem Kapitel deinen ersten Stern.',ok:()=>summe().st>=1},
    {id:'serie-3',name:'Drei Tage am Stück',cls:'bio',ic:'wflame',wie:'Lerne an 3 Tagen hintereinander, jeweils mindestens 5 Minuten.',ok:()=>besteSerie()>=3},
    {id:'serie-7',name:'Eine Woche dran',cls:'bio',ic:'wflame',wie:'Lerne an 7 Tagen hintereinander, jeweils mindestens 5 Minuten.',ok:()=>besteSerie()>=7},
    {id:'stunde',name:'Erste Lernstunde',cls:'de',ic:'clock',wie:'Lerne insgesamt 60 Minuten.',ok:()=>gesamtMin()>=60},
    {id:'kapitel-10',name:'Zehn Kapitel',cls:'br',ic:'flag',wie:'Schaffe 10 Kapitel mit 3 Sternen.',ok:()=>summe().done>=10},
    {id:'karteikasten',name:'Karteikasten-Heldin',cls:'ma',ic:'box',wie:'Hol dir 3 Sterne bei „Terme üben“ und „Potenzen üben“ im Rechenheft.',ok:()=>kapOk('rechenheft',['Terme üben','Potenzen üben'])},
    {id:'mikroskop',name:'Mikroskopier-Führerschein',cls:'bio',ic:'micro',wie:'Hol dir 3 Sterne beim Mikroskopier-Führerschein in der Bio-Expedition.',ok:()=>kapOk('bio-expedition',['Mikroskopier-Führerschein'])},
    {id:'kontinente',name:'Kontinente-Kennerin',cls:'geo',ic:'geo',wie:'Hol dir 3 Sterne bei „Kontinente & Ozeane“ im Atlas-Detektiv.',ok:()=>kapOk('atlas',['Kontinente & Ozeane'])}
  ].concat(HEFTE.filter(h=>h.abzeichen).map(h=>{const f=fach(h.fach)||{};
    return {id:'heft-'+h.id,heft:h.id,name:h.abzeichen,cls:f.cls,ic:f.cls,wie:`Schaffe alle Kapitel in „${h.name}“ mit 3 Sternen.`,ok:()=>stand(h).cur==null&&stand(h).n>0}}));
}
function verdient(){let m={};try{m=JSON.parse(get(ABZ_KEY)||'{}')||{}}catch(e){}return m}
// Prüft alle Abzeichen, merkt sich neue und gibt sie zurück.
function abzeichenPruefen(){
  const m=verdient(),neu=abzeichenListe().filter(a=>!m[a.id]&&a.ok());
  if(neu.length){const d=dayKey(new Date());neu.forEach(a=>m[a.id]=d);put(ABZ_KEY,JSON.stringify(m))}
  return neu;
}
const datum=k=>{const [y,mo,d]=String(k).split('-');return d?`${+d}.${+mo}.${y}`:''};
const badgeHtml=(a,m)=>m[a.id]
  ?`<button class="badge ${a.cls}" type="button" data-abz="${a.id}"><span class="bi">${I[a.ic]}</span><b>${esc(a.name)}</b></button>`
  :`<button class="badge lock" type="button" data-abz="${a.id}" aria-label="${esc(a.name)}, noch nicht geschafft"><span class="bi">${I.lock}</span><b>${esc(a.name)}</b></button>`;
let ABZ_Q=[];
function abzZeigen(a,neu){
  const m=verdient(),got=!!m[a.id],d=$('abzDlg');KAUF=null;
  d.className='sheet '+(got?a.cls:'');
  d.innerHTML=`${neu?'<span class="kick">Neues Abzeichen!</span>':''}
    <div class="bi ${got?'':'lock'}">${got?I[a.ic]:I.lock}</div>
    <h2 id="abzT">${esc(a.name)}</h2>
    <p>${got?(neu?esc(a.wie):`Geschafft am ${datum(m[a.id])}. ${esc(a.wie)}`):`Noch nicht geschafft. ${esc(a.wie)}`}</p>
    <form method="dialog"><button class="btn br" value="ok">${neu?(ABZ_Q.length?'Super! Noch eins':'Super!'):'Schließen'}</button></form>`;
  if(!d.open)d.showModal();
}
/* ---------- Edelsteine und Shop ----------
   Edelsteine verdient Nea mit Sternen (je 1) und Abzeichen (je 10). Gekaufte Sachen stehen in lernwelt-shop
   (Liste von ids); ausgegeben wird daraus berechnet, so kann beim Synchronisieren nichts doppelt zählen. */
const SHOP_KEY='lernwelt-shop',GEM_STERN=1,GEM_ABZ=10;
const SHOP=[
  {id:'blume',art:'extra',name:'Blume',preis:10},
  {id:'zauberhut',art:'extra',name:'Zauberhut',preis:15},
  {id:'sonnenbrille',art:'extra',name:'Sonnenbrille',preis:20},
  {id:'regenbogen',art:'bg',name:'Regenbogen',preis:25},
  {id:'sternenkranz',art:'extra',name:'Sternenkranz',preis:30},
  {id:'nacht',art:'bg',name:'Sternenhimmel',preis:35}
];
const BG_CSS={regenbogen:'linear-gradient(135deg,#ff9a9e,#fbc2eb 35%,#a1c4fd 70%,#c2e9fb)',nacht:'radial-gradient(circle at 30% 30%,#3b4a8f,#1a1f4d)'};
function gekauft(){let a=[];try{a=JSON.parse(get(SHOP_KEY)||'[]')}catch(e){}return Array.isArray(a)?a:[]}
function edelsteine(){
  const k=gekauft(),ein=summe().st*GEM_STERN+Object.keys(verdient()).length*GEM_ABZ;
  const aus=SHOP.filter(i=>k.includes(i.id)).reduce((a,i)=>a+i.preis,0);
  return Math.max(0,ein-aus);
}
let KAUF=null;
function kaufZeigen(it){
  const bal=edelsteine(),ok=bal>=it.preis,d=$('abzDlg');
  KAUF=ok?it.id:null;ABZ_Q=[];
  d.className='sheet br';d.returnValue='';
  d.innerHTML=`<span class="kick">Shop</span>
    <div class="av shopav">${figur(Object.assign({},ME,{[it.art]:it.id}))}</div>
    <h2 id="abzT">${esc(it.name)}</h2>
    <p>${ok?`Für ${it.preis} Edelsteine kaufen? Du hast ${bal}.`:`Dafür brauchst du ${it.preis} Edelsteine, dir fehlen noch ${it.preis-bal}. Sammle Sterne und Abzeichen!`}</p>
    <form method="dialog" class="btns">${ok?`<button class="btn br" value="buy">Kaufen</button><button class="btn ghost" value="no">Lieber nicht</button>`:'<button class="btn br" value="no">Okay</button>'}</form>`;
  if(!d.open)d.showModal();
}
function kaufen(id){
  const it=SHOP.find(i=>i.id===id);if(!it||edelsteine()<it.preis)return;
  const k=gekauft();if(!k.includes(id))k.push(id);put(SHOP_KEY,JSON.stringify(k));
  ME.art='figur';ME[it.art]=id;saveMe();route(true);refocus(`[data-av="${it.art}"][data-v="${id}"]`);
}
function zeitHeft(){let h={};try{h=JSON.parse(get('lernwelt-zeit-heft')||'{}')||{}}catch(e){}return h}
function abzFeiern(){const n=abzeichenPruefen();if(!n.length)return;ABZ_Q=n.slice(1);abzZeigen(n[0],true)}
const sterneHtml=p=>{const n=sterne(p);return `<span class="stars" role="img" aria-label="${n} von 3 Sternen">${[0,1,2].map(i=>sternSvg(i<n)).join('')}</span>`};

const I={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="M9 5l7 7-7 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="#A86F00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
  refbook:'<svg viewBox="0 0 24 24" fill="none" stroke="#B0127F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-3 2-5 5-5 8 0 4.3 3 7 7 7z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

// Bild verkleinern und quadratisch zuschneiden, damit es klein genug für das Konto ist.
function shrink(file){
  return new Promise((ok,fail)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const S=256,c=document.createElement('canvas');c.width=c.height=S;
      const m=Math.min(img.width,img.height),x=(img.width-m)/2,y=(img.height-m)/2;
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);g.drawImage(img,x,y,m,m,0,0,S,S);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.85))};
    img.onerror=()=>{URL.revokeObjectURL(url);fail()};
    img.src=url;
  });
}

const V={

        <div class="hello">${avatar()}<div><h1>Hallo ${esc(displayName())}!</h1><p>Schön, dass du da bist.</p></div></div>
      </header>
      <div class="pad">
      <section class="goalcard" aria-label="Tagesziel">
        <svg role="img" aria-label="${min} von ${ZIEL_MIN} Minuten" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="none" stroke="var(--soft)" stroke-width="7"/>
          ${q>0?`<circle cx="27" cy="27" r="22" fill="none" stroke="#FFB800" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(q*C).toFixed(1)} ${C}" transform="rotate(-90 27 27)"/>`:''}

    const hs=HEFTE.filter(h=>h.fach===id),viele=hs.length>=6,filt=viele?S.filt:'alle',q=viele?S.q.toLowerCase():'';

      </div>`;

  heft(id){

    const f=fach(h.fach),t=stand(h),k=t.k;
    return `<header class="head ${f.cls}"><div class="toprow" style="justify-content:flex-start">${backBtn('#fach-'+f.id,'Zurück zu '+f.name)}<span class="eyebrow">${esc(f.name)} · ${esc(h.thema)}</span></div>
        <h1 style="margin-top:14px;font-size:1.9rem;line-height:1.05">${esc(h.name)}</h1><p class="sub">${esc(h.info)}</p>
        <div class="hbar"><span class="bar"><i style="width:${Math.round(100*t.done/Math.max(1,t.n))}%"></i></span><span>${t.done} von ${plural(t.n,'Kapitel','Kapiteln')}</span></div></header>
      <div class="pad ${f.cls}">
        <section class="path" aria-label="Kapitel">
        ${k.map((x,i)=>{const st=x.p>=.999?'done':i===t.cur?'now':'open';
          return `<a class="step ${st}" href="${kapLink(h,i)}" data-heft="${h.id}" aria-label="Kapitel ${i+1}: ${esc(x.t)}${st==='done'?', geschafft':st==='now'?', als Nächstes':''}">
            <span class="dot">${st==='done'?I.check:i+1}</span>
            <span>${st==='now'?`<span class="here">${t.any?'Du bist hier':'Hier geht es los'}</span>`:''}<b>${esc(x.t)}</b><small>${sterneHtml(x.p)}</small></span></a>`}).join('')}
        ${h.abzeichen?(()=>{const got=verdient()['heft-'+h.id],f2=fach(h.fach);
          return `<button class="goal" type="button" data-abz="heft-${h.id}"><span class="dot ${got?'bi '+f2.cls:''}">${got?I[f2.cls]:I.trophy}</span><span><b>Abzeichen</b><span class="small muted">„${esc(h.abzeichen)}“ ${got?'gehört dir!':'wartet'}</span></span></button>`})():''}
        </section>
        <div class="cta"><a class="btn br" href="${t.cur!=null?kapLink(h,t.cur):heftLink(h)}" data-heft="${h.id}">${!started(h)?"Los geht's":t.cur!=null?`Weiter mit Kapitel ${t.cur+1}`:'Heft öffnen'} ${I.arrow}</a></div>
      </div>`;
  },
  profil(){
    const opt=(k,v,label)=>`<button class="opt" type="button" data-av="${k}" data-v="${v}" aria-pressed="${ME[k]===v}" aria-label="${label}" title="${label}">${figur(Object.assign({},ME,{[k]:v},k==='figur'||k==='augen'?{extra:'nichts'}:{}))}</button>`;
    const sw=(k,v,label)=>`<button class="opt sw" type="button" data-av="${k}" data-v="${v}" aria-pressed="${ME[k]===v}" aria-label="${label||'Farbe'}"><i style="background:${BG_CSS[v]||v}"></i></button>`;
    const k=gekauft(),meins=a=>SHOP.filter(i=>i.art===a&&k.includes(i.id)),rest=SHOP.filter(i=>!k.includes(i.id)),bal=edelsteine();
    const shopOpt=it=>`<button class="opt shop" type="button" data-shop="${it.id}" aria-label="${esc(it.name)}, ${it.preis} Edelsteine">${figur(Object.assign({},ME,{[it.art]:it.id}))}<span class="price">${I.gem}${it.preis}</span></button>`;
    const fn=fach(ME.fach),bild=get(BILD);
    return `<header class="head prof br">
        <span class="deco" style="left:40px;top:calc(36px + env(safe-area-inset-top,0px))">${I.star}</span>
        <span class="deco" style="right:56px;top:calc(92px + env(safe-area-inset-top,0px));transform:scale(.7)">${I.star}</span>
        <div class="bigav">${avatar()}<a class="pen" href="#avatar" aria-label="Avatar bearbeiten">${I.pen}</a></div>
        <h1>${esc(displayName())}</h1>${ME.motto?`<p class="motto">„${esc(ME.motto)}“</p>`:''}
      </header>
      <div class="pad">
        ${(()=>{const su=summe(),se=serie();return `<div class="stats lift">
          <div class="stat"><b style="color:var(--bio)">${se}</b><span>Tage in Folge</span></div>
          <div class="stat"><b style="color:var(--new-fg)">${su.st}</b><span>Sterne</span></div>
          <div class="stat"><b style="color:var(--ok)">${Object.keys(verdient()).length}</b><span>Abzeichen</span></div></div>`})()}
        <a class="row avrow" href="#avatar"><span class="ic">${avatar()}</span><div><span>Figur, Farben und Shop</span><b>Avatar bearbeiten</b></div><span class="gems" aria-label="${bal} Edelsteine">${I.gem}${bal}</span>${I.chev}</a>
        ${(()=>{const m=verdient(),L=abzeichenListe(),n=L.filter(a=>m[a.id]).length;return `<section class="sec" aria-labelledby="h-abz">
          <div class="sec-h"><h2 class="sh" id="h-abz">Meine Abzeichen</h2><span class="small muted">${n} von ${L.length}</span></div>
          <div class="badges">${L.map(a=>badgeHtml(a,m)).join('')}</div></section>`})()}
        ${fn?`<a class="row ${fn.cls}" href="#fach-${fn.id}"><span class="ic">${I[fn.cls]}</span><div><span>Lieblingsfach</span><b>${esc(fn.name)}</b></div>${I.chev}</a>`:''}
        <form class="panel" id="about"><h2 class="sh">Über mich</h2><div class="fields">
          <label for="pSpitz">So soll die Lernwelt mich nennen<input id="pSpitz" maxlength="20" value="${esc(ME.spitz)}" placeholder="${esc(USERNAME)}"></label>
          <label for="pFach">Lieblingsfach<select id="pFach"><option value="">Noch keins</option>${FAECHER.map(f=>`<option value="${f.id}" ${ME.fach===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>
          <label for="pMotto" class="wide">Mein Motto<input id="pMotto" maxlength="40" value="${esc(ME.motto)}" placeholder="Zum Beispiel: Schritt für Schritt zum Ziel"></label>
        </div><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><button class="btn" type="submit">Speichern</button><p class="saved" id="saved" role="status"></p></div></form>
        <section class="panel"><h2 class="sh">Mein Konto</h2><p class="small muted" style="margin:0">Angemeldet als <b>${esc(USERNAME)}</b>. Das Passwort ändern Mama oder Papa.</p>
          <div style="display:flex;flex-wrap:wrap;gap:10px"><a class="btn ghost" href="#eltern">Für Eltern</a><button class="btn ghost" type="button" id="logout">Abmelden</button></div></section>
      </div>`;
  },
  avatar(){
    const opt=(k,v,label)=>`<button class="opt" type="button" data-av="${k}" data-v="${v}" aria-pressed="${ME[k]===v}" aria-label="${label}" title="${label}">${figur(Object.assign({},ME,{[k]:v},k==='figur'||k==='augen'?{extra:'nichts'}:{}))}</button>`;
    const sw=(k,v,label)=>`<button class="opt sw" type="button" data-av="${k}" data-v="${v}" aria-pressed="${ME[k]===v}" aria-label="${label||'Farbe'}"><i style="background:${BG_CSS[v]||v}"></i></button>`;
    const k=gekauft(),meins=a=>SHOP.filter(i=>i.art===a&&k.includes(i.id)),rest=SHOP.filter(i=>!k.includes(i.id)),bal=edelsteine();
    const shopOpt=it=>`<button class="opt shop" type="button" data-shop="${it.id}" aria-label="${esc(it.name)}, ${it.preis} Edelsteine">${figur(Object.assign({},ME,{[it.art]:it.id}))}<span class="price">${I.gem}${it.preis}</span></button>`;
    const fn=fach(ME.fach),bild=get(BILD);
    return `<header class="head prof br">
        <div class="toprow" style="justify-content:flex-start;width:100%">${backBtn('#profil','Zurück zum Profil')}<span class="eyebrow">Profil</span></div>
        <div class="bigav">${avatar()}</div>
        <h1>Mein Avatar</h1>
      </header>
      <div class="pad">
        <section class="panel" id="avatar" aria-label="Avatar bauen"><div class="grp">
          <div class="seg" role="group" aria-label="Avatar-Art"><button type="button" data-art="figur" aria-pressed="${ME.art==='figur'}">Figur</button><button type="button" data-art="bild" aria-pressed="${ME.art==='bild'}">Eigenes Bild</button></div></div>
        ${ME.art==='bild'?`
        <div class="grp"><div class="upload">${bild?`<span class="av"><img src="${esc(bild)}" alt="Dein Bild"></span>`:`<span class="av"></span>`}
            <div style="display:flex;flex-wrap:wrap;gap:10px"><label class="btn" for="file">${bild?'Anderes Bild':'Bild aussuchen'}</label>
            <input id="file" type="file" accept="image/*">${bild?'<button class="btn ghost" type="button" id="rmBild">Löschen</button>':''}</div></div>
          <p class="note">Das Bild wird rund zugeschnitten. Nimm etwas, das du magst, zum Beispiel dein Haustier oder eine Zeichnung.</p></div>`:`
        <div class="grp"><h3>Figur</h3><div class="opts">${AV.figur.map(([v,l])=>opt('figur',v,l)).join('')}</div></div>
        <div class="grp"><h3>Farbe</h3><div class="opts">${AV.farbe.map(v=>sw('farbe',v)).join('')}</div></div>
        <div class="grp"><h3>Augen</h3><div class="opts">${AV.augen.map(([v,l])=>opt('augen',v,l)).join('')}</div></div>
        <div class="grp"><h3>Mund</h3><div class="opts">${AV.mund.map(([v,l])=>opt('mund',v,l)).join('')}</div></div>
        <div class="grp"><h3>Extras</h3><div class="opts">${AV.extra.concat(meins('extra').map(i=>[i.id,i.name])).map(([v,l])=>opt('extra',v,l)).join('')}</div></div>
        <div class="grp"><h3>Hintergrund</h3><div class="opts">${AV.bg.map(v=>sw('bg',v)).concat(meins('bg').map(i=>sw('bg',i.id,i.name))).join('')}</div></div>
        <div class="grp"><div class="sec-h"><h3>Shop</h3><span class="gems" role="img" aria-label="Du hast ${bal} Edelsteine">${I.gem}${bal}</span></div>
          <p class="note">Für jeden Stern bekommst du 1 Edelstein, für jedes Abzeichen 10.</p>
          ${rest.length?`<div class="opts shopopts">${rest.map(shopOpt).join('')}</div>`:'<p class="note">Du hast schon alles gekauft!</p>'}</div>`}
        </section>
      </div>`;
  }
};

/* Eltern-Sperre: eine kleine Rechenaufgabe, gilt bis der Browser-Tab geschlossen wird (sessionStorage, nicht synchronisiert). */
const ELT_OK='lernwelt-eltern-ok';
const elternOffen=()=>{try{return sessionStorage.getItem(ELT_OK)==='1'}catch(e){return false}};
let ELT_Q=null;
function elternSperre(){
  if(!ELT_Q){const a=6+Math.floor(Math.random()*4),b=12+Math.floor(Math.random()*8);ELT_Q={a,b}}
  return `<header class="head br"><div class="toprow" style="justify-content:flex-start">${backBtn('#profil','Zurück zum Profil')}<span class="eyebrow">Profil</span></div>
      <h1 style="margin-top:14px;font-size:1.9rem;line-height:1.05">Für Eltern</h1><p class="sub">Dieser Bereich ist für Mama und Papa.</p></header>
    <div class="pad"><form class="panel" id="eGate"><h2 class="sh">Kurze Frage</h2>
      <div class="fields"><label for="eAns">Wie viel ist ${ELT_Q.a} × ${ELT_Q.b}?<input id="eAns" inputmode="numeric" autocomplete="off" required></label></div>
      <button class="btn br" type="submit">Öffnen</button><p class="err" id="eErr" role="alert"></p></form></div>`;
}
/* Fortschritt eines Hefts löschen: Speicher der App, Kapitel-Fortschritt und besuchte Abschnitte. Abzeichen bleiben. */
function heftLeeren(h){[h.key,'lernwelt-fortschritt-'+h.id,h.id+'-besucht'].forEach(k=>{if(k)put(k,null)})}
V.eltern=function(){
  if(!elternOffen())return elternSperre();
  const z=zeit(),Z=zielMin(),WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const tage=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {wt:WT[d.getDay()],k:dayKey(d),m:Math.floor((z[dayKey(d)]||0)/60)}});
  const max=Math.max(Z,...tage.map(t=>t.m))*1.1,sum=tage.reduce((a,t)=>a+t.m,0),ok=tage.filter(t=>t.m>=Z).length,zh=zeitHeft(),su=summe();
  const pct=v=>(100*v/max).toFixed(1)+'%';
  return `<header class="head br"><div class="toprow" style="justify-content:flex-start">${backBtn('#profil','Zurück zum Profil')}<span class="eyebrow">Profil</span></div>
      <h1 style="margin-top:14px;font-size:1.9rem;line-height:1.05">Für Eltern</h1><p class="sub">So läuft es bei ${esc(displayName())}.</p></header>
    <div class="pad">
      <div class="stats">
        <div class="stat"><b>${sum}</b><span>Minuten in 7 Tagen</span></div>
        <div class="stat"><b>${ok} / 7</b><span>Tage mit Tagesziel</span></div>
        <div class="stat"><b>${su.done}</b><span>Kapitel geschafft</span></div></div>
      <section class="panel" aria-labelledby="h-wk"><div class="sec-h"><h2 class="sh" id="h-wk">Lernzeit diese Woche</h2><span class="small muted">Minuten pro Tag</span></div>
        <div class="wk" aria-hidden="true">
          <span class="wkz" style="bottom:${pct(Z)}"><em>Ziel ${Z}</em></span>
          ${tage.map((t,i)=>`<span class="wkc" title="${t.wt}: ${t.m} Min."><i style="height:${t.m?pct(t.m):'0'}"></i>${i===6&&t.m?`<b style="bottom:${pct(t.m)}">${t.m}</b>`:''}</span>`).join('')}
        </div>
        ${sum?'':'<p class="note" style="margin:0 0 8px">In den letzten 7 Tagen wurde noch nicht gelernt.</p>'}
        <div class="wkl" aria-hidden="true">${tage.map((t,i)=>`<span>${i===6?'Heute':t.wt}</span>`).join('')}</div>
        <table class="sr"><caption>Lernzeit der letzten 7 Tage</caption><tr><th>Tag</th><th>Minuten</th></tr>${tage.map(t=>`<tr><td>${t.wt} ${datum(t.k)}</td><td>${t.m}</td></tr>`).join('')}</table>
      </section>
      <section class="sec" aria-labelledby="h-eh"><h2 class="rule" id="h-eh">Lernhefte</h2>
        ${HEFTE.map(h=>{const t=stand(h),f=fach(h.fach),m=Math.floor((zh[h.id]||0)/60);
          return `<div class="erow ${f.cls}"><div class="top"><b>${esc(h.name)}</b><span class="small muted">${esc(f.name)}</span></div>
            <span class="meta"><span class="bar"><i style="width:${Math.round(100*t.done/Math.max(1,t.n))}%"></i></span><b>${t.done} / ${t.n} Kapitel</b></span>
            <span class="small muted">${t.k.reduce((a,x)=>a+sterne(x.p),0)} von ${3*t.n} Sternen${m?` · ${m} Min. gelernt`:''}</span></div>`}).join('')}
        <p class="note">Lernzeit zählt, solange ein Heft offen und auf dem Bildschirm zu sehen ist.</p>
      </section>
      <form class="panel" id="einst"><h2 class="sh">Einstellungen</h2>
        <div class="fields"><label for="eZiel">Tagesziel<select id="eZiel">${[10,15,20,30,45].map(v=>`<option value="${v}" ${v===Z?'selected':''}>${v} Minuten</option>`).join('')}</select></label></div>
        <p class="note">Ein Tag zählt für die Serie, wenn ${esc(displayName())} mindestens 5 Minuten lernt. Ein Kapitel ist geschafft, wenn es 3 Sterne hat.</p>
        <p class="saved" id="esaved" role="status"></p></form>
      <form class="panel" id="reset"><h2 class="sh">Fortschritt zurücksetzen</h2>
        <div class="fields"><label for="rHeft">Lernheft<select id="rHeft"><option value="">Heft auswählen</option>${HEFTE.filter(started).map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></label></div>
        <p class="note">Löscht Sterne, Karteikasten und Kapitel-Fortschritt in diesem Heft. Abzeichen und Edelsteine-Käufe bleiben.</p>
        <button class="btn ghost" type="submit" id="rGo">Zurücksetzen</button><p class="saved" id="rsaved" role="status"></p></form>
    </div>`;
};
const S={filt:'alle',q:''};
const VIEWS=['faecher','merkzettel','profil','avatar','eltern'];
function route(keepScroll){
  let h=(location.hash||'#start').slice(1),y=window.scrollY,html,act;
  if(h.startsWith('fach-')){html=V.fach(h.slice(5));act='faecher'}
  else if(h.startsWith('heft-')){html=V.heft(h.slice(5));act='faecher'}
  else if(VIEWS.includes(h)){html=V[h]();act=h==='eltern'||h==='avatar'?'profil':h}
  else{html=V.start();act='start'}
  $('view').innerHTML=html;drawNav(act);
  window.scrollTo(0,keepScroll?y:0);
}
function refocus(sel){const b=document.querySelector(sel);if(b)b.focus({preventScroll:true})}

document.addEventListener('click',e=>{
  const hl=e.target.closest('[data-heft]');
  if(hl){put(LAST,hl.dataset.heft);return}
  const c=e.target.closest('.chip[data-f]');
  if(c){S.filt=c.dataset.f;route(true);refocus(`.chip[data-f="${S.filt}"]`);return}
  const ar=e.target.closest('[data-art]');
  if(ar){ME.art=ar.dataset.art;saveMe();route(true);refocus(`[data-art="${ME.art}"]`);return}
  const a=e.target.closest('[data-av]');
  if(a){ME[a.dataset.av]=a.dataset.v;saveMe();route(true);refocus(`[data-av="${a.dataset.av}"][data-v="${a.dataset.v}"]`);return}
  const sh=e.target.closest('[data-shop]');
  if(sh){const it=SHOP.find(i=>i.id===sh.dataset.shop);if(it)kaufZeigen(it);return}
  const ab=e.target.closest('[data-abz]');
  if(ab){const a=abzeichenListe().find(x=>x.id===ab.dataset.abz);if(a){ABZ_Q=[];abzZeigen(a,false)}return}
  if(e.target.id==='rmBild'){put(BILD,null);route(true);return}
  if(e.target.id==='logout'){LW.signOut().then(()=>{location.hash='';show(null)});return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='rHeft'){const b=$('rGo');b.dataset.armed='';b.textContent='Zurücksetzen';return}
  if(e.target.id==='eZiel'){const x=einst();x.ziel=+e.target.value;put(EINST,JSON.stringify(x));const s=$('esaved');if(s)s.textContent='Gespeichert!';return}
  if(e.target.id!=='file'||!e.target.files[0])return;
  shrink(e.target.files[0]).then(d=>{
    if(!put(BILD,d))throw 0;
    ME.art='bild';saveMe();route(true);
  }).catch(()=>{const s=$('saved');if(s){s.style.color='var(--err)';s.textContent='Das Bild konnte nicht geladen werden. Probier ein anderes.'}});
});
document.addEventListener('submit',e=>{
  if(e.target.id==='eGate'){e.preventDefault();
    if(+$('eAns').value===ELT_Q.a*ELT_Q.b){try{sessionStorage.setItem(ELT_OK,'1')}catch(x){}ELT_Q=null;route()}
    else{$('eErr').textContent='Das stimmt nicht. Versuch es noch einmal.';$('eAns').value='';$('eAns').focus()}
    return}
  if(e.target.id==='reset'){e.preventDefault();
    const h=heft($('rHeft').value),b=$('rGo');if(!h)return;
    if(b.dataset.armed!==h.id){b.dataset.armed=h.id;b.textContent=`„${h.name}“ wirklich zurücksetzen?`;return}
    heftLeeren(h);route(true);const s=$('rsaved');if(s)s.textContent=`„${h.name}“ ist zurückgesetzt.`;
    return}
  if(e.target.id!=='about')return;
  e.preventDefault();
  ME.spitz=$('pSpitz').value.trim();ME.motto=$('pMotto').value.trim();ME.fach=$('pFach').value;
  saveMe();route(true);const s=$('saved');if(s)s.textContent='Gespeichert!';
});
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  S.q=e.target.value;const pos=e.target.selectionStart;route(true);
  const n=$('q');if(n){n.focus({preventScroll:true});n.setSelectionRange(pos,pos)}
});
$('pwShow').addEventListener('click',()=>{const i=$('lpw'),on=i.type==='password';i.type=on?'text':'password';$('pwShow').setAttribute('aria-pressed',on);$('pwShow').setAttribute('aria-label',on?'Passwort verbergen':'Passwort anzeigen')});
$('abzDlg').addEventListener('close',()=>{const d=$('abzDlg');if(KAUF){const id=KAUF;KAUF=null;if(d.returnValue==='buy')kaufen(id);return}const n=ABZ_Q.shift();if(n)setTimeout(()=>abzZeigen(n,true),150)});
// Zurück aus einer App (Seite aus dem Zwischenspeicher): Fortschritt neu anzeigen.
window.addEventListener('pageshow',e=>{if(e.persisted&&!$('app').hidden){route(true);abzFeiern()}});
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#fach-')){S.filt='alle';S.q=''}route()});

function show(user){
  const inn=!!user;
  $('loginWrap').hidden=inn;$('app').hidden=!inn;$('tabNav').hidden=!inn;
  if(inn){
    const n=(user.email||'').replace(/@lernwelt\.local$/,'');
    USERNAME=n.charAt(0).toUpperCase()+n.slice(1);
    loadMe();const neu=abzeichenPruefen();route();
    if(neu.length){ABZ_Q=neu.slice(1);abzZeigen(neu[0],true)}
  }else setTimeout(()=>$('lname').focus(),0);
}
if(!window.LW||!LW.configured){$('noconfig').hidden=false;$('loginWrap').hidden=false;$('lbtn').disabled=true}
else{
  LW.ready.then(s=>show(s&&s.user),()=>show(null));
  $('login').addEventListener('submit',e=>{
    e.preventDefault();$('lerr').textContent='';$('lbtn').disabled=true;
    LW.signIn($('lname').value,$('lpw').value)
      .then(s=>{$('lpw').value='';$('lpw').type='password';show(s&&s.user)})
      .catch(()=>{$('lerr').textContent='Name oder Passwort stimmt nicht. Versuch es noch einmal oder frag Mama oder Papa.'})
      .finally(()=>{$('lbtn').disabled=false});
  });
}
</script>
</body>
</html>
