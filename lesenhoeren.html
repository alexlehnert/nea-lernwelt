  <button class="toggle" id="denk" aria-pressed="${S.denk?"true":"false"}"><span class="grow"><b>Denkfrage vor den Antworten</b><br><span class="small">Erst überlegen: Was suche ich im Text?</span></span><span class="sw" aria-hidden="true"></span></button>
  <span class="eyebrow sect">Lesen</span>
  <div class="stations">${CH.filter(c=>c.mode==="lesen").map(stBtn).join("")}</div>
  <span class="eyebrow sect">Hören</span>
  <div class="stations">${CH.filter(c=>c.mode==="hoeren").map(stBtn).join("")}</div>
  <span class="eyebrow sect">Zum Schluss</span>
  <div class="stations">${CH.filter(c=>c.test).map(stBtn).join("")}
    <button class="st extra" data-ch="lesecke"><span class="ico" aria-hidden="true">🛋️</span><span class="grow"><span class="n">Entdecken</span><h3>Lese-Ecke</h3><p>Alle Texte in Ruhe lesen oder anhören und mitlesen</p></span></button></div>`;
  $("#denk").onclick=e=>{S.denk=!S.denk;save();e.currentTarget.setAttribute("aria-pressed",S.denk?"true":"false")};
  app.querySelectorAll(".st[data-ch]").forEach(b=>b.onclick=()=>openCh(b.dataset.ch));
  scrollTo(0,0)}
function stBtn(c){const k=CH.indexOf(c),b=stars(c);
  return `<button class="st ${c.test?"extra":""}" data-ch="${c.id}"><span class="ico" aria-hidden="true">${c.ico}</span><span class="grow"><span class="n">${c.test?"Großer Test":"Kapitel "+(k+1)}</span><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p><span class="stars" aria-label="${b} von 3 Sternen">${[0,1,2].map(i=>I.star(i<b)).join("")}</span></span></button>`}
function openCh(id){if(id==="lesecke")return ecke();const c=chOf(id);if(!c)return;intro(c)}

/* ================= Erklär-Karten ================= */
function intro(c,i){R=null;hush();i=i||0;const n=c.cards.length,last=i>=n-1,seen=S.seen[c.id];
  const k=CH.indexOf(c);
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>
    <div><span class="eyebrow">${c.test?"Großer Test":"Kapitel "+(k+1)}</span><h2>${esc(c.t)}</h2></div>
    <section class="card-x"><h3>${c.cards[i].h}</h3>${c.cards[i].b}</section>
    ${n>1?`<div class="dotsnav" aria-label="Karte ${i+1} von ${n}">${c.cards.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>`:""}
    <div class="row">${i>0?`<button class="ghost grow" id="prv">Zurück</button>`:""}<button class="go grow" id="nxt">${last?(c.test?"Probe-GLN starten":"Los geht's"):"Weiter"}</button></div>
    ${!last&&seen?`<button class="ghost" id="skip">Erklärung überspringen</button>`:""}`;
  $("#cbk").onclick=home;
  $("#nxt").onclick=()=>{if(last){S.seen[c.id]=1;save();startRound(c.id)}else intro(c,i+1)};
  if($("#prv"))$("#prv").onclick=()=>intro(c,i-1);
  if($("#skip"))$("#skip").onclick=()=>startRound(c.id);
  scrollTo(0,0)}

/* ================= Runde =================
   R.steps: {read:tx} Text lesen · {listen:tx,max} Text anhören · {part} Teil-Karte im Test · {task,tx} Frage */
let R=null;
function startRound(id){const c=chOf(id);hush();const steps=[];let n=0;const used=[];
  if(c.test){c.parts.forEach((p,pi)=>{steps.push({part:p,pi});steps.push(TX[p.tx].hoer?{listen:p.tx,max:p.max}:{read:p.tx});
    p.tasks.forEach(t=>steps.push({task:t,tx:p.tx,pi}));n+=p.tasks.length;used.push(p.tx)})}
  else{const L=c.sets.length;let k=(S.rot[id]||0)%L,taken=0;
    while(taken<L&&(n<c.n)){const set=c.sets[(k+taken)%L];taken++;used.push(set.tx);
      steps.push(c.mode==="hoeren"?{listen:set.tx}:{read:set.tx});
      set.tasks.forEach(t=>steps.push({task:t,tx:set.tx}));n+=set.tasks.length}
    S.rot[id]=(k+taken)%L;save()}
  R={id,c,steps,si:0,n,res:[],pts:0,max:0,used,plays:{},byPart:[[0,0],[0,0]]};showStep()}
function track(){const t=$("#track");if(!t)return;t.innerHTML=Array.from({length:R.n},(_,i)=>{const r=R.res[i];return `<i class="${r!=null?(r===1?"ok":r>0?"half":"no"):(i===R.res.length?"now":"")}"></i>`}).join("")}
function topbar(){return `<div class="topbar"><button id="quit" aria-label="Runde beenden"></button><div class="track" id="track"></div></div>`}
function bindTop(){$("#quit").onclick=()=>{hush();home()};track()}
function nextStep(){hush();R.si++;R.si>=R.steps.length?endRound():showStep()}
function showStep(){const st=R.steps[R.si];R.locked=false;hush();
  if(st.part)return partScreen(st);
  if(st.read)return readScreen(TX[st.read]);
  if(st.listen)return listenScreen(st.listen,st.max);
  showTask(st)}

/* Teil-Karte (nur Probe-GLN) */
function partScreen(st){const p=st.part;
  app.innerHTML=`${topbar()}<section class="panel part"><span class="big" aria-hidden="true">${p.ico}</span><h2>${esc(p.h)}</h2><p class="lead">${esc(p.b)}</p>
    <button class="go" id="go" style="width:100%">${st.pi===0?"Text lesen":"Zum Hören"}</button></section>`;
  bindTop();$("#go").onclick=nextStep;scrollTo(0,0)}

/* Text lesen */
function readScreen(tx){
  app.innerHTML=`${topbar()}<div class="q"><span class="lk">Lesen</span><b>Lies den Text genau.</b></div>
    ${txHTML(tx)}
    <p class="small">Bei den Fragen kannst du den Text jederzeit wieder aufklappen.</p>
    <button class="go" id="go" style="width:100%">Zu den Fragen</button>`;
  bindTop();$("#go").onclick=nextStep;scrollTo(0,0)}

/* Text anhören */
function hearText(tx){return [tx.t+"."].concat(units(tx))}
function listenScreen(id,max){const tx=TX[id],test=!!max,ch=R.c,qs=R.steps.filter(s=>s.task&&s.tx===id);
  const heard=()=>R.plays[tx.t]||0;
  app.innerHTML=`${topbar()}<div class="q"><span class="lk">Hören</span><b>Hör gut zu!</b></div>
    <section class="hear"><span class="tico" aria-hidden="true">${tx.ico}</span><h3>${esc(tx.t)}</h3>
      <button class="play" id="play" aria-label="Text anhören">${I.play}</button>
      <div class="ears" id="ears"></div>
      <p class="small" id="hint">${test?"Du darfst den Text zweimal hören.":ch.id==="ohren"?"Drück auf ▶. Du kannst so oft hören, wie du willst.":"Hör einmal zu. Dann schau dir die Fragen an und hör ein zweites Mal."}</p>
      ${!test&&ch.id==="hoeren"?`<details class="ref vorher" id="vor"><summary>Fragen vorher ansehen</summary><div class="txt"><ol>${qs.map(s=>`<li>${esc(s.task.q||(s.task.k==="rf"?"Richtig, falsch oder nicht gesagt?":"Bring in die richtige Reihenfolge."))}</li>`).join("")}</ol></div></details>`:""}
    </section>
    <div id="notts"></div>
    <button class="go" id="go" style="width:100%" disabled>Zu den Fragen</button>
    ${TTS.ok?`<button class="ghost" id="nots" style="align-self:center">Kein Ton? Text lesen</button>`:""}`;
  bindTop();
  const play=$("#play"),go=$("#go");
  const ears=()=>{const n=heard();$("#ears").innerHTML=test?[0,1].map(i=>`<i class="${i<n?"on":""}">${i+1}</i>`).join("")+`<span style="align-self:center">${n>=2?"zweimal gehört":""}</span>`:(n?`<span>${n}× gehört</span>`:"")};ears();
  const idle=()=>{play.classList.remove("on");play.innerHTML=I.play;play.setAttribute("aria-label","Text anhören");if(test&&heard()>=max)play.disabled=true};
  const showText=why=>{$("#notts").innerHTML=`<div class="panel"><p class="small">${why}</p>${txHTML(tx)}</div>`;go.disabled=false};
  if(!TTS.ok){play.disabled=true;showText("Dein Gerät kann leider nicht vorlesen. Lass dir den Text von jemandem vorlesen, ohne selbst hinzuschauen, oder lies ihn hier.")}
  play.onclick=()=>{if(play.classList.contains("on")){hush();return}
    if(test&&heard()>=max)return;wake();R.plays[tx.t]=heard()+1;ears();
    play.classList.add("on");play.innerHTML=I.stop;play.setAttribute("aria-label","Stopp");
    speakSeq(hearText(tx),null,()=>{idle();go.disabled=false;if(test&&heard()<max)$("#hint").textContent="Jetzt nochmal: Achte auf die Einzelheiten.";else if(test)$("#hint").textContent="Jetzt geht es zu den Fragen."},idle)};
  go.onclick=()=>{if(test&&heard()<max&&!confirmOnce(go,"Du darfst noch einmal hören. Trotzdem weiter?"))return;nextStep()};
  if($("#nots"))$("#nots").onclick=()=>{hush();showText("Lies den Text einmal still durch, so als ob er vorgelesen wird.");$("#nots").remove()};
  scrollTo(0,0)}
/* zweimal tippen statt Dialog */
function confirmOnce(btn,msg){if(btn.dataset.sure)return true;btn.dataset.sure=1;btn.textContent="Ja, weiter";
  btn.insertAdjacentHTML("beforebegin",`<p class="small" style="text-align:center">${esc(msg)}</p>`);return false}

/* Frage */
const LK={mc:"Auswählen",pic:"Bild antippen",rf:"Richtig oder falsch?",find:"Beweis antippen",order:"Reihenfolge",gap:"Lücke füllen"};
const QD={rf:"Stimmt das? Tippe bei jedem Satz an.",order:"Bring es in die richtige Reihenfolge. Tippe nacheinander an.",gap:"Welches Wort fehlt?"};
function showTask(st){const t=st.task,tx=TX[st.tx],hear=!!tx.hoer,test=R.c.test;
  app.innerHTML=`${topbar()}<div class="q"><span class="lk">${hear?"Hören · ":""}${LK[t.k]}</span><b>${esc(t.q||QD[t.k])}</b></div>
    <div id="ref"></div><section class="stage" id="cb"></section>`;
  bindTop();
  const ref=$("#ref"),cb=$("#cb");
  if(hear){const noRe=test;
    if(!noRe){ref.innerHTML=`<button class="replay" id="rp">${I.spk}<span>Nochmal hören</span></button>`;
      const rp=$("#rp"),idle=()=>{rp.classList.remove("on");rp.lastChild.textContent="Nochmal hören"};
      rp.onclick=()=>{if(rp.classList.contains("on")){hush();return}wake();R.plays[tx.t]=(R.plays[tx.t]||0)+1;rp.classList.add("on");rp.lastChild.textContent="Stopp";speakSeq(hearText(tx),null,idle,idle)}}}
  else if(t.k!=="find"){const open=R.refOpen!=null?R.refOpen:false;
    ref.innerHTML=`<details class="ref" id="dt"${open?" open":""}><summary>📖 Text: ${esc(tx.t)}</summary>${txHTML(tx)}</details>`;
    $("#dt").addEventListener("toggle",e=>{R.refOpen=e.target.open});
    if(t.at&&!test){ref.insertAdjacentHTML("beforeend",`<button class="ghost tipp" id="tp" style="margin-top:10px">💡 Wo steht's?</button>`);
      $("#tp").onclick=()=>{const d=$("#dt");d.querySelector(".txt").outerHTML=txHTML(tx,{mark:paraOf(tx,t.at)});d.open=true;$("#tp").remove();
        const m=d.querySelector("p.mk");if(m)m.scrollIntoView({behavior:"smooth",block:"center"})}}}
  const go=()=>T[t.k](t,cb,tx);
  if(t.w&&S.denk)denkStep(t.w,cb,go);else go();
  scrollTo(0,0)}

/* Denkfrage: Was suche ich im Text? (zählt nicht als Fehler) */
function denkStep(w,cb,go){const box=document.createElement("div");box.className="denk";
  const others=shuffle(Object.keys(W).filter(k=>k!==w&&W[k]!==W[w])).slice(0,2);
  const opts=shuffle([w].concat(others));
  box.innerHTML=`<p>💡 Was suchst du im Text?</p><div class="chips">${opts.map(k=>`<button class="chip" data-k="${k}">${esc(W[k])}</button>`).join("")}</div>`;
  cb.appendChild(box);
  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const ok=b.dataset.k===w;
    box.querySelectorAll(".chip").forEach(x=>{x.disabled=true;if(x.dataset.k===w)x.classList.add("ok")});if(!ok)b.classList.add("no");
    box.insertAdjacentHTML("beforeend",`<span class="tip">${ok?"Genau! ":""}Bei <b>${esc(WN[w])}</b> suchst du ${esc(W[w])}.</span>`);
    ok?sfxPop():0;go()})}

/* Beleg aus dem Text für die Rückmeldung */
function beleg(t,tx){if(!t.at)return "";const ats=[].concat(t.at);const us=units(tx).filter(u=>ats.some(a=>u.includes(a)));if(!us.length)return "";
  return `<div class="beleg">${tx.hoer?"🔊 Im Hörtext hieß es":"📖 Im Text steht"}: „${us.map(esc).join(" … ")}“</div>`}
/* Ergebnis einer Frage; frac = Anteil der Punkte (für richtig/falsch-Aufgaben) */
function done(ok,ex,extra,frac){if(R.locked)return;R.locked=true;
  const st=R.steps[R.si],t=st.task;const f=frac!=null?frac:(ok?1:0),p=ptsOf(t);
  R.res.push(f);R.pts+=f*p;R.max+=p;if(st.pi!=null){R.byPart[st.pi][0]+=f*p;R.byPart[st.pi][1]+=p}
  ok?sfxOk():sfxBad();track();
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Stark!"]):f>0?"Fast!":"Nicht ganz"}</strong>${ex?`<p>${ex}</p>`:""}${extra||""}`;
  const nx=document.createElement("button");nx.className="next";nx.type="button";
  const last=R.si+1>=R.steps.length,nxs=R.steps[R.si+1];
  nx.textContent=last?"Ergebnis":nxs&&nxs.part?"Weiter zu Teil 2":nxs&&(nxs.read||nxs.listen)?"Nächster Text":"Weiter";
  nx.onclick=nextStep;
  lwSheet($("#cb"),ok,[fb,nx])}

/* ================= Aufgabenarten ================= */
const T={};
T.mc=(t,cb,tx)=>{const opts=shuffle(t.o.map((x,i)=>({x,i})));
  const box=document.createElement("div");box.className="opts";
  box.innerHTML=opts.map(o=>`<button class="opt" data-i="${o.i}">${esc(o.x)}</button>`).join("");cb.appendChild(box);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const ok=b.dataset.i==="0";
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.i==="0")x.classList.add("ok")});if(!ok)b.classList.add("bad");
    done(ok,esc(t.ex),beleg(t,tx))})};
T.pic=(t,cb,tx)=>{const opts=shuffle(t.o.map((x,i)=>({x,i})));
  const box=document.createElement("div");box.className="opts picgrid";
  box.innerHTML=opts.map(o=>`<button class="opt" data-i="${o.i}"><span class="e" aria-hidden="true">${o.x[0]}</span><span>${esc(o.x[1])}</span></button>`).join("");cb.appendChild(box);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const ok=b.dataset.i==="0";
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.i==="0")x.classList.add("ok")});if(!ok)b.classList.add("bad");
    done(ok,esc(t.ex),beleg(t,tx))})};
/* richtig / falsch / steht nicht im Text */
const RFL={r:"richtig",f:"falsch",n:"steht nicht im Text"};
T.rf=(t,cb,tx)=>{const ans=t.s.map(()=>null);
  const box=document.createElement("div");box.className="rf";
  box.innerHTML=t.s.map((s,i)=>`<div class="rfi" data-i="${i}"><p>${esc(s[0])}</p><div class="rfb">${["r","f","n"].map(k=>`<button data-k="${k}" aria-pressed="false">${k==="r"?"✓ richtig":k==="f"?"✗ falsch":tx.hoer?"? nicht gesagt":"? steht nicht im Text"}</button>`).join("")}</div></div>`).join("")+
    `<button class="go" id="chk" disabled>Prüfen</button>`;
  cb.appendChild(box);
  box.querySelectorAll(".rfi").forEach(row=>{const i=+row.dataset.i;row.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(R.locked||box.dataset.done)return;ans[i]=b.dataset.k;sfxPop();
    row.querySelectorAll("button").forEach(x=>{x.classList.toggle("sel",x===b);x.setAttribute("aria-pressed",x===b)});$("#chk").disabled=ans.some(a=>!a)})});
  $("#chk").onclick=()=>{if(R.locked)return;box.dataset.done=1;let good=0;
    box.querySelectorAll(".rfi").forEach(row=>{const i=+row.dataset.i,right=t.s[i][1],ok=ans[i]===right;if(ok)good++;
      row.classList.add(ok?"ok":"bad");row.querySelectorAll("button").forEach(x=>{x.disabled=true;x.classList.remove("sel");if(x.dataset.k===right)x.classList.add("right");else if(x.dataset.k===ans[i])x.classList.add("wrong")});
      if(!ok)row.insertAdjacentHTML("beforeend",`<small>Richtig wäre: ${RFL[right]}${tx.hoer&&right==="n"?" (wurde nicht gesagt)":""}</small>`)});
    $("#chk").remove();
    done(good===t.s.length,`${good} von ${t.s.length} richtig. ${esc(t.ex)}`,"",good/t.s.length)}};
/* Satz im Text antippen */
T.find=(t,cb,tx)=>{const right=new Set();units(tx).forEach((u,i)=>{if([].concat(t.a).some(a=>u.includes(a)))right.add(i)});
  cb.insertAdjacentHTML("beforeend",txHTML(tx,{tap:true}));
  cb.querySelectorAll(".u").forEach(s=>{const hit=()=>{if(R.locked)return;const i=+s.dataset.u,ok=right.has(i);
    s.classList.add(ok?"hit":"miss");cb.querySelectorAll(".u").forEach(x=>{x.removeAttribute("tabindex");if(!ok&&right.has(+x.dataset.u))x.classList.add("left")});
    const r=cb.querySelector(".u.left");if(r)r.scrollIntoView({behavior:"smooth",block:"center"});
    done(ok,(ok?"":"Der grün umrandete Satz ist der Beweis. ")+esc(t.ex))};
    s.onclick=hit;s.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();hit()}}})};
/* Reihenfolge antippen */
T.order=(t,cb,tx)=>{const seq=shuffle(t.o.map((x,i)=>i));let tap=[];
  const box=document.createElement("div");box.className="ord";
  box.innerHTML=seq.map(i=>`<button class="oc" data-i="${i}"><span class="num"></span><span class="grow">${esc(t.o[i])}</span></button>`).join("");cb.appendChild(box);
  cb.insertAdjacentHTML("beforeend",`<button class="ghost" id="undo" disabled>Zurücksetzen</button>`);
  const undo=$("#undo");
  undo.onclick=()=>{tap=[];box.querySelectorAll(".oc").forEach(b=>{b.classList.remove("on");b.querySelector(".num").textContent=""});undo.disabled=true};
  box.querySelectorAll(".oc").forEach(b=>b.onclick=()=>{if(R.locked||b.classList.contains("on"))return;tap.push(+b.dataset.i);sfxPop();
    b.classList.add("on");b.querySelector(".num").textContent=tap.length;undo.disabled=false;
    if(tap.length===t.o.length){const ok=tap.every((n,i)=>n===i);undo.remove();
      box.querySelectorAll(".oc").forEach(x=>{const n=+x.dataset.i,good=tap.indexOf(n)===n;x.classList.add(good?"ok":"bad");x.disabled=true;
        if(!good)x.querySelector(".grow").insertAdjacentHTML("beforeend",`<small>gehört an Platz ${n+1}</small>`)});
      done(ok,esc(t.ex))}})};
/* Lücke füllen */
T.gap=(t,cb,tx)=>{const m=t.s.match(/\[\[(.*?)\]\]/),opts=m[1].split("|"),pre=t.s.slice(0,m.index),post=t.s.slice(m.index+m[0].length);
  const txt=document.createElement("div");txt.className="txt";cb.appendChild(txt);
  const draw=v=>{txt.innerHTML=esc(pre)+(v==null?`<span class="gap now">?</span>`:v===opts[0]?`<span class="gap ok">${esc(v)}</span>`:`<span class="gap bad"><s>${esc(v)}</s>${esc(opts[0])}</span>`)+esc(post)};draw(null);
  const ch=document.createElement("div");ch.className="chips";cb.appendChild(ch);
  ch.innerHTML=shuffle(opts).map(o=>`<button class="chip">${esc(o)}</button>`).join("");
  ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(R.locked)return;const v=b.textContent,ok=v===opts[0];draw(v);ch.querySelectorAll(".chip").forEach(x=>x.disabled=true);
    done(ok,esc(t.ex),beleg(t,tx))})};

/* ================= Ergebnis ================= */
function endRound(){const c=R.c,q=R.max?R.pts/R.max:0;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[c.id]=Math.max(S.best[c.id]||0,st);
  const P=x=>Math.round(x*2)/2;
  if(c.test)S.probe={pts:P(R.pts),max:R.max,a:P(R.byPart[0][0]),am:R.byPart[0][1],b:P(R.byPart[1][0]),bm:R.byPart[1][1],d:new Date().toLocaleDateString("de-DE")};
  save();
  const k=CH.indexOf(c),nxt=CH[k+1];
  const cheer=c.test?["Weiter üben, du schaffst das!","Gut gemacht!","Stark!","Super, du bist bereit für die GLN!"][st]:["Dranbleiben, das wird!","Gut gemacht!","Stark!","Super, du bist eine echte Text-Detektivin!"][st];
  const used=R.used.slice(),id=c.id;
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    ${c.test?`<p class="lead"><b>${String(P(R.pts)).replace(".",",")} von ${R.max} Punkten</b></p>
      <div class="teile"><div><span class="small">📖 Teil 1 Lesen</span><b>${String(S.probe.a).replace(".",",")} / ${S.probe.am}</b></div><div><span class="small">🎧 Teil 2 Hören</span><b>${String(S.probe.b).replace(".",",")} / ${S.probe.bm}</b></div></div>`
      :`<p class="lead"><b>${R.res.filter(x=>x===1).length} von ${R.n}</b> Fragen ganz richtig</p>`}
    <div class="spick"><b>📌 Spickzettel: ${esc(c.t)}</b><ul>${c.spick.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    ${used.filter(u=>TX[u].hoer).map(u=>`<button class="ghost" data-r="${u}">${I.spk}Hörtext mitlesen: ${esc(TX[u].t)}</button>`).join("")}
    <button class="go" id="again">${c.test?"Probe-GLN nochmal":"Nochmal üben"}</button>
    ${nxt&&st>=2&&!c.test?`<button class="ghost" id="nx">Weiter: ${esc(nxt.t)}</button>`:""}
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  R=null;
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;if($("#nx"))$("#nx").onclick=()=>openCh(nxt.id);
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>reader(b.dataset.r,home));
  scrollTo(0,0)}

/* ================= Entdecken: Lese-Ecke ================= */
function ecke(){R=null;hush();const probeDone=!!S.probe;
  const item=id=>{const t=TX[id];return `<button class="libitem" data-t="${id}"><span class="tico" aria-hidden="true">${t.ico}</span><span class="grow"><h3>${esc(t.t)}</h3><span class="small">${esc(t.art)}</span></span></button>`};
  const ids=Object.keys(TX).filter(k=>!TX[k].probe||probeDone);
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>
    <div><span class="eyebrow">Entdecken</span><h2>Lese-Ecke</h2><p class="small" style="margin-top:4px">Lies die Texte in Ruhe, oder lass sie dir vorlesen und lies mit. Der Satz, der gerade gelesen wird, leuchtet gelb.</p></div>
    <span class="eyebrow sect">Geschichten und Sachtexte</span><div class="stations">${ids.filter(k=>!TX[k].hoer).map(item).join("")}</div>
    <span class="eyebrow sect">Hörtexte zum Mitlesen</span><div class="stations">${ids.filter(k=>TX[k].hoer).map(item).join("")}</div>
    ${probeDone?`<p class="small">Letzte Probe-GLN am ${esc(S.probe.d)}: ${String(S.probe.pts).replace(".",",")} von ${S.probe.max} Punkten.</p>`:`<p class="small">🔒 Die Texte der Probe-GLN erscheinen hier, wenn du sie gemacht hast.</p>`}`;
  $("#cbk").onclick=home;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>reader(b.dataset.t,ecke));
  scrollTo(0,0)}
function reader(id,back){hush();const tx=TX[id];
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}${back===ecke?"Lese-Ecke":"Alle Kapitel"}</button></div>
    ${TTS.ok?`<button class="spk" id="spk" style="align-self:flex-start">${I.spk}<span> Vorlesen und mitlesen</span></button>`:""}
    ${txHTML(tx)}`;
  $("#cbk").onclick=()=>{hush();back()};
  const sp=$("#spk");if(!sp){scrollTo(0,0);return}
  const us=[...app.querySelectorAll(".txt .u")];
  const clear=()=>{us.forEach(u=>u.classList.remove("now"));sp.classList.remove("on");sp.lastChild.textContent=" Vorlesen und mitlesen"};
  sp.onclick=()=>{if(sp.classList.contains("on")){hush();return}wake();sp.classList.add("on");sp.lastChild.textContent=" Stopp";
    speakSeq(hearText(tx),i=>{us.forEach(u=>u.classList.remove("now"));if(i>0&&us[i-1]){us[i-1].classList.add("now");us[i-1].scrollIntoView({behavior:"smooth",block:"center"})}},clear,clear)};
  scrollTo(0,0)}

/* Lernwelt: direkt ins Kapitel (lesenhoeren.html#stimmt …), Anker stehen in hefte.js */
function kapitelSprung(){const id=location.hash.slice(1);if(id==="lesecke"){ecke();return true}if(!chOf(id))return false;openCh(id);return true}
window.lwStart?lwStart('home',kapitelSprung):(kapitelSprung()||home());
</script>
