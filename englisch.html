<title>English trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: eine Spalte im Stil eines grünen Englischbuchs – grünes Kopfband, grüner Karteikasten, Karten mit grünem Reiter */
:root{
  --bg:#eef4e6; --paper:#ffffff; --ink:#1f2a1a; --muted:#5a6a4f; --line:#cfe0bd;
  --navy:#3f8f1f; --navy-soft:#e4f1d3; --onnavy:#ffffff; --rule:#7cc13a;
  --green:#6cb52d; --green-dk:#2f6f17; --sun:#f6c623;
  --ok:#2c7d2a; --ok-bg:#e2f3dc; --bad:#c0392b; --bad-bg:#fbe6e3; --chip:#dcebc9;
  --f-d:'Nunito', 'Segoe UI', system-ui, sans-serif;
  --f-b:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a0f; --paper:#1b2617; --ink:#e9f2e1; --muted:#a3b597; --line:#2f4227;
  --navy:#8fd45a; --navy-soft:#24361b; --onnavy:#0f1a0a; --rule:#7cc13a;
  --green:#4f8f22; --green-dk:#2b5a16; --sun:#f6c623;
  --ok:#7fd67a; --ok-bg:#183319; --bad:#f08a7e; --bad-bg:#3a1d1a; --chip:#273a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a0f; --paper:#1b2617; --ink:#e9f2e1; --muted:#a3b597; --line:#2f4227;
  --navy:#8fd45a; --navy-soft:#24361b; --onnavy:#0f1a0a; --rule:#7cc13a;
  --green:#4f8f22; --green-dk:#2b5a16; --sun:#f6c623;
  --ok:#7fd67a; --ok-bg:#183319; --bad:#f08a7e; --bad-bg:#3a1d1a; --chip:#273a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.5;padding:0 16px}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{background:var(--green);color:#fff;border-radius:0 0 18px 18px;margin:-20px -16px 0;padding:22px 20px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
header .vol{position:relative;z-index:1;font-family:var(--f-d);font-weight:900;font-size:2.6rem;line-height:1;background:#fff;color:var(--green-dk);border-radius:12px;padding:4px 14px}
h1{font-family:var(--f-d);font-weight:900;font-size:1.9rem;letter-spacing:-.01em;margin:0;line-height:1.05;position:relative;z-index:1}
h1 small{display:block;font-family:var(--f-b);font-weight:400;font-size:.88rem;color:rgba(255,255,255,.9);letter-spacing:0;margin-top:4px}
h2{font-family:var(--f-d);font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance}
.lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* Karteikasten */
.box{background:var(--green);border-radius:16px;padding:14px 12px 0;color:#fff;box-shadow:0 12px 24px -16px rgba(30,70,10,.6)}
.box-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap;padding:0 4px}
.box-head h2{color:#fff;font-weight:900}
.box-head .small{color:rgba(255,255,255,.88)}
.fächer{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;background:var(--green-dk);border-radius:10px 10px 0 0;padding:10px 6px 0}
.fach{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.tab{background:#fff;color:var(--green-dk);font-family:var(--f-d);font-weight:900;font-size:.8rem;border-radius:6px 6px 0 0;padding:1px 6px;width:100%;max-width:64px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fach.f0 .tab{background:var(--sun);color:#3b2e00}
.stack{width:100%;max-width:64px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 3px;background:rgba(0,0,0,.18);margin-top:-4px}
.cards{border-radius:2px 2px 0 0;background:repeating-linear-gradient(to top,#ffffff 0 3px,#cfe0bd 3px 4px);transition:height .4s}
.fach.f5 .cards{background:repeating-linear-gradient(to top,#fff6c8 0 3px,var(--sun) 3px 4px)}
.front{background:var(--green);margin:0 -12px;border-radius:0 0 16px 16px;border-top:4px solid rgba(255,255,255,.35);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 18px 12px}
.front div{display:flex;flex-direction:column;align-items:center;min-width:0}
.front .n{font-family:var(--f-d);font-weight:900;font-variant-numeric:tabular-nums;font-size:1.15rem;line-height:1.1}
.front .t{font-size:.66rem;color:rgba(255,255,255,.9);text-align:center;line-height:1.15}

/* Auswahl */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.seg button b{font-family:var(--f-d);font-size:1.05rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--onnavy)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.go{background:var(--navy);color:var(--onnavy);border:none;border-radius:12px;padding:14px 22px;font-family:var(--f-d);font-weight:700;font-size:1.1rem}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.9rem;color:var(--muted)}
.small{font-size:.85rem;color:var(--muted)}

/* Karteikarte */
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--navy);transition:width .3s}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 24px -14px rgba(20,35,60,.35);overflow:hidden}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;background:var(--green);color:#fff}
.tag{font-family:var(--f-d);font-size:.85rem;font-weight:900;letter-spacing:.03em;color:#fff}
.fachtag{font-family:var(--f-d);font-weight:900;font-size:.85rem;background:#fff;color:var(--green-dk);border-radius:6px;padding:2px 8px}
.card-body{padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px;background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--line) 35px 36px);background-position:0 18px}
.instr{font-size:.92rem;color:var(--muted);margin:0}
.prompt{font-family:var(--f-d);font-weight:700;font-size:clamp(1.45rem,5vw,2rem);line-height:1.2;margin:0;text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--navy);text-align:center;color:var(--navy)}
.say{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.say svg{width:20px;height:20px;fill:var(--navy)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left;font-size:1.02rem;min-height:52px}
@media (hover:hover) and (pointer:fine){.opt:hover:not(:disabled){border-color:var(--navy)}}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.25rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.inp input.ok{border-color:var(--ok);background:var(--ok-bg)}
.inp input.bad{border-color:var(--bad);background:var(--bad-bg)}
.check{background:var(--navy);color:var(--onnavy);border:none;border-radius:12px;padding:12px 18px;font-weight:700}
.slots{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 12px;font-size:1.15rem;font-weight:700;min-width:42px}
.tile.l{font-family:var(--f-d);text-transform:none}
.slots .tile{background:var(--navy-soft);border-color:var(--navy)}
.flipback{border-top:1px dashed var(--line);padding-top:14px;font-size:1.3rem}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-bg);color:var(--ink);border:1.5px solid var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:1.5px solid var(--bad)}
.fb strong{font-family:var(--f-d)}
.fb .ex{font-size:.92rem;color:var(--muted)}
.card{border-radius:12px;border:2px solid var(--green)}
.go,.next,.check{box-shadow:0 3px 0 var(--green-dk)}
.go:active,.next:active,.check:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-dk)}
.panel{border:2px solid var(--line)}
.lbl{color:var(--navy)}
.sol{font-size:1.2rem;font-weight:700;letter-spacing:.02em}
.sol .x{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.next{align-self:flex-end;background:var(--navy);color:var(--onnavy);border:none;border-radius:12px;padding:12px 22px;font-family:var(--f-d);font-weight:700;font-size:1.05rem}
.end{display:flex;flex-direction:column;gap:14px}
.score{font-family:var(--f-d);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.prompt .gap.gh{min-width:0;padding:0 .25em;font-size:.8em;color:var(--muted);font-weight:600}
.gpicq{margin:0;display:flex;align-items:center;gap:12px}
.gpicq span{font-size:2.6rem;line-height:1;letter-spacing:.05em;white-space:nowrap;flex:none}
.gpicq small{color:var(--muted);font-size:.9rem}
.grules{display:flex;flex-direction:column;gap:10px}
.grules p{margin:0}
.gex{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:12px;padding:10px 12px}
.gex .gpic{font-size:1.9rem;line-height:1;flex:none;min-width:2.6em;text-align:center}
.gex b{display:block;font-size:1.12rem}
.gex small{display:block;color:var(--muted);font-size:.86rem;line-height:1.3}
.gex.gok{background:var(--ok-bg)}.gex.gok .gpic{color:var(--ok);font-weight:900}
.gex.gno{background:var(--bad-bg)}.gex.gno .gpic{color:var(--bad);font-weight:900}.gex.gno b{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.grules s{text-decoration-color:var(--bad);text-decoration-thickness:2px}
.grule{font-family:var(--f-d);font-size:1.1rem;border-left:4px solid var(--navy);padding:4px 0 4px 12px}
.gnote{background:var(--navy-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.gsteps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
.kkey{display:inline-grid;place-items:center;min-width:2em;height:1.9em;padding:0 .45em;border-radius:7px;background:var(--paper);border:1.5px solid var(--line);border-bottom-width:3px;font-family:var(--f-d);font-weight:700;font-size:.9rem;line-height:1;vertical-align:middle;color:var(--ink)}
.kkey.hot{background:var(--sun);border-color:#b48a00;color:#3b2e00;font-size:1.1rem}
.apos{border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:.92rem}
.apos summary{cursor:pointer;font-weight:700;color:var(--navy);min-height:32px;display:flex;align-items:center}
.apos p{margin:6px 0 0;line-height:2}
@media (max-width:460px){.opts{grid-template-columns:1fr}.seg button span{display:none}.fach .t{font-size:.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.card-top .tag{color:var(--lw-c);font-family:var(--lw-f-b);font-weight:700;letter-spacing:.12em}

<style id="vokabel-extras">

const OKB=(w,d)=>`<div class="gex gok"><span class="gpic">✔</span><span><b>${w}</b>${d?`<small>${d}</small>`:''}</span></div>`,NOB=(w,d)=>`<div class="gex gno"><span class="gpic">✘</span><span><b>${w}</b>${d?`<small>${d}</small>`:''}</span></div>`;
RULES.G8=[
 {k:null,h:'have got = haben, besitzen',b:`<p>Mit <b>have got</b> sagst du, was jemand <b>hat</b>. Das <i>got</i> übersetzt du nicht extra: <i>I’ve got a dog.</i> = Ich habe einen Hund.</p>
  <div class="gex"><span class="gpic">🚲</span><span><b>I’ve got a new bike.</b><small>Dinge, die dir gehören</small></span></div>
  <div class="gex"><span class="gpic">👨‍👩‍👧</span><span><b>Karam has got a sister.</b><small>Familie, Freunde und Haustiere</small></span></div>
  <div class="gex"><span class="gpic">👩‍🦰</span><span><b>Lily has got red hair.</b><small>Aussehen: zum Beispiel die Haare</small></span></div>`,say:"I've got a new bike. Karam has got a sister. Lily has got red hair."},
 {k:1,h:'have got oder has got?',b:`<p>Wie bei <i>to be</i> kommt es auf die Person an:</p>
  <div class="gex"><span class="gpic">🙋</span><span><b>I / you / we / they have got</b><small>I have got a pen. They have got a dog.</small></span></div>
  <div class="gex"><span class="gpic">🧍</span><span><b>he / she / it has got</b><small>Ryan has got a dog. Sherlock has got a new bed.</small></span></div>
  <p class="grule">he, she, it → <b>has got</b>. Alle anderen → <b>have got</b>.</p>
  <p class="gnote">💡 Ein Name, ein Tier oder ein Ding ist immer he, she oder it: <i>Lily</i> → she → <b>has got</b>. Zwei Namen sind they: <i>Ruby and Ryan</i> → <b>have got</b>.</p>`,say:'I have got a pen. They have got a dog. Ryan has got a dog. Sherlock has got a new bed.'},
 {k:2,h:'Kurzformen: ’ve got und ’s got',b:`<p>Beim Sprechen und in Nachrichten nimmst du fast immer die Kurzform:</p>
  <div class="gex"><span class="gpic">✂️</span><span><b>I’ve got · you’ve got · we’ve got · they’ve got</b><small>have → ’ve</small></span></div>
  <div class="gex"><span class="gpic">✂️</span><span><b>he’s got · she’s got · it’s got</b><small>has → ’s</small></span></div>
  <p class="gnote">⚠️ <b>she’s</b> kann zwei Sachen heißen! <i>She’s got a cat.</i> = she <b>has</b> got. <i>She’s eleven.</i> = she <b>is</b>. Trick: Steht <b>got</b> dahinter, ist ’s = has.</p>`,say:"I've got a cat. She's got a cat. She's eleven."},
 {k:3,h:'Verneinung: haven’t got / hasn’t got',b:`<p>Hat jemand etwas <b>nicht</b>, kommt <b>not</b> zwischen have und got:</p>
  <div class="gex"><span class="gpic">🙅</span><span><b>I haven’t got a brother.</b><small>have not got → haven’t got</small></span></div>
  <div class="gex"><span class="gpic">🐈‍⬛</span><span><b>Lily hasn’t got a dog.</b><small>has not got → hasn’t got</small></span></div>
  <p class="grule">have not → <b>haven’t</b> · has not → <b>hasn’t</b> · got bleibt!</p>
  <p class="gnote">⚠️ Kein <b>don’t</b> und kein <b>doesn’t</b>: <s>I don’t have got</s> gibt es nicht.</p>`,say:"I haven't got a brother. Lily hasn't got a dog."},
 {k:4,h:'Fragen und Kurzantworten',b:`<p>In der Frage tauschen <b>Have/Has</b> und die Person den Platz. <b>got</b> bleibt hinter der Person.</p>
  <div class="gex"><span class="gpic">🐾</span><span><b>Have you got a pet?</b><small>Yes, I have. / No, I haven’t.</small></span></div>
  <div class="gex"><span class="gpic">👧</span><span><b>Has Karam got a sister?</b><small>Yes, he has. / No, he hasn’t.</small></span></div>
  <div class="gex"><span class="gpic">🎒</span><span><b>What have you got in your pencil case?</b><small>Fragewort + have/has + Person + got</small></span></div>
  <p class="gnote">⚠️ In der Kurzantwort steht <b>kein got</b>: <i>Yes, I have.</i> Nicht: <s>Yes, I have got.</s> Und bei Yes keine Kurzform: <s>Yes, I’ve.</s></p>`,say:"Have you got a pet? Yes, I have. No, I haven't. Has Karam got a sister? Yes, he has. No, he hasn't."},
 {k:5,h:'Achtung: so nicht!',b:`${NOB('Do you have got a pen?')}${OKB('Have you got a pen?','Bei have got gibt es kein do.')}
  ${NOB('I got a dog.')}${OKB('I’ve got a dog.','Ohne have heißt got „bekam“.')}
  ${NOB('Lily have got a cat.')}${OKB('Lily has got a cat.','Lily = she → has got.')}
  <p class="grule">have got = <b>haben, besitzen</b>. Kein do, und das <b>got</b> nicht vergessen.</p>`,say:"Have you got a pen? I've got a dog. Lily has got a cat."},
 {k:'t',h:'Jetzt tippst du selbst',b:`<p>Gleich schreibst du die richtige Form selbst, so wie im Buch: <i>Karam (have got) a sister.</i> → <b>has got</b>. Steht <b>(✘)</b> dahinter, schreibst du die Verneinung.</p>
  <p class="lbl" style="margin:4px 0 0">Für haven’t und hasn’t brauchst du das Apostroph ’</p>
  <ol class="gsteps">
   <li>Tipp unten links auf ${KB('123')}</li>
   <li>In der dritten Reihe tippst du auf <span class="kkey hot">'</span></li>
   <li>Mit ${KB('ABC')} kommst du zurück zu den Buchstaben.</li></ol>
  <p class="gnote">✨ <b>Profi-Trick:</b> Halt ${KB('123')} gedrückt, wisch zum <b>'</b> und lass los.</p>`}];
/* G7: „So nicht!“-Karte vor dem Tippen */
RULES.G7.splice(3,0,{k:null,h:'Achtung: so nicht!',b:`${NOB('I’ve got two dog’s.')}${OKB('I’ve got two dogs.','Nur Mehrzahl, niemandem gehört etwas → kein Apostroph.')}
  ${NOB('This is Ryans dog.')}${OKB('This is Ryan’s dog.','Zeigt das s Besitz, braucht es immer das Apostroph.')}
  ${NOB('the dog of Ryan')}${OKB('Ryan’s dog','Bei Personen und Tieren sagst du ’s, nicht of.')}
  <p class="grule">Apostroph nur, wenn etwas <b>jemandem gehört</b>. Mehrzahl allein → nur <b>s</b>.</p>`,say:"I've got two dogs. This is Ryan's dog."});

/* ===== Sprechen: Spracherkennung des Browsers (wie die Sprech-Übungen bei Duolingo) =====

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const NUMW='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');
const CONTR={"i'm":'i am',"you're":'you are',"we're":'we are',"they're":'they are',"he's":'he is',"she's":'she is',"it's":'it is',"that's":'that is',"what's":'what is',"there's":'there is',"let's":'let us',"don't":'do not',"can't":'can not',cannot:'can not',"isn't":'is not',"aren't":'are not'};
const HOMO={};[['two','to','too'],['four','for'],['eight','ate'],['one','won'],['right','write'],['see','sea'],['hear','here'],['no','know'],['bee','be'],['new','knew'],['flower','flour'],['break','brake'],['mrs','missus','misses'],['mum','mom'],['colour','color'],['favourite','favorite'],['grey','gray'],['centre','center'],['ok','okay'],['hi','hey'],['bye','by','buy']].forEach(g=>g.forEach(w=>HOMO[w]=g[0]));
function sNorm(t){
  t=apos(String(t)).toLowerCase().replace(/\([^)]*\)/g,' ').replace(/\d+/g,d=>NUMW[+d]||d).replace(/[-–/]/g,' ').replace(/[^a-z' ]/g,' ');

const sCore=t=>t.replace(/^(to|a|an|the) /,'');

  for(const raw of alts){const a=sNorm(raw);if(!a)continue;
    for(const t of targets){const ca=sCore(a),ct=sCore(t),pa=ca.replace(/ /g,''),pt=ct.replace(/ /g,'');

/* Eine Aufnahme: onLive zeigt mit, was gerade verstanden wird; onDone bekommt die Varianten (beste zuerst) oder einen Fehler */
function listen(onLive,onDone){
  stopMic();try{speechSynthesis.cancel()}catch(e){}
  const rec=new SR();REC=rec;
  rec.lang=recLang;rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  let res=null,err=null,done=false,t1,t2;
  const fin=()=>{if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);const mine=REC===rec;if(mine)REC=null;
    const alts=[];if(res){if(res.length===1)for(let k=0;k<res[0].length;k++)alts.push(res[0][k].transcript);
      else alts.push(Array.from({length:res.length},(_,i)=>res[i][0].transcript).join(' '))}
    if(!mine&&err==null)err='aborted';
    onDone(alts.filter(a=>a&&a.trim()),err)};
  rec.onresult=e=>{res=e.results;onLive(Array.from({length:res.length},(_,i)=>res[i][0].transcript).join(' '))};
  rec.onerror=e=>{err=e.error||'error'};
  rec.onend=fin;
  t1=setTimeout(()=>{try{rec.stop()}catch(e){}t2=setTimeout(fin,1500)},8000);
  try{rec.start()}catch(e){err='start';fin()}
}

function micWidget(el,o){
  el.innerHTML=`<div class="mic-wrap"><button class="mic${o.small?' sm':''}" type="button" aria-label="Mikrofon: tippen und sprechen">${MIC}</button>
    <div class="mic-lbl" aria-live="polite">${o.label||'Tippen und sprechen'}</div><p class="heard"></p>
    ${o.max?`<div class="mic-tries" aria-hidden="true">${'<i></i>'.repeat(o.max)}</div>`:''}</div>`;
  const mic=el.querySelector('.mic'),ml=el.querySelector('.mic-lbl'),hd=el.querySelector('.heard');let tries=0;
  const idle=t=>{mic.classList.remove('on');ml.textContent=t||'Nochmal tippen und sprechen'};
  mic.onclick=()=>{
    if(mic.classList.contains('on')){try{REC&&REC.stop()}catch(e){}return}
    mic.classList.add('on');ml.textContent='Ich höre zu …';hd.className='heard';hd.textContent='';
    listen(t=>{hd.innerHTML=`<b>${esc(t)}</b>`},(alts,err)=>{
      if(!mic.isConnected||err==='aborted')return;
      if(err==='language-not-supported'&&recLang==='en-GB'){recLang='en-US';mic.classList.remove('on');mic.click();return}
      if(['not-allowed','service-not-allowed','audio-capture','start'].includes(err)||(err==='language-not-supported')){
        micBroken=true;idle('');mic.disabled=true;
        const msg=err==='audio-capture'?'Ich finde kein Mikrofon.':'Das Mikrofon ist hier nicht freigegeben.';
        return o.broken&&o.broken(msg)}
      if(err==='network'){idle();hd.textContent='Keine Verbindung zur Spracherkennung. Versuch es gleich nochmal.';return}
      if(!alts.length){idle();hd.textContent='Ich habe nichts gehört. Tipp aufs Mikrofon und sprich laut und deutlich.';return}
      const hit=heardOK(alts,o.targets);
      if(hit){mic.classList.remove('on');mic.disabled=true;ml.textContent='';hd.className='heard ok';hd.innerHTML=`<b>„${esc(hit)}“</b>`;return o.hit(hit)}
      tries++;const dots=el.querySelectorAll('.mic-tries i');if(dots[tries-1])dots[tries-1].classList.add('x');
      if(o.max&&tries>=o.max){mic.classList.remove('on');mic.disabled=true;ml.textContent='';hd.innerHTML=`Verstanden habe ich: <b>„${esc(alts[0])}“</b>`;return o.miss(alts[0])}
      idle(o.again);hd.innerHTML=`Ich habe <b>„${esc(alts[0])}“</b> verstanden.`;
    });
  };
  return mic;
}

/* Rechtschreib-Vergleich: markiert in der richtigen Lösung, welche Buchstaben gefehlt haben oder falsch waren */
function diffHTML(typed,target){

  const mark=new Array(m).fill(true);let i=n,j=m;

    else if(j>0&&d[i][j]===d[i][j-1]+1){mark[j-1]=false;j--}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function whenTxt(d){
  if(!d)return '';const [y,m,t]=d.split('-').map(Number),a=new Date(y,m-1,t),n=new Date();n.setHours(0,0,0,0);
  const k=Math.round((n-a)/864e5);return k<=0?'heute':k===1?'gestern':k<7?`vor ${k} Tagen`:`am ${t}.${m}.`;
}

  const m=$('#kmore');if(m)m.onclick=()=>{KW.more=true;renderWords()};
  const pr=$('#kpractice');if(pr)pr.onclick=()=>startRound(ids.filter(id=>bx(id)===KW.tab));

/* ===== Kapitel-Modus: ein Kapitel pro Buchseite, Grammatik eingeordnet (Reihenfolge wie hefte.js) ===== */
const KAPS=[{a:'s0',s:0},{a:'g2',g:'G2'},{a:'s1',s:1},{a:'g1',g:'G1'},{a:'s2',s:2},{a:'g3',g:'G3'},{a:'s3',s:3},{a:'s4',s:4},{a:'g6',g:'G6'},{a:'s5',s:5},{a:'s6',s:6},{a:'s7',s:7},{a:'s8',s:8},{a:'s9',s:9},{a:'s10',s:10},{a:'s11',s:11},{a:'s12',s:12},{a:'s13',s:13},{a:'s14',s:14},{a:'s15',s:15},{a:'s16',s:16},{a:'s17',s:17},{a:'s18',s:18},{a:'s19',s:19},{a:'g7v',g:'G7',v:1},{a:'g7',g:'G7'},{a:'s20',s:20},{a:'s21',s:21},{a:'g8v',g:'G8',v:1},{a:'g8',g:'G8'}];
const OLD_ANKER={v1:'s0',v2:'s4',v3:'s7'};
let KAP=null,VR=null;
/* Grammatik mit Verstehen-Einheit: Kapitel N.1 = Verstehen (v:1), N.2 = Quiz. Nummern für die Anzeige: */
const KNR=(()=>{let c=0;return KAPS.map((K,i)=>{const pv=KAPS[i-1];if(K.v)return ++c+'.1';if(K.g&&pv&&pv.v&&pv.g===K.g)return c+'.2';return ''+ ++c})})();
const KTOT=parseInt(KNR[KNR.length-1]);
const KSHORT={G7:'’s und s’',G8:'have got'};
const hasVer=g=>KAPS.some(K=>K.v&&K.g===g);
const verIdx=g=>KAPS.findIndex(K=>K.v&&K.g===g),quizIdx=g=>KAPS.findIndex(K=>!K.v&&K.g===g);
const kapTitle=K=>K.v?`${K.g} · Verstehen: ${KSHORT[K.g]}`:K.g&&hasVer(K.g)?`${K.g} · Quiz: ${KSHORT[K.g]}`:K.g?TOP[K.g]:`${SECS[K.s].p} · ${SECS[K.s].n}`;
const kapIds=K=>K.v?[]:K.g?G.filter(x=>x.g===K.g).map(x=>x.id):V.filter(v=>v.s===K.s).map(v=>v.id);
/* Sterne: ⭐ alle einmal gesehen · ⭐⭐ alle mindestens Fach 2 · ⭐⭐⭐ alle mindestens Fach 4 */
/* Verstehen: ⭐ alles einmal durchgelesen · ⭐⭐ mindestens 80 % der Fragen auf Anhieb richtig · ⭐⭐⭐ alle auf Anhieb richtig */
const verS=g=>(S.ver&&S.ver[g])||{};
const verProg=g=>{const v=verS(g);return v.best>=1?1:v.best>=.8?2/3:v.read?1/3:0};
function kapProg(K){
  if(K.v)return verProg(K.g);
  const ids=kapIds(K),n=ids.length||1,sh=k=>ids.filter(id=>bx(id)>=k).length/n;
  const a=sh(1),b=sh(2),c=sh(4);
  return a<1?a/3:b<1?1/3+b/3:2/3+c/3;
}
const kapStars=p=>p>=.999?3:p>=2/3-1e-9?2:p>=1/3-1e-9?1:0;
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>';
const starsHTML=n=>`<span class="kstars" aria-label="${n} von 3 Sternen">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}">${STAR}</i>`).join('')}</span>`;
function kapNext(K){
  const ids=kapIds(K),isG=!!K.g,w=isG?'Aufgaben':'Wörter',st=kapStars(kapProg(K));
  const left=k=>ids.filter(id=>bx(id)<k).length;
  return st===0?`Nächster Stern: alle ${w} einmal kennenlernen (noch ${left(1)}).`:
    st===1?`Nächster Stern: alle ${w} mindestens in Fach 2 bringen (noch ${left(2)}).`:
    st===2?`Letzter Stern: alle ${w} mindestens in Fach 4 bringen (noch ${left(4)}).`:
    `Kapitel geschafft! Üben hält die ${w} trotzdem frisch.`;
}
function kapMeter(K){
  const ids=kapIds(K),c=[0,0,0,0,0,0];ids.forEach(id=>c[bx(id)]++);
  return `<span class="kmeter">${[5,4,3,2,1,0].map(i=>c[i]?`<i style="width:${c[i]/ids.length*100}%;background:var(--k${i})"></i>`:'').join('')}</span>
  <p class="small" style="margin:0">${c[5]} von ${ids.length} sicher · ${c[0]} neu</p>`;
}
function kapBar(){

function home(){stopMic();VR=null;KAP!=null?kapStart():start()}

    <button class="go" type="button" id="kgo">${seen?'Weiter üben':"Los geht's"}</button>
    ${isG&&SPICK[K.g]?'<button class="ghost kbtn" type="button" id="kspick">Spickzettel ansehen</button>':isG&&RULES[K.g]?'<button class="ghost kbtn" type="button" id="kexpl">Erklärung ansehen</button>':''}
    <button class="ghost kbtn" type="button" id="kseek">${isG?'Aufgaben ansehen':'Wörter ansehen'}</button>
    <a class="ghost kbtn klink" href="index.html#heft-englisch">Zurück zum Heft</a>

function kapRound(){const K=KAPS[KAP];if(K.g&&RULES[K.g]&&!hasVer(K.g)&&!kapIds(K).some(id=>bx(id)>0))return guidedRound(K.g);startRound(kapIds(K),{maxNew:5})}
/* Erster Durchgang eines Themas mit Erklär-Karten: erst klicken, zwischendurch erklären, am Ende selbst tippen und chatten */
function guidedRound(g){
  closeDetail();
  const pick=(k,n)=>shuffle(G.filter(x=>x.g===g&&x.k===k).map(x=>x.id)).slice(0,n);
  const chat=shuffle(G.filter(x=>x.g===g&&x.t==='chat').map(x=>x.id)).slice(0,1);
  /* Jede Erklär-Karte bringt danach ihre Aufgaben mit (k an der Karte, sonst 1, 2, 3, t wie bei G7; k:null = nur Erklärung) */
  const out=[];RULES[g].forEach((r,n)=>{const k='k' in r?r.k:[1,2,3,'t'][n];out.push('ex:'+g+':'+n);if(k!=null)out.push(...pick(k,k==='t'?3:2))});out.push(...chat);
  const was={};out.forEach(id=>was[id]=bx(id));
  R={q:out,i:0,right:0,first:out.length,nx:out.filter(id=>id.startsWith('ex:')).length,missed:[],retried:new Set(),was,intro:[],ii:0};
  window.scrollTo(0,0);task();
}
function ruleHTML(g,n){const x=RULES[g][n];return `<p class="prompt" style="font-size:1.35rem">${esc(x.h)}</p><div class="grules">${x.b}</div>${x.say?`<p class="row" style="margin:0;gap:8px;align-items:center">${sayBtn(x.say)}<span class="small">Beispiele anhören</span></p>`:''}`}
function explainCard(g,n,onNext,top,last){

let R=null;
/* ===== Neueste zuerst: Fokus auf die jüngsten Kapitel, ältere kommen nach und nach dazu =====

const FR={minV:15,fest:3};
const dayDiff=d=>{if(!d)return 99;const a=new Date(d+'T12:00'),b=new Date(today()+'T12:00');return Math.max(0,Math.round((b-a)/864e5))};
function freshPlan(){
  const groups=[];

  if(S.mode!=='v')groups.push({v:0,L:KAPS.filter(K=>K.g&&!K.v&&S.tops.includes(K.g)).reverse()});
  const focus=[],older=[],fk=[];
  groups.forEach(({v,L})=>{
    let n=0,fest=true,i=0;

      if(i>0&&!fest&&(!v||n>=FR.minV))break;
      const ids=kapIds(L[i]);fk.push(L[i]);focus.push(...ids);n+=ids.length;
      if(!ids.every(id=>bx(id)>=FR.fest))fest=false;

  });

  const rev=older.filter(o=>bx(o.id)>0);
  const nRev=rev.length?Math.min(rev.length,Math.max(1,Math.round(S.len*(.1+.4*festQ)))):0;
  const fAv=focus.filter(id=>bx(id)>0).length+Math.min(focus.filter(id=>bx(id)===0).length,Math.ceil(S.len*.6)),nRevShow=Math.min(rev.length,Math.max(nRev,S.len-fAv));

const freshOn=()=>S.fresh!==false;
function drawW(cand,n,out,cnt){
  while(out.length<n&&cand.length){

    while(k<cand.length-1&&r>cand[k].w){r-=cand[k].w;k++}
    const c=cand.splice(k,1)[0];
    if(bx(c.id)===0){if(cnt.n>=cnt.max)continue;cnt.n++}
    out.push(c.id);
  }
}

function startRound(only,opt){

  if(!(only&&only.length)&&KAP==null&&freshOn()){
    const P=freshPlan(),Wf=[12,16,8,4,2,1],Wr=[0,16,8,4,2,1];
    /* Wiederholung: tiefe Fächer, nähere Kapitel und lange nicht gesehene Karten bevorzugt */
    const rc=P.rev.map(o=>{const h=S.hist[o.id];return {id:o.id,w:Wr[bx(o.id)]/(1+o.d*.25)*(dayDiff(h&&h.d)>=3?2:1)}});

    const c=shuffle(chats).sort((a,b)=>bx(a)-bx(b))[0];

  }

  const c=clean(v.en),core=c.startsWith('to ')?c.slice(3):c,words=c.split(' ');
  const sp=speakOn()&&speakable(v)?1:0;
  const can={flip:1,mcED:1,mcDE:1,type:c.length<=26?1:0,
    tiles:/^[A-Za-z'-]{3,12}$/.test(core)?1:0, words:words.length>=3&&words.length<=8?1:0, say:sp, speak:sp};
  const plan=b<=1?['mcED','mcED','mcDE','say']:b===2?['mcDE','mcED','tiles','words','say']:b===3?['type','tiles','words','mcDE','speak']:['type','type','words','speak'];
  const ok=plan.filter(t=>can[t]);return rnd(ok.length?ok:['mcED']);
}
function task(){
  stopMic();renderBox();
  if(R.intro&&R.ii<R.intro.length)return introCard();
  if(R.i>=R.q.length)return end();
  const id=R.q[R.i];
  if(id.startsWith('ex:')){const [,g,n]=id.split(':'),nxt=R.q[R.i+1];return explainCard(g,+n,()=>{R.i++;task()},`${KAP!=null?`Kapitel ${KNR[KAP]} · `:''}Erklärung`,nxt&&nxt.startsWith('ex:')?'Weiter':nxt&&ALL[nxt]&&ALL[nxt].t==='t'?'Selbst schreiben':'Jetzt üben')}
  const it=ALL[id],b=bx(id),isV=id[0]==='v';
  let kind=isV?vocabType(it,b):it.t;
  if(!isV&&it.t==='c'&&b>=3&&it.q.includes('___')&&/^[A-Za-z']+$/.test(it.a[0])&&!it.opts.includes(SND[0]))kind='t';
  const tag=isV?`Vokabel · ${SECS[it.s].p}`:TOP[it.g];
  const fach=b?`Fach ${b}`:'neu';
  const pct=Math.round(R.i/R.q.length*100);
  $('#screen').innerHTML=`<div class="topbar"><span>${KAP!=null?`Kapitel ${KNR[KAP]} · `:''}Karte ${R.i+1} von ${R.q.length}${R.i>=R.first?' · Wiederholung':''}</span><button class="ghost" type="button" id="quit" aria-label="Runde beenden">Beenden</button></div>
  <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <article class="card"><div class="card-top"><span class="tag">${esc(tag)}</span><span class="fachtag">${fach}</span></div>
  <div class="card-body" id="cb"></div></article>`;
  $('#quit').onclick=home;
  const cb=$('#cb');
  if(isV)VT[kind](cb,it);else GT[kind](cb,it);
}
function bindSay(root){root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say))}

/* Bewertung + Rückmeldung */
function grade(id,ok,html){
  const b=bx(id);
  if(R.i<R.first||!R.retried.has(id)){S.box[id]=ok?Math.min(5,Math.max(1,b)+1):1}
  else if(ok&&b<1)S.box[id]=1;
  const h=S.hist[id]||{r:''};S.hist[id]={d:today(),r:(h.r+(ok?'1':'0')).slice(-4)};
  save();
  if(ok)R.right+=R.i<R.first?1:0;
  else{if(!R.missed.includes(id))R.missed.push(id);if(!R.retried.has(id)){R.retried.add(id);R.q.push(id)}}
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'ok':'bad');fb.setAttribute('role','status');
  const rn=!ok&&id[0]==='g'?ruleFor(ALL[id]):undefined;
  fb.innerHTML=html+(id[0]==='v'?vMore(ALL[id],true):'')+(rn!==undefined?`<button class="ghost vrule" type="button" data-rule="${rn==null?'':rn}">📖 Regel nochmal ansehen</button>`:'')+(!ok&&R.retried.has(id)&&R.q.lastIndexOf(id)>R.i?'<span class="ex">Diese Karte kommt am Ende der Runde noch einmal.</span>':'');
  const rb=fb.querySelector('[data-rule]');if(rb)rb.onclick=()=>ruleSheet(ALL[id].g,rb.dataset.rule===''?null:+rb.dataset.rule);
  const cb=$('#cb');
  const nx=document.createElement('button');nx.className='next';nx.type='button';nx.textContent=R.i+1>=R.q.length?'Ergebnis':'Weiter';
  nx.onclick=()=>{R.i++;task();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()};bindSay(lwSheet(cb,ok,[fb,nx])||fb);nx.focus({preventScroll:true});
  renderBox();
}
const praise=()=>rnd(['Richtig!','Super!','Genau!','Prima!','Stimmt!']);

/* ===== Vokabel-Aufgaben ===== */
function distract(v,key){
  const same=V.filter(x=>x.s===v.s&&x[key]!==v[key]&&x.en!==v.en),other=V.filter(x=>x.s!==v.s&&x[key]!==v[key]);
  const pick=shuffle(same).slice(0,3);while(pick.length<3)pick.push(rnd(other));
  return shuffle([v,...pick]);
}
function mc(cb,v,key,instr,prompt,speak){
  const o=distract(v,key);
  cb.innerHTML=`<p class="instr">${instr}</p><p class="prompt">${esc(prompt)} ${speak?sayBtn(v.en):''}</p>
  <div class="opts">${o.map((x,i)=>`<button class="opt" type="button" data-i="${i}">${esc(x[key])}</button>`).join('')}</div>`;
  bindSay(cb);
  cb.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    const x=o[+btn.dataset.i],ok=x[key]===v[key];
    cb.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(o[+b.dataset.i][key]===v[key])b.classList.add('ok')});
    if(!ok)btn.classList.add('bad');
    if(key==='en'&&ok&&canSay)say(v.en);
    grade(v.id,ok,ok?`<strong>${praise()}</strong><span>${esc(v.en)} = ${esc(v.de)}</span>`:`<strong>Nicht ganz.</strong><span><b>${esc(v.en)}</b> heißt ${esc(v.de)}.</span>`);
  });
}
const VT={
  flip(cb,v){
    cb.innerHTML=`<p class="instr">Weißt du, was das heißt? Sag es laut und dreh dann die Karte um.</p>
    <p class="prompt">${esc(v.en)} ${sayBtn(v.en)}</p><div id="fl"><button class="check" type="button" id="turn">Karte umdrehen</button></div>`;
    bindSay(cb);
    $('#turn').onclick=()=>{
      $('#fl').innerHTML=`<div class="flipback">${esc(v.de)}</div><p class="instr" style="margin-top:12px">Hast du es gewusst? Sei ehrlich – nur so hilft der Karteikasten.</p>
      <div class="opts"><button class="opt" type="button" id="y">Gewusst ✔</button><button class="opt" type="button" id="n">Noch nicht ✘</button></div>`;
      const fin=ok=>{cb.querySelectorAll('.opt').forEach(b=>b.disabled=true);(ok?$('#y'):$('#n')).classList.add(ok?'ok':'bad');
        grade(v.id,ok,ok?`<strong>${praise()}</strong><span>Die Karte rückt ein Fach weiter.</span>`:`<strong>Kein Problem.</strong><span>Merk dir: <b>${esc(v.en)}</b> = ${esc(v.de)}</span>`)};
      $('#y').onclick=()=>fin(true);$('#n').onclick=()=>fin(false);
    };
  },
  mcED(cb,v){mc(cb,v,'de','Was heißt das auf Deutsch?',v.en,true)},
  mcDE(cb,v){mc(cb,v,'en','Was heißt das auf Englisch?',v.de,false)},
  type(cb,v){
    const target=clean(v.en),acc=new Set();V.filter(x=>x.de===v.de).forEach(x=>variants(x.en).forEach(a=>acc.add(a)));
    cb.innerHTML=`<p class="instr">Schreibe das englische Wort. Achte auf die Rechtschreibung!</p><p class="prompt">${esc(v.de)}</p>
    <form class="inp" id="f"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort auf Englisch"><button class="check" type="submit">Prüfen</button></form>`;
    const inp=$('#ans');inp.focus({preventScroll:true});
    $('#f').onsubmit=e=>{e.preventDefault();const raw=strip(inp.value);if(!raw)return;inp.disabled=true;e.target.querySelector('button').disabled=true;
      const lo=raw.toLowerCase(),hit=[...acc].find(a=>a.toLowerCase()===lo);
      if(hit){inp.classList.add('ok');if(canSay)say(v.en);
        const caseNote=hit!==raw?`<span class="ex">Achte auf Groß- und Kleinschreibung: <b>${esc(hit)}</b></span>`:'';
        const toNote=target.startsWith('to ')&&!lo.startsWith('to ')?`<span class="ex">Verben lernst du mit <b>to</b>: ${esc(target)}</span>`:'';
        grade(v.id,true,`<strong>${praise()}</strong><span>${esc(target)}</span>${caseNote}${toNote}`);
      }else{inp.classList.add('bad');const close=lev(lo,target.toLowerCase())<=2;
        grade(v.id,false,`<strong>${close?'Fast! Schau genau auf die Buchstaben:':'Richtig wäre:'}</strong><span class="sol">${diffHTML(raw,target)}</span><span class="ex">Du hast geschrieben: ${esc(raw)}</span>`)}};
  },
  tiles(cb,v){
    const c=clean(v.en),pre=c.startsWith('to ')?'to ':'',core=c.slice(pre.length);
    tileGame(cb,v.id,[...core],`Bilde das Wort aus den Buchstaben. Klick sie in der richtigen Reihenfolge an.`,v.de,core,pre,'',true,v.en);
  },
  words(cb,v){const c=clean(v.en);tileGame(cb,v.id,c.split(' '),'Bring die Wörter in die richtige Reihenfolge.',v.de,c,'',' ',false,v.en)},
  say(cb,v){speakTask(cb,v,true)},
  speak(cb,v){speakTask(cb,v,false)}
};
function tileGame(cb,id,parts,instr,prompt,target,prefix,joiner,letters,speak){
  let order;do{order=shuffle(parts.map((p,i)=>i))}while(parts.length>1&&order.every((x,i)=>parts[x]===parts[i]));
  const placed=[];
  cb.innerHTML=`<p class="instr">${instr}</p><p class="prompt">${esc(prompt)}</p>
  <div class="slots" id="sl" aria-label="Deine Lösung">${prefix?`<span class="small">${esc(prefix)}</span>`:''}</div><div class="pool" id="pl"></div>`;
  const draw=()=>{
    $('#sl').innerHTML=(prefix?`<span class="tile l" style="opacity:.6">${esc(prefix.trim())}</span>`:'')+placed.map((k,i)=>`<button type="button" class="tile${letters?' l':''}" data-p="${i}" aria-label="${esc(parts[k])} entfernen">${esc(parts[k])}</button>`).join('');
    $('#pl').innerHTML=order.map(k=>placed.includes(k)?'':`<button type="button" class="tile${letters?' l':''}" data-k="${k}">${esc(parts[k])}</button>`).join('');
    cb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.p,1);draw()});
    cb.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{placed.push(+b.dataset.k);draw();if(placed.length===parts.length)done()});
  };
  const done=()=>{cb.querySelectorAll('.tile').forEach(b=>b.disabled=true);
    const got=placed.map(k=>parts[k]).join(joiner),ok=got===target;
    if(ok&&canSay)say(speak);
    grade(id,ok,ok?`<strong>${praise()}</strong><span>${esc(prefix+target)}</span>`:`<strong>Nicht ganz. Richtig ist:</strong><span class="sol">${esc(prefix+target)}</span>`)};
  draw();
}

/* ===== Grammatik-Aufgaben ===== */
const showQ=(q,h)=>esc(q).replace('___',h?`<span class="gap gh">(${esc(h)})</span>`:'<span class="gap">&nbsp;?&nbsp;</span>');
const picHTML=it=>it.pic?`<p class="gpicq"><span aria-hidden="true">${it.pic}</span><small>${esc(it.pd||'')}</small></p>`:'';
/* Hinweis fürs iPhone, wenn ein Apostroph getippt werden muss */
const aposHelp=it=>it.a.some(a=>a.includes("'"))&&(it.g==='G7'||it.g==='G8')?`<details class="apos"><summary>Wo ist das ’ auf dem iPhone?</summary><p>Tipp auf <span class="kkey">123</span>, dann in der dritten Reihe auf <span class="kkey hot">'</span>. Mit <span class="kkey">ABC</span> geht es zurück. Trick: <span class="kkey">123</span> gedrückt halten, zum <b>'</b> wischen, loslassen.</p></details>`:'';
const negHint=it=>it.q.includes('(✘)')?' ✘ = verneinen.':'';
const fillQ=(q,a)=>esc(q).replace('___',`<b>${esc(a)}</b>`);
const GT={
  c(cb,it){
    const o=shuffle(it.opts),long=o.some(x=>x.length>14);
    cb.innerHTML=`<p class="instr">${it.g==='G7'&&it.h?'Klick die richtige Form an: ’s oder s’?':it.g==='G8'&&it.h?`Klick die richtige Form von <b>${esc(it.h)}</b> an.${negHint(it)}`:'Klick die richtige Lösung an.'}</p>${picHTML(it)}<p class="prompt">${showQ(it.q,it.h)}</p>
    <div class="opts${long?' one':''}">${o.map((x,i)=>`<button class="opt" type="button" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
    cb.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      const x=o[+btn.dataset.i],ok=it.a.includes(x);
      cb.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(it.a.includes(o[+b.dataset.i]))b.classList.add('ok')});
      if(!ok)btn.classList.add('bad');
      const full=it.q.includes('___')?`<span>${fillQ(it.q,it.a[0])}</span>`:`<span><b>${esc(it.a[0])}</b></span>`;
      grade(it.id,ok,`<strong>${ok?praise():'Nicht ganz.'}</strong>${full}<span class="ex">${esc(it.ex)}</span>`);
    });
  },
  /* Chat: Nea schreibt mit. Ab Fach 3 schreibt sie einzelne Wörter selbst, sonst tippt sie Vorschläge an. */
  chat(cb,it){
    const c=it.chat,typed=bx(it.id)>=3;
    cb.innerHTML=`<p class="instr">Chatte mit! Füll die Lücken in deinen Nachrichten.${canSay?' Tipp auf eine Nachricht, dann hörst du sie.':''}</p>`;
    lwChat(cb,{title:c.title,sub:c.sub,ava:c.ava,fach:'en',people:PEOPLE,say:canSay?say:null,
      lines:c.lines.map(l=>l.a&&typed&&/^[A-Za-z']+$/.test(l.a[0])?Object.assign({},l,{type:true}):l),
      onEnd(res){const n=res.length,k=res.filter(r=>r.ok).length,ok=k===n;
        const wrong=res.filter(r=>!r.ok).map(r=>`<span>${fillQ(r.line.t,r.line.a[0])}</span>`).join('');
        grade(it.id,ok,`<strong>${ok?praise()+' Alles richtig geschrieben.':`${k?"Fast! ":""}${k} von ${n} richtig.`}</strong>${ok?'':`<span class="ex">So wäre es richtig:</span>${wrong}`}<span class="ex">${esc(EXD[it.g])}</span>`)}});
  },
  t(cb,it){
    cb.innerHTML=`<p class="instr">${it.g==='G7'&&it.h?`Schreibe die richtige Form von <b>${esc(it.h)}</b>: mit ’s oder s’.`:it.g==='G8'&&it.h?`Schreibe die richtige Form von <b>${esc(it.h)}</b>.${negHint(it)}`:it.q.includes('___')?'Schreibe das fehlende Wort.':'Schreibe die Lösung.'}</p>${picHTML(it)}<p class="prompt">${showQ(it.q,it.h)}</p>
    <form class="inp" id="f"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort"><button class="check" type="submit">Prüfen</button></form>${aposHelp(it)}`;
    const inp=$('#ans');inp.focus({preventScroll:true});
    $('#f').onsubmit=e=>{e.preventDefault();const raw=strip(inp.value);if(!raw)return;inp.disabled=true;e.target.querySelector('button').disabled=true;
      const lo=raw.toLowerCase(),hit=it.a.map(strip).find(a=>a.toLowerCase()===lo),target=strip(it.a[0]);
      const full=it.q.includes('___')?`<span>${fillQ(it.q,it.a[0])}</span>`:'';
      if(hit){inp.classList.add('ok');
        const cn=hit!==raw&&/^[A-Z]|\bI\b/.test(hit)?`<span class="ex">Achte auf Groß- und Kleinschreibung: <b>${esc(hit)}</b></span>`:'';
        grade(it.id,true,`<strong>${praise()}</strong>${full}${cn}<span class="ex">${esc(it.ex)}</span>`);
      }else{inp.classList.add('bad');
        const ap=x=>x.toLowerCase().replace(/'/g,''),apN=target.includes("'")&&ap(raw)===ap(target)?`<span class="ex"><b>${raw.includes("'")?'Fast! Das Apostroph steht an der falschen Stelle.':'Fast! Es fehlt nur das Apostroph.'}</b></span>`:'';
        grade(it.id,false,`<strong>Richtig wäre:</strong><span class="sol">${diffHTML(raw,target)}</span>${apN}${it.a.length>1?`<span class="ex">Auch richtig: ${it.a.slice(1).map(esc).join(' · ')}</span>`:''}<span class="ex">${esc(it.ex)}</span>`)}};
  }
};

/* ===== Ende ===== */
function end(){
  const uniq=[...new Set(R.q)].filter(id=>ALL[id]),mv={sure:[],up:[],down:[]};
  uniq.forEach(id=>{const a=R.was[id]??0,b=bx(id);if(b===5&&a<5)mv.sure.push([id,a,b]);else if(a===0&&b===1)return;else if(b>a)mv.up.push([id,a,b]);else if(b<a)mv.down.push([id,a,b])});
  R.moves=mv;
  renderBox();
  const n=R.first-(R.nx||0),r=R.right,ids=pool(),sure=ids.filter(id=>bx(id)===5).length;
  const msg=r===n?'Alles richtig – stark!':r>=n*.8?'Sehr gut gemacht!':r>=n*.5?'Gut! Die falschen Karten stehen jetzt in Fach 1.':'Dranbleiben – morgen sitzt es schon besser.';
  $('#screen').innerHTML=`<section class="panel end">
    <div class="lbl">Runde geschafft</div>
    <div class="score">${r}<span style="font-size:1.4rem;color:var(--muted)"> / ${n}</span></div>
    <h2>${msg}</h2>
    ${KAP!=null?`<div class="kapend"><div class="lbl">Kapitel ${KNR[KAP]} · ${esc(kapTitle(KAPS[KAP]))}</div>${starsHTML(kapStars(kapProg(KAPS[KAP])))}${kapMeter(KAPS[KAP])}<p style="margin:0">${kapNext(KAPS[KAP])}</p></div>`
      :`<p class="small" style="margin:0">${sure} von ${ids.length} Karten sind schon in Fach 5.</p>`}
    ${movesHTML()}
    ${R.missed.length?`<div><div class="lbl" style="margin-bottom:6px">Diese Karten übst du am besten noch einmal</div><ul class="list">${R.missed.map(id=>{const x=ALL[id];return `<li>${id[0]==='v'?`<b>${esc(x.en)}</b> – ${esc(x.de)}`:(x.q.includes('___')?fillQ(x.q,x.a[0]):`${esc(x.q)} → <b>${esc(x.a[0])}</b>`)}</li>`}).join('')}</ul></div>`:''}
    ${KAP!=null?`<div class="row"><button class="go" type="button" id="again">Weiter üben</button><a class="ghost klink" href="index.html#heft-englisch">Zurück zum Heft</a><button class="ghost" type="button" id="menu">Zum Kapitel</button></div>`
      :`<div class="row"><button class="go" type="button" id="again">Neue Runde</button><button class="ghost" type="button" id="menu">Auswahl ändern</button>${R.moves&&R.moves.down.length?'<button class="ghost" type="button" id="seef1">Fach 1 ansehen</button>':''}</div>`}
  </section>`;
  $('#again').onclick=()=>KAP!=null?kapRound():startRound();$('#menu').onclick=home;
  if($('#seef1'))$('#seef1').onclick=()=>openWords(1);$('#again').focus({preventScroll:true});
}
/* Lernwelt: direkt ins Kapitel (englisch.html#v1 … #v3, #g1 …), Anker stehen in hefte.js */
function kapitelSprung(){
  let h=location.hash.slice(1).toLowerCase();h=OLD_ANKER[h]||h;
  const i=KAPS.findIndex(K=>K.a===h);if(i<0)return false;
  KAP=i;kapStart();return true;
}
window.addEventListener('hashchange',()=>{kapitelSprung()||start()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const nx=document.querySelector('.next');if(nx&&document.activeElement!==nx&&!(document.activeElement&&document.activeElement.tagName==='INPUT'&&!document.activeElement.disabled)){e.preventDefault();nx.click()}}});
kapitelSprung()||start();
</script>
