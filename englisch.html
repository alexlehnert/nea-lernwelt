/* Layout: eine Spalte im Stil eines grünen Englischbuchs – grünes Kopfband, grüner Karteikasten, Karten mit grünem Reiter */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a0f; --paper:#1b2617; --ink:#e9f2e1; --muted:#a3b597; --line:#2f4227;
  --navy:#8fd45a; --navy-soft:#24361b; --onnavy:#0f1a0a; --rule:#7cc13a;
  --green:#4f8f22; --green-dk:#2b5a16; --sun:#f6c623;

:root[data-theme="dark"]{
  --bg:#121a0f; --paper:#1b2617; --ink:#e9f2e1; --muted:#a3b597; --line:#2f4227;
  --navy:#8fd45a; --navy-soft:#24361b; --onnavy:#0f1a0a; --rule:#7cc13a;
  --green:#4f8f22; --green-dk:#2b5a16; --sun:#f6c623;
  --ok:#7fd67a; --ok-bg:#183319; --bad:#f08a7e; --bad-bg:#3a1d1a; --chip:#273a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.5;padding:0 16px}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{background:var(--green);color:#fff;border-radius:0 0 18px 18px;margin:-20px -16px 0;padding:22px 20px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
header .vol{position:relative;z-index:1;font-family:var(--f-d);font-weight:900;font-size:2.6rem;line-height:1;background:#fff;color:var(--green-dk);border-radius:12px;padding:4px 14px}
h1{font-family:var(--f-d);font-weight:900;font-size:1.9rem;letter-spacing:-.01em;margin:0;line-height:1.05;position:relative;z-index:1}
h1 small{display:block;font-family:var(--f-b);font-weight:400;font-size:.88rem;color:rgba(255,255,255,.9);letter-spacing:0;margin-top:4px}
h2{font-family:var(--f-d);font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance}
.lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* Karteikasten */
.box{background:var(--green);border-radius:16px;padding:14px 12px 0;color:#fff;box-shadow:0 12px 24px -16px rgba(30,70,10,.6)}
.box-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap;padding:0 4px}
.box-head h2{color:#fff;font-weight:900}
.box-head .small{color:rgba(255,255,255,.88)}
.fächer{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;background:var(--green-dk);border-radius:10px 10px 0 0;padding:10px 6px 0}
.fach{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.tab{background:#fff;color:var(--green-dk);font-family:var(--f-d);font-weight:900;font-size:.8rem;border-radius:6px 6px 0 0;padding:1px 6px;width:100%;max-width:64px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fach.f0 .tab{background:var(--sun);color:#3b2e00}
.stack{width:100%;max-width:64px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 3px;background:rgba(0,0,0,.18);margin-top:-4px}
.cards{border-radius:2px 2px 0 0;background:repeating-linear-gradient(to top,#ffffff 0 3px,#cfe0bd 3px 4px);transition:height .4s}
.fach.f5 .cards{background:repeating-linear-gradient(to top,#fff6c8 0 3px,var(--sun) 3px 4px)}
.front{background:var(--green);margin:0 -12px;border-radius:0 0 16px 16px;border-top:4px solid rgba(255,255,255,.35);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 18px 12px}
.front div{display:flex;flex-direction:column;align-items:center;min-width:0}
.front .n{font-family:var(--f-d);font-weight:900;font-variant-numeric:tabular-nums;font-size:1.15rem;line-height:1.1}
.front .t{font-size:.66rem;color:rgba(255,255,255,.9);text-align:center;line-height:1.15}

/* Auswahl */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.seg button b{font-family:var(--f-d);font-size:1.05rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--onnavy)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.go{background:var(--navy);color:var(--onnavy);border:none;border-radius:12px;padding:14px 22px;font-family:var(--f-d);font-weight:700;font-size:1.1rem}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.9rem;color:var(--muted)}

.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--navy);text-align:center;color:var(--navy)}

.say svg{width:20px;height:20px;fill:var(--navy)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left;font-size:1.02rem;min-height:52px}
@media (hover:hover) and (pointer:fine){.opt:hover:not(:disabled){border-color:var(--navy)}}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.25rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.inp input.ok{border-color:var(--ok);background:var(--ok-bg)}
.inp input.bad{border-color:var(--bad);background:var(--bad-bg)}
.check{background:var(--navy);color:var(--onnavy);border:none;border-radius:12px;padding:12px 18px;font-weight:700}
.slots{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 12px;font-size:1.15rem;font-weight:700;min-width:42px}
.tile.l{font-family:var(--f-d);text-transform:none}
.slots .tile{background:var(--navy-soft);border-color:var(--navy)}
.flipback{border-top:1px dashed var(--line);padding-top:14px;font-size:1.3rem}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-bg);color:var(--ink);border:1.5px solid var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:1.5px solid var(--bad)}
.fb strong{font-family:var(--f-d)}
.fb .ex{font-size:.92rem;color:var(--muted)}
.card{border-radius:12px;border:2px solid var(--green)}
.go,.next,.check{box-shadow:0 3px 0 var(--green-dk)}
.go:active,.next:active,.check:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-dk)}
.panel{border:2px solid var(--line)}
.lbl{color:var(--navy)}
.sol{font-size:1.2rem;font-weight:700;letter-spacing:.02em}
.sol .x{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.next{align-self:flex-end;background:var(--navy);color:var(--onnavy);border:none;border-radius:12px;padding:12px 22px;font-family:var(--f-d);font-weight:700;font-size:1.05rem}
.end{display:flex;flex-direction:column;gap:14px}
.score{font-family:var(--f-d);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}

function variants(en){
  const base=strip(en.replace(/\(pl\)/g,''));
  const out=new Set([clean(en),strip(base.replace(/[()]/g,''))]);
  [...out].forEach(v=>{if(v.includes(' / '))v.split(' / ').forEach(p=>out.add(p.trim()))});
  [...out].forEach(v=>{if(v.startsWith('to '))out.add(v.slice(3));else if(/^[a-z]/.test(v)&&!v.includes(' ')&&en.startsWith('to '))out.add('to '+v)});
  return [...out];
}

/* Rechtschreib-Vergleich: markiert in der richtigen Lösung, welche Buchstaben gefehlt haben oder falsch waren */
function diffHTML(typed,target){
  const a=apos(typed).toLowerCase(),b=target,bl=b.toLowerCase(),n=a.length,m=b.length;
  const d=Array.from({length:n+1},(_,i)=>Array.from({length:m+1},(_,j)=>i?(j?0:i):j));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===bl[j-1]?0:1));
  const mark=new Array(m).fill(true);let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(a[i-1]===bl[j-1]?0:1)){if(a[i-1]!==bl[j-1])mark[j-1]=false;i--;j--}
    else if(j>0&&d[i][j]===d[i][j-1]+1){mark[j-1]=false;j--}
    else i--;
  }
  return [...b].map((c,k)=>mark[k]?esc(c):`<span class="x">${esc(c)}</span>`).join('');
}
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};

let R=null;
function startRound(){
  const ids=pool(),Wt=[6,16,8,4,2,1];let cand=ids.map(id=>({id,w:Wt[bx(id)]}));
  const out=[],maxNew=Math.ceil(S.len*.6);let nNew=0;
  while(out.length<S.len&&cand.length){
    const tot=cand.reduce((s,c)=>s+c.w,0);let r=Math.random()*tot,k=0;
    while(r>cand[k].w){r-=cand[k].w;k++}
    const c=cand.splice(k,1)[0];
    if(bx(c.id)===0){if(nNew>=maxNew)continue;nNew++}
    out.push(c.id);
  }
  R={q:out,i:0,right:0,first:out.length,missed:[],retried:new Set()};
  task();
}
function vocabType(v,b){
  const c=clean(v.en),core=c.startsWith('to ')?c.slice(3):c,words=c.split(' ');
  const can={flip:1,mcED:1,mcDE:1,type:c.length<=26?1:0,
    tiles:/^[A-Za-z'-]{3,12}$/.test(core)?1:0, words:words.length>=3&&words.length<=8?1:0};
  const plan=b<=1?['mcED','mcED','mcDE']:b===2?['mcDE','mcED','tiles','words']:b===3?['type','tiles','words','mcDE']:['type','type','words'];
  const ok=plan.filter(t=>can[t]);return rnd(ok.length?ok:['mcED']);
}
function task(){
  renderBox();
  if(R.i>=R.q.length)return end();
  const id=R.q[R.i],it=ALL[id],b=bx(id),isV=id[0]==='v';
  let kind=isV?vocabType(it,b):it.t;
  if(!isV&&it.t==='c'&&b>=3&&it.q.includes('___')&&/^[A-Za-z']+$/.test(it.a[0])&&!it.opts.includes(SND[0]))kind='t';
  const tag=isV?`Vokabel · ${SECS[it.s].p}`:TOP[it.g];
  const fach=b?`Fach ${b}`:'neu';
  const pct=Math.round(R.i/R.q.length*100);
  $('#screen').innerHTML=`<div class="topbar"><span>Karte ${R.i+1} von ${R.q.length}${R.i>=R.first?' · Wiederholung':''}</span><button class="ghost" type="button" id="quit">Beenden</button></div>

  <div class="card-body" id="cb"></div></article>`;

}

function grade(id,ok,html){
  const b=bx(id);

  save();
  if(ok)R.right+=R.i<R.first?1:0;
  else{if(!R.missed.includes(id))R.missed.push(id);if(!R.retried.has(id)){R.retried.add(id);R.q.push(id)}}
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'ok':'bad');fb.setAttribute('role','status');
  fb.innerHTML=html+(!ok&&R.retried.has(id)&&R.q.lastIndexOf(id)>R.i?'<span class="ex">Diese Karte kommt am Ende der Runde noch einmal.</span>':'');
  const cb=$('#cb');cb.appendChild(fb);
  const nx=document.createElement('button');nx.className='next';nx.type='button';nx.textContent=R.i+1>=R.q.length?'Ergebnis':'Weiter';
  nx.onclick=()=>{R.i++;task();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()};cb.appendChild(nx);nx.focus({preventScroll:true});
  renderBox();
}
const praise=()=>rnd(['Richtig!','Super!','Genau!','Prima!','Stimmt!']);

/* ===== Vokabel-Aufgaben ===== */
function distract(v,key){
  const same=V.filter(x=>x.s===v.s&&x[key]!==v[key]&&x.en!==v.en),other=V.filter(x=>x.s!==v.s&&x[key]!==v[key]);
  const pick=shuffle(same).slice(0,3);while(pick.length<3)pick.push(rnd(other));
  return shuffle([v,...pick]);
}
function mc(cb,v,key,instr,prompt,speak){
  const o=distract(v,key);
  cb.innerHTML=`<p class="instr">${instr}</p><p class="prompt">${esc(prompt)} ${speak?sayBtn(v.en):''}</p>
  <div class="opts">${o.map((x,i)=>`<button class="opt" type="button" data-i="${i}">${esc(x[key])}</button>`).join('')}</div>`;
  bindSay(cb);
  cb.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    const x=o[+btn.dataset.i],ok=x[key]===v[key];
    cb.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(o[+b.dataset.i][key]===v[key])b.classList.add('ok')});
    if(!ok)btn.classList.add('bad');
    if(key==='en'&&ok&&canSay)say(v.en);
    grade(v.id,ok,ok?`<strong>${praise()}</strong><span>${esc(v.en)} = ${esc(v.de)}</span>`:`<strong>Nicht ganz.</strong><span><b>${esc(v.en)}</b> heißt ${esc(v.de)}.</span>`);
  });
}
const VT={
  flip(cb,v){
    cb.innerHTML=`<p class="instr">Weißt du, was das heißt? Sag es laut und dreh dann die Karte um.</p>
    <p class="prompt">${esc(v.en)} ${sayBtn(v.en)}</p><div id="fl"><button class="check" type="button" id="turn">Karte umdrehen</button></div>`;
    bindSay(cb);
    $('#turn').onclick=()=>{
      $('#fl').innerHTML=`<div class="flipback">${esc(v.de)}</div><p class="instr" style="margin-top:12px">Hast du es gewusst? Sei ehrlich – nur so hilft der Karteikasten.</p>
      <div class="opts"><button class="opt" type="button" id="y">Gewusst ✔</button><button class="opt" type="button" id="n">Noch nicht ✘</button></div>`;
      const fin=ok=>{cb.querySelectorAll('.opt').forEach(b=>b.disabled=true);(ok?$('#y'):$('#n')).classList.add(ok?'ok':'bad');
        grade(v.id,ok,ok?`<strong>${praise()}</strong><span>Die Karte rückt ein Fach weiter.</span>`:`<strong>Kein Problem.</strong><span>Merk dir: <b>${esc(v.en)}</b> = ${esc(v.de)}</span>`)};
      $('#y').onclick=()=>fin(true);$('#n').onclick=()=>fin(false);
    };
  },
  mcED(cb,v){mc(cb,v,'de','Was heißt das auf Deutsch?',v.en,true)},
  mcDE(cb,v){mc(cb,v,'en','Was heißt das auf Englisch?',v.de,false)},
  type(cb,v){
    const target=clean(v.en),acc=new Set();V.filter(x=>x.de===v.de).forEach(x=>variants(x.en).forEach(a=>acc.add(a)));
    cb.innerHTML=`<p class="instr">Schreibe das englische Wort. Achte auf die Rechtschreibung!</p><p class="prompt">${esc(v.de)}</p>
    <form class="inp" id="f"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort auf Englisch"><button class="check" type="submit">Prüfen</button></form>`;
    const inp=$('#ans');inp.focus({preventScroll:true});
    $('#f').onsubmit=e=>{e.preventDefault();const raw=strip(inp.value);if(!raw)return;inp.disabled=true;e.target.querySelector('button').disabled=true;
      const lo=raw.toLowerCase(),hit=[...acc].find(a=>a.toLowerCase()===lo);
      if(hit){inp.classList.add('ok');if(canSay)say(v.en);
        const caseNote=hit!==raw?`<span class="ex">Achte auf Groß- und Kleinschreibung: <b>${esc(hit)}</b></span>`:'';
        const toNote=target.startsWith('to ')&&!lo.startsWith('to ')?`<span class="ex">Verben lernst du mit <b>to</b>: ${esc(target)}</span>`:'';
        grade(v.id,true,`<strong>${praise()}</strong><span>${esc(target)}</span>${caseNote}${toNote}`);
      }else{inp.classList.add('bad');const close=lev(lo,target.toLowerCase())<=2;
        grade(v.id,false,`<strong>${close?'Fast! Schau genau auf die Buchstaben:':'Richtig wäre:'}</strong><span class="sol">${diffHTML(raw,target)}</span><span class="ex">Du hast geschrieben: ${esc(raw)}</span>`)}};
  },
  tiles(cb,v){
    const c=clean(v.en),pre=c.startsWith('to ')?'to ':'',core=c.slice(pre.length);
    tileGame(cb,v.id,[...core],`Bilde das Wort aus den Buchstaben. Klick sie in der richtigen Reihenfolge an.`,v.de,core,pre,'',true,v.en);
  },
  words(cb,v){const c=clean(v.en);tileGame(cb,v.id,c.split(' '),'Bring die Wörter in die richtige Reihenfolge.',v.de,c,'',' ',false,v.en)}
};
function tileGame(cb,id,parts,instr,prompt,target,prefix,joiner,letters,speak){
  let order;do{order=shuffle(parts.map((p,i)=>i))}while(parts.length>1&&order.every((x,i)=>parts[x]===parts[i]));
  const placed=[];
  cb.innerHTML=`<p class="instr">${instr}</p><p class="prompt">${esc(prompt)}</p>
  <div class="slots" id="sl" aria-label="Deine Lösung">${prefix?`<span class="small">${esc(prefix)}</span>`:''}</div><div class="pool" id="pl"></div>`;
  const draw=()=>{
    $('#sl').innerHTML=(prefix?`<span class="tile l" style="opacity:.6">${esc(prefix.trim())}</span>`:'')+placed.map((k,i)=>`<button type="button" class="tile${letters?' l':''}" data-p="${i}" aria-label="${esc(parts[k])} entfernen">${esc(parts[k])}</button>`).join('');
    $('#pl').innerHTML=order.map(k=>placed.includes(k)?'':`<button type="button" class="tile${letters?' l':''}" data-k="${k}">${esc(parts[k])}</button>`).join('');
    cb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.p,1);draw()});
    cb.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{placed.push(+b.dataset.k);draw();if(placed.length===parts.length)done()});
  };
  const done=()=>{cb.querySelectorAll('.tile').forEach(b=>b.disabled=true);
    const got=placed.map(k=>parts[k]).join(joiner),ok=got===target;
    if(ok&&canSay)say(speak);
    grade(id,ok,ok?`<strong>${praise()}</strong><span>${esc(prefix+target)}</span>`:`<strong>Nicht ganz. Richtig ist:</strong><span class="sol">${esc(prefix+target)}</span>`)};
  draw();
}

/* ===== Grammatik-Aufgaben ===== */
const showQ=q=>esc(q).replace('___','<span class="gap">&nbsp;?&nbsp;</span>');
const fillQ=(q,a)=>esc(q).replace('___',`<b>${esc(a)}</b>`);
const GT={
  c(cb,it){
    const o=shuffle(it.opts),long=o.some(x=>x.length>14);
    cb.innerHTML=`<p class="instr">Klick die richtige Lösung an.</p><p class="prompt">${showQ(it.q)}</p>
    <div class="opts${long?' one':''}">${o.map((x,i)=>`<button class="opt" type="button" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
    cb.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      const x=o[+btn.dataset.i],ok=it.a.includes(x);
      cb.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(it.a.includes(o[+b.dataset.i]))b.classList.add('ok')});
      if(!ok)btn.classList.add('bad');
      const full=it.q.includes('___')?`<span>${fillQ(it.q,it.a[0])}</span>`:`<span><b>${esc(it.a[0])}</b></span>`;
      grade(it.id,ok,`<strong>${ok?praise():'Nicht ganz.'}</strong>${full}<span class="ex">${esc(it.ex)}</span>`);
    });
  },
  t(cb,it){
    cb.innerHTML=`<p class="instr">${it.q.includes('___')?'Schreibe das fehlende Wort.':'Schreibe die Lösung.'}</p><p class="prompt">${showQ(it.q)}</p>
    <form class="inp" id="f"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort"><button class="check" type="submit">Prüfen</button></form>`;
    const inp=$('#ans');inp.focus({preventScroll:true});
    $('#f').onsubmit=e=>{e.preventDefault();const raw=strip(inp.value);if(!raw)return;inp.disabled=true;e.target.querySelector('button').disabled=true;
      const lo=raw.toLowerCase(),hit=it.a.map(strip).find(a=>a.toLowerCase()===lo),target=strip(it.a[0]);
      const full=it.q.includes('___')?`<span>${fillQ(it.q,it.a[0])}</span>`:'';
      if(hit){inp.classList.add('ok');
        const cn=hit!==raw&&/^[A-Z]|\bI\b/.test(hit)?`<span class="ex">Achte auf Groß- und Kleinschreibung: <b>${esc(hit)}</b></span>`:'';
        grade(it.id,true,`<strong>${praise()}</strong>${full}${cn}<span class="ex">${esc(it.ex)}</span>`);
      }else{inp.classList.add('bad');
        grade(it.id,false,`<strong>Richtig wäre:</strong><span class="sol">${diffHTML(raw,target)}</span>${it.a.length>1?`<span class="ex">Auch richtig: ${it.a.slice(1).map(esc).join(' · ')}</span>`:''}<span class="ex">${esc(it.ex)}</span>`)}};
  }
};

/* ===== Ende ===== */
function end(){
  renderBox();
  const n=R.first,r=R.right,ids=pool(),sure=ids.filter(id=>bx(id)===5).length;
  const msg=r===n?'Alles richtig – stark!':r>=n*.8?'Sehr gut gemacht!':r>=n*.5?'Gut! Die falschen Karten stehen jetzt in Fach 1.':'Dranbleiben – morgen sitzt es schon besser.';
  $('#screen').innerHTML=`<section class="panel end">
    <div class="lbl">Runde geschafft</div>
    <div class="score">${r}<span style="font-size:1.4rem;color:var(--muted)"> / ${n}</span></div>
    <h2>${msg}</h2>
    <p class="small" style="margin:0">${sure} von ${ids.length} Karten sind schon in Fach 5.</p>
    ${R.missed.length?`<div><div class="lbl" style="margin-bottom:6px">Diese Karten übst du am besten noch einmal</div><ul class="list">${R.missed.map(id=>{const x=ALL[id];return `<li>${id[0]==='v'?`<b>${esc(x.en)}</b> – ${esc(x.de)}`:(x.q.includes('___')?fillQ(x.q,x.a[0]):`${esc(x.q)} → <b>${esc(x.a[0])}</b>`)}</li>`}).join('')}</ul></div>`:''}
    <div class="row"><button class="go" type="button" id="again">Neue Runde</button><button class="ghost" type="button" id="menu">Auswahl ändern</button></div>
  </section>`;
  $('#again').onclick=startRound;$('#menu').onclick=start;$('#again').focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const nx=document.querySelector('.next');if(nx&&document.activeElement!==nx&&!(document.activeElement&&document.activeElement.tagName==='INPUT'&&!document.activeElement.disabled)){e.preventDefault();nx.click()}}});
start();
</script>
