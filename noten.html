<style>
/* Layout: ein Notenheft. Helles Linienpapier, Tinte in Indigo, die Töne in Boomwhacker-Farben (c rot … h pink) wie im Heft.
   Startseite = Glockenspiel (Fortschritt) + Stationen-Kacheln; Spiel = eine Notenzeile im Mittelpunkt, Rückmeldung von unten.
   Bewusst ein einziges helles Erscheinungsbild, weil Notenpapier hell ist. */
:root{
  color-scheme:light;
  --paper:#EFECF6; --sheet:#FFFFFF; --ink:#211A44; --muted:#665F86; --line:#DCD6EA; --rule:#3B3366; --soft:#E6E1F2;
  --accent:#4A35C6; --accent-d:#2D2091; --gold:#F2B61F; --gold-d:#B9860B;
  --good:#11906A; --good-bg:#DCF3EA; --bad:#D2452E; --bad-bg:#FCE4DE;
  --n-c:#E3342F; --n-d:#F28A1C; --n-e:#E8B600; --n-f:#86C03F; --n-g:#17995A; --n-a:#6A3FA6; --n-h:#E0438C;
  --f-d:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-b:"Lexend","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0 46px,rgba(59,51,102,.07) 46px 47px,transparent 47px 54px,rgba(59,51,102,.07) 54px 55px,transparent 55px 62px,rgba(59,51,102,.07) 62px 63px,transparent 63px 70px,rgba(59,51,102,.07) 70px 71px,transparent 71px 78px,rgba(59,51,102,.07) 78px 79px,transparent 79px 140px)}
.wrap{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem;color:var(--muted)}
svg{display:block}

/* Kopf */
.hero{display:flex;align-items:center;gap:12px;padding-top:6px}
.hero .logo{width:52px;height:70px;flex:none;color:var(--accent)}
.hero small{font:700 .72rem/1 var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:2.15rem;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-top:2px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{background:var(--sheet);border:2px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center}
.chip b{display:block;font:800 1.45rem/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.chip span{font-size:.74rem;color:var(--muted)}
.chip.xp b{color:var(--accent)} .chip.fire b{color:var(--n-d)} .chip.goal b{color:var(--good)}
.level{background:var(--sheet);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.level .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.level h3{font-size:1.15rem;color:var(--accent)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--n-c),var(--n-d),var(--n-e),var(--n-f),var(--n-g),var(--n-a),var(--n-h));transition:width .6s}

.sec{font:800 1.15rem/1.2 var(--f-d);color:var(--ink);margin:4px 2px -6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec small{font:400 .8rem var(--f-b);color:var(--muted)}
.panel{background:var(--sheet);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Glockenspiel */
.bells{width:100%;height:auto;user-select:none;-webkit-user-select:none}
.bells .bar{cursor:pointer;transition:transform .12s}
.bells .bar.ring{animation:ring .5s}
@keyframes ring{25%{transform:translateY(-4px)}60%{transform:translateY(1px)}}
.bells .nail{fill:var(--ink);opacity:.55}
.bells .bl{font:700 15px var(--f-d);fill:var(--ink)}
.bells .pip{fill:var(--sheet);stroke:var(--muted);stroke-width:1.2}
.bells .pip.on{fill:var(--good);stroke:var(--good)}

/* Stationen */
.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.st{position:relative;text-align:left;background:var(--sheet);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--line);transition:transform .1s;min-width:0}
.st:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.st .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.st .ico svg{width:26px;height:26px}
.st h3{font-size:1.08rem;font-weight:800;overflow-wrap:anywhere}
.st p{font-size:.8rem;color:var(--muted);line-height:1.3}
.st .stars{display:flex;gap:2px;margin-top:auto}
.st .stars svg{width:18px;height:18px}
.st.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.st.wide > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.st.wide .ico{width:52px;height:52px}
.st.wide .ico svg{width:32px;height:32px}
.st .tagnew{position:absolute;top:10px;right:10px;font:700 .66rem/1 var(--f-b);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:4px 7px;border-radius:99px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bd{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--sheet);font-size:.74rem;line-height:1.2;min-width:0}
.bd svg{width:36px;height:36px}
.bd b{font:700 .82rem/1.15 var(--f-d);overflow-wrap:anywhere}
.bd.lock{opacity:.45}
.bd.own{border-color:var(--gold)}

.settings{display:flex;flex-wrap:wrap;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;background:var(--sheet);border:2px solid var(--line);border-radius:99px;padding:8px 14px;font-size:.88rem}
.toggle .sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{left:17px}
details.parents{background:var(--sheet);border:2px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:.88rem}
details.parents summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.parents ul{padding-left:20px;margin:8px 0}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:16px;font:800 1.12rem/1 var(--f-d);background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sec2{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.btn.small{min-height:42px;font-size:.98rem;padding:8px 14px}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}

/* Spiel */
.topbar{display:flex;align-items:center;gap:10px}

  app.querySelectorAll(".lvb").forEach(b=>b.onclick=()=>{TR.lvl=+b.dataset.l;TR.pts=[];TR.strokes=[];TR.done=false;drawTraceScreen()});

  $("#done").onclick=scoreTrace}
function setupCanvas(){const cv=$("#cv"),tb=$("#tb");const fit=()=>{const r=tb.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;redraw()};fit();

  const t0=performance.now(),T=3200;(function step(t){const q=Math.min(1,(t-t0)/T);p.style.strokeDashoffset=L*(1-q);const pt=p.getPointAtLength(L*q);dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);

function scoreTrace(){const path=$("#guide"),L=path.getTotalLength();const G=[];for(let d=0;d<=L;d+=2){const p=path.getPointAtLength(d);G.push([p.x,p.y])}

    [oneStroke,oneStroke?"In einem Schwung gezeichnet.":"Versuch den Schlüssel in einem Zug zu zeichnen, ohne abzusetzen."]];
  $("#tres").innerHTML=`<div class="row c" style="gap:14px"><span class="score">${score}%</span><div class="bigstars">${[0,1,2].map(k=>I.bigstar(k<stars).replace('<svg','<svg style="width:38px;height:38px"')).join("")}</div></div>
   <div class="tips">${tips.map(([ok,t])=>`<div class="tip ${ok?"":"bad"}"><i></i><span>${t}</span></div>`).join("")}</div>
   <p class="small" style="text-align:center">+${xp} Notenpunkte${stars===3&&TR.lvl<3?" · Probier jetzt die nächste Stufe!":""}</p>
   <div class="row c"><button class="btn" id="tagain">Nochmal zeichnen</button></div>`;
  $("#tagain").onclick=()=>{TR.strokes=[];TR.done=false;drawTraceScreen()};
  if(stars>=2){sfxOk();if(stars===3){fanfare();confetti()}}else sfxBad()}

/* ================= Notenregen ================= */
let RN=null;
function stopAll(){if(RN){RN.run=false;cancelAnimationFrame(RN.raf)}if(CP)CP.playing=false;window.onresize=null}
function rain(){hideFb();stopAll();RN={run:false};
  app.innerHTML=`<div class="topbar"><button class="x" id="quit" aria-label="Zurück">${I.x}</button><div style="flex:1"><b style="font:800 1.2rem var(--f-d)">Notenregen</b></div><div class="purse">Rekord ${S.hi}</div></div>
  <section class="stage rain" id="rs"><div class="prompt"><b>Benenne jede Note, bevor sie den Schlüssel erreicht</b><small>Tipp auf den Buchstaben. Hoch oder tief ist egal, c′ und c″ sind beide c. Drei Herzen hast du, und es wird immer schneller.</small></div>
   <div class="row c"><button class="btn gold" id="go">${I.play} Los geht's</button></div></section>`;
  $("#quit").onclick=home;$("#go").onclick=rainGo}
function rainGo(){ac();RN={run:true,score:0,lives:3,combo:0,cur:null,raf:0,last:-1};
  $("#rs").innerHTML=`<div class="rainhead"><div class="hearts" id="hearts"></div><div style="text-align:center"><div class="rscore" id="rsc">0</div><div class="combo" id="cmb"></div></div><div class="small" style="width:84px;text-align:right">Rekord<br><b>${S.hi}</b></div></div>
   <div class="staffbox" style="max-width:560px">${staffSVG(340,'<g id="rn"></g><g id="rv"></g>')}</div>
   <div class="letters">${"cdefgah".split("").map(l=>`<button class="lt" data-l="${l}">${l}</button>`).join("")}</div>`;
  hearts();$("#rs").querySelectorAll(".lt").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();rainHit(b)}));rainNext();RN.raf=requestAnimationFrame(rainLoop)}
function hearts(){$("#hearts").innerHTML=[0,1,2].map(i=>I.heart(i<RN.lives)).join("")}
function rainNext(){let p;do{p=rand(10)}while(p===RN.last);RN.last=p;RN.cur={p,t0:performance.now(),T:Math.max(1500,5200-RN.score*140)};$("#rn").innerHTML=noteSVG(p,0);$("#rn").setAttribute("transform","translate(360 0)")}
function rainLoop(t){if(!RN.run)return;const c=RN.cur;const q=(t-c.t0)/c.T;const x=340-(340-56)*Math.min(1,q);$("#rn")?.setAttribute("transform",`translate(${x} 0)`);
  if(q>=1){rainMiss(true);}RN.raf=requestAnimationFrame(rainLoop)}
function rainHit(b){if(!RN.run)return;const p=RN.cur.p;if(b.dataset.l===NOTES[p].l){RN.combo++;RN.score+=1+Math.floor(RN.combo/5);playP(p);b.classList.remove("ok");void b.offsetWidth;b.classList.add("ok");setTimeout(()=>b.classList.remove("ok"),250);
    bump(p,true);$("#rsc").textContent=RN.score;$("#cmb").textContent=RN.combo>=5?`Serie ${RN.combo}: Bonus +${Math.floor(RN.combo/5)}`:"";rainNext()}
  else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),350);rainMiss(false)}}
function rainMiss(timeout){const p=RN.cur.p;RN.lives--;RN.combo=0;$("#cmb").textContent="";hearts();sfxBad();bump(p,false);
  $("#rv").innerHTML=`<text x="${timeout?80:170}" y="22" class="reveal">Das war ${NOTES[p].n}</text>`;setTimeout(()=>{if($("#rv"))$("#rv").innerHTML=""},1200);
  if(RN.lives<=0)return rainOver();if(timeout)rainNext()}
function rainOver(){RN.run=false;cancelAnimationFrame(RN.raf);const rec=RN.score>S.hi;if(rec)S.hi=RN.score;const xp=RN.score*3;addXP(xp);if(RN.score>=20)award("rain20");
  const stars=RN.score>=25?3:RN.score>=15?2:RN.score>=6?1:0;S.best.rain=Math.max(S.best.rain||0,stars);finishDay();save();
  $("#rs").innerHTML=`<section class="result"><h2>${rec?"Neuer Rekord!":"Geschafft!"}</h2><div class="bigstars">${[0,1,2].map(k=>I.bigstar(k<stars)).join("")}</div><div class="rscore">${RN.score} Noten</div>
   <p class="muted">+${xp} Notenpunkte · Rekord: ${S.hi}</p><p class="small">1 Stern ab 6, 2 Sterne ab 15, 3 Sterne ab 25.</p><div class="row c"><button class="btn gold" id="go2">Nochmal</button><button class="btn sec2" id="bk">Zur Übersicht</button></div></section>`;
  $("#go2").onclick=rainGo;$("#bk").onclick=home;if(rec&&RN.score>0){fanfare();confetti()}}

/* ================= Melodie-Baukasten ================= */
let CP=null;const SL=16,CX0=62,CDX=50;
function compose(){hideFb();stopAll();CP={notes:CP?CP.notes:Array(SL).fill(null),playing:false};
  app.innerHTML=`<div class="topbar"><button class="x" id="quit" aria-label="Zurück">${I.x}</button><div style="flex:1"><b style="font:800 1.2rem var(--f-d)">Melodie-Baukasten</b></div></div>
  <section class="stage"><div class="prompt"><b>Schreib deine eigene Melodie</b><small>Tipp auf die Notenzeile oder spiel auf dem Klavier. Nochmal auf eine Note tippen löscht sie.</small></div>
   <div class="scroll" id="scr"><div class="staffbox tapme" style="max-width:none">${staffSVG(CX0+SL*CDX,'<g id="cur"></g><g id="cn"></g>',{under:[4,8,12,16].map(k=>`<line x1="${CX0+k*CDX-CDX/2}" x2="${CX0+k*CDX-CDX/2}" y1="${ST.top}" y2="${ST.top+4*ST.s}" class="bar"/>`).join(""),h:150})}</div></div>
   <div class="row c"><button class="btn" id="pl">${I.play} Abspielen</button><button class="btn sec2 small" id="cl">Alles löschen</button></div>
   <div class="pianobox">${pianoSVG({labels:true,dots:true})}</div>
   <div><p class="small" style="margin-bottom:6px">Bekannte Lieder laden und nachspielen:</p><div class="presets">${SONGS.map((s,i)=>`<button class="pc" data-i="${i}">${s.t}</button>`).join("")}</div></div>
  </section>`;
  $("#quit").onclick=home;const svg=app.querySelector(".scroll svg");drawC();
  svg.addEventListener("pointerdown",e=>{e.preventDefault();const pt=svgPt(svg,e);if(pt.x<CX0-CDX/2)return;const i=Math.max(0,Math.min(SL-1,Math.round((pt.x-CX0)/CDX)));const p=pFromY(pt.y);
    if(CP.notes[i]===p){CP.notes[i]=null}else{CP.notes[i]=p;playP(p)}drawC(i)});
  bindPiano(app.querySelector(".pianobox"),(i,black)=>{if(black)return;let k=CP.notes.indexOf(null);if(k<0){CP.notes.shift();CP.notes.push(null);k=SL-1}CP.notes[k]=i;drawC(k);
    const sc=$("#scr");sc.scrollLeft=Math.max(0,(k-3)*CDX*(sc.scrollWidth/(CX0+SL*CDX)))});
  $("#cl").onclick=()=>{CP.notes=Array(SL).fill(null);drawC()};
  app.querySelectorAll(".pc").forEach(b=>b.onclick=()=>{const s=SONGS[+b.dataset.i];CP.notes=Array(SL).fill(null);s.ps.slice(0,SL).forEach((p,i)=>CP.notes[i]=p);drawC();playC(s.d)});
  $("#pl").onclick=()=>playC()}
function drawC(popI){const g=$("#cn");if(!g)return;g.innerHTML=CP.notes.map((p,i)=>p===null?"":noteSVG(p,CX0+i*CDX,{cls:i===popI?"pop":"",label:true})).join("")}
function playC(d){if(CP.playing)return;const idx=CP.notes.map((p,i)=>p===null?-1:i).filter(i=>i>=0);if(!idx.length)return toast("Setz zuerst ein paar Noten");
  CP.playing=true;const ps=idx.map(i=>CP.notes[i]);if(!d&&idx.length>=8)award("komp");
  melody(ps,d?d.slice(0,ps.length):null,.36,k=>{const c=$("#cur");if(!c)return;if(k<0){c.innerHTML="";CP.playing=false;return}const x=CX0+idx[k]*CDX;c.innerHTML=`<rect x="${x-20}" y="6" width="40" height="130" rx="10" class="cursor"/>`;
    const n=[...document.querySelectorAll("#cn .note")][k];if(n){n.classList.remove("pop");void n.getBBox();n.classList.add("pop")}})}

/* ================= Spickzettel ================= */
function cheat(){hideFb();stopAll();const DX=46,X0=70;
  app.innerHTML=`<div class="topbar"><button class="x" id="quit" aria-label="Zurück">${I.x}</button><div style="flex:1"><b style="font:800 1.2rem var(--f-d)">Spickzettel</b></div></div>
  <section class="stage cheat"><div class="prompt"><b>Alle Noten von c′ bis e″</b><small>Tipp auf eine Note, dann hörst du sie.</small></div>
   <div class="scroll"><div class="staffbox" style="max-width:none;min-width:520px">${staffSVG(X0+9*DX+34,NOTES.map((_,p)=>noteSVG(p,X0+p*DX,{color:realCol(p),label:true})).join(""),{h:150})}</div></div>
   <div class="pianobox">${pianoSVG({labels:true,dots:true})}</div></section>
  <div class="panel"><b style="font:800 1.05rem var(--f-d)">Merksätze</b>
   <p class="mnem">Linien von unten: <b>E</b>s <b>G</b>eht <b>H</b>offentlich <b>D</b>iesmal <b>F</b>ehlerfrei</p><p class="small">e′ · g′ · h′ · d″ · f″</p>
   <p class="mnem">Zwischenräume von unten: <b>F A C E</b>, englisch für Gesicht</p><p class="small">f′ · a′ · c″ · e″</p>
   <p class="mnem">Ganz unten: c′ auf der Hilfslinie, d′ hängt unter der 1. Linie.</p></div>
  <div class="panel"><b style="font:800 1.05rem var(--f-d)">Notenhals</b>
   <div class="rule">${staffSVG(150,noteSVG(4,64,{color:"var(--ink)"})+noteSVG(8,112,{color:"var(--ink)"}),{clef:false})}<p class="small">Bis a′ zeigt der Hals <b>nach oben</b> und steht <b>rechts</b>. Ab h′ zeigt er <b>nach unten</b> und steht <b>links</b>.</p></div></div>
  <div class="panel"><b style="font:800 1.05rem var(--f-d)">Violinschlüssel</b><p class="small">Er heißt auch G-Schlüssel, weil seine Schnecke die 2. Linie umkreist. Dort steht g′. Beim Zeichnen startest du genau dort.</p><div class="row"><button class="btn small" id="toclef">Zur Schlüssel-Werkstatt</button></div></div>`;
  $("#quit").onclick=home;$("#toclef").onclick=()=>openStation("clef");
  app.querySelectorAll(".cheat .staff .note").forEach(g=>{g.style.cursor="pointer";g.addEventListener("pointerdown",()=>{playP(+g.dataset.p);g.classList.remove("pop");void g.getBBox();g.classList.add("pop")})});
  bindPiano(app.querySelector(".pianobox"));scrollTo(0,0)}

home();
</script>

</body></html>
