<title>Bio-Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chelsea+Market&family=Patrick+Hand&family=Patrick+Hand+SC&display=swap">
<style>
/* Poster look (wie „Expedition Pflanzenzelle“): Kreide auf Anthrazit, Orange, Senf, Hellgrün, Creme. Bewusst ein einziges dunkles Erscheinungsbild. */
:root{
  color-scheme:dark;
  --paper:#252321; --surface:#2E2B27; --surface2:#3A362F; --ink:#F4E6C1; --muted:#C2B597; --line:#5C5446;
  --accent:#F08A24; --accent-d:#B4610F; --accent-ink:#1E1C1A; --good:#B9D24A; --bad:#F2875A; --good-bg:#34401D; --bad-bg:#4A2A1C;
  --c-wall:#E0B447; --c-wall-d:#8C6A1E; --c-mem:#F7EBC8; --c-cyto:#34302A; --c-vac:#7FAF9B; --c-vac-d:#CFE5D6;
  --c-nuc:#D95A2B; --c-nuc-d:#F7D774; --c-chl:#A9C33B; --c-chl-d:#4C6A1C; --c-mit:#F29A3A; --c-mit-d:#6E3312;
  --c-er:#E98C7A; --c-gol:#F6D35E; --c-rib:#FFF4D6;
  --sun:#F6D35E; --p-h2o:#6FB7D0; --salt:#6A5E44; --soil:#E07B2E; --leaf:#A9C33B; --leaf-d:#6E8A24; --petal:#F6E3B0;
  --display:"Chelsea Market", "Comic Sans MS", system-ui, sans-serif;
  --hand:"Patrick Hand SC", "Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
  --hand2:"Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--paper);
  background-image:radial-gradient(circle,rgba(246,211,94,.45) 1px,transparent 1.6px),radial-gradient(circle,rgba(240,138,36,.35) 1px,transparent 1.6px),radial-gradient(circle,rgba(244,230,193,.16) .8px,transparent 1.4px);
  background-size:67px 71px,89px 83px,23px 29px;background-position:0 0,31px 43px,7px 11px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 40px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-weight:400;line-height:1.12;text-wrap:balance}
p{margin:0}
b{color:#FFF6DC}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px dashed var(--accent);outline-offset:3px}
.hand{font-family:var(--hand)}
.small{font-size:.9rem;color:var(--muted)}

/* Kopf */
header.top{padding-block:22px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kicker{font-family:var(--hand);letter-spacing:.1em;color:var(--c-wall);font-size:1rem}
h1{font-family:var(--display);font-size:clamp(2.3rem,10vw,3.2rem);color:var(--accent);line-height:1}
h1 small{display:block;font-family:var(--hand2);font-size:1.15rem;color:var(--muted);margin-top:6px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:2px 12px;font-family:var(--hand2);font-size:1.05rem;white-space:nowrap}
.pill b{color:var(--good);font-weight:400}

/* Karten / Panels */
.panel{background:rgba(46,43,39,.94);border:1.5px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.lbl{font-family:var(--hand);font-size:1.05rem;letter-spacing:.08em;color:var(--c-wall)}
h2{font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-family:var(--hand2);font-size:1.1rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.go{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:14px 28px;font-family:var(--display);font-size:1.25rem;box-shadow:0 5px 0 var(--accent-d)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--hand2);font-size:1.08rem;color:var(--ink)}
.ghost:hover{border-color:var(--accent)}

/* Wissens-Pflanze */
.plantwrap{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:520px){.plantwrap{grid-template-columns:minmax(0,1fr)}.plantwrap svg{max-height:300px}}
.plantwrap svg{width:100%;height:auto;display:block;max-height:380px}
.leaf{cursor:pointer;transition:opacity .3s}
.leaf.hl path:first-child{stroke:var(--accent)!important;stroke-width:3!important}
.leaf.new{animation:grow 1.4s ease-out 2}
@keyframes grow{0%{transform-box:fill-box;filter:drop-shadow(0 0 0 var(--good))}50%{filter:drop-shadow(0 0 10px var(--good))}}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.m{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:4px 10px;font-family:var(--hand2);font-size:1.05rem;background:transparent;text-align:left;min-width:0}
.m span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m[aria-pressed="true"]{border-color:var(--accent)}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.pips i.on{background:var(--good);border-color:var(--good)}
.plantcap{font-family:var(--hand2);font-size:1.1rem;color:var(--muted);min-height:1.5em}

/* Runde */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--hand2);font-size:1.1rem;color:var(--muted);padding-top:16px}
.progress{height:10px;border-radius:99px;border:1.5px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);transition:width .3s}
.card{background:rgba(46,43,39,.96);border:1.5px solid var(--line);border-radius:26px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--hand);font-size:.98rem;letter-spacing:.05em;border-radius:999px;padding:0 10px;background:var(--accent);color:var(--accent-ink)}
.tag.soft{background:transparent;color:var(--muted);border:1.5px dashed var(--line)}
.prompt{font-family:var(--display);font-size:clamp(1.2rem,5vw,1.5rem);line-height:1.25;color:var(--petal);text-wrap:balance}
.instr{font-size:.95rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:transparent;border-radius:16px;padding:11px 14px;text-align:left;font-size:1rem;min-height:54px;line-height:1.3}
.opts.two .opt{text-align:center;font-family:var(--hand2);font-size:1.2rem}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.98rem}
.fb.ok{background:var(--good-bg);border:1.5px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:1.5px solid var(--bad)}
.fb strong{font-family:var(--display);font-weight:400;font-size:1.15rem}
.fb.ok strong{color:var(--good)} .fb.bad strong{color:var(--bad)}
.fb .ex{color:var(--muted);font-size:.93rem}
.next{align-self:stretch;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:13px 22px;font-family:var(--display);font-size:1.2rem;box-shadow:0 5px 0 var(--accent-d)}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
.check{background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:11px 22px;font-family:var(--hand2);font-size:1.2rem}
.check:disabled{opacity:.4}

/* Zelle */
.cellbox{background:rgba(37,35,33,.8);border:1.5px solid var(--line);border-radius:22px;padding:8px}
.cellbox svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
svg .org{cursor:pointer}
svg.dimmed .org:not(.hl){opacity:.22}
svg .org.hl{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 7px var(--accent)) brightness(1.15)}}
svg .org.ok{filter:drop-shadow(0 0 8px var(--good))}
svg .org.bad{filter:drop-shadow(0 0 8px var(--bad))}
svg .org.sel{filter:drop-shadow(0 0 6px var(--accent))}
svg.sel-on .org:not(.sel){opacity:.45}
svg .pin circle{fill:var(--paper);stroke:var(--ink);stroke-width:3}
svg .pin text{font-family:var(--display);font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .pin.ok circle{stroke:var(--good);fill:var(--good-bg)} svg .pin.bad circle{stroke:var(--bad);fill:var(--bad-bg)}
svg .pin.act circle{stroke:var(--accent)}
svg .pin{cursor:pointer}
svg text.lab{font-family:var(--hand);font-size:19px;fill:var(--ink)}

/* Zuordnen (Beschriften / Verbinden) */
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:44px}
.tile{border:1.5px solid var(--ink);background:var(--surface2);border-radius:999px;padding:5px 14px;font-family:var(--hand2);font-size:1.12rem;min-height:42px}
.tile[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile:disabled{opacity:.35}
.slots{display:flex;flex-direction:column;gap:6px}
.slotrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:16px;padding:6px 8px 6px 10px;background:transparent;text-align:left;min-height:50px;font-size:.98rem}
.slotrow .num{font-family:var(--display);color:var(--accent);font-size:1.2rem;min-width:1.2em;text-align:center}
.slotrow .got{font-family:var(--hand2);font-size:1.15rem;color:var(--muted)}
.slotrow .got.filled{color:var(--ink)}
.slotrow.ok{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.slotrow.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.slotrow.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.vrow{display:flex;flex-direction:column;gap:2px}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;perspective:800px}
.mc{position:relative;border:none;background:none;padding:0;min-height:98px}
.mc .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center}
.mc .f{background:var(--surface2);border:1.5px solid var(--line);background-image:radial-gradient(circle,rgba(169,195,59,.5) 1.5px,transparent 2px);background-size:14px 14px}
.mc .f::after{content:"?";font-family:var(--display);font-size:1.6rem;color:var(--c-wall)}
.mc .b{transform:rotateY(180deg);background:var(--surface);border:1.5px solid var(--ink);font-family:var(--hand2);font-size:1rem;line-height:1.15}
.mc .b.city{border-style:dashed;color:var(--petal)}
.mc .b svg{width:46px;height:30px}
.mc.done .b{border-color:var(--good);background:var(--good-bg)}
.memstat{font-family:var(--hand2);font-size:1.1rem;color:var(--muted)}

/* Wischen */
.swipe{position:relative;height:250px;border:1.5px dashed var(--line);border-radius:22px;overflow:hidden;touch-action:pan-y}
.swipe .side{position:absolute;top:10px;font-family:var(--hand);font-size:1.05rem;letter-spacing:.06em;padding:2px 10px;border-radius:999px;transition:opacity .15s,background .15s}
.swipe .side.l{left:10px;color:var(--good)} .swipe .side.r{right:10px;color:var(--c-mit)}
.swipe .side.on.l{background:var(--good);color:var(--accent-ink)} .swipe .side.on.r{background:var(--c-mit);color:var(--accent-ink)}
.scard{position:absolute;left:50%;top:50px;width:min(72%,260px);margin-left:calc(min(72%,260px) / -2);height:170px;border-radius:22px;background:var(--surface2);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.scard svg{width:96px;height:64px}
.scard .nm{font-family:var(--display);font-size:1.35rem;color:var(--petal);text-align:center;padding:0 8px}
.scard.fly{transition:transform .35s ease-in,opacity .35s}
.scard.back{transition:transform .25s}
.swfb{min-height:1.5em;font-family:var(--hand2);font-size:1.12rem;text-align:center}
.swfb.ok{color:var(--good)} .swfb.bad{color:var(--bad)}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.ok{background:var(--good);border-color:var(--good)} .dots i.bad{background:var(--bad);border-color:var(--bad)}

/* Gleichung */
.eqn{display:flex;flex-direction:column;align-items:center;gap:6px}
.eside{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.eqn .op{font-family:var(--display);font-size:1.4rem;color:var(--c-wall)}
.eqn .arrow{display:flex;align-items:center;gap:8px;font-family:var(--hand2);color:var(--sun);font-size:1rem;line-height:1}
.eqn .arrow span:first-child{font-family:var(--display);font-size:1.8rem;color:var(--c-wall)}
.eslot{min-width:110px;min-height:46px;border:1.5px dashed var(--muted);border-radius:14px;background:transparent;font-family:var(--hand2);font-size:1.1rem;padding:4px 10px}
.eslot.filled{border-style:solid;border-color:var(--ink);background:var(--surface2)}
.eslot.ok{border-color:var(--good);background:var(--good-bg)} .eslot.bad{border-color:var(--bad);background:var(--bad-bg)}
.side-lbl{font-family:var(--hand);font-size:.9rem;color:var(--muted);letter-spacing:.06em;width:100%;text-align:center}

/* Balance */
.sunrow{display:flex;align-items:center;gap:12px}
.sunrow svg{width:46px;height:46px;flex:none}
input[type=range]{width:100%;accent-color:var(--accent);height:34px}
.meter{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px;align-items:center;font-family:var(--hand2);font-size:1.08rem}
.meter .track{height:14px;border-radius:99px;border:1.5px solid var(--line);overflow:hidden;position:relative}
.meter .track i{position:absolute;top:0;bottom:0;left:0;border-radius:99px;transition:width .15s}
.div-track{height:18px;border-radius:99px;border:1.5px solid var(--line);position:relative;overflow:hidden}
.div-track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.7}
.div-track i{position:absolute;top:0;bottom:0;transition:all .15s}
.div-labels{display:flex;justify-content:space-between;font-family:var(--hand2);color:var(--muted)}
.live{font-family:var(--hand2);font-size:1.15rem;text-align:center;min-height:1.5em}

/* Bilder-Auswahl */
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pic{border:1.5px solid var(--line);background:transparent;border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pic svg{width:100%;height:auto}
.pic span{font-family:var(--hand2);font-size:1rem;color:var(--muted);min-height:1.3em}
.pic.ok{border-color:var(--good);background:var(--good-bg)} .pic.bad{border-color:var(--bad);background:var(--bad-bg)}
.bigpic{max-width:240px;align-self:center;width:70%}

/* Sortieren / Lupe */
.sortl{display:flex;flex-direction:column;gap:8px}
.sorti{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:transparent;border-radius:16px;padding:8px 12px;min-height:52px;text-align:left}
.sorti .badge{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center;font-family:var(--display);flex:none}
.sorti.on .badge{border-style:solid;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sorti .sz{margin-left:auto;font-family:var(--hand2);color:var(--muted)}
.sorti.ok{border-color:var(--good);background:var(--good-bg)} .sorti.bad{border-color:var(--bad);background:var(--bad-bg)}
.lupe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lupe button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:16px;padding:8px 10px;min-height:56px;font-family:var(--hand2);font-size:1.1rem;text-align:left}
.lupe button svg{width:40px;height:28px;flex:none}
.lupe button[aria-pressed="true"]{border-color:var(--accent);background:rgba(240,138,36,.15)}
.lupe button.ok{border-color:var(--good);background:var(--good-bg)} .lupe button.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Schreiben */
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input{flex:1 1 180px;min-width:0;font:inherit;font-size:1.2rem;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
.inp input.ok{border-color:var(--good);background:var(--good-bg)} .inp input.bad{border-color:var(--bad);background:var(--bad-bg)}
.sol{font-family:var(--hand2);font-size:1.35rem;letter-spacing:.02em}
.sol .x{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}

/* Ende */
.score{font-family:var(--display);font-size:3.4rem;line-height:1;color:var(--good)}
.score span{font-size:1.5rem;color:var(--muted)}
.stars{font-size:1.9rem;letter-spacing:.15em;color:var(--sun)}
.misslist{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}

/* Erkunden */
.info{display:flex;flex-direction:column;gap:8px}
.info h3{font-family:var(--display);font-size:1.4rem;color:var(--petal);display:flex;align-items:center;gap:10px}
.info h3 svg{width:48px;height:32px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-family:var(--hand2);font-size:1rem;border:1.5px dashed var(--line);border-radius:999px;padding:0 10px}
.fchip.plant{border-style:solid;border-color:var(--good);color:var(--good)}
/* Führerschein */
.licence{border:2px dashed var(--c-wall);background:linear-gradient(160deg,rgba(224,180,71,.10),rgba(46,43,39,.94) 45%)}
.lic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.passed{font-family:var(--display);color:var(--accent);border:3px solid var(--accent);border-radius:12px;padding:4px 10px;transform:rotate(-8deg);text-transform:uppercase;font-size:1.1rem;text-align:center;line-height:1.1}
.passed small{display:block;font-family:var(--hand2);font-size:.85rem;text-transform:none}
.lic-name{font-family:var(--hand);font-size:1.1rem;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.lic-name input{flex:1;min-width:0;font:inherit;font-family:var(--hand2);font-size:1.2rem;background:transparent;border:none;border-bottom:1.5px dashed var(--muted);color:var(--ink);padding:2px 4px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:6px;font-family:var(--hand2);font-size:.86rem;line-height:1.05;color:var(--muted);
  background:radial-gradient(circle,var(--surface) 62%,transparent 63%),conic-gradient(var(--good) calc(var(--p)*360deg),var(--line) 0)}
.stamp span{overflow-wrap:anywhere}
.stamp.got{background:var(--accent);color:var(--accent-ink);transform:rotate(-7deg);box-shadow:inset 0 0 0 3px var(--accent-ink),inset 0 0 0 5px var(--accent)}
/* Kapitel */
.chtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:6px}
.chtabs button{border:1.5px solid var(--line);background:rgba(46,43,39,.9);border-radius:20px;padding:10px 12px;text-align:left;font-family:var(--hand2);font-size:1.12rem;line-height:1.15;min-height:64px}
.chtabs button small{display:block;font-family:var(--hand);color:var(--c-wall);letter-spacing:.08em;font-size:.92rem}
.chtabs button[aria-pressed="true"]{border:2px solid var(--accent);background:rgba(240,138,36,.14)}
/* Skelett */
.skelwrap svg{max-height:420px}
.cellbox.fig svg{max-height:440px;margin-inline:auto}
.small-fig{max-width:200px;align-self:center;width:55%}
.spinebox svg{max-height:400px;width:100%;margin-inline:auto}
svg .org.glow{filter:drop-shadow(0 0 5px rgba(255,244,214,.8))}
svg .org.new{animation:glow 1.2s ease-in-out 3}
.xray{background:#0c1820;border-color:#2c4a5a}
svg.hidden-bones .org{opacity:.025}
.riddle{display:flex;gap:12px;align-items:flex-start;border:1.5px dashed var(--c-wall);border-radius:20px;padding:14px;background:rgba(224,180,71,.08)}
.riddle .q{font-family:var(--display);font-size:2.2rem;color:var(--accent);line-height:1}
.riddle p{font-family:var(--hand2);font-size:1.3rem;line-height:1.3;color:var(--petal)}
.paints{display:flex;gap:8px;flex-wrap:wrap}
.paint{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px 5px 6px;font-family:var(--hand2);font-size:1.1rem;min-height:44px}
.paint i{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink)}
.paint[aria-pressed="true"]{border:2px solid var(--ink);background:var(--surface2)}
.sortcard{border:2px solid var(--ink);border-radius:22px;background:var(--surface2);min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;text-align:center;position:relative}
.sortcard p{font-family:var(--display);font-size:1.3rem;color:var(--petal);line-height:1.25}
.sortcard .cnt{position:absolute;top:8px;right:14px;font-family:var(--hand2);color:var(--muted)}
.sortcard.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.9);opacity:.3}}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.buckets .opt{text-align:center;font-family:var(--hand2);font-size:1.15rem}
.lockwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.padlock{width:100px;height:auto}
.padlock #shk{transition:transform .5s}
.padlock.open #shk{transform:translateY(-16px) rotate(-12deg);transform-origin:90px 62px;stroke:var(--good)!important}
.padlock.nope{animation:shake .4s}
.wheels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:18px;padding:6px 8px;min-width:76px}
.wheel button{border:none;background:var(--surface2);border-radius:10px;width:52px;height:38px;font-size:1rem;color:var(--ink)}
.wheel output{font-family:var(--display);font-size:2rem;color:var(--petal);min-width:1.6em;text-align:center}
.wheel span{font-family:var(--hand2);color:var(--muted);font-size:1rem}
.bauk{display:flex;flex-direction:column;gap:12px}
.steppers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--hand2);font-size:1.05rem;border:1.5px solid var(--line);border-radius:16px;padding:6px 2px}
.stepper div{display:flex;flex-direction:column;align-items:center;gap:4px}
.stepper button[data-d="1"]{order:-1}
.stepper button[data-d="-1"]{order:1}
.stepper>span{font-size:.92rem;white-space:nowrap}
.stepper button{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;width:42px;height:42px;font-size:1.4rem;color:var(--ink)}
.stepper output{font-family:var(--display);font-size:1.5rem;min-width:1.6em;text-align:center;color:var(--petal)}
.lt{font-size:1.08rem;line-height:2.3}
.lt .gap{border:none;border-bottom:2px dashed var(--muted);background:transparent;font-family:var(--hand2);font-size:1.12rem;padding:0 6px;min-width:64px;border-radius:6px 6px 0 0}
.lt .gap.filled{border-bottom-style:solid;border-color:var(--ink);background:var(--surface2)}
.lt .gap.act{border-color:var(--accent);background:rgba(240,138,36,.18)}
.lt .gap.ok{background:var(--good-bg);border-color:var(--good)} .lt .gap.bad{background:var(--bad-bg);border-color:var(--bad);text-decoration:line-through}
.lt .fix{font-family:var(--hand2);color:var(--good);margin-left:4px}
.lupe.one{grid-template-columns:1fr}
.stossbox svg{display:block;max-width:240px;margin-inline:auto;width:100%;height:auto}
.stack .vb,.stack .dsc{transform-box:fill-box}
.stack .dsc{transform-origin:center}
.stack.jump .vb{animation:dropv .7s ease-in-out}
.stack.jump .dsc{animation:squash .7s ease-in-out}
@keyframes dropv{45%{transform:translateY(var(--dy))}}
@keyframes squash{45%{transform:scaleY(.45)}}
.stack.nodisc.jump{animation:shake .4s}
svg .spark{opacity:0}
svg .stack.nodisc.jump~.spark{animation:spark .5s}
@keyframes spark{20%,60%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const s=stage();$('#stats').innerHTML=`<span class="pill">Blätter <b>${SKILLS.filter(k=>lv(k)>0).length}/${SKILLS.length}</b></span><span class="pill">Blüte <b>${s.full}/${SKILLS.length}</b></span><span class="pill">Stempel <b>${MKS.filter(k=>lv(k)>=4).length}/${MKS.length}</b></span>`;
}
function masteryGrid(list){return list.map(k=>`<button class="m" type="button" data-k="${k}" aria-pressed="false"><span>${esc(SK_NAME[k])}</span><span class="pips">${[1,2,3,4,5].map(i=>`<i class="${lv(k)>=i?'on':''}"></i>`).join('')}</span></button>`).join('');}
function start(){
  R=null;renderStats();window.scrollTo(0,0);
  const scr=$('#screen');scr.innerHTML='';
  const tabs=document.createElement('nav');tabs.className='chtabs';tabs.setAttribute('aria-label','Kapitel');
  tabs.innerHTML=Object.entries(CH).map(([k,c])=>`<button type="button" data-ch="${k}" aria-pressed="${S.ch===k}"><small>${c.n}</small>${esc(c.t)}</button>`).join('');
  scr.appendChild(tabs);
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.ch=b.dataset.ch;save();start();});
  if(S.ch==='skelett')startSkelett(scr);else startZelle(scr);
  settingsPanel(scr);
}

function bindTabs(){document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>explore(b.dataset.ex));$('#back').onclick=start;}
function explore(kind,view){
  window.scrollTo(0,0);
  const scr=$('#screen');
  if(kind==='skelett'){
   view=view||'body';

   <p class="instr">Tippe auf einen Knochen oder Teil.</p><div class="cellbox fig${view==='spine'?' spinebox':''}" id="cb"></div><div class="info" id="info"></div></section>`;

   bindTabs();
   const C=makeScope();$('#cb').appendChild(C.svg);
   const show=k=>{C.svg.classList.add('sel-on');MKP.forEach(x=>C.G[x].classList.toggle('sel',x===k));document.querySelectorAll('#ech .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
     $('#info').innerHTML=`<h3>${esc(M[k].n)}</h3><p>${esc(M[k].nom)} ${esc(M[k].fn)}.</p>${M[k].ab?`<p class="small">Arbeitsblatt: „${esc(M[k].ab)}“</p>`:''}`;};
   MKP.forEach(k=>C.G[k].addEventListener('click',()=>show(k)));document.querySelectorAll('#ech .chip').forEach(b=>b.onclick=()=>show(b.dataset.k));show('mk_okular');
   return;

  scr.innerHTML=`<div class="topbar"><span>Zelle erkunden</span><button class="ghost" type="button" id="back">Zurück</button></div>

}

/* =================== RUNDE PLANEN =================== */
let R=null;
const ORGT=[['finde_n',0,2],['benenne',0,5],['aufgabe',0,5],['wer',1,5],['wahr',1,5],['finde_f',2,5],['finde_c',3,5],['schreib',3,5],['beschriften',1,5],['verbinde',1,5],['memory',2,5]];
const TOPT={vergleich:[['swipe',0],['wahr',0],['mc',1]],foto:[['gleichung',0],['wahr',0],['mc',0],['balance',2]],atmung:[['gleichung',0],['wahr',0],['mc',0],['balance',2]],wasser:[['predict',0],['zustand',1],['wahr',0],['mc',0]],mikro:[['lupe',0],['sortiere',1],['wahr',0],['mc',0]]};
const MULTI=new Set(['beschriften','verbinde','memory','swipe','lupe','sortiere','m_beschriften','m_verbinde','m_reihe']);
const MKT=[['m_finde_n',0,2],['m_benenne',0,5],['m_funktion',0,5],['m_finde_f',1,5],['m_verbinde',0,5],['m_beschriften',1,5],['m_schreib',3,5]];
TOPT.mk_vergr=[['m_vergr',0],['wahr',0],['mc',1]];TOPT.mk_umgang=[['m_reihe',0],['wahr',0],['mc',0]];
const BT=[['b_finde_n',0,2],['b_benenne',0,5],['b_raetsel',0,5],['wahr',1,5],['b_finde_f',1,5],['b_beschriften',1,5],['b_roentgen',2,5],['b_schreib',3,5]];
Object.assign(TOPT,{sk_aufbau:[['malbuch',0],['sorter',0],['schloss',0],['luecke',1],['wahr',0],['mc',0]],sk_funktion:[['sorter',0],['luecke',0],['wahr',0],['mc',0]],sk_schaedel:[['schaedelreg',0],['schaedelauf',0],['luecke',1],['wahr',0],['mc',0]],sk_wirbel:[['spfinde',0],['spreihe',0],['schloss',0],['baukasten',1],['spmemory',2],['luecke',1],['wahr',0],['mc',1]],sk_bau:[['querfinde',0],['stoss',0],['luecke',0],['wahr',0],['mc',0]],sk_modell:[['biege',0],['luecke',1],['wahr',0],['mc',0]]});
['malbuch','sorter','b_beschriften','spmemory','stoss','biege','baukasten','luecke','schaedelauf','spreihe'].forEach(t=>MULTI.add(t));
function typesFor(k){
  const L=lv(k);
  if(B[k])return BT.filter(t=>L>=t[1]&&L<=t[2]&&(t[0]!=='wahr'||TF.some(f=>f[0]===k))).map(t=>t[0]);
  if(M[k])return MKT.filter(t=>L>=t[1]&&L<=t[2]).map(t=>t[0]);
  if(O[k])return ORGT.filter(t=>L>=t[1]&&L<=t[2]&&(t[0]!=='wahr'||TF.some(f=>f[0]===k))).map(t=>t[0]);
  return TOPT[k].filter(t=>L>=t[1]&&(t[0]!=='wahr'||TF.some(f=>f[0]===k))&&(t[0]!=='mc'||MC.some(f=>f[0]===k))&&(t[0]!=='luecke'||LT.some(f=>f[0]===k))).map(t=>t[0]);
}
function pickWeighted(arr,w){const tot=arr.reduce((s,a)=>s+w(a),0);let r=Math.random()*tot;for(const a of arr){r-=w(a);if(r<=0)return a;}return arr[arr.length-1];}
function pickOrgs(n,must){const rest=shuffle(ORG.filter(k=>k!==must));rest.sort((a,b)=>lv(a)-lv(b)+(Math.random()-.5)*2);return shuffle([must,...rest.slice(0,n-1)]);}
function planRound(gs){
  const pool=[...new Set((gs||S.groups).flatMap(g=>GROUPS[g].sk))];
  const out=[],used={},recent=[];let lastT=null;const usedTF=new Set(),usedMC=new Set();
  for(let i=0;i<S.len;i++){
    const cand=pool.filter(k=>!recent.includes(k));const k=pickWeighted(cand.length?cand:pool,k=>Math.pow(6-lv(k),2)+.5);
    recent.push(k);if(recent.length>Math.min(3,pool.length-1))recent.shift();
    let types=typesFor(k).filter(t=>!(MULTI.has(t)&&used[t]));
    if(!types.length)types=['wahr'].filter(()=>TF.some(f=>f[0]===k));
    if(!types.length)types=B[k]?['b_benenne']:M[k]?['m_benenne']:O[k]?['benenne']:[TOPT[k][0][0]];
    const t=pickWeighted(types,t=>Math.max(.08,1-(t===lastT?.85:0)-.35*(used[t]||0)));
    used[t]=(used[t]||0)+1;lastT=t;
    out.push(makeSpec(t,k,usedTF,usedMC));
  }
  return out;
}
function makeSpec(t,k,usedTF,usedMC){
  const sp={t,k};
  if(t==='wahr'){const c=TF.filter(f=>f[0]===k);const f=rnd(c.filter(x=>!usedTF.has(x))||c)||rnd(c);sp.f=f||rnd(c);usedTF.add(sp.f);}
  if(t==='mc'){const c=MC.filter(f=>f[0]===k);const f=rnd(c.filter(x=>!usedMC.has(x)))||rnd(c);sp.f=f;usedMC.add(f);}
  if(t==='beschriften')sp.ks=pickOrgs(5,k);
  if(t==='verbinde'){sp.ks=pickOrgs(4,k);sp.mode=lv(k)>=3&&Math.random()<.5?'city':'fn';}
  if(t==='memory')sp.ks=pickOrgs(6,k);
  if(t==='swipe'){const pl=shuffle(ORG.filter(x=>O[x].plant)).slice(0,2+(Math.random()<.5?1:0));sp.ks=shuffle([...pl,...shuffle(ORG.filter(x=>!O[x].plant)).slice(0,6-pl.length)]);}
  if(t==='gleichung'||t==='balance')sp.v=t==='balance'?rnd(['gleich','auf','ab']):null;
  if(t==='predict')sp.f=rnd(WSC);
  if(t==='zustand')sp.f=rnd(Object.keys(WSTATE));
  if(t==='lupe'){const vis=shuffle(['zellwand','zellkern','vakuole','chloroplast']).slice(0,3),no=shuffle(['ribosom','er','golgi','mitochondrium']).slice(0,3);sp.ks=shuffle([...vis,...no]);}
  if(t==='sortiere'){let pick;do{pick=shuffle(SIZES).slice(0,4).sort((a,b)=>a[2]-b[2]);}while(pick.some((x,i)=>i&&x[2]/pick[i-1][2]<3));sp.items=shuffle(pick);}
  if(t==='b_beschriften')sp.ks=B[k].fig==='skull'?shuffle(BSKULL):shuffle([k,...sameFig(k,4)]);
  if(t==='sorter'){sp.set=k==='sk_funktion'?'funktion':'aufbau';const all=shuffle(SORTSETS[sp.set].items),pick=[];Object.keys(SORTSETS[sp.set].cats).forEach(c=>pick.push(all.find(x=>x[1]===c)));all.forEach(x=>{if(pick.length<(sp.set==='funktion'?6:7)&&!pick.includes(x))pick.push(x);});sp.items=shuffle(pick);}
  if(t==='schloss')sp.v=k==='sk_aufbau'?'knochen':rnd(['abschnitte','abschnitte','einzeln']);
  if(t==='baukasten'){do{sp.start=[3+Math.random()*8|0,3+Math.random()*8|0,3+Math.random()*8|0];}while(sp.start.join()==='7,12,5');}
  if(t==='spfinde'){sp.tg=rnd(SPK);sp.mode=lv(k)>=2&&Math.random()<.6?'q':'n';}
  if(t==='luecke')sp.f=rnd(LT.filter(l=>l[0]===k));
  if(t==='schaedelreg')sp.tg=rnd(['hirn','gesicht']);
  if(t==='schaedelauf')sp.items=shuffle([...shuffle(SKAUF.filter(x=>x[1])).slice(0,3),...shuffle(SKAUF.filter(x=>!x[1])).slice(0,3)]);
  if(t==='querfinde')sp.tg=rnd(['wirbel','bandscheibe','rueckenmark']);
  if(t==='m_beschriften')sp.ks=pickParts(5,k);
  if(t==='m_verbinde')sp.ks=pickParts(4,k,true);
  if(t==='m_reihe'){const idx=shuffle(STEPS.map((_,i)=>i)).slice(0,5).sort((a,b)=>a-b);sp.items=shuffle(idx);}
  if(t==='m_vergr'){sp.v=rnd(['rechne','stelle']);sp.ok=sp.v==='rechne'?rnd([10,10,5,15]):10;sp.ob=rnd([4,10,40]);}
  return sp;
}

/* Bewertung. per = {skill:true/false} für Mehrfach-Aufgaben */
function grade(sp,ok,html,per,opts){
  opts=opts||{};
  const first=!sp.retry;
  if(first){
    const apply=(k,good)=>{const L=lv(k);S.lv[k]=good?Math.min(5,L+1):(opts.soft?L:Math.max(1,L-2));};
    if(per)Object.entries(per).forEach(([k,g])=>apply(k,g));else apply(sp.k,ok);
    if(ok){R.right++;R.streak++;}else R.streak=0;
    save();
  }else if(ok)R.streak++;
  if(!ok){buzz([40,40,40]);if(first&&opts.sum)R.missed.push(opts.sum);
    if(first&&!MULTI.has(sp.t)&&sp.t!=='balance'){R.q.push(Object.assign({},sp,{retry:true}));}}
  else buzz(15);
  const cb=$('#cb');
  const fb=document.createElement('div');fb.className='fb '+(ok?'ok':'bad');fb.setAttribute('role','status');
  fb.innerHTML=html+(!ok&&first&&!MULTI.has(sp.t)&&sp.t!=='balance'?'<span class="ex">Diese Aufgabe kommt am Ende der Runde noch einmal.</span>':'');
  cb.appendChild(fb);
  const nx=document.createElement('button');nx.className='next';nx.type='button';nx.textContent=R.i+1>=R.q.length?'Zum Ergebnis':'Weiter';
  nx.onclick=()=>{R.i++;task();};cb.appendChild(nx);
  setTimeout(()=>{try{nx.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},60);
  renderStats();
}

 luecke(cb,sp){
  const [k,text,dis]=sp.f;const {parts,gaps}=parseLT(text);const tiles=shuffle([...gaps.map(g=>g.a),...dis]);const fill=new Array(gaps.length).fill(null);let act=0,done=false;
  H(cb,`<p class="prompt">Ergänze den Merktext.</p><p class="instr">Tippe auf eine Lücke und dann auf das passende Wort. Ohne Auswahl füllst du die nächste freie Lücke.</p><p class="lt" id="lt"></p><div class="pool" id="pool"></div><button class="check" id="chk" type="button" disabled>Prüfen</button>`);

    $('#lt').innerHTML=parts.map(p=>p.t!=null?esc(p.t):`<button type="button" class="gap${fill[p.gap]!=null?' filled':''}${act===p.gap&&!done?' act':''}${res?(res[p.gap]?' ok':' bad'):''}" data-g="${p.gap}">${fill[p.gap]!=null?esc(tiles[fill[p.gap]]):'&nbsp;…&nbsp;'}</button>${res&&!res[p.gap]?`<span class="fix">${esc(gaps[p.gap].a)}</span>`:''}`).join('');

    $('#lt').querySelectorAll('.gap').forEach(b=>b.onclick=()=>{if(done)return;const g=+b.dataset.g;if(fill[g]!=null&&act===g){fill[g]=null;}act=g;draw();});
    $('#pool').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{let g=act;if(g==null||fill[g]!=null)g=fill.indexOf(null);if(g<0)return;fill[g]=+b.dataset.t;const nx=fill.indexOf(null);act=nx<0?null:nx;buzz(5);draw();});

    const n=res.filter(Boolean).length;draw();

  draw();
 },

 schaedelauf(cb,sp){

 stoss(cb,sp){
  let disc=true;const tried={an:0,aus:0};
  H(cb,`<p class="prompt">Stoßdämpfer-Test</p><p class="instr">Lass die Wirbelsäule springen – einmal mit und einmal ohne Bandscheiben. Was passiert?</p>
   <div class="chips" id="dt"><button class="chip" type="button" data-v="an" aria-pressed="true">mit Bandscheiben</button><button class="chip" type="button" data-v="aus" aria-pressed="false">ohne Bandscheiben</button></div>
   <div class="cellbox stossbox"><svg id="ss" viewBox="0 0 220 250" aria-hidden="true"></svg></div><button class="go" id="jump" type="button" style="align-self:center">Springen!</button><p class="live" id="sl"></p><div id="q"></div>`);
  const s=$('#ss');

    const ys=disc?[18,94,170]:[40,96,152];

    if(disc)[74,150].forEach(y=>el('rect',{x:54,y,width:82,height:20,rx:7,class:'dsc',style:'fill:var(--c-vac);stroke:var(--c-vac-d);stroke-width:1.5'},g));
    el('rect',{x:30,y:228,width:160,height:8,rx:4,style:'fill:var(--line)'},s);
    if(!disc)[[140,96],[140,152]].forEach(([x,y])=>{const k=el('g',{class:'spark'},s);el('path',{d:`M${x+4},${y-8} l12,-6 M${x+4},${y} l16,0 M${x+4},${y+8} l12,6 M${50-4},${y-8} l-12,-6 M${46},${y} l-16,0 M${46},${y+8} l-12,6`,style:'stroke:var(--bad);stroke-width:3;stroke-linecap:round'},k);});

    tried[disc?'an':'aus']=1;$('#sl').textContent=disc?'Federt sanft ab – die Bandscheiben werden kurz zusammengedrückt.':'Autsch! Knochen stoßen direkt aufeinander.';$('#sl').style.color=disc?'var(--good)':'var(--bad)';buzz(disc?20:[60,30,60]);
    if(tried.an&&tried.aus&&!$('#q').children.length){const opts=shuffle(['Sie federn Stöße ab wie Stoßdämpfer.','Sie stellen das Blut her.','Sie bewegen die Muskeln.','Sie schützen das Gehirn.']);

      choices($('#q'),opts,opts.indexOf('Sie federn Stöße ab wie Stoßdämpfer.'),esc,ok=>{$('#jump').disabled=true;grade(sp,ok,`<strong>${ok?praise():'Nicht ganz.'}</strong><span>Die Bandscheiben aus <b>Knorpel</b> liegen zwischen den Wirbeln. Sie federn Stöße ab und machen die Wirbelsäule beweglich.</span>`,null,{sum:'Bandscheiben (Knorpel) zwischen den Wirbeln federn Stöße ab.'});});}
    else if(!(tried.an&&tried.aus))$('#sl').textContent+=` Jetzt probier es ${disc?'ohne':'mit'} Bandscheiben!`;};
 },
 biege(cb,sp){
  H(cb,`<p class="prompt">Papprollen-Versuch</p><p class="instr">Wie auf deinem Arbeitsblatt 4.3.2: Modell 1 hat viele Schnitte, Modell 2 keine. Zieh am Regler und biege beide Rollen.</p>
   <div class="cellbox"><svg id="rv" viewBox="0 0 300 270" aria-hidden="true"></svg></div>
   <input type="range" id="bend" min="0" max="100" value="0" aria-label="Biegen"><p class="live" id="bl">Noch nicht gebogen</p><div id="q"></div>`);
  const s=$('#rv');let asked=false;
  const draw=b=>{s.innerHTML='';
    // Modell 1: Segmente

    for(let i=0;i<n;i++){const g=el('g',{transform:`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(a*180/Math.PI).toFixed(1)})`},s);

    const l1=el('text',{x:80,y:258,'text-anchor':'middle',class:'lab',style:'font-size:16px'},s);l1.textContent='Modell 1';
    const l2=el('text',{x:220,y:258,'text-anchor':'middle',class:'lab',style:'font-size:16px'},s);l2.textContent='Modell 2';
  };

  $('#bend').oninput=e=>{const b=e.target.value/100;draw(b);$('#bl').textContent=b<.15?'Noch nicht gebogen':b<.7?'Modell 1 biegt sich – Modell 2 bleibt steif.':'Modell 1 biegt sich weit – Modell 2 knickt!';
    if(b>=.7&&!asked){asked=true;const opts=['Modell 1 (mit Schnitten)','Modell 2 (ohne Schnitte)'];
      H($('#q'),`<p class="prompt" style="margin-bottom:8px">Welches Modell ist unserer Wirbelsäule am ähnlichsten?</p>`);
      choices($('#q'),opts,0,esc,ok=>{$('#bend').disabled=true;grade(sp,ok,`<strong>${ok?praise():'Nicht ganz.'}</strong><span>Modell 1 – wie die Wirbelsäule besteht es aus vielen einzelnen Teilen (<b>Wirbeln</b>), die beweglich verbunden sind. Dazwischen liegen <b>Bandscheiben</b>.</span><span class="ex">Darum ist es wichtig: So können wir uns bücken, drehen und beugen. Aus einem einzigen Knochen wäre unser Rücken steif wie Modell 2.</span>`,null,{sum:'Papprollen-Versuch: Die Rolle mit Schnitten (viele einzelne Wirbel) ist beweglich wie unsere Wirbelsäule.'});},'two');}};
 }

/* Mini-Zellen für Wasser-Aufgaben */
function mini(s){
  const p=s==='plasmo'?{x:34,y:30,w:52,h:40,r:16}:{x:11,y:11,w:98,h:78,r:8};
  const vf=s==='prall'?1:s==='welk'?.62:.5;const vw=(p.w-22)*vf,vh=(p.h-18)*vf,vx=p.x+14+(p.w-22-vw)/2,vy=p.y+9+(p.h-18-vh)/2;
  const arrows=s==='prall'?`<g style="stroke:var(--c-vac-d);stroke-width:2.5;stroke-linecap:round"><path d="M60,${vy} v-7 m-3,3 l3,-3 l3,3"/><path d="M60,${vy+vh} v7 m-3,-3 l3,3 l3,-3"/><path d="M${vx},50 h-7 m3,-3 l-3,3 l3,3"/><path d="M${vx+vw},50 h7 m-3,-3 l3,3 l-3,3"/></g>`:'';
  return `<svg viewBox="0 0 120 100" aria-hidden="true"><rect x="8" y="8" width="104" height="84" rx="10" style="fill:${s==='plasmo'?'var(--salt)':'var(--c-cyto)'}"/>
   <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.r}" style="fill:var(--c-cyto);stroke:var(--c-mem);stroke-width:2"/>
   <rect x="${vx.toFixed(1)}" y="${vy.toFixed(1)}" width="${vw.toFixed(1)}" height="${vh.toFixed(1)}" rx="${(Math.min(vw,vh)*.35).toFixed(1)}" style="fill:var(--c-vac);stroke:var(--c-vac-d);stroke-width:1.5"/>
   ${arrows}<circle cx="${p.x+8}" cy="${p.y+p.h/2}" r="5" style="fill:var(--c-nuc)"/>
   <rect x="6" y="6" width="108" height="88" rx="12" style="fill:none;stroke:var(--c-wall);stroke-width:5"/></svg>`;
}

/* =================== ENDE =================== */
function end(){
  renderStats();window.scrollTo(0,0);
  const n=R.first,r=R.right,pct=Math.round(r/n*100);S.rounds++;S.best=Math.max(S.best,pct);save();
  const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  const sk=R.ch==='skelett';
  const msg=pct===100?(sk?'Alles richtig – dein Skelett strahlt!':'Alles richtig – deine Pflanze strahlt!'):pct>=80?'Sehr gut gemacht!':pct>=50?'Gut! Was noch wackelt, kommt in der nächsten Runde öfter dran.':'Dranbleiben – morgen sitzt es schon besser.';
  let info='',fig=null;
  if(sk){const up=SKALL.filter(k=>lv(k)>(R.before[k]||0));info=up.length?`<p class="small">Heller geworden: ${up.map(k=>esc(SK_NAME[k])).join(', ')}.</p>`:'<p class="small">Diesmal ist nichts heller geworden – nicht aufgeben!</p>';fig=()=>progressBody(new Set(up)).svg;}
  else{const grown=new Set(SKILLS.filter(k=>lv(k)>(R.before[k]||0)));
    const newSt=MKS.filter(k=>lv(k)>=4&&(R.before[k]||0)<4),mkUp=MKS.filter(k=>lv(k)>(R.before[k]||0));
    info=`${grown.size||!mkUp.length?`<p class="small">${grown.size?`Gewachsen: ${[...grown].map(k=>esc(SK_NAME[k])).join(', ')}.`:'Diesmal ist kein Blatt gewachsen – nicht aufgeben!'}</p>`:''}
     ${mkUp.length?`<p class="small">Führerschein: ${newSt.length?`neue Stempel für <b>${newSt.map(k=>esc(SK_NAME[k])).join(', ')}</b>!`:`sicherer geworden bei ${mkUp.map(k=>esc(SK_NAME[k])).join(', ')}.`} Stempel: ${MKS.filter(k=>lv(k)>=4).length}/${MKS.length}</p>`:''}`;
    if(grown.size||!mkUp.length)fig=()=>plantSVG(grown).svg;}
  $('#screen').innerHTML=`<section class="panel"><div class="lbl">Runde geschafft</div>
   <div class="row" style="justify-content:space-between;align-items:flex-end"><div class="score">${r}<span> / ${n}</span></div><div class="stars" aria-label="${stars} von 3 Sternen">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div></div>
   <h2>${msg}</h2>${info}
   ${fig?'<div id="pl" style="max-width:220px;align-self:center;width:60%"></div>':''}
   ${R.missed.length?`<div><div class="lbl" style="margin-bottom:6px">Das schaust du dir am besten noch mal an</div><ul class="misslist">${R.missed.map(m=>`<li>${m}</li>`).join('')}</ul></div>`:''}
   <div class="row"><button class="go" type="button" id="again">Neue Runde</button><button class="ghost" type="button" id="home">Startseite</button></div></section>`;
  if(fig)$('#pl').appendChild(fig());
  $('#again').onclick=()=>startRound(R.gs);$('#home').onclick=start;
}
