<title>Gemeinsam stark</title>
<style>
/* Ethik · Gemeinsam stark: das Thema Gewalt für Klasse 5.
   Jedes Kapitel ist ein Pfad aus kurzen Karten: auf eine kurze Info folgt immer gleich eine Aktion
   (Sortieren, Stimmt/Stimmt nicht, Was tust du?, Klassenchat, Rollenspiel zum Anhören, Ich-Botschaft, Klassenvertrag).

:root{color-scheme:light dark}

/* ================= Vorlesen (Sprachausgabe des Geräts) =================
   Robust für iPhone und Android:
   - Handys sprechen erst nach dem ersten Antippen der Seite. Beim ersten Tipp wird die Sprachausgabe mit einem
     stummen Satz „aufgeweckt“; vorher wird nicht automatisch vorgelesen (sonst verschluckt das Handy den Text).
   - Nur Stimmen, die auf dem Gerät liegen (localService): Online-Stimmen brechen lange Texte ab oder bleiben stumm.
   - Lange Texte werden in Sätze geteilt, jeder Satz ist eine eigene Ansage.
   - Nach cancel() kurz warten, bevor neu gesprochen wird (sonst geht die neue Ansage oft verloren).
   - Die Ansage wird festgehalten (sonst räumt iOS sie weg und onend kommt nie), und ein Zeitlimit
     sorgt dafür, dass Geschichten auch weiterlaufen, wenn das Gerät kein onend meldet. */
const TTS={ok:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window,v:null,run:0,keep:null,awake:false,err:0,warned:false};
function pickVoices(){if(!TTS.ok)return;const all=speechSynthesis.getVoices()||[];
  let vs=all.filter(v=>/^de([-_]|$)/i.test(v.lang));const dd=vs.filter(v=>/de[-_]DE/i.test(v.lang));if(dd.length)vs=dd;
  const loc=vs.filter(v=>v.localService);if(loc.length)vs=loc;
  TTS.v=vs.find(v=>/anna|petra|helena|katja|marlene|vicki/i.test(v.name))||vs.find(v=>v.default)||vs[0]||null}
if(TTS.ok){pickVoices();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",pickVoices);else speechSynthesis.onvoiceschanged=pickVoices}
function wake(){if(!TTS.ok||TTS.awake)return;TTS.awake=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;u.lang="de-DE";TTS.keep=u;speechSynthesis.speak(u)}catch(e){}
  pickVoices()}
["touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,wake,{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(document.hidden)hush()});
const talking=()=>TTS.ok&&(speechSynthesis.speaking||speechSynthesis.pending);
function stopNow(){if(talking()){speechSynthesis.cancel();TTS.cut=Date.now()}}
function hush(){TTS.run++;stopNow();document.querySelectorAll(".spk.on").forEach(b=>b.classList.remove("on"))}
/* Sätze, höchstens ~180 Zeichen pro Ansage */
function chunks(t){const out=[];(t.match(/[^.!?…]+[.!?…]*["“”»«„]?\s*/g)||[t]).forEach(s=>{s=s.trim();if(!s)return;
  while(s.length>180){let k=s.lastIndexOf(", ",180);if(k<60)k=s.lastIndexOf(" ",180);if(k<1)k=180;out.push(s.slice(0,k+1));s=s.slice(k+1).trim()}
  if(s)out.push(s)});
  /* sehr kurze Stücke an das vorige hängen */
  return out.reduce((a,s)=>{if(a.length&&(a[a.length-1].length+s.length<120))a[a.length-1]+=" "+s;else a.push(s);return a},[])}
/* spricht einen Text; o = {pitch, rate}; onend kommt auch bei Fehlern, damit Abfolgen weiterlaufen */
function speak(text,o,onend){if(typeof o==="function"){onend=o;o={}}o=o||{};
  if(!TTS.ok){if(onend)setTimeout(onend,0);return false}
  const id=++TTS.run,parts=chunks(plain(text));let k=0;
  const done=()=>{if(id===TTS.run&&onend)onend()};
  const one=()=>{if(id!==TTS.run)return;if(k>=parts.length){done();return}
    const u=new SpeechSynthesisUtterance(parts[k++]);u.lang="de-DE";if(TTS.v)u.voice=TTS.v;
    u.rate=Math.min(1.4,S.rate*(o.rate||1));u.pitch=o.pitch||1.05;TTS.keep=u;
    let fired=false,started=false;
    const fin=e=>{if(fired)return;fired=true;clearTimeout(wd);
      if(e&&e.type==="error"&&!/interrupted|canceled/.test(e.error||"")){TTS.err++;if(!started&&TTS.err>=2&&!TTS.warned){TTS.warned=true;toast("Vorlesen klappt gerade nicht. Ist der Ton an?")}}
      else if(started)TTS.err=0;
      one()};
    u.onstart=()=>{started=true;TTS.lastStart=Date.now()};u.onend=fin;u.onerror=fin;
    const wd=setTimeout(fin,2500+u.text.length*110/u.rate);
    if(speechSynthesis.paused)speechSynthesis.resume();
    speechSynthesis.speak(u)};
  stopNow();const wait=90-(Date.now()-(TTS.cut||0));wait>0?setTimeout(one,wait):one();
  return true}
/* Vorlese-Knopf: spricht, solange er leuchtet; nochmal tippen stoppt */
function spkBtn(getText){const b=document.createElement("button");b.className="spk";b.type="button";b.setAttribute("aria-label","Vorlesen");b.innerHTML=I.spk;
  b.onclick=()=>{if(b.classList.contains("on")){hush();return}hush();wake();b.classList.add("on");speak(getText(),()=>b.classList.remove("on"))};return b}
/* automatisch vorlesen nur, wenn die Seite schon einmal angetippt wurde */
const canAuto=()=>S.auto&&TTS.ok&&TTS.awake;
function autoSay(text,btn){if(!canAuto())return;if(btn)btn.classList.add("on");speak(text,()=>{if(btn)btn.classList.remove("on")})}

/* kurze Töne für richtig/falsch */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function beep(fs,len,type,vol){const a=ac();if(!a)return;let t=a.currentTime+.02;fs.forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type=type||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02);t+=len*.75})}

 {k:"scene",chat:"Klasse 5b 💬",h:"Im Klassenchat",lines:[

 {k:"read",art:"📸",ey:"Wichtig",h:"Das Recht am eigenen Bild",p:"Jeder Mensch darf selbst bestimmen, ob ein Foto oder Video von ihm verschickt oder gepostet wird. Frag also immer vorher: „Darf ich das Foto teilen?“"},

 {k:"order",q:"Jemand beleidigt dich im Chat. Tipp die Schritte in der richtigen Reihenfolge an.",items:["Nicht zurückschreiben oder zurückbeleidigen","Screenshot machen als Beweis","Die Person blockieren oder melden","Einem Erwachsenen den Screenshot zeigen"],

{id:"loesen",t:"Gewaltfrei Streit lösen",d:"Ich-Botschaften, Streitschlichtung und ein Rollenspiel",ico:"🤝",

 steps:[
 {k:"read",art:"🤝",ey:"Los geht's",h:"Streiten – aber fair",p:"Ein Streit kann gut ausgehen, wenn beide sagen, was sie stört, ohne den anderen anzugreifen. Ein wichtiges Werkzeug dafür ist die Ich-Botschaft."},
 {k:"read",art:"🙋",ey:"Zwei Arten zu sprechen",h:"Du-Botschaft oder Ich-Botschaft?",tiles:[
   ["👉","Du-Botschaft","„Du bist so gemein! Immer machst du alles kaputt!“ – greift an, der andere wehrt sich.","r"],
   ["🙋","Ich-Botschaft","„Ich bin traurig, wenn du mein Bild zerknickst. Ich wünsche mir, dass du vorsichtig bist.“ – sagt, wie es mir geht.","g"]]},
 {k:"sort",q:"Ich-Botschaft oder Du-Botschaft?",cats:["ich","du"],items:[
   {h:"„Ich ärgere mich, wenn du mich unterbrichst.“",c:"ich",e:"💬",why:"Sie sagt, wie es mir geht und was mich stört."},
   {h:"„Du nervst total!“",c:"du",e:"💬",why:"Ein Vorwurf an den anderen – eine Du-Botschaft."},
   {h:"„Ich bin traurig, wenn ich nicht mitspielen darf.“",c:"ich",e:"💬",why:"Gefühl und Grund – eine Ich-Botschaft."},
   {h:"„Immer musst du alles bestimmen!“",c:"du",e:"💬",why:"„Immer“ und „du musst“ greifen an."},
   {h:"„Ich bin wütend, weil du meinen Stift genommen hast. Bitte frag mich vorher.“",c:"ich",e:"💬",why:"Gefühl, Grund und Wunsch: eine perfekte Ich-Botschaft."}]},
 {k:"read",art:"🧱",ey:"Baukasten",h:"So baust du eine Ich-Botschaft",tiles:[
   ["1️⃣","Gefühl","Ich bin … / Ich fühle mich …"],

   ["3️⃣","Wunsch","Ich wünsche mir, dass …"]]},
 {k:"build",ctx:"Ben nimmt dir in der Pause immer wieder den Ball weg.",q:"Bau deine Ich-Botschaft für Ben.",parts:[

   {lab:"2 · Was macht Ben?",pre:", wenn du",opts:["mir den Ball wegnimmst","mich nicht fragst","weiterspielst, obwohl ich Stopp sage"]},

  resp:"Super, das ist eine echte Ich-Botschaft! Ben erfährt, wie es dir geht, ohne dass du ihn beleidigst. So hört er viel eher zu."},
 {k:"mc",ctx:"Sofia hat heimlich in Leas Tagebuch gelesen.",q:"Welche Ich-Botschaft passt am besten für Lea?",opts:[

   {h:"„Du bist so eine Spionin!“",fb:"Das ist eine Du-Botschaft. Sie greift an, und Sofia wehrt sich wahrscheinlich."},

  why:"Gefühl + was passiert ist + Wunsch: So versteht Sofia, was Lea verletzt hat."},
 {k:"read",art:"⚖️",ey:"Streitschlichtung",h:"Hilfe von Streitschlichtern",p:"An vielen Schulen gibt es Streitschlichter: ausgebildete Schülerinnen und Schüler, die bei Streit helfen. Sie halten zu niemandem, sie helfen beiden. Und was besprochen wird, bleibt unter euch."},
 {k:"order",q:"Bring die Schritte der Streitschlichtung in die richtige Reihenfolge.",items:["Regeln klären: ausreden lassen, nicht beleidigen","Beide erzählen nacheinander, was passiert ist","Beide sagen, wie sie sich fühlen","Gemeinsam Lösungen sammeln","Auf eine Lösung einigen und sie abmachen"],
  why:"Erst die Regeln, dann zuhören, dann Gefühle, dann Lösungen – und am Ende eine Abmachung, mit der beide zufrieden sind."},

   {w:"Emil",t:"Ey, das ist mein Platz! Ich war zuerst da!"},
   {w:"Mia",t:"Gar nicht, ich sitz hier schon seit Montag!"},

   {h:"„Selber nervig! Hau ab!“",fb:"So beleidigen sich beide gegenseitig, und der Streit wird größer."},
   {h:"Emil den Stuhl wegziehen",fb:"Das ist körperliche Gewalt – und Emil könnte sich verletzen."},
   {h:"Wortlos gehen und wochenlang nicht mehr mit Emil reden",fb:"Verständlich, aber so ist der Streit nicht gelöst. Morgen geht er weiter."}]}},
 {k:"scene",h:"So kann es weitergehen",lines:[
   {w:"Mia",t:"Ich bin sauer, wenn du mich nervig nennst. Wollen wir uns abwechseln? Eine Woche du, eine Woche ich?"},

 {k:"tf",s:"Bei einem Streit sollte man den anderen ausreden lassen.",ok:true,why:"Ja. Wer ausreden darf, fühlt sich ernst genommen – dann hört er auch eher zu."},
 {k:"read",art:"⭐",ey:"Merk dir",h:"Das Wichtigste",merk:"Ich-Botschaft statt Du-Botschaft: „Ich bin …, wenn du … Ich wünsche mir, dass …“ Streitschlichter helfen beiden, eine Lösung zu finden."}

let R=null;
/* Sortier-Aufgaben werden zu einzelnen Schritten, damit nach jeder Situation eine Rückmeldung kommt */
function expand(steps){const out=[];steps.forEach(s=>{
  if(s.k==="sort"){const its=shuffle(s.items);its.forEach((it,i)=>out.push({k:"cat",q:s.q,cats:s.cats,it,i,n:its.length}))}
  else out.push(s)});return out}
const GRADED=s=>["mc","tf","cat","multi","order","pad"].includes(s.k)||(s.k==="scene"&&s.ask);
function mixSteps(){const pool=[];CH.forEach(c=>{if(!c.mix)expand(c.steps).forEach(s=>{if(["mc","tf","cat","multi"].includes(s.k))pool.push(s)})});
  /* höchstens 2 Situationen aus derselben Sortier-Aufgabe */
  const per={},out=[];for(const s of shuffle(pool)){const key=s.k==="cat"?s.cats.join():null;if(key){per[key]=(per[key]||0)+1;if(per[key]>2)continue}out.push(s.k==="cat"?Object.assign({},s,{i:null}):s);if(out.length>=12)break}
  return out}
function startRound(id){hush();const c=chOf(id);
  R={id,i:0,res:[],steps:c.mix?mixSteps():expand(c.steps)};
  R.graded=R.steps.filter(GRADED).length;R.ok=0;R.miss=0;showStep()}
function track(){$("#track").innerHTML=R.steps.map((s,i)=>{const r=R.res[i];return `<i class="${r===true?"ok":r===false?"no":r==="done"?"done":i===R.i?"now":""}"></i>`}).join("")}

    <section class="stage" id="cb"></section>`;
  $("#quit").onclick=home;$("#hb").onclick=helpCard;track();return $("#cb")}
function showStep(){hush();const t=R.steps[R.i];R.locked=false;const cb=frame();
  (RENDER[t.k]||RENDER.read)(t,cb);scrollTo(0,0)}
function next(){R.i++;R.i>=R.steps.length?endRound():showStep()}

function dock(cb,label,fn){const d=document.createElement("div");d.className="dock";const b=document.createElement("button");b.className="go";b.type="button";b.textContent=label||"Weiter";

function feedback(ok,html,sayText,graded){if(R.locked)return;R.locked=true;
  if(graded!==false){R.res[R.i]=ok;if(ok)R.ok++;else R.miss++;ok?sfxOk():sfxBad()}else{R.res[R.i]="done";sfxOk()}
  track();

  const extra=[];

    box.innerHTML=t.cats.map(c=>`<button class="opt" data-c="${c}"><span class="e">${ART[c].e}</span><span>${ART[c].h}</span></button>`).join("");cb.appendChild(box);
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const ok=b.dataset.c===it.c;
      box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.c===it.c)x.classList.add("ok")});if(!ok)b.classList.add("bad");
      feedback(ok,`<strong>${ok?PRAISE():"Nicht ganz"}</strong><p>Das ist <b>${ART[it.c].h}</b>. ${it.why||""}</p>`)});
    autoSay(it.h,sb)},

  /* alle richtigen antippen */
  multi(t,cb){const sb=qhead(cb,t.q);const order=shuffle(t.opts.map((o,i)=>i));const sel=new Set();
    const box=document.createElement("div");box.className="opts";
    box.innerHTML=order.map(i=>`<button class="opt" data-i="${i}" aria-pressed="false">${t.opts[i].e?`<span class="e">${t.opts[i].e}</span>`:""}<span>${t.opts[i].h}</span></button>`).join("");cb.appendChild(box);
    const chk=document.createElement("button");chk.className="go check";chk.type="button";chk.textContent="Prüfen";chk.disabled=true;cb.appendChild(chk);
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle("sel",sel.has(i));b.setAttribute("aria-pressed",sel.has(i));chk.disabled=!sel.size;sfxPling()});
    chk.onclick=()=>{if(R.locked)return;let err=0;
      box.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i,o=t.opts[i],s=sel.has(i);b.disabled=true;b.classList.remove("sel");
        if(o.ok&&s)b.classList.add("ok");else if(!o.ok&&s){b.classList.add("bad");err++}else if(o.ok&&!s){b.classList.add("miss");err++}});
      chk.remove();const ok=!err;
      feedback(ok,`<strong>${ok?PRAISE():"Fast"}</strong>${!ok?`<p>Richtig sind: ${t.opts.filter(o=>o.ok).map(o=>o.h).join(" · ")}</p>`:""}<p>${t.why}</p>`)};
    autoSay(t.q,sb)},

  /* Reihenfolge antippen */
  order(t,cb){const sb=qhead(cb,t.q);const mix=(()=>{let m;do{m=shuffle(t.items.map((x,i)=>i))}while(m.every((v,i)=>v===i));return m})();const seq=[];
    const box=document.createElement("div");box.className="opts";cb.appendChild(box);
    const chk=document.createElement("button");chk.className="go check";chk.type="button";chk.textContent="Prüfen";chk.disabled=true;cb.appendChild(chk);
    const draw=()=>{box.innerHTML=mix.map(i=>{const p=seq.indexOf(i);return `<button class="opt ${p>=0?"sel":""}" data-i="${i}"><span class="num">${p>=0?p+1:""}</span><span>${t.items[i]}</span></button>`}).join("");
      box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const i=+b.dataset.i,p=seq.indexOf(i);if(p>=0)seq.splice(p);else seq.push(i);sfxPling();draw()});
      chk.disabled=seq.length<t.items.length};
    draw();cb.insertAdjacentHTML("beforeend",`<p class="small">Tippst du eine Nummer nochmal an, wird sie wieder frei.</p>`);
    chk.onclick=()=>{if(R.locked)return;const ok=seq.every((v,i)=>v===i);
      box.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const i=+b.dataset.i;b.classList.remove("sel");b.classList.add(seq.indexOf(i)===i?"ok":"bad")});chk.remove();
      feedback(ok,`<strong>${ok?PRAISE():"Nicht ganz"}</strong>${!ok?`<p>So ist die Reihenfolge:</p><ol>${t.items.map(x=>`<li>${x}</li>`).join("")}</ol>`:""}<p>${t.why}</p>`)};
    autoSay(t.q,sb)},

  /* Nummer eintippen */
  pad(t,cb){const sb=qhead(cb,t.q);let typed="";
    cb.insertAdjacentHTML("beforeend",`<div class="phone" id="ph" aria-live="polite">☎️</div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="del" aria-label="Löschen">${I.del}</button><button data-k="0">0</button><button class="ok" data-k="ok" disabled>OK</button></div>`);
    const show=()=>{$("#ph").textContent=typed?typed.replace(/^(\d{3})(\d)/,"$1 $2"):"☎️";cb.querySelector(".kp .ok").disabled=!typed};
    cb.querySelectorAll(".kp button").forEach(b=>b.onclick=()=>{if(R.locked)return;const k=b.dataset.k;
      if(k==="ok"){const ok=typed===t.ans;$("#ph").classList.add(ok?"ok":"bad");cb.querySelectorAll(".kp button").forEach(x=>x.disabled=true);
        feedback(ok,`<strong>${ok?PRAISE():"Nicht ganz"}</strong><p>Die Nummer gegen Kummer ist <b>116 111</b>. ${t.why}</p>`,"Die Nummer gegen Kummer ist eins eins sechs, eins eins eins. "+t.why);return}
      if(k==="del")typed=typed.slice(0,-1);else if(typed.length<8)typed+=k;
      beep([440+(+k||0)*40],.06,"sine",.05);show()});
    autoSay(t.q,sb)},

  /* Gefühle – ohne Richtig oder Falsch */
  feel(t,cb){const sb=qhead(cb,t.q);if(t.ctx)cb.insertAdjacentHTML("beforeend",`<p class="small">${t.ctx}</p>`);else cb.insertAdjacentHTML("beforeend",`<p class="small">Tipp an, was passt. Hier gibt es kein Richtig oder Falsch.</p>`);
    const sel=new Set();const box=document.createElement("div");box.className="opts g2";
    box.innerHTML=FEEL.map((f,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"><span class="e">${f[0]}</span><span>${f[1]}</span></button>`).join("");cb.appendChild(box);
    const chk=document.createElement("button");chk.className="go check";chk.type="button";chk.textContent="Fertig";chk.disabled=true;cb.appendChild(chk);
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle("sel",sel.has(i));b.setAttribute("aria-pressed",sel.has(i));chk.disabled=!sel.size;sfxPling()});
    chk.onclick=()=>{box.querySelectorAll(".opt").forEach(b=>b.disabled=true);chk.remove();
      const names=[...sel].map(i=>FEEL[i][1]);
      feedback(true,`<strong>Danke!</strong><p>Du hast gewählt: ${names.join(", ")}.</p><p>${t.resp}</p>`,null,false)};
    autoSay(t.q,sb)},

  /* Ich-Botschaft bauen */
  build(t,cb){cb.insertAdjacentHTML("beforeend",`<div class="sit"><span class="e" aria-hidden="true">⚽</span><span>${t.ctx}</span></div>`);
    const sb=qhead(cb,t.q,t.ctx+" "+t.q);const ch=t.parts.map(()=>null);
    const pv=document.createElement("div");pv.className="preview";cb.appendChild(pv);
    const sentence=()=>t.parts.map((p,i)=>p.pre+" "+(ch[i]!=null?p.opts[ch[i]]:"…")).join(" ").replace(/ ,/g,",").replace(/ \./g,".")+".";
    const drawPv=()=>{pv.innerHTML=t.parts.map((p,i)=>`${p.pre} <span class="${ch[i]!=null?"fill":"gap"}">${ch[i]!=null?esc(p.opts[ch[i]]):""}</span>`).join(" ").replace(/ ,/g,",").replace(/ \. /g,". ")+"."};
    t.parts.forEach((p,i)=>{const d=document.createElement("div");d.className="part";d.innerHTML=`<span class="lab">${p.lab}</span><div class="chips">${p.opts.map((o,j)=>`<button class="chip" data-j="${j}" aria-pressed="false">${o}</button>`).join("")}</div>`;cb.appendChild(d);
      d.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(R.locked)return;ch[i]=+b.dataset.j;d.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));drawPv();sfxPling();chk.disabled=ch.some(x=>x==null)})});
    const chk=document.createElement("button");chk.className="go check";chk.type="button";chk.textContent="Fertig";chk.disabled=true;cb.appendChild(chk);
    drawPv();
    chk.onclick=()=>{const s=sentence();S.ich=s;save();chk.remove();cb.querySelectorAll(".chip").forEach(b=>b.disabled=true);
      feedback(true,`<strong>Deine Ich-Botschaft</strong><p class="quote">„${esc(s)}“</p><p>${t.resp}</p><p class="small">Gespeichert unter „Meine Sachen“.</p>`,s+" "+t.resp,false)};
    autoSay(t.ctx+" "+t.q,sb)},

  /* Klassenvertrag */
  vertrag(t,cb){const sb=qhead(cb,t.q,t.q+". "+t.p);const sel=new Set(S.vertrag?S.vertrag.r.map(r=>RULES.indexOf(r)).filter(i=>i>=0):[]);
    cb.insertAdjacentHTML("beforeend",`<p>${t.p}</p>`);
    const box=document.createElement("div");box.className="rules";
    box.innerHTML=RULES.map((r,i)=>`<button class="rule" data-i="${i}" aria-pressed="${sel.has(i)}"><span class="box">${I.tick}</span><span>${r}</span></button>`).join("");cb.appendChild(box);
    cb.insertAdjacentHTML("beforeend",`<label class="part"><span class="lab">Unterschrift (dein Name)</span><input class="field" id="sig" maxlength="24" autocomplete="off" value="${esc(S.vertrag?S.vertrag.n:spitzname())}"></label><p class="small" id="vcount"></p>`);
    const chk=document.createElement("button");chk.className="go check";chk.type="button";chk.textContent="Unterschreiben";cb.appendChild(chk);
    const upd=()=>{const n=sel.size;$("#vcount").textContent=n<4?`Noch ${4-n} ${4-n===1?"Regel":"Regeln"} auswählen.`:`${n} Regeln ausgewählt.`;chk.disabled=n<4||!$("#sig").value.trim()};
    box.querySelectorAll(".rule").forEach(b=>b.onclick=()=>{if(R.locked)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.setAttribute("aria-pressed",sel.has(i));sfxPling();upd()});
    $("#sig").oninput=upd;upd();
    chk.onclick=()=>{const d=new Date();S.vertrag={r:[...sel].sort((a,b)=>a-b).map(i=>RULES[i]),n:$("#sig").value.trim(),d:d.toLocaleDateString("de-DE")};save();
      R.res[R.i]="done";track();sfxOk();certView(next)};
    autoSay(t.q+". "+t.p,sb)},

  /* Gespräch oder Klassenchat */
  scene(t,cb){
    const sc=document.createElement("div");sc.className="scene"+(t.chat?" chat":"");
    let body=sc;
    if(t.chat){sc.innerHTML=`<div class="chathead"><span class="ava">5b</span><span><b>${t.chat}</b><small>Malik, Paul, Lea, Emil, Hanna, du</small></span></div><div class="chatbody"></div>`;body=sc.querySelector(".chatbody")}
    else cb.insertAdjacentHTML("beforeend",`<span class="ey">${t.ask?"Hör zu":"Geschichte"}</span>`);
    cb.insertAdjacentHTML("beforeend",`<div class="qh"><b>${t.h}</b></div>`);
    cb.appendChild(sc);
    const ctl=document.createElement("div");ctl.className="row";cb.appendChild(ctl);
    const skip=document.createElement("button");skip.className="ghost skip";skip.type="button";skip.textContent="Alles zeigen";ctl.appendChild(skip);
    const run=++SCN;let i=0,finished=false;
    const lineEl=l=>{if(l.n){const p=document.createElement("p");p.className="nar";p.textContent=l.n;return p}
      const c=who(l.w);
      const b=document.createElement("button");b.type="button";b.className="ln"+(l.think?" think":"");
      b.innerHTML=`<span class="ava" style="background:${c.c}">${l.w[0]}</span><span class="bub"><span class="who" style="color:${c.c}">${l.w}${l.think?" denkt":""}</span>${l.photo?`<span class="photo"><span class="e">📷</span>${l.photo}</span>`:l.voice?`<span class="voice">${I.spk.replace('<svg','<svg width="18" height="18"')}<span>Sprachnachricht ${l.voice}</span></span><span class="small">„${esc(l.t)}“</span>`:esc(l.t)}</span>`;
      b.setAttribute("aria-label",l.w+": "+(l.photo||l.t));
      b.onclick=()=>{hush();sayLine(l)};return b};
    const sayLine=(l,cb2)=>{if(l.n)return speak(l.n,{pitch:1},cb2);if(l.photo)return speak(l.w+" schickt ein Foto. "+l.photo,{pitch:1},cb2);const c=who(l.w);return speak(l.t,{pitch:c.p,rate:l.think?.95:1},cb2)};
    const els=[];
    const finish=()=>{if(finished)return;finished=true;skip.remove();
      while(i<t.lines.length){const e=lineEl(t.lines[i++]);body.appendChild(e);els.push(e)}
      els.forEach(e=>e.classList.remove("now"));
      const again=document.createElement("button");again.className="ghost";again.type="button";again.innerHTML=I.spk+"<span>Nochmal hören</span>";ctl.appendChild(again);
      again.onclick=()=>{hush();let j=0;const go=()=>{if(j>=t.lines.length){els.forEach(e=>e.classList.remove("now"));return}els.forEach(e=>e.classList.remove("now"));els[j].classList.add("now");sayLine(t.lines[j++],()=>setTimeout(go,250))};go()};
      if(t.ask)askAfter(t,cb);else dock(cb)};
    const step=()=>{if(run!==SCN||finished)return;if(i>=t.lines.length){finish();return}
      const l=t.lines[i++];
      const show=()=>{if(run!==SCN||finished)return;const e=lineEl(l);body.appendChild(e);els.push(e);els.forEach(x=>x.classList.remove("now"));e.classList.add("now");
        if(t.chat&&!l.n)sfxPling();e.scrollIntoView({block:"nearest",behavior:"smooth"});
        const len=plain(l.n||l.photo||l.t).length;
        if(canAuto())sayLine(l,()=>setTimeout(step,300));else setTimeout(step,900+len*35)};
      if(t.chat&&!l.n){const ty=document.createElement("div");ty.className="typing";ty.innerHTML="<i></i><i></i><i></i>";body.appendChild(ty);setTimeout(()=>{ty.remove();show()},650)}else show()};
    skip.onclick=()=>{hush();finish()};
    step()},
};
let SCN=0;
/* Frage nach einer Szene */
function askAfter(t,cb){const a=t.ask;const sb=qhead(cb,a.q);const order=shuffle(a.opts.map((o,i)=>i));
  const box=document.createElement("div");box.className="opts";
  box.innerHTML=order.map(i=>`<button class="opt" data-i="${i}">${a.opts[i].h}</button>`).join("");cb.appendChild(box);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const o=a.opts[+b.dataset.i];
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(a.opts[+x.dataset.i].ok&&(o.ok?x===b:true))x.classList.add("ok")});if(!o.ok)b.classList.add("bad");
    const good=a.opts.find(x=>x.ok);
    feedback(!!o.ok,`<strong>${o.ok?PRAISE():"Nicht ganz"}</strong>${!o.ok&&!o.fb?`<p>Besser: ${good.h}</p>`:""}<p>${o.fb||a.why}</p>${!o.ok&&o.fb?`<p>Besser: ${good.h}</p>`:""}${o.ok&&o.fb&&a.why?`<p>${a.why}</p>`:""}`)});
  sb.scrollIntoView({block:"start",behavior:"smooth"});
  autoSay(a.q,sb)}

/* Klassenvertrag als Urkunde */
function certView(after){hush();const v=S.vertrag;if(!v){after();return}const inRound=!!R&&after!==home;
  app.innerHTML=`${inRound?"":`<div class="row"><button class="ghost" id="cbk">${I.back}<span>Alle Kapitel</span></button></div>`}
    <div class="cert"><span class="ey" style="text-align:center">Gemeinsam stark</span><h2>📜 Unser Klassenvertrag</h2>
      <ol>${v.r.map(r=>`<li>${esc(r)}</li>`).join("")}</ol>
      <div class="sign"><div>${esc(v.n)}<br><span>Unterschrift</span></div><div style="text-align:right">${esc(v.d)}<br><span>Datum</span></div></div></div>
    <div class="row" id="crow"></div>
    ${inRound?`<p class="small">Gespeichert! Du findest ihn jederzeit unter „Meine Sachen“. Vielleicht wollt ihr so einen Vertrag ja auch in deiner Klasse machen?</p>`:""}`;
  const say="Unser Klassenvertrag. "+v.r.join(" ")+" Unterschrieben von "+v.n+".";
  const b=document.createElement("button");b.className="ghost";b.type="button";b.innerHTML=I.spk+"<span>Vorlesen</span>";b.onclick=()=>speak(say);$("#crow").appendChild(b);
  if(inRound){beep([523.25,659.25,783.99],.16);dock(app,"Weiter",after);if(canAuto())speak(say)}
  else $("#cbk").onclick=after;
  scrollTo(0,0)}

function endRound(){hush();const n=R.graded,ok=R.ok,q=n?ok/n:1;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[R.id]=Math.max(S.best[R.id]||0,st);save();
  const c=chOf(R.id),k=CH.indexOf(c),nxt=CH[k+1];
  const cheer=["Dranbleiben, das wird!","Gut gemacht!","Stark!","Super, du kennst dich aus!"][st];
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    <p class="lead"><b>${ok} von ${n}</b> Fragen richtig</p>
    <div class="panel"><b>Das nimmst du mit:</b><ul>${c.merk.map(m=>`<li>${m}</li>`).join("")}</ul><div class="row" id="mrow"></div></div>
    <button class="helpbtn" id="help"><span class="h">${I.heart}</span><span><b>Brauchst du Hilfe?</b><span>Nummer gegen Kummer 116 111 · kostenlos</span></span></button>
    ${nxt&&st>=2?`<button class="go" id="nx">Weiter: ${nxt.t}</button>`:""}
    <button class="${nxt&&st>=2?"ghost":"go"}" id="again">Nochmal machen</button>
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  const id=R.id;R=null;
  $("#mrow").appendChild(spkBtn(()=>c.merk.join(" ")));
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;$("#help").onclick=helpCard;if($("#nx"))$("#nx").onclick=()=>startRound(nxt.id);
  scrollTo(0,0)}

/* Lernwelt: direkt ins Kapitel (gewalt.html#mobbing …), Anker stehen in hefte.js */
function kapitelSprung(){const id=location.hash.slice(1);if(!chOf(id))return false;startRound(id);return true}
// Kam Nea über ein Kapitel der Lernwelt, führt „Alle Kapitel/Startseite“ zurück zur Heft-Seite
window.lwStart?lwStart('home',kapitelSprung):(kapitelSprung()||home());
</script>
<script>/* Lernwelt: Kapitel-Fortschritt für die Startseite (siehe sync.js) */
if(window.LW&&LW.kapitel){
LW.kapitel(function(){
  return CH.map(function(c){return {t:c.t,p:(S.best[c.id]||0)/3}});
});
