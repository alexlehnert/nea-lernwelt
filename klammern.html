<!doctype html><html lang="de"><head><meta charset=utf8><script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/sync.js"></script><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lernwelt"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5B3FE6"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Klammer-Profi</title>
<style>
/* Klammer-Profi: Rechengesetze für den GLN (Buch S. 85–105).
   Plus-/Minusklammer, Subtrahenden zusammenfassen, Umstellen, Punkt vor Strich, Faktoren-Partner,
   Ausmultiplizieren, Ausklammern mit Tricks (Faktor 1, Quadrat, versteckter Faktor), Fehler finden, Regeln in Worten.
   Aufbau wie rechengesetze.html: Regelheft zum Lesen, dann Runden mit Sternen, Klassenchat, Probe-GLN.
   Farben und Schriften kommen aus lernwelt-app.css (hell und dunkel). */
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--lw-bg);color:var(--lw-ink);font-family:var(--lw-f-b);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--lw-f-d);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.6rem}
h3{font-size:1.15rem}
p{margin:0}
b{font-weight:700}
sup{font-size:.6em;line-height:0;position:relative;top:-.15em;vertical-align:super}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--lw-brand);outline-offset:2px}
svg{display:block}
.small{font-size:.88rem;color:var(--lw-muted)}
.lead{font-size:1.05rem}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.panel{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lw-ma)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px}
.ghost svg,.go svg{width:18px;height:18px;flex:none}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* Startseite */
.hero{display:flex;flex-direction:column;gap:8px}
.lawchips{display:flex;gap:8px;flex-wrap:wrap}
.lawchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--lw-ma-s);color:var(--lw-ma);font:700 .95rem/1.1 var(--lw-f-d)}
.stations{display:flex;flex-direction:column;gap:12px}
.st{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px;border-radius:22px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px}
.st:active{transform:translateY(3px);border-bottom-width:2px}
.st .ico{width:56px;height:56px;flex:none;border-radius:16px;background:var(--lw-ma-s);color:var(--lw-ma);display:grid;place-items:center;font:700 1.25rem/1 var(--lw-f-d)}
.st .ico svg{width:30px;height:30px}
.st h3{font-size:1.12rem}
.st p{font-size:.9rem;color:var(--lw-muted);line-height:1.3;margin-top:2px}
.st .n{font:700 12px var(--lw-f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--lw-ma)}
.stars{display:flex;gap:2px;margin-top:6px}
.stars svg{width:20px;height:20px}
.st.read .ico{background:var(--lw-sun);color:#5B3A00}
.seen{display:inline-block;margin-top:6px;font-size:.82rem;font-weight:700;color:var(--lw-ok-ink);background:var(--lw-ok-bg);padding:2px 10px;border-radius:99px}

/* Merkseite (Regelheft) */
.chead{display:flex;align-items:center;gap:12px}
.backb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px 6px 10px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-muted)}
.backb svg{width:18px;height:18px}
.law{gap:12px}
.lawhead{display:flex;align-items:center;gap:12px}
.lawhead .badge{width:52px;height:52px;flex:none;border-radius:16px;background:var(--lw-ma);color:#fff;display:grid;place-items:center;font:700 1.4rem/1 var(--lw-f-d)}
.lawhead .badge sup{font-size:.6em}
.lawhead h3{font-size:1.2rem}
.lawhead .small{margin-top:2px}
/* wie im Regelheft: Regel im roten Kasten */
.formel{align-self:center;border:3px solid #D94A3A;border-radius:10px;padding:8px 18px;font:700 clamp(1.35rem,6.5vw,1.8rem)/1.2 var(--lw-f-d);white-space:nowrap;background:var(--lw-card)}
.bsp{font:600 1.1rem/1.5 var(--lw-f-d);font-variant-numeric:tabular-nums}
.bsp .k{font:400 .85rem var(--lw-f-b);color:var(--lw-muted);display:block}
.worte{border-left:5px solid var(--lw-ma);padding:4px 0 4px 12px}
.worte .wl{display:block;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--lw-ma)}
.meta{background:var(--lw-soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.meta .mt{display:flex;gap:10px;align-items:flex-start}
.meta .em{font-size:1.9rem;line-height:1}
.meta .mt b{display:block;font-family:var(--lw-f-d);font-size:1.05rem}
.falle{background:var(--lw-bad-bg);color:var(--lw-ink);border-radius:18px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.falle .em{font-size:1.6rem;line-height:1}
.falle s{color:var(--lw-bad-ink);text-decoration-thickness:3px}
.falle b.r{color:var(--lw-ok-ink)}
.words{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:4px 6px;align-items:end;text-align:center;font:700 1.6rem/1 var(--lw-f-d)}
.words small{font:700 .72rem/1.2 var(--lw-f-b);color:var(--lw-ma);letter-spacing:.04em;display:block;margin-top:6px}

/* Demo: Murmeln tauschen */
.lz{white-space:nowrap}
.demo,.zrow,.gline{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.demo{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--lw-card);border-radius:16px;padding:12px}
.demo .go{width:100%}
.bags{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.bag{flex:1;max-width:150px;border:2px solid var(--lw-line);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--lw-card)}
.bag b{font:700 1.8rem/1 var(--lw-f-d)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:110px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.demo .sumline{font:700 1.5rem/1.2 var(--lw-f-d);font-variant-numeric:tabular-nums}
.pl{font:700 1.6rem/1 var(--lw-f-d);color:var(--lw-muted)}

/* Klammer = Gondel */
.gline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font:700 clamp(1.5rem,7.5vw,2.1rem)/1.2 var(--lw-f-d);font-variant-numeric:tabular-nums}
.gon{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 6px;border-radius:14px 14px 18px 18px;background:var(--lw-ma-s);border:3px solid var(--lw-ma);position:relative;transition:background .2s}
.gon::before{content:"";position:absolute;left:50%;top:-12px;width:3px;height:10px;background:var(--lw-ma);transform:translateX(-50%)}
.gon .br{color:var(--lw-ma)}
.steps{font:600 1.1rem/1.5 var(--lw-f-d);text-align:center;font-variant-numeric:tabular-nums}
.plus{min-width:44px;min-height:44px;border-radius:12px;border:2px dashed var(--lw-ma);background:none;color:var(--lw-ma);font:700 1em/1 var(--lw-f-d);padding:0 4px}
.plus.in{border-style:solid;background:var(--lw-ma);color:#fff}

/* Runde */
.topbar{display:flex;align-items:center;gap:12px}
.track{flex:1;display:flex;gap:4px}
.track i{flex:1;height:12px;border-radius:99px;background:var(--lw-line)}
.track i.ok{background:var(--lw-ok)}
.track i.no{background:var(--lw-bad)}
.track i.now{background:var(--lw-ma)}
.q{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.q b{display:block;font:700 1.3rem/1.2 var(--lw-f-d)}
.q .lk{flex:none;padding:4px 10px;border-radius:99px;background:var(--lw-ma-s);color:var(--lw-ma);font:700 .95rem/1.2 var(--lw-f-d)}
.stage{display:flex;flex-direction:column;gap:14px}
.show{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.eq{font:700 clamp(1.5rem,7.5vw,2.3rem)/1.25 var(--lw-f-d);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 .3em;font-variant-numeric:tabular-nums}
.slot{display:inline-grid;place-items:center;min-width:1.6em;min-height:1.25em;padding:0 .2em;border-radius:12px;border:2px dashed var(--lw-ma);background:var(--lw-ma-s);color:var(--lw-ma);font-variant-numeric:tabular-nums;white-space:nowrap}
.slot.full{border-style:solid}
.slot.ok{border-color:var(--lw-ok);background:var(--lw-ok-bg);color:var(--lw-ok-ink)}
.slot.bad{border-color:var(--lw-bad);background:var(--lw-bad-bg);color:var(--lw-bad-ink)}
.sub{font-size:.95rem;color:var(--lw-muted)}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{width:100%;padding:10px 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-variant-numeric:tabular-nums}
.opt:disabled{cursor:default}
.opt sup{font-size:.6em}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:54px;border-radius:16px;border:2px solid var(--lw-line);border-bottom-width:5px;background:var(--lw-card);font:700 1.5rem/1 var(--lw-f-d);color:var(--lw-ink);display:grid;place-items:center}
.kp button:active{transform:translateY(3px);border-bottom-width:2px}
.kp button:disabled{opacity:.45}
.kp .del{color:var(--lw-muted)}
.kp .del svg{width:26px;height:26px}
.kp .ok{background:var(--lw-ma);border-color:var(--lw-ma-d);color:#fff;font-size:1.15rem;letter-spacing:.04em}
.fb .big{font:700 1.4rem/1.3 var(--lw-f-d);color:var(--lw-ink);font-variant-numeric:tabular-nums}
.fb p{margin-top:4px}
.lw-sheet .ghost{width:100%;min-height:50px}

/* Zahlenkärtchen zum Ziehen */
.zrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font:700 clamp(1.5rem,7.5vw,2.1rem)/1 var(--lw-f-d)}
.zt{min-width:72px;min-height:64px;padding:6px 12px;border-radius:18px;border:3px solid var(--lw-ma);border-bottom-width:6px;background:var(--lw-card);color:var(--lw-ink);font:700 1em/1 var(--lw-f-d);font-variant-numeric:tabular-nums;touch-action:none;position:relative;transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .15s,border-color .15s}
.zt.drag{transition:none;z-index:50;box-shadow:0 10px 24px rgba(30,27,58,.25);cursor:grabbing}
.zt.sel{background:var(--lw-ma);color:#fff;border-color:var(--lw-ma-d)}
.zt.over{background:var(--lw-sun);border-color:#D99A00;color:#3A2600}
.zt.shake{animation:shake .4s}
.zt.pop{animation:pop .45s}
.zt.ten{border-color:var(--lw-ok);background:var(--lw-ok-bg);color:var(--lw-ok-ink)}
.zt:disabled{cursor:default}
.op{color:var(--lw-muted)}
#pz{gap:6px;font-size:clamp(1.3rem,6.4vw,1.8rem)}
#pz .zt{min-width:58px;padding:6px 8px}
.res{min-width:1.6em}
.res.q{color:var(--lw-muted)}
.res.diff{color:var(--lw-bad-ink)}
.res.same{color:var(--lw-ok-ink)}
.before{font:600 1.05rem/1.3 var(--lw-f-d);color:var(--lw-muted);font-variant-numeric:tabular-nums}
.hint{font-size:.95rem;color:var(--lw-muted);display:flex;align-items:center;gap:6px;justify-content:center}
.hint svg{width:22px;height:22px;flex:none;color:var(--lw-ma)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Ergebnis */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:64px;height:64px}
.bigstars .s1{animation:pop .5s .1s both}.bigstars .s2{animation:pop .5s .35s both}.bigstars .s3{animation:pop .5s .6s both}
.result .go,.result .ghost{width:100%}
.missed{align-self:stretch;text-align:left}
.missed ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chatbox{min-width:0}

/* Klammer-Profi: Schritt-für-Schritt-Rechnungen und Ausdrücke */
.calc{font:600 1.15rem/1.6 var(--lw-f-d);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-start;background:var(--lw-card);border-radius:16px;padding:10px 14px}
.calc span{opacity:1;transition:opacity .25s}
.calc span.off{display:none}
.calc .note{font:400 .85rem/1.3 var(--lw-f-b);color:var(--lw-muted);margin-left:.6em}
.calc .hl{color:var(--lw-ma);font-weight:700}
.pair2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair2 .calc{font-size:1rem}
.pair2 b.who{font:700 .8rem var(--lw-f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--lw-ma)}
.tbl{display:flex;flex-wrap:wrap;gap:8px}
.tbl span{padding:6px 12px;border-radius:12px;background:var(--lw-ma-s);color:var(--lw-ma);font:700 1.05rem/1.2 var(--lw-f-d);font-variant-numeric:tabular-nums}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:700 1rem/1.2 var(--lw-f-d)}
.order span.o{padding:6px 10px;border-radius:12px;background:var(--lw-ma);color:#fff}
.wrong{color:var(--lw-bad-ink)}
.eq.sm{font-size:clamp(1.2rem,5.6vw,1.8rem)}
.eq .lz{display:inline-flex;align-items:center;gap:.3em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
/* ================= Grundlagen ================= */
const $=s=>document.querySelector(s);
const app=$("#app");
const rand=n=>Math.floor(Math.random()*n);
const rnd=(a,b)=>a+rand(b-a+1);
const pick=a=>a[rand(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const notTen=(a,b)=>{let n;do{n=rnd(a,b)}while(n%10===0);return n};
const sq=a=>`${a}<sup>2</sup>`;
const cube=a=>`${a}<sup>3</sup>`;
/* Antwortoptionen ohne doppelte Texte */
const uniq=opts=>opts.filter((o,i,a)=>a.findIndex(x=>x.h===o.h)===i);

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function beep(fs,len,type,vol){const a=ac();if(!a)return;let t=a.currentTime+.02;fs.forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type=type||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02);t+=len*.75})}
const sfxOk=()=>beep([1046.5,1318.5],.14);
const sfxBad=()=>beep([233,175],.18,"triangle",.12);
const sfxPop=()=>beep([784],.08,"sine",.12);

/* ================= Bausteine für Aufgaben ================= */
const eqShow=(left,slotRight)=>`<div class="eq">${left}${slotRight===false?"":`<span>=</span><span class="slot" id="slot">?</span>`}</div>`;
const kpTask=(o)=>Object.assign({kind:"kp"},o);
const mcTask=(o)=>Object.assign({kind:"mc"},o);
const yesNo=(ok)=>[{h:"Stimmt",ok:ok},{h:"Stimmt nicht",ok:!ok}];
/* Lücke mitten im Term: show enthält <span class="slot" id="slot">?</span> */
const SLOT=`<span class="slot" id="slot">?</span>`;
const steps=a=>a.join(" = ");

/* ================= Aufgaben ================= */
const T={
  /* ---------- 2. Plus- und Minusklammer ---------- */
  kSign(){const outer=pick(["−","−","−","+"]),inner=pick(["+","−"]);
    const b=rnd(40,150),c=rnd(11,b-10),a=b+rnd(30,200);
    const ans=outer==="−"?(inner==="+"?"−":"+"):inner;
    return mcTask({lk:"Klammer",topic:"Minusklammer",q:"Klammer weg: Welches Zeichen kommt in die Lücke?",
      show:`<div class="eq sm"><span>${a} ${outer} (${b} ${inner} ${c})</span><span>=</span><span class="lz">${a} ${outer} ${b} <span class="slot">?</span> ${c}</span></div>`,
      opts:[{h:"+",ok:ans==="+"},{h:"−",ok:ans==="−"}],g2:true,
      ex:outer==="−"?`Minus vor der Klammer: Alle Zeichen in der Klammer drehen sich um. Aus ${inner} wird <b>${ans}</b>.`
        :`Plus vor der Klammer: Die Klammer fällt einfach weg, alle Zeichen bleiben. Also <b>${ans}</b> ${c}.`})},
  kCalc(){const v=pick(["mp","mm","pm","pp"]);let a,b,c,show,res,way;
    if(v==="mp"){b=notTen(12,89);const r=pick([100,200,250,300]);a=r+b;c=notTen(11,r-11);res=a-b-c;show=`${a} − (${b} + ${c})`;way=steps([`${a} − ${b} − ${c}`,`${r} − ${c}`,res])}
    else if(v==="mm"){b=notTen(12,89);const r=pick([100,200,300]);a=r+b;c=notTen(11,b-1);res=a-b+c;show=`${a} − (${b} − ${c})`;way=steps([`${a} − ${b} + ${c}`,`${r} + ${c}`,res])}
    else if(v==="pm"){a=notTen(111,189);b=200-a;c=notTen(21,99);res=a+b-c;show=`${a} + (${b} − ${c})`;way=steps([`${a} + ${b} − ${c}`,`200 − ${c}`,res])}
    else{a=notTen(111,389);b=(100-a%100)%100;if(b<10)b+=100;c=notTen(11,99);res=a+b+c;show=`${a} + (${b} + ${c})`;way=steps([`${a} + ${b} + ${c}`,`${a+b} + ${c}`,res])}
    return kpTask({lk:"Klammer",topic:"Minusklammer",q:"Löse die Klammer auf und rechne geschickt.",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},
  kTrap(){const b=rnd(40,99),c=rnd(11,b-5),a=b+c+rnd(10,90);const v=pick(["mmF","mmT","mpF","mpT"]);
    const M={mmF:[`${a} − (${b} − ${c}) = ${a} − ${b} − ${c}`,false,`Stimmt nicht! Minus vor der Klammer: aus − ${c} wird <b>+ ${c}</b>. Richtig: ${a} − ${b} + ${c} = ${a-b+c}.`],
      mmT:[`${a} − (${b} − ${c}) = ${a} − ${b} + ${c}`,true,`Stimmt! Minus vor der Klammer dreht das Zeichen um: − ${c} wird + ${c}. Beides ist ${a-b+c}.`],
      mpF:[`${a} − (${b} + ${c}) = ${a} − ${b} + ${c}`,false,`Stimmt nicht! Aus + ${c} wird <b>− ${c}</b>. Richtig: ${a} − ${b} − ${c} = ${a-b-c}.`],
      mpT:[`${a} − (${b} + ${c}) = ${a} − ${b} − ${c}`,true,`Stimmt! Aus + ${c} wird − ${c}. Beides ist ${a-b-c}.`]}[v];
    return mcTask({lk:"Klammer",topic:"Minusklammer",q:"Stimmt das?",show:`<div class="eq sm"><span>${M[0]}</span></div>`,opts:yesNo(M[1]),g2:true,ex:M[2]})},

  /* ---------- 3. Subtrahenden zusammenfassen ---------- */
  sGap(){const b=rnd(12,60),c=rnd(11,50),a=b+c+rnd(5,80);
    return kpTask({lk:"Sammeln",topic:"Subtrahenden",q:"Welche Zahl fehlt?",show:`<div class="eq sm"><span>${a} − ${b} − ${c}</span><span>=</span><span class="lz">${a} − (${b} + ${SLOT} )</span></div>`,ans:String(c),
      ex:`Statt ${b} und ${c} einzeln abzuziehen, zieht man ihre <b>Summe</b> ab: ${a} − (${b} + ${c}) = ${a} − ${b+c} = ${a-b-c}.`})},
  sCalc(){const three=rand(2);let subs,a;
    if(three){const b=notTen(12,88),c=(10-b%10)+10*rnd(0,3),d=rnd(11,60);subs=[b,c,d];
      /* b+c ist ein glatter Zehner */}else{const b=notTen(12,88),c=(10-b%10)+10*rnd(0,4);subs=[b,c]}
    const s=subs.reduce((x,y)=>x+y,0);a=s+rnd(1,120);
    const order=three?shuffle(subs):subs;const pairSum=three?subs[0]+subs[1]:s;
    const way=three?`${a} − (${subs[0]} + ${subs[1]}) − ${subs[2]} = ${a} − ${pairSum} − ${subs[2]} = ${a-s}`:`${a} − (${subs[0]} + ${subs[1]}) = ${a} − ${s} = ${a-s}`;
    return kpTask({lk:"Sammeln",topic:"Subtrahenden",q:"Fasse die Zahlen hinter dem Minus zusammen und rechne.",show:eqShow(`<span>${a} − ${order.join(" − ")}</span>`),ans:String(a-s),ex:way})},
  sTrap(){const b=rnd(20,60),c=rnd(5,b-5),a=b+c+rnd(20,90);const ok=rand(2)===1;
    return mcTask({lk:"Sammeln",topic:"Subtrahenden",q:"Stimmt das?",show:`<div class="eq sm"><span>${a} − ${b} − ${c} = ${a} − (${b} ${ok?"+":"−"} ${c})</span></div>`,opts:yesNo(ok),g2:true,
      ex:ok?`Stimmt! Wer erst ${b} und dann ${c} abzieht, zieht insgesamt ${b+c} ab. Beides ist ${a-b-c}.`
        :`Stimmt nicht! Mehrere Subtrahenden fasst man als <b>Summe</b> zusammen: ${a} − (${b} + ${c}) = ${a-b-c}. Mit (${b} − ${c}) käme ${a-b+c} heraus.`})},

  /* ---------- 4. Umstellen mit Rechenzeichen ---------- */
  uWhich(){const a=notTen(41,89),c=100-a;let b;do{b=rnd(11,70)}while(b===c||b===a);
    const opts=shuffle([{h:`${a} + ${c} − ${b}`,ok:true},{h:`${a} + ${c} + ${b}`,ok:false},{h:`${a} − ${c} + ${b}`,ok:false},{h:`${a} − ${c} − ${b}`,ok:false}]);
    return mcTask({lk:"Umstellen",topic:"Umstellen",q:"Welche Umstellung ist richtig?",show:`<div class="eq"><span>${a} − ${b} + ${c}</span></div>`,opts,
      ex:`Das Rechenzeichen wandert mit: <b>+ ${c}</b> nach vorne, <b>− ${b}</b> nach hinten. ${a} + ${c} − ${b} = 100 − ${b} = ${100-b}.`})},
  uCalc(){const v=rand(3);let show,res,way;
    if(v===0){const x=rnd(150,320),y=rnd(120,300),dx=rnd(1,9),dy=rnd(1,9);const z=x-100,w=y-dy;
      show=`${x} + ${y} − ${z} − ${w}`;res=x+y-z-w;way=`${x} − ${z} + ${y} − ${w} = 100 + ${dy} = ${res}`}
    else if(v===1){const x=notTen(51,98),y=100-x,p=notTen(11,89),q=100-p;
      show=`${x} + ${p} + ${y} + ${q}`;res=200;way=`${x} + ${y} + ${p} + ${q} = 100 + 100 = 200`;
      if(rand(2)){const m=rnd(11,60);show+=` − ${m}`;res-=m;way=`(${x} + ${y}) + (${p} + ${q}) − ${m} = 200 − ${m} = ${res}`}}
    else{const x=rnd(200,400),z=x-rnd(1,9),y=rnd(100,300),w=y-100;
      show=`${x} + ${y} − ${z} − ${w}`;res=x+y-z-w;way=`${x} − ${z} + ${y} − ${w} = ${x-z} + 100 = ${res}`}
    return kpTask({lk:"Umstellen",topic:"Umstellen",q:"Stelle geschickt um und rechne im Kopf.",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},
  uTrue(){const v=pick(["erst","sil","sil2"]);
    if(v==="erst"){const a=rnd(90,130),b=rnd(40,80),c=rnd(50,99);
      return mcTask({lk:"Umstellen",topic:"Umstellen",q:"Darf man das erste Glied so tauschen?",show:`<div class="eq sm"><span>${a} − ${b} + ${c} = ${c} − ${b} + ${a}</span></div>`,opts:yesNo(true),g2:true,
        ex:`Stimmt! Vor der ersten Zahl steht ein unsichtbares Plus (+${a}). Es wandert mit. Beides ist ${a-b+c}.`})}
    const a=notTen(41,89),c=100-a;let b;do{b=rnd(11,70)}while(b===c||b===a);
    return mcTask({lk:"Umstellen",topic:"Umstellen",q:"Hat Silvester richtig umgestellt?",show:`<div class="eq sm"><span>${a} − ${b} + ${c} = ${a} + ${c} + ${b}</span></div>`,opts:yesNo(false),g2:true,
      ex:`Stimmt nicht! Das Minus gehört zur ${b} und muss mitwandern: ${a} + ${c} <b>− ${b}</b> = ${100-b}.`})},

  /* ---------- 5. Punkt vor Strich, Potenzen, Klammern ---------- */
  rPvs(){const v=rand(3);let show,res,way;
    if(v===0){const b=rnd(6,19),c=rnd(3,9),a=b*c+rnd(2,40);show=`${a} − ${b} · ${c}`;res=a-b*c;way=`${a} − ${b*c} = ${res}`}
    else if(v===1){const a=rnd(3,9),b=rnd(6,15),c=rnd(3,9),d=rnd(6,15);show=`${a} · ${b} + ${c} · ${d}`;res=a*b+c*d;way=`${a*b} + ${c*d} = ${res}`}
    else{const b=rnd(2,6),c=rnd(6,14),d=rnd(2,6),e=rnd(5,12),a=d*e+rnd(5,40);show=`${a} + ${b} · ${c} − ${d} · ${e}`;res=a+b*c-d*e;way=`${a} + ${b*c} − ${d*e} = ${res}`}
    return kpTask({lk:"Reihenfolge",topic:"Reihenfolge",q:"Berechne. Punkt vor Strich!",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},
  rKlammer(){const v=rand(3);let show,res,way;
    if(v===0){const a=rnd(3,12),b=rnd(5,30),c=rnd(2,20);show=`${a} · (${b} + ${c})`;res=a*(b+c);way=`${a} · ${b+c} = ${res}`}
    else if(v===1){const d=rnd(2,9),c=d+rnd(2,9),b=rnd(5,15),a=b*(c-d)+rnd(2,60);show=`${a} − ${b} · (${c} − ${d})`;res=a-b*(c-d);way=`${a} − ${b} · ${c-d} = ${a} − ${b*(c-d)} = ${res}`}
    else{const a=rnd(3,9),b=rnd(2,9),c=rnd(3,9),d=rnd(1,6);show=`(${a} + ${b}) · (${c} + ${d})`;res=(a+b)*(c+d);way=`${a+b} · ${c+d} = ${res}`}
    return kpTask({lk:"Reihenfolge",topic:"Reihenfolge",q:"Klammern zuerst!",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},
  rPot(){const v=rand(3);let show,res,way;
    if(v===0){const b=rnd(2,5),c=rnd(2,3),a=rnd(3,40);const p=c===2?b*b:b*b*b;show=`${a} + 2 · ${c===2?sq(b):cube(b)}`;res=a+2*p;way=`${a} + 2 · ${p} = ${a} + ${2*p} = ${res}`}
    else if(v===1){const c=rnd(3,9),a=rnd(2,6),b=Math.ceil((c*c+1)/a)+rnd(0,8);show=`${a} · ${b} − ${sq(c)}`;res=a*b-c*c;way=`${a*b} − ${c*c} = ${res}`}
    else{const a=rnd(8,15),b=a-1,k=rnd(2,9);show=`${k} · (${sq(a)} − ${sq(b)})`;res=k*(a*a-b*b);way=`${k} · (${a*a} − ${b*b}) = ${k} · ${a*a-b*b} = ${res}`}
    return kpTask({lk:"Reihenfolge",topic:"Reihenfolge",q:"Potenzen zuerst berechnen!",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},
  rNest(){const e=rnd(2,9),d=e+rnd(2,8),c=rnd(2,5),b=rnd(5,30),a=b+c*(d-e)+rnd(2,40);
    const res=a-(b+c*(d-e));
    return kpTask({lk:"Reihenfolge",topic:"Reihenfolge",q:"Geschachtelte Klammern: innen anfangen!",show:eqShow(`<span>${a} − [${b} + ${c} · (${d} − ${e})]</span>`),ans:String(res),
      ex:`Erst ( ), dann [ ]: ${a} − [${b} + ${c} · ${d-e}] = ${a} − [${b} + ${c*(d-e)}] = ${a} − ${b+c*(d-e)} = ${res}`})},
  rSetBr(){let a,b,c,d,f;do{b=rnd(3,9);c=rnd(2,6);d=rnd(2,9);a=b*(c+d)+rnd(4,40);
      f=[{h:`(${a} − ${b}) · ${c} + ${d}`,v:(a-b)*c+d},{h:`${a} − ${b} · (${c} + ${d})`,v:a-b*(c+d)},{h:`${a} − (${b} · ${c} + ${d})`,v:a-(b*c+d)},{h:`(${a} − ${b}) · (${c} + ${d})`,v:(a-b)*(c+d)}];
    }while(new Set(f.map(x=>x.v).concat([a-b*c+d])).size<5);
    const t=pick(f);
    return mcTask({lk:"Reihenfolge",topic:"Reihenfolge",q:`Wo stehen die Klammern, damit ${t.v} herauskommt?`,show:`<div class="eq sm"><span>${a} − ${b} · ${c} + ${d}</span></div><p class="sub">Ohne Klammern: ${a-b*c+d}</p>`,
      opts:shuffle(f.map(x=>({h:x.h,ok:x===t}))),ex:`${t.h} = ${t.v}. Klammern ändern die Reihenfolge, darum kommt etwas anderes heraus als ohne Klammern.`})},

  /* ---------- 6. Faktoren-Partner ---------- */
  pPick(){const P=pick([[4,25],[2,50],[8,125],[4,250],[5,20],[2,5],[5,40]]);let x,y;
    /* ungerade und ohne 5: dann ergibt kein anderes Paar eine runde Zahl */
    do{x=rnd(3,17);y=rnd(3,13)}while(x%2===0||y%2===0||x%5===0||y%5===0||x===y);
    const f=shuffle([P[0],P[1],x,y]);const prod=P[0]*P[1];
    const wrong=[[P[0],x],[P[1],y],[x,y]].map(([u,v])=>({h:`${u} · ${v}`,ok:false}));
    return mcTask({lk:"Partner",topic:"Partner",q:"Welche zwei Faktoren tust du zuerst zusammen?",show:`<div class="eq"><span>${f.join(" · ")}</span></div>`,
      opts:shuffle(uniq([{h:`${P[0]} · ${P[1]}`,ok:true},...wrong])),g2:true,
      ex:`${P[0]} · ${P[1]} = ${prod}, eine runde Zahl. Dann (${P[0]} · ${P[1]}) · (${x} · ${y}) = ${prod} · ${x*y} = ${prod*x*y}.`})},
  pCalc(){const P=pick([[4,25],[2,50],[8,125],[5,20],[4,250]]);let x,y;do{x=rnd(3,13);y=rnd(3,9)}while(x%2===0||y%2===0||x%5===0||y%5===0||x===y);
    const f=shuffle([P[0],P[1],x,y]);const r=P[0]*P[1]*x*y;
    return kpTask({lk:"Partner",topic:"Partner",q:"Stelle die Faktoren um und rechne geschickt.",show:eqShow(`<span>${f.join(" · ")}</span>`),ans:String(r),
      ex:`(${P[0]} · ${P[1]}) · (${x} · ${y}) = ${P[0]*P[1]} · ${x*y} = ${r}`})},

  /* ---------- 7. Ausmultiplizieren ---------- */
  dGap(){const a=rnd(3,19),R=pick([20,30,40,50,60,70,80,90,100]),c=rnd(1,9),op=pick(["+","−"]);
    return kpTask({lk:"Ausmultiplizieren",topic:"Ausmultiplizieren",q:"Multipliziere aus: Welche Zahl fehlt?",
      show:`<div class="eq sm"><span>${a} · (${R} ${op} ${c})</span><span>=</span><span class="lz">${a*R} ${op} ${SLOT}</span></div>`,ans:String(a*c),
      ex:`Jedes Glied in der Klammer wird mit ${a} multipliziert: ${a} · ${R} ${op} ${a} · ${c} = ${a*R} ${op} ${a*c} = ${op==="+"?a*R+a*c:a*R-a*c}.`})},
  dCalc(){const v=rand(3);let show,res,way;
    if(v===0){const a=rnd(6,19),R=pick([20,30,40,50,100]),c=rnd(1,9),op=pick(["+","−"]);res=op==="+"?a*(R+c):a*(R-c);
      show=`${a} · (${R} ${op} ${c})`;way=`${a*R} ${op} ${a*c} = ${res}`}
    else if(v===1){const a=rnd(6,19),c=rnd(1,9),R=pick([20,30,40,50]);res=(R-c)*a;show=`(${R} − ${c}) · ${a}`;way=`${R} · ${a} − ${c} · ${a} = ${R*a} − ${c*a} = ${res}`}
    else{const a=rnd(4,16),b=pick([10,20,30]),c=rnd(1,9);res=a*(100-b+c);show=`${a} · (100 − ${b} + ${c})`;way=`${a*100} − ${a*b} + ${a*c} = ${res}`}
    return kpTask({lk:"Ausmultiplizieren",topic:"Ausmultiplizieren",q:"Multipliziere aus und berechne.",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},
  dZerleg(){const a=rnd(12,19),R=pick([30,40,50,60,70,80,90]),k=rnd(1,2),dn=rand(2);const n=dn?R-k:R+k;
    const best=dn?`${R} − ${k}`:`${R} + ${k}`;
    const wrongMath=dn?`${R} + ${k}`:`${R} − ${k}`;
    const lo=Math.floor(n/10)*10-10,harder=`${lo} + ${n-lo}`;
    return mcTask({lk:"Ausmultiplizieren",topic:"Ausmultiplizieren",q:`Wie zerlegst du ${n} für ${a} · ${n} am geschicktesten?`,show:`<div class="eq"><span>${a} · ${n}</span></div>`,
      opts:shuffle([{h:`${a} · (${best})`,ok:true},{h:`${a} · (${wrongMath})`,ok:false},{h:`${a} · (${harder})`,ok:false}]),
      ex:`${n} liegt ganz nah an ${R}: ${a} · (${best}) = ${a*R} ${dn?"−":"+"} ${a*k} = ${a*n}. ${a} · (${wrongMath}) ist nicht ${n}, und ${harder} geht zwar, macht aber mehr Rechnerei.`})},
  dKlammerOder(){const v=rand(2);
    if(v){/* Klammer ergibt runde Zahl */const a=rnd(12,48),x=rnd(11,25),y=rnd(11,25),z=pick([50,60,100])-x-y;
      return mcTask({lk:"Ausmultiplizieren",topic:"Ausmultiplizieren",q:"Was ist hier günstiger?",show:`<div class="eq sm"><span>${a} · (${x} + ${y} + ${z})</span></div>`,
        opts:[{h:"Klammer zuerst",ok:true},{h:"Ausmultiplizieren",ok:false}],g2:true,ex:`Die Klammer ergibt eine runde Zahl: ${x} + ${y} + ${z} = ${x+y+z}. Dann ${a} · ${x+y+z} = ${a*(x+y+z)}.`})}
    const a=rnd(12,79),R=pick([40,90,100]),k=rnd(1,3);
    return mcTask({lk:"Ausmultiplizieren",topic:"Ausmultiplizieren",q:"Was ist hier günstiger?",show:`<div class="eq sm"><span>${a} · (${R} − ${k})</span></div>`,
      opts:[{h:"Klammer zuerst",ok:false},{h:"Ausmultiplizieren",ok:true}],g2:true,ex:`${R} − ${k} = ${R-k} ist krumm. Ausmultiplizieren ist leichter: ${a} · ${R} − ${a} · ${k} = ${a*R} − ${a*k} = ${a*(R-k)}.`})},
  dWrong(){const a=rnd(3,9),b=pick([20,30,40,50]),c=rnd(2,9);const op=pick(["+","−"]);const o2=op==="+"?"−":"+";
    return mcTask({lk:"Ausmultiplizieren",topic:"Ausmultiplizieren",q:"Welche Umformung ist richtig?",show:`<div class="eq"><span>${a} · (${b} ${op} ${c})</span></div>`,
      opts:shuffle([{h:`${a} · ${b} ${op} ${a} · ${c}`,ok:true},{h:`${a} · ${b} ${op} ${c}`,ok:false},{h:`${a} · ${b} ${o2} ${a} · ${c}`,ok:false},{h:`${a} + ${b} ${op} ${c}`,ok:false}]),
      ex:`Der Faktor ${a} wird an <b>jedes</b> Glied verteilt, das Rechenzeichen bleibt: ${a} · ${b} ${op} ${a} · ${c} = ${op==="+"?a*(b+c):a*(b-c)}.`})},

  /* ---------- 8. Ausklammern ---------- */
  oWhich(){let a,b,c;do{a=rnd(12,59);b=rnd(11,89);c=rnd(11,89)}while(a===b||a===c||b===c);const op=pick(["+","−"]);if(op==="−"&&b<c)[b,c]=[c,b];
    const forms=[`${a} · ${b} ${op} ${a} · ${c}`,`${a} · ${b} ${op} ${c} · ${a}`,`${b} · ${a} ${op} ${a} · ${c}`];
    return mcTask({lk:"Ausklammern",topic:"Ausklammern",q:"Welchen Faktor kannst du ausklammern?",show:`<div class="eq sm"><span>${pick(forms)}</span></div>`,
      opts:shuffle([{h:String(a),ok:true},{h:String(b),ok:false},{h:String(c),ok:false}]),g2:false,
      ex:`${a} steckt in beiden Produkten: ${a} · (${b} ${op} ${c}).`})},
  oGap(){const a=rnd(12,49),b=notTen(12,88),R=pick([50,100,100,60,80]);const c=R-b>0?R-b:(Math.ceil(b/10)*10+10)-b;
    return kpTask({lk:"Ausklammern",topic:"Ausklammern",q:"Klammere aus: Welche Zahl fehlt?",show:`<div class="eq sm"><span>${a} · ${b} + ${a} · ${c}</span><span>=</span><span class="lz">${a} · (${b} + ${SLOT} )</span></div>`,ans:String(c),
      ex:`${a} steht in beiden Produkten, also davor. In die Klammer kommt der Rest: ${a} · (${b} + ${c}) = ${a} · ${b+c} = ${a*(b+c)}.`})},
  oCalc(){const v=rand(2);let a=rnd(12,59),b,c,show,res,way;
    if(v){b=notTen(12,88);c=(Math.ceil(b/10)*10)-b+10*rnd(0,3);if(c<1)c+=10;show=pick([`${a} · ${b} + ${a} · ${c}`,`${b} · ${a} + ${a} · ${c}`]);res=a*(b+c);way=`${a} · (${b} + ${c}) = ${a} · ${b+c} = ${res}`}
    else{c=rnd(11,60);b=c+pick([10,20,30,40,50,100]);show=pick([`${a} · ${b} − ${a} · ${c}`,`${a} · ${b} − ${c} · ${a}`]);res=a*(b-c);way=`${a} · (${b} − ${c}) = ${a} · ${b-c} = ${res}`}
    return kpTask({lk:"Ausklammern",topic:"Ausklammern",q:"Klammere aus und rechne.",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},

  /* ---------- 9. Tricks: Faktor 1, Quadrat, versteckter Faktor ---------- */
  tEins(){const a=rnd(12,99),R=pick([20,30,50,100]),up=rand(2);const b=up?R-1:R+1;
    const show=up?pick([`${a} · ${b} + ${a}`,`${a} + ${b} · ${a}`]):`${a} · ${b} − ${a}`;
    return kpTask({lk:"Faktor 1",topic:"Faktor 1",q:"Der Trick mit dem Faktor 1: Welche Zahl fehlt?",show:`<div class="eq sm"><span>${show}</span><span>=</span><span class="lz">${a} · (${b} ${up?"+":"−"} ${SLOT} )</span></div>`,ans:"1",
      ex:`Die einzelne ${a} ist ${a} · <b>1</b>. Also ${a} · (${b} ${up?"+":"−"} 1) = ${a} · ${R} = ${a*R}.`})},
  tQuad(){const up=rand(2);let a,b;
    if(up){a=notTen(21,79);b=100-a}else{a=rnd(25,95);b=a-pick([1,2,3,5,10])}
    const show=up?`${sq(a)} + ${a} · ${b}`:`${sq(a)} − ${a} · ${b}`;
    return kpTask({lk:"Quadrat",topic:"Quadrat",q:"Ein Quadrat ist ein Produkt: Welche Zahl fehlt?",show:`<div class="eq sm"><span>${show}</span><span>=</span><span class="lz">${a} · ( ${SLOT} ${up?"+":"−"} ${b})</span></div>`,ans:String(a),
      ex:`${sq(a)} = ${a} · ${a}. Also ${a} · ${a} ${up?"+":"−"} ${a} · ${b} = ${a} · (${a} ${up?"+":"−"} ${b}) = ${a} · ${up?a+b:a-b} = ${up?a*(a+b):a*(a-b)}.`})},
  tVersteckt(){let a;do{a=rnd(3,17)}while(a===10);const up=rand(2);let b,k;
    if(up){b=notTen(12,88);const R=Math.ceil(b/10)*10;k=R-b;if(k<2){k+=10}}else{k=rnd(2,9);b=pick([30,40,50,60,80,100])+k}
    const p=a*k,show=up?pick([`${a} · ${b} + ${p}`,`${p} + ${b} · ${a}`]):`${a} · ${b} − ${p}`;const r=up?a*(b+k):a*(b-k);
    return kpTask({lk:"Versteckt",topic:"Versteckt",q:`Versteckter Faktor: ${p} = ${a} · ?`,show:`<div class="eq sm"><span>${show}</span><span>=</span><span class="lz">${a} · (${b} ${up?"+":"−"} ${SLOT} )</span></div>`,ans:String(k),
      ex:`${p} = ${a} · ${k}. Also ${a} · (${b} ${up?"+":"−"} ${k}) = ${a} · ${up?b+k:b-k} = ${r}.`})},
  tCalc(){const v=rand(3);let show,res,way;
    if(v===0){const a=rnd(12,99),R=pick([20,50,100]);const b=R-1;show=`${a} · ${b} + ${a}`;res=a*R;way=`${a} · ${b} + ${a} · 1 = ${a} · (${b} + 1) = ${a} · ${R} = ${res}`}
    else if(v===1){const a=notTen(21,89),b=100-a;show=`${sq(a)} + ${a} · ${b}`;res=a*100;way=`${a} · (${a} + ${b}) = ${a} · 100 = ${res}`}
    else{const a=pick([3,4,6,7,8,9,11,12,13]),b=notTen(12,88);let k=Math.ceil(b/10)*10-b;if(k<2)k+=10;show=`${a} · ${b} + ${a*k}`;res=a*(b+k);way=`${a} · ${b} + ${a} · ${k} = ${a} · ${b+k} = ${res}`}
    return kpTask({lk:"Tricks",topic:"Tricks",q:"Klammere geschickt aus und rechne.",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},
  tMulti(){const a=pick([12,18,25,24,15]),v=rand(2);let show,res,way;
    if(v){let x,y,z;do{x=rnd(30,70);y=rnd(20,60);z=x+y-pick([50,60,40])}while(z<5||z===x||z===y);show=`${a} · ${x} + ${a} · ${y} − ${a} · ${z}`;res=a*(x+y-z);way=`${a} · (${x} + ${y} − ${z}) = ${a} · ${x+y-z} = ${res}`}
    else{const y=rnd(10,30),x=pick([40,50,60])+y-1;show=`${a} + ${x} · ${a} − ${a} · ${y}`;const t=1+x-y;res=a*t;way=`${a} · (1 + ${x} − ${y}) = ${a} · ${t} = ${res}`}
    return kpTask({lk:"Tricks",topic:"Tricks",q:"Mehr als zwei Glieder: Klammere aus.",show:eqShow(`<span>${show}</span>`),ans:String(res),ex:`${show} = ${way}`})},

  /* ---------- 10. Fehler-Detektivin ---------- */
  fehler(){const E=pick(["mk","um","f1","sub","pvs","dist"]);let c;
    if(E==="mk"){const b=rnd(50,99),x=rnd(11,b-10),a=b+rnd(60,140);c=[`${a} − (${b} − ${x}) = ${a} − ${b} − ${x} = ${a-b-x}`,`Richtig: ${a} − ${b} + ${x} = ${a-b+x}.`]}
    else if(E==="um"){const a=notTen(41,89),z=100-a;let b;do{b=rnd(11,70)}while(b===z||b===a);c=[`${a} − ${b} + ${z} = ${a} + ${z} + ${b} = ${100+b}`,`Richtig: ${a} + ${z} − ${b} = ${100-b}.`]}
    else if(E==="f1"){if(rand(2)){const a=pick([99,49,19,29]);c=[`${a} + ${sq(a)} = ${a} · ${a} = ${a*a}`,`Richtig: ${a} · (1 + ${a}) = ${a} · ${a+1} = ${a*(a+1)}.`]}
      else{const a=rnd(12,49),b=pick([39,59,79,99]);c=[`${a} · ${b} + ${a} = ${a} · ${b} = ${a*b}`,`Richtig: ${a} · (${b} + 1) = ${a} · ${b+1} = ${a*(b+1)}.`]}}
    else if(E==="sub"){const b=rnd(30,60),x=rnd(5,b-10),a=b+x+rnd(20,80);c=[`${a} − ${b} − ${x} = ${a} − (${b} − ${x}) = ${a-b+x}`,`Richtig: ${a} − (${b} + ${x}) = ${a-b-x}.`]}
    else if(E==="pvs"){const a=rnd(3,9),b=rnd(3,9),x=rnd(3,9);c=[`${a} + ${b} · ${x} = ${a+b} · ${x} = ${(a+b)*x}`,`Richtig: ${a} + ${b*x} = ${a+b*x}.`]}
    else{const a=rnd(3,9),b=pick([20,30,40]),x=rnd(2,9);c=[`${a} · (${b} + ${x}) = ${a} · ${b} + ${x} = ${a*b+x}`,`Richtig: ${a} · ${b} + ${a} · ${x} = ${a*b+a*x}.`]}
    const D={mk:"Minus vor der Klammer: Die Zeichen in der Klammer wurden nicht umgedreht.",um:"Beim Umstellen ist das Minuszeichen nicht mitgewandert.",f1:"Der Faktor 1 wurde vergessen.",
      sub:"Mehrere Subtrahenden fasst man als Summe zusammen, nicht als Differenz.",pvs:"Punkt vor Strich wurde nicht beachtet.",dist:"Beim Ausmultiplizieren wurde nicht jedes Glied multipliziert."};
    const others=shuffle(Object.keys(D).filter(k=>k!==E)).slice(0,2);
    return mcTask({lk:"Detektivin",topic:"Fehler",q:"Hier steckt ein Fehler drin. Welcher?",show:`<div class="eq sm wrong"><span>${c[0]}</span></div>`,
      opts:shuffle([E,...others].map(k=>({h:D[k],ok:k===E}))),ex:`${D[E]} ${c[1]}`})},

  /* ---------- 11. Regeln in Worten (Erkläre / Formuliere) ---------- */
  worte(){const W=WORTE[(R&&R.wi!=null)?(R.wi++%WORTE.length):rand(WORTE.length)];
    return mcTask({lk:"In Worten",topic:"Worte",q:W.q,show:W.s?`<div class="eq sm"><span>${W.s}</span></div>`:"",opts:shuffle(W.o.map((h,i)=>({h,ok:i===0}))),ex:W.ex})},
  nennen(){const a=rnd(3,19),b=rnd(11,60),c=rnd(2,30),op=pick(["+","−"]);const dir=rand(2);
    const s=dir?`${a} · (${b} ${op} ${c}) = ${a} · ${b} ${op} ${a} · ${c}`:`${a} · ${b} ${op} ${a} · ${c} = ${a} · (${b} ${op} ${c})`;
    return mcTask({lk:"In Worten",topic:"Worte",q:"Wie heißt diese Umformung?",show:`<div class="eq sm"><span>${s}</span></div>`,opts:[{h:"Ausmultiplizieren",ok:!!dir},{h:"Ausklammern",ok:!dir}],g2:true,
      ex:dir?"Die Klammer wird aufgelöst, der Faktor an jedes Glied verteilt: <b>Ausmultiplizieren</b>.":"Der gemeinsame Faktor wird vor die Klammer gezogen: <b>Ausklammern</b>. Das ist der Rückweg vom Ausmultiplizieren."})}
};

/* ================= Runde ================= */
let R=null;
function startRound(id){const c=chOf(id);
  const pool=c.types||MIXPOOL;let list=[];
  /* jede Aufgabenart mindestens einmal (wenn Platz), Rest zufällig, nie zweimal dieselbe Art hintereinander */
  const n=lwFragen(c.n),base=shuffle(Array.from(new Set(pool))).slice(0,n);
  while(base.length<n)base.push(pick(pool));
  list=shuffle(base);for(let i=1;i<list.length;i++)if(list[i]===list[i-1]){const j=list.findIndex((x,k)=>k>i&&x!==list[i]&&x!==list[i-1]);if(j>0)[list[i],list[j]]=[list[j],list[i]]}
  R={id,i:0,ok:0,res:[],miss:[],wi:rand(WORTE.length)};
  if(id==="worte")WORTE.sort(()=>Math.random()-.5);
  R.tasks=list.map(k=>T[k]());R.n=R.tasks.length;showTask()}
function track(){$("#track").innerHTML=Array.from({length:R.n},(_,i)=>`<i class="${i<R.res.length?(R.res[i]?"ok":"no"):(i===R.i?"now":"")}"></i>`).join("")}
function showTask(){const t=R.tasks[R.i];R.locked=false;R.typed="";
  app.innerHTML=`<div class="topbar"><button id="quit" aria-label="Runde beenden"></button><div class="track" id="track"></div></div>
    <div class="q"><b>${t.q}</b><span class="lk">${t.lk}</span></div>
    <section class="stage" id="cb"></section>`;
  $("#quit").onclick=home;track();
  const cb=$("#cb");
  let h=t.show?`<div class="show">${t.show}</div>`:"";
  if(t.kind==="mc")h+=`<div class="opts ${t.g2?"g2":""}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.h}</button>`).join("")}</div>`;
  else h+=keypad();
  cb.innerHTML=h;
  if(t.kind==="mc")cb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const o=t.opts[+b.dataset.i];
    cb.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(t.opts[i].ok)x.classList.add("ok")});if(!o.ok)b.classList.add("bad");done(o.ok,t.ex)});
  else wireKeypad(cb,t.ans,6,(ok)=>done(ok,(ok?"":`Richtig ist <b>${t.ans}</b>. `)+t.ex));
  scrollTo(0,0)}
function keypad(){return `<div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="del" aria-label="Löschen">${I.del}</button><button data-k="0">0</button><button class="ok" data-k="ok" disabled>OK</button></div>`}
/* Ziffernblock (eigener, damit keine Handy-Tastatur aufspringt) */
function wireKeypad(cb,ans,max,fin){R.kp=k=>{if(R.locked)return;
    if(k==="ok"){if(!R.typed)return;const ok=R.typed===ans;const sl=$("#slot");sl.classList.add(ok?"ok":"bad");cb.querySelectorAll(".kp button").forEach(b=>b.disabled=true);fin(ok,R.typed);return}
    if(k==="del")R.typed=R.typed.slice(0,-1);else if(R.typed.length<max)R.typed=(R.typed==="0"?"":R.typed)+k;
    const sl=$("#slot");sl.textContent=R.typed||"?";sl.classList.toggle("full",!!R.typed);cb.querySelector(".kp .ok").disabled=!R.typed};
  cb.querySelectorAll(".kp button").forEach(b=>b.onclick=()=>R.kp(b.dataset.k))}
document.addEventListener("keydown",e=>{if(!R||!R.kp||R.locked||e.metaKey||e.ctrlKey||e.altKey||!$(".kp"))return;
  if(/^[0-9]$/.test(e.key))R.kp(e.key);else if(e.key==="Backspace")R.kp("del");else if(e.key==="Enter"){e.preventDefault();R.kp("ok")}});

function done(ok,ex){if(R.locked)return;R.locked=true;const t=R.tasks[R.i];
  R.res.push(ok);if(ok)R.ok++;else R.miss.push(t);
  ok?sfxOk():sfxBad();track();
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Stark!"]):"Nicht ganz"}</strong><p>${ex}</p>`;
  const nx=document.createElement("button");nx.className="next";nx.type="button";nx.textContent=R.i+1>=R.n?"Ergebnis":"Weiter";
  nx.onclick=()=>{R.i++;R.i>=R.n?endRound():showTask()};
  lwSheet($("#cb"),ok,[fb,nx])}
const TOPIC={Minusklammer:"Plus- und Minusklammer (Regel 1)",Subtrahenden:"Mehrere Zahlen abziehen (Regel 2)",Umstellen:"Umstellen mit Rucksack (Regel 3)",Reihenfolge:"Klammer, Potenz, Punkt, Strich (Regel 4)",
  Partner:"Faktoren-Partner (Regel 5)",Ausmultiplizieren:"Ausmultiplizieren (Regel 6)",Ausklammern:"Ausklammern (Regel 7)","Faktor 1":"Trick: Faktor 1 (Regel 8)",Quadrat:"Trick: Quadrat (Regel 8)",
  Versteckt:"Trick: versteckter Faktor (Regel 8)",Tricks:"Ausklammern mit Tricks (Regel 7 und 8)",Fehler:"Typische Fehler erkennen",Worte:"Regeln in Worten"};
function endRound(){const n=R.n,ok=R.ok,q=ok/n;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[R.id]=Math.max(S.best[R.id]||0,st);save();
  const k=CH.findIndex(c=>c.id===R.id),nxt=CH[k+1];
  const cheer=["Dranbleiben, das wird!","Gut gemacht!","Stark!","Super, du bist ein Klammer-Profi!"][st];
  const topics=[...new Set(R.miss.map(t=>TOPIC[t.topic]||t.topic))];
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    <p class="lead"><b>${ok} von ${n}</b> richtig</p>
    ${topics.length?`<div class="panel missed"><b>Schau dir das noch einmal an:</b><ul>${topics.map(x=>`<li>${x}</li>`).join("")}</ul><button class="ghost" id="rg">${I.book}Im Regelheft nachlesen</button></div>`:""}
    <button class="go" id="again">Nochmal üben</button>
    ${nxt&&st>=2?`<button class="ghost" id="nx">Weiter: ${nxt.t}</button>`:""}
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  const id=R.id;R=null;
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;if($("#nx"))$("#nx").onclick=()=>openCh(nxt.id);if($("#rg"))$("#rg").onclick=regeln;
  scrollTo(0,0)}
