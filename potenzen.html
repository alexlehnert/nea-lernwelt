<title>Potenz-Quiz</title>
<style>
/* Potenz-Quiz: 2er- und 10er-Potenzen von Hochzahl 0 bis 20 auswendig lernen, ohne Erklärteil.
   Jede Potenz sammelt 3 Punkte (dreimal hintereinander richtig). Kapitel = Quizrunden mit Sternen.
   Vorlesen der Zahlen mit der Sprachausgabe des Geräts (Web Speech API, de-DE).

b{font-weight:700}

button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}

svg{display:block}
.small{font-size:.88rem;color:var(--lw-muted)}
.lead{font-size:1.05rem}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.panel{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lw-ma)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px}
.ghost svg,.go svg{width:18px;height:18px;flex:none}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* Startseite: Übersicht aller 42 Potenzen */
.sure{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{min-height:44px;border-radius:12px;border:2px solid var(--lw-line);background:var(--lw-card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;font:700 .95rem/1 var(--lw-f-d);color:var(--lw-ink)}
.cell .d{display:flex;gap:2px;margin-top:4px}

.fb .nm{font:600 1.15rem/1.25 var(--lw-f-d);color:var(--lw-ink)}
.fb p{margin-top:4px}

/* Ergebnis */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}

.bigstars svg{width:64px;height:64px}

/* Hörtafel */

.tafel{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:62px 1fr 26px;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:16px;border:2px solid var(--lw-line);background:var(--lw-card);color:var(--lw-ink)}

.hrow .v{font:700 1.05rem/1.2 var(--lw-f-d);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hrow .v small{display:block;font:400 .88rem/1.25 var(--lw-f-b);color:var(--lw-muted);margin-top:2px}

.hrow.on{border-color:var(--lw-ma);background:var(--lw-ma-s)}

.lw-sheet .missl{margin:0;padding-left:20px}
.missed ul{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}

#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style><!--/lw-look--></head><body><nav id="lw-bar" class="lw-bar lw-ma" aria-label="Lernwelt"><a class="lw-back" href="index.html#heft-potenzen" aria-label="Zurück zum Heft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><span class="lw-t"><span class="lw-eyebrow">Mathe</span><span class="lw-name">Potenz-Quiz</span></span></nav>
<main class="wrap" id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ================= Grundlagen ================= */
const $=s=>document.querySelector(s);
const app=$("#app");
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let toastT;function toast(t){const el=$("#toast");el.innerHTML=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2600)}

/* ================= Zahlen ================= */
const MAXN=20;
const val=(b,n)=>b===2?String(Math.pow(2,n)):"1"+"0".repeat(n);           // als Text, 10²⁰ ist zu groß für exakte Zahlen
const fmt=s=>String(s).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0");           // 1 048 576 mit festem Leerzeichen: Dreiergruppen gut sichtbar
const pw=(b,n,cls)=>`<span class="num ${cls||""}">${b}<sup>${n}</sup></span>`;
/* Namen der 10er-Potenzen (deutsche lange Skala) */
const NAME=["eins","zehn","hundert","tausend","zehntausend","hunderttausend",
  "eine Million","zehn Millionen","hundert Millionen","eine Milliarde","zehn Milliarden","hundert Milliarden",
  "eine Billion","zehn Billionen","hundert Billionen","eine Billiarde","zehn Billiarden","hundert Billiarden",
  "eine Trillion","zehn Trillionen","hundert Trillionen"];
const FAM=[[6,"Million"],[9,"Milliarde"],[12,"Billion"],[15,"Billiarde"],[18,"Trillion"]];
/* Zahlwörter fürs Vorlesen (bis unter eine Milliarde reicht für 2²⁰) */
const ONES=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const TENS=["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function w99(n,end){if(n<20)return n===1?(end?"eins":"ein"):ONES[n];const u=n%10,t=Math.floor(n/10);return u?(u===1?"ein":ONES[u])+"und"+TENS[t]:TENS[t]}
function w999(n,end,lead){const h=Math.floor(n/100),r=n%100;return (h?(h===1?(lead?"einhundert":"hundert"):ONES[h]+"hundert"):"")+(r?w99(r,end):"")}
function words(n){n=+n;if(n===0)return "null";const m=Math.floor(n/1e6),th=Math.floor(n/1000)%1000,r=n%1000,out=[];
  if(m)out.push(m===1?"eine Million":w999(m,false)+" Millionen");
  let s="";if(th)s+=th===1?"tausend":w999(th,false)+"tausend";if(r)s+=w999(r,true,!!(m||th));if(s)out.push(s);return out.join(" ")}
const spoken=f=>f.b===10?NAME[f.n]:words(f.v);                 // wie man die Zahl ausspricht
const sayPow=f=>`${f.b===2?"zwei":"zehn"} hoch ${ONES[f.n]}`;
const sayFact=f=>`${sayPow(f)} ist ${spoken(f)}`;

/* Alle 42 Potenzen */
const F=[];[2,10].forEach(b=>{for(let n=0;n<=MAXN;n++)F.push({b,n,id:b+"-"+n,v:val(b,n)})});
const fact=(b,n)=>F.find(f=>f.b===b&&f.n===n);

/* ================= Zustand ================= */
const KEY="potenz-quiz-v1";
const DEF={m:{},best:{},ton:true,rate:.9,taf:2};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return Object.assign(JSON.parse(JSON.stringify(DEF)),s)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dots=f=>S.m[f.id]||0;
const sureCount=()=>F.filter(f=>dots(f)>=3).length;

/* ================= Vorlesen (Sprachausgabe des Geräts) ================= */
const TTS={ok:"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window,v:null,run:0};
function pickVoice(){if(!TTS.ok)return;const vs=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));
  TTS.v=vs.find(v=>/de[-_]DE/i.test(v.lang)&&/anna|petra|helena|katja|google/i.test(v.name))||vs.find(v=>/de[-_]DE/i.test(v.lang))||vs[0]||null}
if(TTS.ok){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",pickVoice)}
function hush(){TTS.run++;if(TTS.ok)speechSynthesis.cancel()}
/* spricht einen Text; onend kommt auch bei Fehlern, damit Abfolgen weiterlaufen */
function speak(text,onend){if(!TTS.ok){if(onend)onend();return false}
  const id=++TTS.run;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(TTS.v)u.voice=TTS.v;u.rate=S.rate;u.pitch=1.05;
  let fired=false;const fin=()=>{if(fired)return;fired=true;if(id===TTS.run&&onend)onend()};u.onend=fin;u.onerror=fin;
  speechSynthesis.speak(u);return true}

/* kurze Töne für richtig/falsch */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function beep(fs,len,type,vol){const a=ac();if(!a)return;let t=a.currentTime+.02;fs.forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type=type||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02);t+=len*.75})}
const sfxOk=()=>beep([1046.5,1318.5],.14);
const sfxBad=()=>beep([233,175],.18,"triangle",.12);

/* ================= Aufgaben ================= */
/* Nachbarn als falsche Antworten: gleiche Basis, nahe Hochzahl (bei Namen sind ±3 die typische Verwechslung) */
function near(f,deltas,k,lo){lo=lo==null?0:lo;const out=[];
  for(const d of deltas){const n=f.n+d;if(n>=lo&&n<=MAXN&&n!==f.n&&!out.includes(n))out.push(n);if(out.length>=k)break}
  if(out.length<k)for(let n=lo;n<=MAXN&&out.length<k;n++)if(n!==f.n&&!out.includes(n))out.push(n);
  return out}
const D1=()=>shuffle([-1,1]).concat(shuffle([-2,2]),shuffle([-3,3]));
const D3=()=>shuffle([-3,3]).concat(shuffle([-1,1]),shuffle([-2,2,-6,6]));
const isLong=f=>f.v.length>12;

const T={
  /* 2ⁿ = ? eintippen */
  val(f){return {f,kind:"kp",q:"Wie viel ist das?",show:`<div class="eq">${pw(2,f.n)}<span>=</span><span class="slot" id="slot">?</span></div>`,ans:f.v,max:f.v.length+1,group:true}},
  /* Zahl = bⁿ, Hochzahl eintippen */
  exp(f){return {f,kind:"kp",q:"Welche Hochzahl fehlt?",show:`<div class="eq ${isLong(f)?"long":""}"><span class="num">${fmt(f.v)}</span><span>=</span><span class="num">${f.b}<sup><span class="slot" id="slot">?</span></sup></span></div>${f.b===10&&f.n>2?`<p class="sub">Tipp: Zähl die Nullen.</p>`:""}`,ans:String(f.n),max:2}},
  /* bⁿ = ? auswählen */
  pick(f){const ns=near(f,D1(),3);const o=shuffle([f.n,...ns]).map(n=>({h:fmt(val(f.b,n)),ok:n===f.n}));
    return {f,kind:"mc",q:f.b===10?"Welche Zahl ist das?":"Welche Zahl ist richtig?",show:`<div class="eq">${pw(f.b,f.n)}</div>`,opts:o,cls:isLong(fact(f.b,Math.max(f.n,...ns)))?"long":""}},
  /* Verdoppeln: 2ⁿ⁻¹ · 2 */
  dbl(f){return {f,kind:"kp",q:"Verdopple!",show:`<div class="eq"><span class="num">${fmt(val(2,f.n-1))}</span><span>·</span><span>2</span><span>=</span><span class="slot" id="slot">?</span></div><p class="sub">${pw(2,f.n-1)} · 2 = ${pw(2,f.n)}</p>`,ans:f.v,max:f.v.length+1,group:true}},
  /* 10ⁿ oder die Zahl → Name auswählen */
  name(f){const asNum=f.n>=4&&Math.random()<.5;const ns=near(f,D3(),3,3);const o=shuffle([f.n,...ns]).map(n=>({h:NAME[n],ok:n===f.n}));
    return {f,kind:"mc",q:"Wie heißt diese Zahl?",show:asNum?`<div class="eq ${isLong(f)?"long":""}"><span class="num">${fmt(f.v)}</span></div>`:`<div class="eq">${pw(10,f.n)}</div><p class="sub num">${fmt(f.v)}</p>`,opts:o}},
  /* Name → Hochzahl eintippen */
  nameExp(f){return {f,kind:"kp",q:"Schreib als Zehnerpotenz.",show:`<div class="eq"><span class="nm">„${NAME[f.n]}“</span></div><div class="eq"><span>=</span><span class="num">10<sup><span class="slot" id="slot">?</span></sup></span></div>`,ans:String(f.n),max:2}},
  /* Name → Zahl auswählen */
  nameNum(f){const ns=near(f,D3(),3,3);const o=shuffle([f.n,...ns]).map(n=>({h:fmt(val(10,n)),ok:n===f.n}));
    return {f,kind:"mc",q:"Welche Zahl ist das?",show:`<div class="eq"><span class="nm">„${NAME[f.n]}“</span></div>`,opts:o,cls:f.n+3>12||ns.some(n=>n>12)?"long":""}},
  /* Hören: Zahl hören → Potenz wählen */
  hearPow(f){const ns=near(f,f.b===10?D3():D1(),3);const o=shuffle([f.n,...ns]).map(n=>({h:pw(f.b,n),ok:n===f.n,cls:"pw"}));
    return {f,kind:"mc",q:"Welche Potenz hörst du?",audio:spoken(f),show:"",opts:o,g2:true}},
  /* Hören: „zwei hoch …“ → Zahl wählen */
  hearVal(f){const ns=near(f,f.b===10?D3():D1(),3);const o=shuffle([f.n,...ns]).map(n=>({h:f.b===10&&n>=3?NAME[n]:fmt(val(f.b,n)),ok:n===f.n}));
    return {f,kind:"mc",q:"Hör zu: Welche Zahl ist das?",audio:sayPow(f),show:"",opts:o}}
};
/* Welche Aufgabenarten zu welcher Potenz passen */
function typesFor(f,ch){
  const hear=TTS.ok&&S.ton;
  if(ch==="zwei1")return f.n>=2?["val","val","exp","pick","dbl"]:["val","exp","pick"];
  if(ch==="zwei2")return ["val","exp","pick","pick","dbl"];
  if(ch==="zehn")return ["pick","exp","exp"];
  if(ch==="namen")return ["name","name","nameExp","nameNum"];
  if(ch==="hoeren")return hear?["hearPow","hearPow","hearVal"]:(f.b===2?["exp","pick"]:["name","nameNum"]);
  /* Großer Mix */
  const t=f.b===2?(f.n>=2?["val","exp","pick","dbl"]:["val","exp","pick"]):(f.n>=3?["pick","exp","name","nameExp","nameNum"]:["pick","exp"]);
  if(hear)t.push("hearPow","hearVal");return t}

/* ================= Kapitel ================= */
const CH=[

  app.querySelectorAll("[data-ton]").forEach(b=>b.onclick=()=>{S.ton=b.dataset.ton==="true";save();home();if(S.ton)speak("Vorlesen ist an.")});

/* ================= Runde ================= */
let R=null;
/* Potenzen mit wenig Punkten kommen öfter dran; ohne Wiederholung, solange der Vorrat reicht */
function choose(pool,n){const out=[];let rest=pool.slice();
  while(out.length<n){if(!rest.length)rest=pool.filter(f=>f!==out[out.length-1]);
    const W=rest.map(f=>Math.pow(4-dots(f),2)+.6);let r=Math.random()*W.reduce((a,b)=>a+b,0),k=0;while(r>W[k]&&k<W.length-1){r-=W[k];k++}
    out.push(rest[k]);rest.splice(k,1)}
  return out}
function startRound(id){hush();const c=chOf(id);
  const fs=choose(c.pool,c.n);
  R={id,i:0,ok:0,res:[],miss:[],tasks:fs.map(f=>T[pick(typesFor(f,id))](f))};R.n=R.tasks.length;showTask()}
function track(){$("#track").innerHTML=Array.from({length:R.n},(_,i)=>`<i class="${i<R.res.length?(R.res[i]?"ok":"no"):(i===R.i?"now":"")}"></i>`).join("")}
function showTask(){hush();const t=R.tasks[R.i];R.locked=false;R.typed="";const d=dots(t.f);
  app.innerHTML=`<div class="topbar"><button id="quit" aria-label="Runde beenden"></button><div class="track" id="track"></div></div>
    <div class="q"><b>${t.q}</b><span class="dots" aria-label="${d} von 3 Punkten">${[1,2,3].map(i=>`<i class="${d>=i?"on":""}"></i>`).join("")}</span></div>
    <section class="stage" id="cb"></section>`;
  $("#quit").onclick=home;track();
  const cb=$("#cb");let h="";
  if(t.audio)h+=`<div class="show"><button class="go listen" id="lis">${I.spk}<span>Anhören</span></button><p class="sub">So oft du willst.</p></div>`;
  if(t.show)h+=`<div class="show">${t.show}</div>`;
  if(t.kind==="mc")h+=`<div class="opts ${t.g2?"g2":""}">${t.opts.map((o,i)=>`<button class="opt ${o.cls||t.cls||""}" data-i="${i}">${o.h}</button>`).join("")}</div>`;
  else h+=`<div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="del" aria-label="Löschen">${I.del}</button><button data-k="0">0</button><button class="ok" data-k="ok" disabled>OK</button></div>`;
  cb.innerHTML=h;
  if(t.audio){const go=()=>{const b=$("#lis");if(b)b.lastChild.textContent="Hör zu …";speak(t.audio,()=>{const b2=$("#lis");if(b2)b2.lastChild.textContent="Nochmal hören"})};
    $("#lis").onclick=go;go()}
  if(t.kind==="mc")cb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const o=t.opts[+b.dataset.i];
    cb.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(t.opts[i].ok)x.classList.add("ok")});if(!o.ok)b.classList.add("bad");done(o.ok)});
  else cb.querySelectorAll(".kp button").forEach(b=>b.onclick=()=>key(b.dataset.k));
  scrollTo(0,0)}
/* Ziffernblock (eigener, damit keine Handy-Tastatur aufspringt) */
function key(k){if(!R||R.locked)return;const t=R.tasks[R.i];if(t.kind!=="kp")return;
  if(k==="ok"){if(R.typed)check();return}
  if(k==="del")R.typed=R.typed.slice(0,-1);
  else if(R.typed.length<t.max)R.typed=(R.typed==="0"?"":R.typed)+k;
  const sl=$("#slot");sl.textContent=R.typed?(t.group?fmt(R.typed):R.typed):"?";sl.classList.toggle("full",!!R.typed);
  $(".kp .ok").disabled=!R.typed}
document.addEventListener("keydown",e=>{if(!R||R.locked||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("del");else if(e.key==="Enter"){e.preventDefault();key("ok")}else return});
function check(){const t=R.tasks[R.i];const ok=R.typed===t.ans;const sl=$("#slot");sl.classList.add(ok?"ok":"bad");
  $(".kp").querySelectorAll("button").forEach(b=>b.disabled=true);done(ok,R.typed)}
/* Merktipp zur Potenz */
function tip(f){
  if(f.n===0)return "Hoch 0 ist immer 1.";
  if(f.b===2){if(f.n===1)return "Hoch 1 ist die Zahl selbst: 2¹ = 2.";
    let s=`Verdoppeln: ${fmt(val(2,f.n-1))} · 2 = ${fmt(f.v)}.`;
    if(f.n===10)s+=" Merk dir 2¹⁰ = 1 024: fast genau tausend.";
    else if(f.n===20)s+=" Und: 2²⁰ = 1 024 · 1 024, gut eine Million.";
    else if(f.n>10)s+=` Oder: 1 024 · ${fmt(val(2,f.n-10))} = ${fmt(f.v)}.`;
    return s}
  if(f.n===1)return "Hoch 1 ist die Zahl selbst: 10¹ = 10.";
  let s=`Eine 1 mit ${f.n} Nullen.`;
  const fam=FAM.slice().reverse().find(([e])=>e<=f.n);
  if(fam&&f.n>fam[0])s+=` ${fam[1]} ist 10<sup>${fam[0]}</sup>, ${f.n-fam[0]===1?"mal zehn":"mal hundert"} gibt 10<sup>${f.n}</sup>.`;
  else if(fam)s+=" Million, Milliarde, Billion, Billiarde, Trillion: immer drei Nullen mehr.";
  return s}
function done(ok,typed){if(R.locked)return;R.locked=true;const t=R.tasks[R.i],f=t.f;
  S.m[f.id]=ok?Math.min(3,dots(f)+1):0;save();
  R.res.push(ok);if(ok)R.ok++;else if(!R.miss.includes(f))R.miss.push(f);
  ok?sfxOk():sfxBad();track();const d=dots(f);
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Stark!"]):"Nicht ganz"}</strong>
    <div class="big num ${isLong(f)?"long":""}">${f.b}<sup>${f.n}</sup> = ${fmt(f.v)}</div>
    ${f.b===10&&f.n>=3?`<div class="nm">„${NAME[f.n]}“</div>`:""}
    ${!ok&&typed?`<p>Du hast ${t.group?fmt(typed):typed} getippt.</p>`:""}
    <p>${tip(f)}</p>
    <p class="small">${ok?(d>=3?"Diese Potenz sitzt: 3 grüne Punkte!":`Noch ${3-d}-mal richtig, dann sitzt sie.`):"Die Punkte für diese Potenz starten wieder bei null."}</p>`;
  const extra=[];
  if(TTS.ok){const b=document.createElement("button");b.className="ghost";b.type="button";b.innerHTML=I.spk+"<span>Anhören</span>";b.onclick=()=>speak(sayFact(f));extra.push(b)}
  const nx=document.createElement("button");nx.className="next";nx.type="button";nx.textContent=R.i+1>=R.n?"Ergebnis":"Weiter";
  nx.onclick=()=>{R.i++;R.i>=R.n?endRound():showTask()};
  lwSheet($("#cb"),ok,[fb,...extra,nx]);
  if(S.ton)speak(sayFact(f))}
function endRound(){hush();const n=R.n,ok=R.ok,q=ok/n;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[R.id]=Math.max(S.best[R.id]||0,st);save();
  const k=CH.findIndex(c=>c.id===R.id),nxt=CH[k+1];
  const cheer=["Dranbleiben, das wird!","Gut gemacht!","Stark!","Super, alles im Kopf!"][st];
  const miss=R.miss;
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    <p class="lead"><b>${ok} von ${n}</b> richtig · <b>${sureCount()} von 42</b> Potenzen sitzen</p>
    ${miss.length?`<div class="panel missed"><b>Das übst du noch einmal:</b><ul>${miss.map(f=>`<li><button class="hrow" data-f="${f.id}"><span class="p">${f.b}<sup>${f.n}</sup></span><span class="v">${fmt(f.v)}${f.b===10&&f.n>=3?`<small>${NAME[f.n]}</small>`:""}</span>${TTS.ok?I.spk:"<span></span>"}</button></li>`).join("")}</ul></div>`:""}
    <button class="go" id="again">Nochmal üben</button>
    ${nxt&&st>=2?`<button class="ghost" id="nx">Weiter: ${nxt.t}</button>`:""}
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  const id=R.id;R=null;
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;if($("#nx"))$("#nx").onclick=()=>startRound(nxt.id);
  app.querySelectorAll(".missed .hrow").forEach(b=>b.onclick=()=>speak(sayFact(F.find(x=>x.id===b.dataset.f))));
  scrollTo(0,0)}

/* ================= Hörtafel ================= */
let TAF=false;
function tafel(){hush();R=null;TAF=false;const b=S.taf===10?10:2;
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>

    ${TTS.ok?`<button class="go" id="all">${I.play}<span>Alle vorlesen</span></button>`:`<p class="small">Dieser Browser kann leider nicht vorlesen.</p>`}

  $("#cbk").onclick=home;
  app.querySelectorAll("[data-tb]").forEach(x=>x.onclick=()=>{S.taf=+x.dataset.tb;save();tafel()});
  const rows=[...app.querySelectorAll(".tafel .hrow")];
  const mark=el=>{rows.forEach(r=>r.classList.toggle("on",r===el))};
  rows.forEach(r=>r.onclick=()=>{TAF=false;setAll(false);mark(r);speak(sayFact(F.find(x=>x.id===r.dataset.f)),()=>mark(null))});
  const setAll=on=>{const a=$("#all");if(a)a.innerHTML=(on?I.stop:I.play)+`<span>${on?"Stopp":"Alle vorlesen"}</span>`};
  if($("#all"))$("#all").onclick=()=>{if(TAF){TAF=false;hush();mark(null);setAll(false);return}
    TAF=true;setAll(true);let i=0;
    const next=()=>{if(!TAF||!document.body.contains(rows[0]))return;if(i>=rows.length){TAF=false;mark(null);setAll(false);return}
      const r=rows[i++];mark(r);r.scrollIntoView({block:"nearest",behavior:"smooth"});speak(sayFact(F.find(x=>x.id===r.dataset.f)),()=>setTimeout(next,350))};
    next()};
  scrollTo(0,0)}
