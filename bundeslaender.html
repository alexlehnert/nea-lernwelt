<style>
/* Länder-Reise (Sachunterricht, Klasse 3): die 16 Bundesländer und ihre Hauptstädte.

:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--lw-bg);color:var(--lw-ink);font-family:var(--lw-f-b);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--lw-f-d);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--lw-brand);outline-offset:2px}
svg{display:block}
.small{font-size:.92rem;color:var(--lw-muted)}
.panel{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px}
.ghost svg,.go svg{width:20px;height:20px;flex:none}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* Karte */
.map{position:relative;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:8px;display:flex;justify-content:center}
.map svg{width:100%;height:auto;max-height:var(--mh,58vh)}
.map .ld{fill:var(--lw-cs);stroke:var(--lw-card);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.map .ld.seen{fill:color-mix(in srgb,var(--lw-c) 38%,var(--lw-card))}
.map .ld.on{fill:var(--lw-c)}
.map .ld.ok{fill:var(--lw-ok)}
.map .ld.bad{fill:var(--lw-bad)}
.map .ld.dim{fill:var(--lw-soft)}
.map.tap .ld{cursor:pointer}
@media (hover:hover){.map.tap .ld:hover{fill:color-mix(in srgb,var(--lw-c) 55%,var(--lw-card))}}
.map .hit{fill:transparent;cursor:pointer}
.map .ring{fill:none;stroke:var(--lw-c);stroke-width:2.4;stroke-dasharray:3 3;pointer-events:none}
.map .city{fill:var(--lw-ink);stroke:var(--lw-card);stroke-width:2}
.map .city.big{fill:#E11D48;stroke:#fff;stroke-width:3}
.map .lbl{font:700 15px var(--lw-f-d);fill:var(--lw-ink);paint-order:stroke;stroke:var(--lw-card);stroke-width:4px;stroke-linejoin:round;pointer-events:none}

/* Startseite */
.hero{display:flex;gap:14px;align-items:center}
.hero .badge{width:64px;height:64px;flex:none;border-radius:20px;background:var(--lw-cs);color:var(--lw-c);display:grid;place-items:center}
.hero .badge svg{width:38px;height:38px}
.hero b{font:700 1.7rem/1 var(--lw-f-d);color:var(--lw-c)}
.bar{height:12px;border-radius:99px;background:var(--lw-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lw-ok);border-radius:99px}
.stations{display:flex;flex-direction:column;gap:12px}
.st{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px;border-radius:22px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;min-height:92px}
.st:active{transform:translateY(3px);border-bottom-width:2px}
.st .ico{width:60px;height:60px;flex:none;border-radius:18px;background:var(--lw-cs);color:var(--lw-c);display:grid;place-items:center;font:700 1.5rem/1 var(--lw-f-d)}
.st .ico svg{width:34px;height:34px}
.st h3{font-size:1.18rem}
.st p{font-size:.95rem;color:var(--lw-muted);line-height:1.3;margin-top:2px}
.st .n{font:700 12px var(--lw-f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--lw-c)}
.stars{display:flex;gap:2px;margin-top:6px}
.stars svg{width:22px;height:22px}
.modes{display:flex;gap:6px;background:var(--lw-soft);border-radius:16px;padding:4px}
.modes button{flex:1;min-height:48px;border:0;border-radius:12px;background:none;font-weight:700;color:var(--lw-muted)}
.modes button[aria-pressed="true"]{background:var(--lw-card);color:var(--lw-ink);box-shadow:0 2px 0 var(--lw-shadow)}

/* Entdecken */
.chead{display:flex;align-items:center;gap:12px}
.backb{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:6px 16px 6px 12px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-muted)}
.backb svg{width:18px;height:18px}
.info{border-color:var(--lw-c)}
.info .kick{font:700 12px var(--lw-f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--lw-c)}
.info h3{font-size:1.5rem}
.info .cap{font-size:1.1rem}
.info .cap b{color:var(--lw-c)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lchip{min-height:52px;padding:8px 10px;border-radius:16px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;font-size:.95rem;line-height:1.2;text-align:left;display:flex;align-items:center;gap:8px}
.lchip i{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--lw-line);display:grid;place-items:center}
.lchip.seen i{background:var(--lw-ok);border-color:var(--lw-ok)}
.lchip.seen i::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 3px 3px;transform:translateY(-1px) rotate(-45deg)}
.lchip[aria-pressed="true"]{border-color:var(--lw-c);background:var(--lw-cs)}

.text{gap:12px;font-size:1.08rem;line-height:1.55}
.text mark{background:#FFE58A;color:#2A2100;border-radius:4px;padding:0 2px}
/* Runde */
.topbar{display:flex;align-items:center;gap:12px}
.track{flex:1;display:flex;gap:4px}
.track i{flex:1;height:14px;border-radius:99px;background:var(--lw-line)}
.track i.ok{background:var(--lw-ok)}
.track i.no{background:var(--lw-bad)}
.track i.now{background:var(--lw-c)}
.q{display:flex;align-items:center;gap:10px}
.q b{flex:1;display:block;font:700 1.45rem/1.2 var(--lw-f-d)}
.q b em{font-style:normal;color:var(--lw-c)}
.say{flex:none;width:52px;height:52px;border-radius:16px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);color:var(--lw-c);display:grid;place-items:center}
.say svg{width:26px;height:26px}
.stage{display:flex;flex-direction:column;gap:14px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{width:100%;padding:10px 12px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px!important;font-size:1.25rem!important}
.opt:disabled{cursor:default}
.lw-sheet .ghost{width:100%;min-height:52px}
.fb .big{font:700 1.45rem/1.2 var(--lw-f-d);color:var(--lw-ink)}
.fb p{margin-top:4px}

/* Ergebnis */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:68px;height:68px}
.bigstars .s1{animation:pop .5s .1s both}.bigstars .s2{animation:pop .5s .35s both}.bigstars .s3{animation:pop .5s .6s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.result .go,.result .ghost{width:100%}
.missed{align-self:stretch;text-align:left}
.missed ul{margin:6px 0 0;padding-left:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  city:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10l5-3v14M10 21V4l9 4v13"/><path d="M13 10h3M13 14h3M7 13h1M7 17h1"/></svg>`,
  flag:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></svg>`,
  mix:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c4 0 6 10 10 10H21M3 17h3.5c1.6 0 2.8-1.6 3.8-3.5M13.7 9.5C14.7 8.2 15.6 7 17 7h4M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></svg>`,
  star:on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="${on?"#FFC93C":"var(--lw-line)"}" stroke="${on?"#D99A00":"none"}" stroke-width="1.2" stroke-linejoin="round"/></svg>`
};

/* ================= Karte ================= */
/* o: {cls:{id:"on"|"ok"|…}, base:"seen"-Funktion, tap:true, cities:[stadt], label:[id], mh:"50vh"} */
function mapSVG(o){o=o||{};const c=o.cls||{};
  const ps=L.map(l=>`<path class="ld ${c[l.id]||(o.base?o.base(l):"")}" data-l="${l.id}" d="${MAP.l[l.id].d}" fill-rule="evenodd"><title>${o.tap?"":esc(l.n)}</title></path>`).join("");
  // Stadtstaaten sind winzig: größere unsichtbare Tippflächen (und ein Ring, wenn sie gemeint sind)
  const hits=o.tap?["HB","HH","BE"].map(id=>{const [x,y]=lbl(id);return `<circle class="hit" data-l="${id}" cx="${MAP.l[id].c[0]}" cy="${MAP.l[id].c[1]}" r="13"/>`}).join(""):"";
  const rings=(o.ring||[]).map(id=>`<circle class="ring" cx="${MAP.l[id].c[0]}" cy="${MAP.l[id].c[1]}" r="15"/>`).join("");
  const cities=(o.cities||[]).map(s=>{const [x,y]=MAP.cap[s];return `<circle class="city ${o.bigCity?"big":""}" cx="${x}" cy="${y}" r="${o.bigCity?8:4.5}"/>`}).join("");
  const labels=(o.label||[]).map(id=>{const [x,y]=lbl(id);return `<text class="lbl" x="${x}" y="${y+5}" text-anchor="middle">${esc(LAND(id).n.replace("-","-​"))}</text>`}).join("");
  return `<div class="map ${o.tap?"tap":""}" style="${o.mh?"--mh:"+o.mh:""}"><svg viewBox="0 0 ${MAP.w} ${MAP.h}" role="img" aria-label="Karte von Deutschland mit den 16 Bundesländern">${ps}${rings}${cities}${hits}${labels}</svg></div>`}
/* Fortschritt aller Länder in einem Kapitel: Land wird kräftiger, je mehr Punkte */

/* ================= Kapitel ================= */
const CH=[
  {id:"staat",t:"Deutschland ist ein Bundesstaat",d:"Bundesrepublik, Republik, Flächen- und Stadtstaaten",ico:"flag",n:10},
  {id:"entdecken",t:"Deutschland entdecken",d:"Tippe die Länder auf der Karte an und hör zu",ico:"map"},
  {id:"lage",t:"Wo liegt das Land?",d:"Du hörst einen Namen und tippst das Land auf der Karte an",ico:"pin",n:8},
  {id:"name",t:"Wie heißt das Land?",d:"Ein Land leuchtet. Welches ist es?",ico:"look",n:8},
  {id:"stadt",t:"Hauptstädte",d:"Wie heißt die Hauptstadt von diesem Land?",ico:"city",n:8},
  {id:"land",t:"Zu welchem Land gehört die Stadt?",d:"Von der Hauptstadt zum Bundesland",ico:"city",n:8},
  {id:"mix",t:"Große Deutschland-Reise",d:"Alles gemischt",ico:"mix",n:10}
];
const chOf=id=>CH.find(c=>c.id===id);
/* Anteil 0–1: Entdecken = besuchte Länder, Quiz-Kapitel = Punkte aller Länder, Mix = Sterne der besten Runde */
function anteil(c){
  if(c.id==="entdecken")return S.seen.length/16;
  if(c.id==="mix")return (S.best.mix||0)/3;
  if(c.id==="staat")return .7*FAKT.reduce((a,f)=>a+dots("staat",f.id),0)/(FAKT.length*3)+.3*Math.min(1,L.reduce((a,l)=>a+dots("art",l.id),0)/(16*2));
  return L.reduce((a,l)=>a+dots(c.id,l.id),0)/(16*3)}
const sterne=p=>p>=.999?3:p>=2/3?2:p>=1/3?1:0;

/* ================= Startseite ================= */
function home(){hush();R=null;
  const sicher=L.filter(l=>["lage","name","stadt","land"].every(c=>dots(c,l.id)>=3)).length;
  app.innerHTML=`
  <section class="panel"><div class="hero"><span class="badge">${I.map}</span><div class="grow"><h2 style="font-size:1.35rem">Die Bundesrepublik Deutschland hat 16 Bundesländer</h2>
    <p class="small">Jedes Land hat eine Hauptstadt. Wie viele kennst du schon?</p></div></div>
    <div class="row" style="justify-content:space-between"><span class="small"><b style="color:var(--lw-ink)">${S.seen.length} von 16</b> entdeckt</span><span class="small"><b style="color:var(--lw-ink)">${sicher} von 16</b> sitzen ganz sicher</span></div>
    <div class="bar"><i style="width:${(S.seen.length/16*50+sicher/16*50)}%"></i></div></section>
  <div class="stations">${CH.map((c,k)=>{const b=sterne(anteil(c));
    return `<button class="st" data-ch="${c.id}"><span class="ico">${I[c.ico]}</span><span class="grow"><span class="n">Kapitel ${k+1}</span><h3>${c.t}</h3><p>${c.d}</p><span class="stars" aria-label="${b} von 3 Sternen">${[0,1,2].map(i=>I.star(i<b)).join("")}</span></span></button>`}).join("")}</div>
  <section class="panel"><h3>Vorlesen</h3>
    ${TTS.ok?`<p class="small">Die Fragen werden laut vorgelesen. Mit dem Lautsprecher-Knopf hörst du sie noch einmal.</p>
    <div class="modes" role="group" aria-label="Vorlesen">${[[true,"An"],[false,"Aus"]].map(([v,t])=>`<button data-ton="${v}" aria-pressed="${S.ton===v}">${t}</button>`).join("")}</div>
    <div class="modes" role="group" aria-label="Sprechtempo">${[[.7,"Langsam"],[.85,"Normal"],[1,"Schnell"]].map(([v,t])=>`<button data-rate="${v}" aria-pressed="${S.rate===v}">${t}</button>`).join("")}</div>
    <p class="small">Nichts zu hören? Lauter stellen und am iPhone den Stumm-Schalter prüfen.</p>`
    :`<p class="small">Dieser Browser kann leider nicht vorlesen. Alles andere geht trotzdem.</p>`}
  </section>`;
  app.querySelectorAll(".st[data-ch]").forEach(b=>b.onclick=()=>openCh(b.dataset.ch));
  app.querySelectorAll("[data-ton]").forEach(b=>b.onclick=()=>{S.ton=b.dataset.ton==="true";save();home();if(S.ton)speak("Vorlesen ist an.")});
  app.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{S.rate=+b.dataset.rate;save();app.querySelectorAll("[data-rate]").forEach(x=>x.setAttribute("aria-pressed",x===b));speak("Die Hauptstadt vom Saarland ist Saarbrücken.")});
  scrollTo(0,0)}
function openCh(id){id==="entdecken"?entdecken():id==="staat"?lesen():startRound(id)}

/* ================= Grundwissen: erst lesen oder anhören, dann Quiz ================= */
function lesen(){hush();R=null;
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>
    <div><h2>Deutschland ist ein Bundesstaat</h2><p class="small" style="margin-top:4px">Lies dir den Text genau durch oder hör ihn dir an. Danach kommen Fragen dazu.</p></div>
    <section class="panel text">${TEXT.map(t=>`<p>${esc(t).replace(/(Bundesrepublik Deutschland|BRD|16 Bundesländern|gleichberechtigt|Republik|keinen König und keinen Kaiser|Flächenstaaten und Stadtstaaten|Berlin, Hamburg und Bremen|Stadt und Bundesland zugleich|Bayern|Nordrhein-Westfalen)/g,"<mark>$1</mark>")}</p>`).join("")}</section>
    ${mapSVG({mh:"40vh",cls:{BE:"on",HH:"on",HB:"on"},ring:["BE","HH","HB"],label:["BE","HH","HB"]})}
    <p class="small" style="text-align:center">Die drei Stadtstaaten leuchten. Alle anderen sind Flächenstaaten.</p>
    ${TTS.ok?`<button class="ghost" id="hoer">${I.spk}<span>Text anhören</span></button>`:""}
    <button class="go" id="los">Fragen starten</button>`;
  $("#cbk").onclick=home;$("#los").onclick=()=>startRound("staat");
  if($("#hoer"))$("#hoer").onclick=()=>speak(TEXT.join(" "));
  scrollTo(0,0)}

/* ================= Entdecken ================= */
let SEL=null;
function satz(l){return `${Nm(l)}. Die Hauptstadt ist ${l.s}. ${l.staat?"":Nm(l)+" ist ein Flächenstaat. "}${l.f}`}
function entdecken(sel){hush();R=null;SEL=sel||null;const l=SEL&&LAND(SEL);
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>
    <div><h2>Deutschland entdecken</h2><p class="small" style="margin-top:4px">Tippe ein Land auf der Karte an. Du hörst, wie es heißt und wie seine Hauptstadt heißt.</p></div>
    ${mapSVG({tap:true,mh:"56vh",cls:SEL?{[SEL]:"on"}:{},base:x=>S.seen.includes(x.id)?"seen":"",cities:l?[l.s]:[],ring:l&&l.staat?[l.id]:[],label:l?[l.id]:[]})}
    ${l?`<section class="panel info" aria-live="polite"><span class="kick">Bundesland ${S.seen.length} von 16 entdeckt</span><h3>${esc(l.n)}</h3>
      <p class="cap">Hauptstadt: <b>${esc(l.s)}</b></p><p class="small"><b style="color:var(--lw-ink)">${l.staat?"Stadtstaat":"Flächenstaat"}</b>${l.staat?": Stadt und Bundesland zugleich":""}</p><p>${esc(l.f)}</p>
      ${TTS.ok?`<button class="ghost" id="again">${I.spk}<span>Nochmal hören</span></button>`:""}</section>`
      :`<section class="panel"><p>${S.seen.length?`Du hast schon <b>${S.seen.length} von 16</b> Ländern entdeckt. Die grünen kennst du schon.`:"Los geht's! Welches Land tippst du zuerst an?"}</p></section>`}
    <div class="chips">${L.map(x=>`<button class="lchip ${S.seen.includes(x.id)?"seen":""}" data-l="${x.id}" aria-pressed="${x.id===SEL}"><i></i>${esc(x.n)}</button>`).join("")}</div>
    ${S.seen.length===16?`<section class="panel"><b>Alle 16 entdeckt!</b><p class="small">Jetzt kannst du im nächsten Kapitel zeigen, wo die Länder liegen.</p><button class="go" id="nx">Weiter: Wo liegt das Land?</button></section>`:""}`;
  $("#cbk").onclick=home;
  app.querySelectorAll("[data-l]").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.l;
    if(!S.seen.includes(id)){S.seen.push(id);save()}
    const y=scrollY;entdecken(id);if(el.closest(".chips"))scrollTo(0,y);else{const p=$(".info");if(p)p.scrollIntoView({block:"nearest",behavior:"smooth"})}
    speak(satz(LAND(id)))}));
  if($("#again"))$("#again").onclick=()=>speak(satz(l));
  if($("#nx"))$("#nx").onclick=()=>startRound("lage");
  if(!sel)scrollTo(0,0)}

/* ================= Aufgaben ================= */
const others=(l,k)=>shuffle(L.filter(x=>x!==l)).slice(0,k);
const faktTask=f=>{const o=shuffle([f.a,...f.w]);return {l:f,ch:"staat",fakt:true,kind:"mc",q:esc(f.q),say:f.q,map:f.map,opts:o.map(x=>({h:x,ok:x===f.a}))}};
const artTask=l=>({l,ch:"art",kind:"mc",q:`Ist <em>${esc(nm(l))}</em> ein Flächenstaat oder ein Stadtstaat?`,say:`Ist ${nm(l)} ein Flächenstaat oder ein Stadtstaat?`,
  map:{cls:{[l.id]:"on"},ring:l.staat?[l.id]:[],mh:"34vh"},opts:[{h:"Flächenstaat",ok:!l.staat},{h:"Stadtstaat",ok:!!l.staat}]});
/* Fakten mit wenig Punkten kommen öfter dran */
function chooseFakt(n){const out=[];let rest=FAKT.slice();while(out.length<n&&rest.length){const W=rest.map(f=>Math.pow(4-dots("staat",f.id),2)+.6);
  let r=Math.random()*W.reduce((a,b)=>a+b,0),k=0;while(r>W[k]&&k<W.length-1){r-=W[k];k++}out.push(rest[k]);rest.splice(k,1)}return out}
/* Für Flächen- oder Stadtstaat: immer mindestens ein Stadtstaat dabei */
function chooseArt(n){const st=shuffle(L.filter(l=>l.staat)),fl=shuffle(L.filter(l=>!l.staat));return shuffle([st[0],...shuffle(st.slice(1).concat(fl)).slice(0,n-1)])}
const T={
  lage(l){return {l,ch:"lage",kind:"map",q:`Wo liegt <em>${esc(nm(l))}</em>?`,say:`Wo liegt ${nm(l)}? Tippe es auf der Karte an.`}},
  name(l){const o=shuffle([l,...others(l,2)]);return {l,ch:"name",kind:"mc",q:"Wie heißt das Land, das leuchtet?",say:"Wie heißt das Land, das leuchtet?",
    map:{cls:{[l.id]:"on"},ring:l.staat?[l.id]:[]},opts:o.map(x=>({h:x.n,ok:x===l}))}},
  stadt(l){const o=shuffle([l,...others(l,2)]);return {l,ch:"stadt",kind:"mc",q:`Was ist die Hauptstadt von <em>${esc(nm(l))}</em>?`,say:`Was ist die Hauptstadt von ${nm(l)}?`,
    map:{cls:{[l.id]:"on"},ring:l.staat?[l.id]:[],mh:"34vh"},opts:o.map(x=>({h:x.s,ok:x===l}))}},
  land(l){const o=shuffle([l,...others(l,2)]);return {l,ch:"land",kind:"mc",q:`Zu welchem Land gehört <em>${esc(l.s)}</em>?`,say:`Zu welchem Bundesland gehört die Stadt ${l.s}?`,
    map:{cities:[l.s],bigCity:true,base:()=>"dim",mh:"34vh"},opts:o.map(x=>({h:x.n,ok:x===l}))}}
};
/* Länder mit wenig Punkten kommen öfter dran; Stadtstaaten mit gleicher Haupt­stadt nicht bei „Hauptstädte“ hintereinander */
function choose(ch,n){const out=[];let rest=L.slice();
  while(out.length<n){if(!rest.length)rest=L.filter(l=>l!==out[out.length-1]);
    const W=rest.map(l=>Math.pow(4-dots(ch==="mix"?"lage":ch,l.id),2)+.6);let r=Math.random()*W.reduce((a,b)=>a+b,0),k=0;while(r>W[k]&&k<W.length-1){r-=W[k];k++}
    out.push(rest[k]);rest.splice(k,1)}
  return out}

/* ================= Runde ================= */
let R=null;
function startRound(id){hush();const c=chOf(id);
  const ls=choose(id,c.n);
  let tasks;
  if(id==="staat")tasks=shuffle(chooseFakt(7).map(faktTask).concat(chooseArt(3).map(artTask)));
  else{tasks=ls.map(l=>T[id==="mix"?pick(["lage","name","stadt","land"]):id](l));
    if(id==="mix"){tasks.splice(rand(tasks.length),1,faktTask(pick(FAKT)));tasks.splice(rand(tasks.length),1,artTask(pick(L)))}}
  R={id,i:0,ok:0,res:[],miss:[],tasks};R.n=R.tasks.length;showTask()}
function track(){$("#track").innerHTML=Array.from({length:R.n},(_,i)=>`<i class="${i<R.res.length?(R.res[i]?"ok":"no"):(i===R.i?"now":"")}"></i>`).join("")}
function showTask(){hush();const t=R.tasks[R.i];R.locked=false;
  app.innerHTML=`<div class="topbar"><button id="quit" aria-label="Runde beenden"></button><div class="track" id="track"></div></div>
    <div class="q"><b>${t.q}</b>${TTS.ok?`<button class="say" id="say" aria-label="Frage vorlesen">${I.spk}</button>`:""}</div>
    <section class="stage" id="cb"></section>`;
  $("#quit").onclick=home;track();
  const cb=$("#cb");
  if(t.kind==="map"){cb.innerHTML=mapSVG({tap:true,mh:"60vh"});
    cb.querySelectorAll("[data-l]").forEach(el=>el.addEventListener("click",()=>{if(R.locked)return;const ok=el.dataset.l===t.l.id;
      cb.innerHTML=mapSVG({mh:"60vh",cls:ok?{[t.l.id]:"ok"}:{[t.l.id]:"ok",[el.dataset.l]:"bad"},label:ok?[t.l.id]:[t.l.id,el.dataset.l],ring:t.l.staat?[t.l.id]:[]});
      done(ok,ok?null:LAND(el.dataset.l))}))}
  else{cb.innerHTML=(t.map?mapSVG(t.map):"")+`<div class="opts">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.h)}</button>`).join("")}</div>`;
    cb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const o=t.opts[+b.dataset.i];
      cb.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(t.opts[i].ok)x.classList.add("ok")});if(!o.ok)b.classList.add("bad");
      if(t.ch==="land"){const m=cb.querySelector(".map");m.outerHTML=mapSVG(Object.assign({},t.map,{base:null,cls:{[t.l.id]:"ok"},label:[t.l.id]}))}
      done(o.ok,o.ok?null:o.h)})}
  if($("#say"))$("#say").onclick=()=>speak(t.say);
  if(S.ton)speak(t.say);
  scrollTo(0,0)}
function done(ok,wrong){if(R.locked)return;R.locked=true;const t=R.tasks[R.i],l=t.l;
  const m=S.m[t.ch]=S.m[t.ch]||{};m[l.id]=ok?Math.min(3,(m[l.id]||0)+1):0;
  if(!t.fakt&&!S.seen.includes(l.id))S.seen.push(l.id);save();
  R.res.push(ok);if(ok)R.ok++;else if(!R.miss.includes(l))R.miss.push(l);
  ok?sfxOk():sfxBad();track();
  let big,txt;
  if(t.fakt){big=l.big;txt=l.txt}
  else if(t.ch==="art"){big=`${Nm(l)} ist ein ${l.staat?"Stadtstaat":"Flächenstaat"}.`;txt=l.staat?`${l.n} ist Stadt und Bundesland zugleich. Die drei Stadtstaaten sind Berlin, Hamburg und Bremen.`:`${Nm(l)} ist ein großes Land mit vielen Städten und Dörfern. Die Hauptstadt ist ${l.s}.`}
  else if(t.ch==="lage"){big=ok?`Das ist ${nm(l)}!`:`Das war ${nm(wrong)}.`;txt=ok?l.f:`${Nm(l)} ist grün markiert. ${l.f}`}
  else if(t.ch==="name"){big=`Das ist ${nm(l)}.`;txt=l.f}
  else if(t.ch==="stadt"){big=`Die Hauptstadt von ${nm(l)} ist ${l.s}.`;txt=l.staat?`${l.n} ist eine Stadt und ein Bundesland zugleich. Darum heißt die Hauptstadt genauso.`:l.f}
  else{big=`${l.s} liegt in ${l.das?"im Saarland":l.n}.`.replace("in im","im");txt=`${l.s} ist die Hauptstadt von ${nm(l)}.`}
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Toll!"]):"Nicht ganz"}</strong><div class="big">${esc(big)}</div><p>${esc(txt)}</p>`;
  const extra=[];
  if(TTS.ok){const b=document.createElement("button");b.className="ghost";b.type="button";b.innerHTML=I.spk+"<span>Anhören</span>";b.onclick=()=>speak(big+" "+txt);extra.push(b)}
  const nx=document.createElement("button");nx.className="next";nx.type="button";nx.textContent=R.i+1>=R.n?"Ergebnis":"Weiter";
  nx.onclick=()=>{R.i++;R.i>=R.n?endRound():showTask()};
  lwSheet($("#cb"),ok,[fb,...extra,nx]);
  if(S.ton)speak(big)}
function endRound(){hush();const n=R.n,ok=R.ok,q=ok/n;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[R.id]=Math.max(S.best[R.id]||0,st);save();
  const k=CH.findIndex(c=>c.id===R.id),nxt=CH[k+1];
  const cheer=["Weiter üben, du schaffst das!","Gut gemacht!","Stark!","Super, du kennst dich aus!"][st];
  const miss=R.miss,id=R.id;R=null;
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    <p style="font-size:1.15rem"><b>${ok} von ${n}</b> richtig</p>
    ${miss.length?`<div class="panel missed"><b>Diese übst du noch einmal:</b><ul>${miss.map(l=>`<li>${esc(l.n)}: ${esc(l.s)}</li>`).join("")}</ul></div>`:""}
    <button class="go" id="again">Nochmal üben</button>
    ${nxt&&st>=2?`<button class="ghost" id="nx">Weiter: ${esc(nxt.t)}</button>`:""}
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  if(S.ton)speak(cheer+` Du hast ${ok} von ${n} richtig.`);
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;if($("#nx"))$("#nx").onclick=()=>openCh(nxt.id);
  scrollTo(0,0)}

/* Lernwelt: direkt ins Kapitel (bundeslaender.html#stadt …), Anker stehen in hefte.js */
function kapitelSprung(){const id=location.hash.slice(1);if(!chOf(id))return false;openCh(id);return true}
kapitelSprung()||home();
</script>
<script>/* Lernwelt: Kapitel-Fortschritt für die Startseite (siehe sync.js) */
if(window.LW&&LW.kapitel){
LW.kapitel(function(){
  return CH.map(function(c){return {t:c.t,p:anteil(c)}});
});
}</script>
