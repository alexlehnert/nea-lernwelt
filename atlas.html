/* Layout: an atlas cover. Deep blue ground, pale-blue map pages as cards, orange-red as the one signal colour. Single deliberate look in both host themes. */
:root{
  --bg:#1d3667; --bg2:#152a53; --surface:#eef4fa; --ink:#14284f; --muted:#4d648d; --line:#c5d6e9;
  --accent:#e8563a; --accent-ink:#ffffff; --ok:#1d8757; --bad:#c7392b; --chip:#dce8f5; --sky:#a9cdec; --onbg:#ffffff;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-map:"Archivo","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 85% 0%,#25427a 0%,transparent 60%);color:var(--ink);font:16px/1.5 var(--f-body);font-stretch:100%;padding-inline:16px;padding-block:14px 40px;min-height:100%}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font:900 1.55rem/1 var(--f-display);font-stretch:125%;text-transform:uppercase;letter-spacing:.06em;margin:0;color:var(--onbg)}
.brand small{display:block;font:700 .66rem/1 var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--sky);margin-bottom:5px}
.brand .stamp{width:44px;height:44px;flex:none}
.stats{display:flex;gap:8px;font-variant-numeric:tabular-nums}
.pill{background:rgba(255,255,255,.12);color:var(--onbg);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.pill b{color:var(--sky)}
.card{background:var(--surface);border-radius:4px 14px 14px 4px;padding:16px;box-shadow:inset 6px 0 0 #d2e2f2, 0 10px 30px rgba(5,15,40,.28)}
.kicker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tag{font:800 .7rem/1 var(--f-map);font-stretch:110%;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:5px 8px;border-radius:6px}
.tag.soft{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.q{font:850 clamp(1.3rem,4.4vw,1.8rem)/1.15 var(--f-display);font-stretch:112%;letter-spacing:-.005em;margin:0;text-wrap:balance}
.q em{font-style:normal;color:var(--accent)}
.mapbox{position:relative;border-radius:6px;overflow:hidden;border:2px solid var(--ink);background:var(--chip)}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mapbox.pick svg{cursor:crosshair}
.mapbox.globe svg{touch-action:none;cursor:grab}
.hint{font-size:.85rem;color:var(--muted);margin:6px 2px 0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:460px){.choices.three{grid-template-columns:1fr}}
button{font:inherit;color:inherit}
.opt{min-height:56px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:750;font-stretch:105%;font-size:1.02rem;line-height:1.2;text-align:center;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.98)}
.opt:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.num{font:900 1.6rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.feedback{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--chip)}
.feedback .ico{font:900 1.3rem/1 var(--f-display);flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.feedback.ok .ico{background:var(--ok)} .feedback.bad .ico{background:var(--bad)} .feedback.try .ico{background:var(--accent);color:var(--accent-ink)}
.feedback p{margin:0} .feedback .tip{color:var(--muted);font-size:.93rem;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:10px;padding:13px 20px;font:850 1rem/1 var(--f-display);font-stretch:118%;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:#fff;cursor:pointer}
.btn.big{padding:17px 28px;font-size:1.1rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 #a83722}
.btn.big:active{transform:translateY(3px);box-shadow:0 3px 0 #a83722}
.btn.ghost{background:transparent;color:var(--onbg);border:2px solid rgba(255,255,255,.35)}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.settings{display:grid;gap:12px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.setting span{font-weight:700}
.setting small{display:block;color:var(--muted);font-weight:400}
h2{font:900 1.05rem/1.2 var(--f-display);font-stretch:120%;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.m{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--chip);font-size:.92rem;font-weight:700;min-width:0}
.m span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.pips i.on{background:var(--ok);border-color:var(--ok)}
.m.sure{outline:2px solid var(--ok)}
.lead{margin:0 0 4px;color:var(--muted)}
.end-score{font:900 3rem/1 var(--f-display);font-stretch:120%;font-variant-numeric:tabular-nums}
.stars{font-size:2rem;letter-spacing:.15em;color:var(--accent)}
.misslist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.misslist span{background:var(--chip);padding:4px 10px;border-radius:99px;font-weight:700;font-size:.9rem}
.small{font-size:.85rem;color:var(--muted)}
.cover{position:relative;background:var(--bg2);color:var(--onbg);border-radius:4px 16px 16px 4px;padding:20px 18px 18px;overflow:hidden;box-shadow:inset 7px 0 0 #0f2147,0 14px 34px rgba(5,15,40,.35);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.cover .eyebrow{font:800 .68rem/1 var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--sky)}
.cover h2{font:900 clamp(1.9rem,8vw,3rem)/.95 var(--f-display);font-stretch:125%;letter-spacing:.03em;margin:8px 0 10px;color:#fff;text-transform:uppercase}
.cover p{margin:0;color:#d6e4f4;max-width:40ch;font-size:.95rem}
.cover .globe{width:clamp(110px,30vw,180px);height:auto;display:block}
.cover .band{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.cover .band span{font:800 .68rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;border:1.5px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 10px}
@media (max-width:420px){.cover{grid-template-columns:1fr}.cover .globe{justify-self:end;margin-top:-8px;width:120px;grid-row:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.topics{grid-template-columns:repeat(4,minmax(0,1fr))}}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:left;cursor:pointer;min-width:0}
.topic svg{width:40px;height:40px;flex:none}
.topic b{font:850 .98rem/1.15 var(--f-display);font-stretch:104%;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.topic small{color:var(--muted);font-size:.8rem}
.topic[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:#fff7f4}
.topic:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.diagbox{border:2px solid var(--ink);border-radius:6px;background:#f4f8fc;padding:6px}
.diagbox svg{display:block;width:100%;max-width:400px;height:auto;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.diagbox.wide svg{max-width:640px}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:58px;padding:11px 15px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:900 1.05rem/1 var(--f-display);cursor:pointer;transition:transform .1s}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-3px)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.choices.one{grid-template-columns:1fr}
.opt .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ok);margin-right:8px;font-size:.9rem;vertical-align:middle}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt.shake{animation:shake .3s;border-color:var(--bad)}
.gap{display:inline-block;min-width:5ch;border-bottom:4px solid var(--accent);color:var(--accent);text-align:center}
.gap.right{color:var(--ok);border-color:var(--ok)} .gap.wrong{color:var(--bad);border-color:var(--bad)}
dl.defs{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:.93rem}
dl.defs dt{font-weight:800} dl.defs dd{margin:0;color:var(--muted)}
@media (max-width:540px){dl.defs{grid-template-columns:1fr;gap:2px}dl.defs dd{margin-bottom:8px}}
.mhead{font:800 .74rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.mhead:first-child{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.maplab{font-family:var(--f-map);font-weight:700;font-stretch:88%;letter-spacing:.07em;text-transform:uppercase;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.hlstroke{animation:pulse 1.4s ease-in-out infinite}
</style>

  else { const it = itemsFor(SAVE.topic), sure = it.filter(k => mval(k) >= 3).length; s.appendChild(h('span', { class: 'pill' }, `<b>${sure}</b>/${it.length} sicher`)); }
}

  if (title) wrap.appendChild(h('h3', { class: 'mhead' }, title));

}

function next() {
  if (G.i >= G.n) return endScreen();
  const tp = SAVE.topic === 'alles' ? G.seq[G.i] : SAVE.topic;
  const t = tp === 'welt' ? Object.assign(buildTask(), { topic: 'welt' }) : buildOther(tp);
  G.task = t; G.i++;
  G.recent.push(t.target); if (G.recent.length > 3) G.recent.shift();
  G.lastMode = t.mode; if (tp === 'welt') { G.lastStyle = t.style; G.lastProj = t.proj; } G.modeCount[t.mode] = (G.modeCount[t.mode] || 0) + 1;
  persist(); stats(); renderTask(t);
}
function recordItem(k, ok) {
  if (ok) SAVE.mastery[k] = Math.min(3, mval(k) + 1);
  else { G.missed[k] = (G.missed[k] || 0) + 1; SAVE.mastery[k] = Math.max(0, mval(k) - 1); }
  persist();
}
function record(correct, k) { if (correct) G.right++; recordItem(k, correct); stats(); }
function recordMany(res) { const all = res.every(r => r[1]); if (all) G.right++; res.forEach(([k, ok]) => recordItem(k, ok)); stats(); return all; }

function renderTask(t) {
  const sc = $('#screen'); sc.innerHTML = '';
  const prog = h('div', { class: 'progress' }, `<i style="width:${(G.i - 1) / G.n * 100}%"></i>`); sc.appendChild(prog);
  const card = h('section', { class: 'card', style: 'display:flex;flex-direction:column;gap:12px' });
  const projName = { welt: 'Weltkarte', pazifik: 'Pazifik in der Mitte', globus: 'Globus', zoom: 'Ausschnitt', solo: 'Einzeln' }[t.proj];
  if (t.topic !== 'welt') card.appendChild(h('div', { class: 'kicker' }, `<span class="tag">${t.label}</span><span class="tag soft">${TOPIC_INFO[t.topic].n}</span>` + (t.rot ? '<span class="tag soft">gedreht</span>' : '') + (t.tilt < 0 ? '<span class="tag soft">andersherum geneigt</span>' : '')));
  else card.appendChild(h('div', { class: 'kicker' }, `<span class="tag">${MODES[t.mode].label}</span>` + (t.mode === 'wissen' ? '' : `<span class="tag soft">${STY[t.style].name}</span><span class="tag soft">${t.mode === 'nummer' && t.proj === 'globus' ? 'Weltkarte' : projName}</span>`)));
  const q = h('h2', { class: 'q' }); card.appendChild(q);
  const mapHost = h('div'); const hint = h('p', { class: 'hint' });
  const choices = h('div', { class: 'choices' });
  const fb = h('div'); const nav = h('div', { class: 'row' });
  sc.appendChild(card);
  const T = ITEMS[t.target]; const isO = T.t === 'o';
  const art = k => ITEMS[k].t === 'o' ? (k === 'pazifik' || k === 'atlantik' || k === 'indik' ? 'der ' : 'das ') : (k === 'antarktis' ? 'die ' : '');
  let map = null, done = false;

  function finish(correct, msg, extraTip) {
    done = true;
    fb.className = 'feedback ' + (correct ? 'ok' : 'bad');
    fb.innerHTML = `<div class="ico">${correct ? '✓' : '✗'}</div><div><p><b>${msg}</b></p><p class="tip">${extraTip || T.tip}</p></div>`;
    const b = h('button', { class: 'btn', type: 'button', id: 'next' }, G.i >= G.n ? 'Zum Ergebnis' : 'Weiter'); b.onclick = next;
    nav.innerHTML = ''; nav.appendChild(h('span', { class: 'small' }, correct ? rnd(['Stark!', 'Genau!', 'Super, weiter so!', 'Richtig erkannt!']) : 'Merk dir die Stelle gut.')); nav.appendChild(b);
    b.focus({ preventScroll: true });
  }
  function choiceButtons(opts, correctKey, render, onAnswer, numeric, oneCol) {
    choices.innerHTML = ''; choices.className = 'choices' + (oneCol ? ' one' : opts.length === 3 ? ' three' : '');
    for (const o of opts) {
      const b = h('button', { class: 'opt' + (numeric ? ' num' : ''), type: 'button' }, render(o));
      b.onclick = () => {
        if (done) return;
        const ok = o === correctKey;
        [...choices.children].forEach((c, i) => { c.disabled = true; if (opts[i] === correctKey) c.classList.add('ok'); });
        if (!ok) b.classList.add('bad');
        onAnswer(ok, o);
      };
      choices.appendChild(b);
    }
  }

  if (t.topic !== 'welt') {
    const ctx = { card, q, hint, choices, fb, nav, finish, choiceButtons, record, recordMany, done: () => done,
      softMiss: k => { G.missed[k] = 1; persist(); },
      tryAgain(msg, tip) { fb.className = 'feedback try'; fb.innerHTML = `<div class="ico">!</div><div><p><b>${msg}</b></p><p class="tip">${tip}</p></div>`; } };
    (t.topic === 'kompass' ? KMODES : GMODES)[t.mode].render(t, ctx);
    return;
  }
  if (t.mode === 'finde') {
    q.innerHTML = `Tippe auf <em>${T.n}</em>.`;
    let tries = 0;
    const cfg = { style: t.style, proj: t.proj, pick: true, center: centerFor(t.target), onPick(k) {
      if (done) return;
      if (k === t.target) {
        map.mark(k, 'ok'); map.label(sname(k), T.a);
        if (tries === 0) record(true, t.target); else { G.missed[t.target] = 1; persist(); }
        finish(true, tries === 0 ? `Richtig, das ist ${T.n}.` : `Im zweiten Versuch geschafft: ${T.n}.`);
        return;
      }
      tries++;
      if (ITEMS[k]) { map.mark(k, 'bad'); map.label(sname(k), ITEMS[k].a, { size: 13 }); }
      if (tries === 1) {
        fb.className = 'feedback try';
        fb.innerHTML = `<div class="ico">!</div><div><p><b>Das ist ${k === 'binnen' ? 'ein Binnenmeer, kein Ozean' : (ITEMS[k].n)}.</b></p><p class="tip">Noch ein Versuch. ${T.tip}</p></div>`;
      } else {
        map.mark(t.target, 'ok'); map.label(sname(t.target), T.a);
        record(false, t.target);
        finish(false, `Gesucht war ${T.n}. Es ist jetzt grün markiert.`);
      }
    } };
    hint.textContent = t.proj === 'globus' ? 'Den Globus kannst du mit dem Finger drehen.' : (isO ? 'Tippe ins Wasser.' : 'Tippe auf das Land.');
    card.appendChild(mapHost); card.appendChild(hint); card.appendChild(fb); card.appendChild(nav);
    map = drawMap(mapHost, cfg);
  }

  else if (t.mode === 'benenne') {
    q.textContent = isO ? 'Wie heißt der markierte Ozean?' : (t.proj === 'zoom' ? 'Welcher Kontinent ist in diesem Ausschnitt markiert?' : 'Welcher Kontinent ist markiert?');
    card.appendChild(mapHost); if (t.proj === 'globus') { hint.textContent = 'Du kannst den Globus drehen.'; card.appendChild(hint); }
    card.appendChild(choices); card.appendChild(fb); card.appendChild(nav);
    map = drawMap(mapHost, { style: t.style, proj: t.proj, focus: t.target, center: centerFor(t.target) });
    map.mark(t.target, 'hl');
    const opts = shuffle([t.target, ...distractors(t.target, 3)]);
    choiceButtons(opts, t.target, k => sname(k), (ok, k) => { record(ok, t.target); map.label(sname(t.target), T.a); finish(ok, ok ? `Richtig: ${T.n}.` : `Das war ${T.n}, nicht ${sname(k)}.`); });
  }

  else if (t.mode === 'solo') {
    q.textContent = rnd(['Welcher Kontinent hat diese Form?', 'Wessen Umriss ist das?', 'Erkennst du diesen Kontinent ganz allein?']);
    card.appendChild(mapHost); hint.textContent = 'Ohne Nachbarn, ohne Meer. Nur die Form zählt.'; card.appendChild(hint);
    card.appendChild(choices); card.appendChild(fb); card.appendChild(nav);
    map = drawMap(mapHost, { style: t.style, proj: 'solo', focus: t.target });
    const opts = shuffle([t.target, ...distractors(t.target, 3)]);
    choiceButtons(opts, t.target, k => sname(k), (ok, k) => { record(ok, t.target); finish(ok, ok ? `Richtig: ${T.n}.` : `Das war ${T.n}.`); });
  }

  else if (t.mode === 'nummer') {
    const act = shuffle(active());
    const num = {}; act.forEach((k, i) => num[k] = i + 1);
    card.appendChild(mapHost);
    map = drawMap(mapHost, { style: t.style, proj: t.proj === 'globus' ? 'welt' : t.proj });
    for (const k of act) map.badge(num[k], ITEMS[k].a);
    if (t.variant === 'welche') {
      q.innerHTML = `Welche Nummer hat <em>${T.n}</em>?`;
      const opts = shuffle([t.target, ...shuffle(act.filter(k => k !== t.target)).slice(0, 3)]);
      card.appendChild(choices); card.appendChild(fb); card.appendChild(nav);
      choiceButtons(opts, t.target, k => String(num[k]), (ok, k) => { record(ok, t.target); map.mark(t.target, 'ok'); finish(ok, ok ? `Genau, Nummer ${num[t.target]} ist ${T.n}.` : `Nummer ${num[k]} ist ${ITEMS[k].n}. ${T.n} hat die ${num[t.target]}.`); }, true);
    } else {
      q.innerHTML = `Was ist Nummer <em>${num[t.target]}</em>?`;
      const opts = shuffle([t.target, ...distractors(t.target, 3)]);
      card.appendChild(choices); card.appendChild(fb); card.appendChild(nav);
      choiceButtons(opts, t.target, k => sname(k), (ok, k) => { record(ok, t.target); map.mark(t.target, 'ok'); finish(ok, ok ? `Richtig, Nummer ${num[t.target]} ist ${T.n}.` : `Nummer ${num[t.target]} ist ${T.n}.`); });
    }
  }

  else if (t.mode === 'wahr') {
    const shown = t.truth ? t.target : rnd(distractors(t.target, 3));
    q.innerHTML = `Stimmt das? Markiert ist <em>${art(shown)}${sname(shown)}</em>.`;
    card.appendChild(mapHost); card.appendChild(choices); card.appendChild(fb); card.appendChild(nav);
    map = drawMap(mapHost, { style: t.style, proj: t.proj, center: centerFor(t.target), focus: t.target });
    map.mark(t.target, 'hl');
    choiceButtons(['ja', 'nein'], t.truth ? 'ja' : 'nein', o => o === 'ja' ? 'Ja, stimmt' : 'Nein, falsch', ok => {
      record(ok, t.target); map.label(sname(t.target), T.a);
      finish(ok, t.truth ? `Ja, das ist ${T.n}.` : `Nein, markiert ist ${T.n}, nicht ${ITEMS[shown].n}.`);
    });
  }

  else if (t.mode === 'wissen') {
    q.textContent = t.fact[0];
    const opts = t.fact[2] ? shuffle(t.fact[2]) : shuffle([t.target, ...distractors(t.target, 3)]);
    card.appendChild(choices); card.appendChild(fb); card.appendChild(nav);
    choiceButtons(opts, t.target, k => sname(k), ok => {
      record(ok, t.target);
      finish(ok, ok ? `Richtig: ${T.n}.` : `Die Antwort ist ${T.n}.`);

      const m2 = drawMap(mh, { style: 'atlas', proj: t.target === 'pazifik' && SAVE.view !== 'standard' ? 'pazifik' : 'welt' });

    });

  else if (t.mode === 'nachbar') {
    const [ck, phrase] = t.neigh;
    q.innerHTML = `Welcher Ozean liegt <em>${phrase}</em>?`;
    card.appendChild(mapHost); hint.textContent = `${ITEMS[ck].n} ist markiert.`; card.appendChild(hint);
    card.appendChild(choices); card.appendChild(fb); card.appendChild(nav);
    map = drawMap(mapHost, { style: t.style, proj: SAVE.view === 'standard' ? 'welt' : t.proj === 'globus' ? 'globus' : (ck === 'australien' || ck === 'asien' ? 'pazifik' : t.proj), center: ITEMS[ck].a });
    map.mark(ck, 'hl');
    const pool = active().filter(k => ITEMS[k].t === 'o');
    const opts = shuffle([t.target, ...shuffle(pool.filter(k => k !== t.target)).slice(0, 3)]);
    choiceButtons(opts, t.target, k => sname(k), ok => { record(ok, t.target); map.mark(t.target, 'ok'); map.label(sname(t.target), T.a); finish(ok, ok ? `Richtig: ${T.n}.` : `${phrase[0].toUpperCase() + phrase.slice(1)} liegt ${art(t.target)}${T.n}.`); });
  }
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const DIRS = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'];
const MAIN = ['N', 'O', 'S', 'W'], INTER = ['NO', 'SO', 'SW', 'NW'];

function labelTask(c, api, fillKeys, chipText, slotText, afterCheck) {
  const tray = h('div', { class: 'tray' });
  const placed = {}, chips = {}; let sel = null;
  const check = h('button', { class: 'btn', type: 'button', id: 'check' }, 'Prüfen'); check.hidden = true;
  shuffle(fillKeys).forEach(k => {
    const b = h('button', { class: 'chip', type: 'button' }, chipText(k));
    b.onclick = () => { if (c.done()) return; sel = sel === k ? null : k; upd(); };
    chips[k] = b; tray.appendChild(b);
  });
  function upd() {
    const used = Object.values(placed);
    for (const k in chips) { chips[k].hidden = used.includes(k); chips[k].classList.toggle('sel', sel === k); }
    for (const s of fillKeys) api.set(s, placed[s] ? slotText(placed[s]) : '', placed[s] ? 'filled' : (sel ? 'ready' : 'empty'));
    check.hidden = used.length < fillKeys.length;
  }
  function onSlot(s) {
    if (c.done() || !fillKeys.includes(s)) return;
    if (sel) { placed[s] = sel; sel = null; } else if (placed[s]) delete placed[s];
    upd();
  }
  check.onclick = () => {
    if (c.done()) return;
    const res = fillKeys.map(s => [s, placed[s] === s]);
    res.forEach(([s, ok]) => api.set(s, slotText(s), ok ? 'ok' : 'bad'));
    tray.hidden = true;
    afterCheck(res);
  };
  upd();
  return { tray, check, onSlot };
}

/* ---------- Aufgaben: Globus ---------- */

            b.disabled = true; b.classList.add('ok'); b.innerHTML = `<span class="n">${pos + 1}</span>${ITEMS[k].n}`; pos++;

function pickWeighted(pool) {
  const p = pool.filter(k => !G.recent.includes(k)), use = p.length ? p : pool;
  const w = use.map(k => 1 + (3 - mval(k)) * 1.4 + (G.missed[k] ? 3 : 0));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < use.length; i++) { r -= w[i]; if (r <= 0) return use[i]; }
  return use[use.length - 1];
}
function buildOther(tp) {
  const M = tp === 'kompass' ? KMODES : GMODES, pool = tp === 'kompass' ? RK : GK;
  let t = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    const target = pickWeighted(pool);
    const modes = Object.keys(M).filter(m => m !== G.lastMode && M[m].ok(target));
    if (!modes.length) continue;
    modes.sort((a, b) => (G.modeCount[a] || 0) - (G.modeCount[b] || 0) + Math.random() * 1.2 - .6);
    const mode = modes[0];
    t = { topic: tp, mode, target, label: M[mode].label, hard: SAVE.view !== 'standard' };
    M[mode].prep(t);
    const key = [tp, mode, target, t.variant].join('|');
    if (SAVE.seen.includes(key) && attempt < 35) continue;
    SAVE.seen.push(key); return t;
  }
  return t;
}

function endScreen() {

  const sc = $('#screen'); sc.innerHTML = '';

  c.appendChild(h('div', { class: 'end-score' }, `${G.right} von ${G.n}`));
  c.appendChild(h('div', { class: 'stars', 'aria-label': `${stars} von 3 Sternen` }, '★'.repeat(stars) + '<span style="opacity:.25">' + '★'.repeat(3 - stars) + '</span>'));
  const miss = Object.keys(G.missed);
  if (miss.length) {
    c.appendChild(h('p', { style: 'margin:0' }, '<b>Üben:</b> Das kommt in der nächsten Runde öfter dran.'));
    const ml = h('div', { class: 'misslist' }); miss.forEach(k => ml.appendChild(h('span', {}, sname(k)))); c.appendChild(ml);

    if (mw.length) {

      const m = drawMap(mh, { style: 'atlas', proj: 'welt' });
      mw.forEach(k => { m.mark(k, 'bad'); m.label(sname(k), ITEMS[k].a, { size: 12 }); });
    }
  } else c.appendChild(h('p', { style: 'margin:0' }, 'Keine Fehler. Wirklich stark!'));
  sc.appendChild(c);
  const ms = h('section', { class: 'card' }); ms.appendChild(h('h2', {}, 'So sicher bist du')); ms.appendChild(masteryGrid()); sc.appendChild(ms);
  const row = h('div', { class: 'row' });
  const b = h('button', { class: 'btn big', type: 'button', id: 'again' }, 'Neue Runde'); b.onclick = newRound;
  const s = h('button', { class: 'btn ghost', type: 'button', id: 'home' }, 'Startseite'); s.onclick = startScreen;
  row.appendChild(b); row.appendChild(s); sc.appendChild(row);
}

function drawGlobe(svg, size, spin) {
  svg.innerHTML = '';
  const pr = d3.geoOrthographic().rotate([-15, -25, -18]).translate([size / 2, size / 2]).scale(size / 2 - 3);
  const pa = d3.geoPath(pr);
  const g = el('g', spin ? { style: `transform-origin:${size/2}px ${size/2}px` } : {}, svg);
  el('path', { d: pa({ type: 'Sphere' }), fill: '#e8563a' }, svg).parentNode.insertBefore(svg.lastChild, g);
  for (const k of CK) el('path', { d: pa(CONT[k]) || '', fill: '#f6b19f', stroke: '#1d3667', 'stroke-width': size > 100 ? .6 : .4 }, g);
  el('path', { d: pa(d3.geoGraticule().step([30, 30])()), fill: 'none', stroke: '#1d3667', 'stroke-width': size > 100 ? 1.1 : .8, 'stroke-opacity': .85 }, g);
  el('path', { d: pa({ type: 'Sphere' }), fill: 'none', stroke: '#ffffff', 'stroke-width': size > 100 ? 2 : 1.5 }, svg);
  if (spin && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let lon = -15, last = 0; const step = (ts) => { if (!svg.isConnected) return; if (ts - last < 50) { requestAnimationFrame(step); return; } last = ts; lon += .6; pr.rotate([lon, -25, -18]); const ps = g.querySelectorAll('path'); CK.forEach((k, i) => ps[i].setAttribute('d', pa(CONT[k]) || '')); ps[CK.length].setAttribute('d', pa(d3.geoGraticule().step([30, 30])())); requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
}
if (window.d3) { drawGlobe(document.getElementById('stamp'), 44, false); startScreen(); }
else $('#screen').innerHTML = '<div class="card">Die Kartenbibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</div>';
