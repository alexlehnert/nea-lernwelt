<!doctype html><html lang="de"><head><meta charset=utf8><script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/sync.js"></script><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Lernwelt"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5B3FE6"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rechengesetze</title>
<style>
/* Rechengesetze der Addition: Kommutativgesetz K⁺, Assoziativgesetz A⁺, neutrales Element N⁺ (aus Neas Regelheft).
   Kapitel 1 ist die Merkseite mit Bildern zum Ausprobieren, danach Runden mit Sternen.
   Interaktiv: Zahlen ziehen zum Tauschen, Klammer-Gondel setzen, Zahlen-Pärchen zusammenschieben.
   Farben und Schriften kommen aus lernwelt-app.css (hell und dunkel). */
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--lw-bg);color:var(--lw-ink);font-family:var(--lw-f-b);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--lw-f-d);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.6rem}
h3{font-size:1.15rem}
p{margin:0}
b{font-weight:700}
sup{font-size:.6em;line-height:0;position:relative;top:-.15em;vertical-align:super}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--lw-brand);outline-offset:2px}
svg{display:block}
.small{font-size:.88rem;color:var(--lw-muted)}
.lead{font-size:1.05rem}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.panel{background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px}
.ghost svg,.go svg{width:18px;height:18px;flex:none}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* Startseite */
.hero{display:flex;flex-direction:column;gap:8px}
.lawchips{display:flex;gap:8px;flex-wrap:wrap}
.lawchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--lw-ma-s);color:var(--lw-ma);font:700 .95rem/1.1 var(--lw-f-d)}
.stations{display:flex;flex-direction:column;gap:12px}
.st{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px;border-radius:22px;background:var(--lw-card);border:2px solid var(--lw-line);border-bottom-width:5px}
.st:active{transform:translateY(3px);border-bottom-width:2px}
.st .ico{width:56px;height:56px;flex:none;border-radius:16px;background:var(--lw-ma-s);color:var(--lw-ma);display:grid;place-items:center;font:700 1.25rem/1 var(--lw-f-d)}
.st .ico svg{width:30px;height:30px}
.st h3{font-size:1.12rem}

.stars svg{width:20px;height:20px}
.st.read .ico{background:var(--lw-sun);color:#5B3A00}

/* Merkseite (Regelheft) */
.chead{display:flex;align-items:center;gap:12px}
.backb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px 6px 10px;border-radius:14px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);font-weight:700;color:var(--lw-muted)}
.backb svg{width:18px;height:18px}
.law{gap:12px}
.lawhead{display:flex;align-items:center;gap:12px}
.lawhead .badge{width:52px;height:52px;flex:none;border-radius:16px;background:var(--lw-ma);color:#fff;display:grid;place-items:center;font:700 1.4rem/1 var(--lw-f-d)}
.lawhead .badge sup{font-size:.6em}
.lawhead h3{font-size:1.2rem}
.lawhead .small{margin-top:2px}
/* wie im Regelheft: Regel im roten Kasten */
.formel{align-self:center;border:3px solid #D94A3A;border-radius:10px;padding:8px 18px;font:700 clamp(1.35rem,6.5vw,1.8rem)/1.2 var(--lw-f-d);white-space:nowrap;background:var(--lw-card)}
.bsp{font:600 1.1rem/1.5 var(--lw-f-d);font-variant-numeric:tabular-nums}

.meta{background:var(--lw-soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.meta .mt{display:flex;gap:10px;align-items:flex-start}
.meta .em{font-size:1.9rem;line-height:1}

.fb .big{font:700 1.4rem/1.3 var(--lw-f-d);color:var(--lw-ink);font-variant-numeric:tabular-nums}
.fb p{margin-top:4px}
.lw-sheet .ghost{width:100%;min-height:50px}

/* Zahlenkärtchen zum Ziehen */
.zrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font:700 clamp(1.5rem,7.5vw,2.1rem)/1 var(--lw-f-d)}
.zt{min-width:72px;min-height:64px;padding:6px 12px;border-radius:18px;border:3px solid var(--lw-ma);border-bottom-width:6px;background:var(--lw-card);color:var(--lw-ink);font:700 1em/1 var(--lw-f-d);font-variant-numeric:tabular-nums;touch-action:none;position:relative;transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .15s,border-color .15s}

.zt.sel{background:var(--lw-ma);color:#fff;border-color:var(--lw-ma-d)}
.zt.over{background:var(--lw-sun);border-color:#D99A00;color:#3A2600}
.zt.shake{animation:shake .4s}
.zt.pop{animation:pop .45s}
.zt.ten{border-color:var(--lw-ok);background:var(--lw-ok-bg);color:var(--lw-ok-ink)}

.op{color:var(--lw-muted)}
#pz{gap:6px;font-size:clamp(1.3rem,6.4vw,1.8rem)}
#pz .zt{min-width:58px;padding:6px 8px}
.res{min-width:1.6em}
.res.q{color:var(--lw-muted)}
.res.diff{color:var(--lw-bad-ink)}
.res.same{color:var(--lw-ok-ink)}
.before{font:600 1.05rem/1.3 var(--lw-f-d);color:var(--lw-muted);font-variant-numeric:tabular-nums}
.hint{font-size:.95rem;color:var(--lw-muted);display:flex;align-items:center;gap:6px;justify-content:center}
.hint svg{width:22px;height:22px;flex:none;color:var(--lw-ma)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* Ergebnis */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:20px}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:64px;height:64px}
.bigstars .s1{animation:pop .5s .1s both}.bigstars .s2{animation:pop .5s .35s both}.bigstars .s3{animation:pop .5s .6s both}
.result .go,.result .ghost{width:100%}
.missed{align-self:stretch;text-align:left}
.missed ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chatbox{min-width:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
/* ================= Grundlagen ================= */
const $=s=>document.querySelector(s);
const app=$("#app");
const rand=n=>Math.floor(Math.random()*n);
const rnd=(a,b)=>a+rand(b-a+1);
const pick=a=>a[rand(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const notTen=(a,b)=>{let n;do{n=rnd(a,b)}while(n%10===0);return n};
const K=`<span class="lz">K<sup>+</sup></span>`,A=`<span class="lz">A<sup>+</sup></span>`,N=`<span class="lz">N<sup>+</sup></span>`;

/* ================= Zustand ================= */
const KEY="rechengesetze-v1";
const DEF={best:{},chat:{},seen:false};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object")return Object.assign(JSON.parse(JSON.stringify(DEF)),s)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* kurze Töne für richtig/falsch */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function beep(fs,len,type,vol){const a=ac();if(!a)return;let t=a.currentTime+.02;fs.forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type=type||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02);t+=len*.75})}

/* Kärtchen .zt in box: auf ein anderes ziehen ODER erst eins, dann das andere antippen → onPair(a, b) */
function pairTiles(box,onPair){let sel=null;
  const tiles=()=>[...box.querySelectorAll(".zt:not(:disabled)")];
  const under=(t,x,y)=>tiles().find(o=>{if(o===t)return false;const r=o.getBoundingClientRect();return x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6});
  const clear=()=>{if(sel)sel.classList.remove("sel");sel=null};
  box.addEventListener("pointerdown",e=>{const t=e.target.closest(".zt");if(!t||t.disabled||!box.contains(t))return;
    e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(x){}
    const x0=e.clientX,y0=e.clientY;let moved=false;
    const mv=ev=>{const dx=ev.clientX-x0,dy=ev.clientY-y0;
      if(!moved&&Math.hypot(dx,dy)>8){moved=true;t.classList.add("drag");clear()}
      if(moved){t.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;const o=under(t,ev.clientX,ev.clientY);tiles().forEach(x=>x.classList.toggle("over",x===o))}};
    const up=ev=>{t.removeEventListener("pointermove",mv);t.removeEventListener("pointerup",up);t.removeEventListener("pointercancel",up);
      tiles().forEach(x=>x.classList.remove("over"));t.classList.remove("drag");t.style.transform="";
      if(ev.type==="pointercancel")return;
      if(moved){const o=under(t,ev.clientX,ev.clientY);if(o)onPair(t,o);return}
      if(sel===t){clear();return}
      if(sel){const a=sel;clear();onPair(a,t);return}
      sel=t;t.classList.add("sel")};
    t.addEventListener("pointermove",mv);t.addEventListener("pointerup",up);t.addEventListener("pointercancel",up)});
  /* Tastatur: Enter/Leertaste wie Antippen */
  box.addEventListener("click",e=>{if(e.detail!==0)return;const t=e.target.closest(".zt");if(!t||t.disabled)return;
    if(sel===t){clear();return}if(sel){const a=sel;clear();onPair(a,t);return}sel=t;t.classList.add("sel")});
}
/* zwei Kärtchen sichtbar die Plätze tauschen lassen */
function flipSwap(a,b,setVals){const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  setVals();
  a.style.transition=b.style.transition="none";
  a.style.transform=`translate(${rb.left-ra.left}px,${rb.top-ra.top}px)`;b.style.transform=`translate(${ra.left-rb.left}px,${ra.top-rb.top}px)`;
  a.offsetWidth;a.style.transition=b.style.transition="";a.style.transform=b.style.transform=""}

/* Jede Aufgabe: {law, q, kind: mc|kp|swap|gon|pairs, show, …, ex (Erklärung danach)} */
const calc=(a,op,b)=>op==="+"?a+b:op==="−"?a-b:a/b;
const T={
  /* --- K⁺: Tauschen --- */
  swapTest(){const op=pick(["+","+","+","−",":"]);let a,b;
    if(op==="+"){a=rnd(3,60);b=rnd(2,40);if(a===b)b++}
    else if(op==="−"){b=rnd(2,20);a=b+rnd(3,30)}
    else{b=rnd(2,9);let k;do{k=rnd(2,9)}while(k===b);a=b*k}
    return {law:op==="+"?"K":null,lk:op==="+"?K:"Test",kind:"swap",a,op,b,q:"Tausch die beiden Zahlen. Bleibt das Ergebnis gleich?"}},
  gapK(){const a=rnd(12,89),b=rnd(3,49);const v=rand(2);
    return {law:"K",lk:K,kind:"kp",q:"Welche Zahl fehlt?",show:v?`<div class="eq"><span>${a} + ${b}</span><span>=</span><span>${b} +</span><span class="slot" id="slot">?</span></div>`
      :`<div class="eq"><span>${a} + ${b}</span><span>=</span><span class="slot" id="slot">?</span><span>+ ${a}</span></div>`,ans:String(v?a:b),
      ex:`Tauschen erlaubt: ${a} + ${b} = ${b} + ${a}. Beide Seiten sind ${a+b}.`}},
  sameK(){const a=rnd(13,68),b=rnd(14,68);const o=shuffle([[`${b} + ${a}`,true],[`${Math.max(a,b)} − ${Math.min(a,b)}`,false],[`${a} + ${String(b).split("").reverse().join("")}`,false],[`${b} + ${b}`,false]]);
    /* gespiegelte Zahl kann gleich sein (z. B. 22) → dann ersetzen */
    const opts=o.map(([h,ok])=>({h,ok})).filter((x,i,arr)=>arr.findIndex(y=>y.h===x.h)===i);
    return {law:"K",lk:K,kind:"mc",q:"Welcher Term hat denselben Wert?",show:`<div class="eq"><span>${a} + ${b}</span></div>`,opts,
      ex:`Beim Plus darf man tauschen: ${a} + ${b} = ${b} + ${a} = ${a+b}.`}},
  trueK(){const a=rnd(12,40),b=rnd(2,11);const v=pick(["plus","plus","minus","geteilt"]);
    if(v==="plus")return {law:"K",lk:K,kind:"mc",q:"Stimmt das?",show:`<div class="eq"><span>${a} + ${b} = ${b} + ${a}</span></div>`,opts:[{h:"Stimmt",ok:true},{h:"Stimmt nicht",ok:false}],g2:true,
      ex:`Stimmt! Beide Seiten sind ${a+b}. Beim Plus darf man tauschen.`};
    if(v==="minus")return {law:null,lk:"Test",kind:"mc",q:"Stimmt das?",show:`<div class="eq"><span>${a} − ${b} = ${b} − ${a}</span></div>`,opts:[{h:"Stimmt",ok:false},{h:"Stimmt nicht",ok:true}],g2:true,
      ex:`Stimmt nicht! ${a} − ${b} = ${a-b}, aber ${b} − ${a} geht mit unseren Zahlen gar nicht. Beim Minus darf man <b>nicht</b> tauschen.`};
    const d=rnd(2,6),q=rnd(2,9);return {law:null,lk:"Test",kind:"mc",q:"Stimmt das?",show:`<div class="eq"><span>${d*q} : ${d} = ${d} : ${d*q}</span></div>`,opts:[{h:"Stimmt",ok:false},{h:"Stimmt nicht",ok:true}],g2:true,
      ex:`Stimmt nicht! ${d*q} : ${d} = ${q}, aber ${d} : ${d*q} ist kleiner als 1. Beim Teilen darf man <b>nicht</b> tauschen.`}},
  wordK(){return {law:"K",lk:K,kind:"mc",q:"Was sagt das Kommutativgesetz?",show:`<div class="formel">a + b = b + a</div>`,opts:shuffle([
      {h:"Man darf die Summanden vertauschen.",ok:true},{h:"Man darf Klammern umsetzen.",ok:false},{h:"Plus 0 ändert nichts.",ok:false},{h:"Man darf bei Minus tauschen.",ok:false}]),
      ex:"Kommutativ kommt von lateinisch <i>commutare</i>: vertauschen. Bei einer Summe ändert sich der Wert beim Vertauschen nicht."}},

  /* --- A⁺: Klammer-Gondel --- */
  gondel(){/* ein Paar ergibt einen glatten Zehner */const right=rand(2);let x,y,z;
    if(right){x=notTen(12,69);y=notTen(11,58);z=(10-y%10)+10*rnd(0,2);if((x+y)%10===0)x++}
    else{x=notTen(11,58);y=(10-x%10)+10*rnd(0,2);z=notTen(12,69);if((y+z)%10===0)z++}
    return {law:"A",lk:A,kind:"gon",x,y,z,best:right?1:0,q:"Setz die Klammer-Gondel und rechne geschickt."}},
  gapA(){const a=rnd(3,30),b=rnd(2,30),c=rnd(2,30);const v=rand(2);
    return {law:"A",lk:A,kind:"kp",q:"Welche Zahl fehlt?",show:v?`<div class="eq"><span>(${a} + ${b}) + ${c}</span><span>=</span><span>${a} + (</span><span class="slot" id="slot">?</span><span>+ ${c})</span></div>`
      :`<div class="eq"><span>${a} + (${b} + ${c})</span><span>=</span><span>(${a} +</span><span class="slot" id="slot">?</span><span>) + ${c}</span></div>`,ans:String(b),
      ex:`Die Zahlen bleiben gleich, nur die Klammer zieht um: (${a} + ${b}) + ${c} = ${a} + (${b} + ${c}) = ${a+b+c}.`}},
  stepA(){const a=rnd(11,60),b=notTen(2,19);const c=(10-b%10)+10*rnd(0,1);
    return {law:"A",lk:A,kind:"kp",q:"Rechne zuerst die Klammer.",show:`<div class="eq"><span>${a} + (${b} + ${c})</span><span>=</span><span>${a} +</span><span class="slot" id="slot">?</span></div>`,ans:String(b+c),
      ex:`${b} + ${c} = ${b+c}, ein glatter Zehner. Dann ${a} + ${b+c} = ${a+b+c}. Klammer umsetzen macht das Rechnen oft leichter.`}},
  sameA(){const a=rnd(12,40),b=rnd(3,11),c=rnd(2,9);
    const opts=shuffle([{h:`${a} + (${b} + ${c})`,ok:true},{h:`${a} + (${b} − ${c})`,ok:false},{h:`(${a} − ${b}) + ${c}`,ok:false},{h:`(${a} + ${b}) · ${c}`,ok:false}]);
    return {law:"A",lk:A,kind:"mc",q:"Welcher Term hat denselben Wert?",show:`<div class="eq"><span>(${a} + ${b}) + ${c}</span></div>`,opts,
      ex:`Klammer umsetzen ist erlaubt, Rechenzeichen ändern nicht: (${a} + ${b}) + ${c} = ${a} + (${b} + ${c}) = ${a+b+c}.`}},
  minusA(){const a=rnd(14,30),b=rnd(4,9),c=rnd(2,b-1);
    return {law:null,lk:"Test",kind:"mc",q:"Stimmt das?",show:`<div class="eq"><span>(${a} − ${b}) − ${c}</span><span>=</span><span>${a} − (${b} − ${c})</span></div>`,opts:[{h:"Stimmt",ok:false},{h:"Stimmt nicht",ok:true}],g2:true,
      ex:`Stimmt nicht! Links: ${a-b} − ${c} = ${a-b-c}. Rechts: ${a} − ${b-c} = ${a-b+c}. Beim Minus darf man die Klammer <b>nicht</b> umsetzen.`}},

  /* --- N⁺: die neutrale Null --- */
  zeroKp(){const a=rnd(5,999);const v=rand(3);
    const show=v===0?`<span>${a} + 0</span><span>=</span><span class="slot" id="slot">?</span>`:v===1?`<span>0 + ${a}</span><span>=</span><span class="slot" id="slot">?</span>`:`<span class="slot" id="slot">?</span><span>+ 0 = ${a}</span>`;
    return {law:"N",lk:N,kind:"kp",q:"Welche Zahl fehlt?",show:`<div class="eq">${show}</div>`,ans:String(a),
      ex:`Plus 0 ändert nichts: ${v===1?`0 + ${a}`:`${a} + 0`} = ${a}. Die Zahl bleibt, wie sie ist.`}},
  zeroTrue(){const a=rnd(3,99);const v=pick(["falle","falle","ok","ok0","eins","buchst"]);
    const M={falle:[`${a} + 0 = 0`,false,`Stimmt nicht! Das ist die Abschreib-Falle. Plus 0 ändert nichts, also ${a} + 0 = <b>${a}</b>.`],
      ok:[`0 + ${a} = ${a}`,true,`Stimmt! Die 0 darf auch vorne stehen (tauschen, ${K}). Der Wert bleibt ${a}.`],
      ok0:["0 + 0 = 0",true,"Stimmt! Null plus null ist null. Auch hier ändert die 0 nichts."],
      eins:[`${a} + 1 = ${a}`,false,`Stimmt nicht! Plus 1 macht die Zahl um eins größer: ${a} + 1 = ${a+1}. Nur die 0 ändert nichts.`],
      buchst:["a + 0 = 0",false,"Stimmt nicht! Richtig heißt die Regel <b>a + 0 = a</b>: Die Zahl a bleibt übrig, nicht die 0."]}[v];
    return {law:"N",lk:N,kind:"mc",q:"Stimmt das?",show:`<div class="eq"><span>${M[0]}</span></div>`,opts:[{h:"Stimmt",ok:M[1]},{h:"Stimmt nicht",ok:!M[1]}],g2:true,ex:M[2]}},
  zeroWhich(){const v=rand(2);
    if(v)return {law:"N",lk:N,kind:"mc",q:"Welche Zahl ist das neutrale Element der Addition?",show:`<div class="eq"><span>a + ? = a</span></div>`,
      opts:shuffle([{h:"0",ok:true},{h:"1",ok:false},{h:"10",ok:false},{h:"a",ok:false}]),g2:true,ex:"Die 0: Sie ändert beim Addieren nichts. Darum heißt sie neutrales Element der Addition."};
    return {law:"N",lk:N,kind:"mc",q:"Warum heißt die 0 „neutral“?",show:`<div class="formel">a + 0 = a</div>`,
      opts:shuffle([{h:"Sie ändert beim Plus nichts.",ok:true},{h:"Sie macht jede Summe zu 0.",ok:false},{h:"Sie ist die kleinste Zahl.",ok:false},{h:"Man darf sie weglassen, wenn sie vorne steht.",ok:false}]),
      ex:"Neutral heißt: Sie hält sich raus, wie eine Schiedsrichterin, die zu keiner Mannschaft hält. Plus 0 ändert die Zahl nicht."}},

  /* --- Geschickt rechnen: K⁺ und A⁺ zusammen --- */
  pairs(){const n=rand(3)?4:3;const p=()=>{const a=notTen(11,79);return [a,(10-a%10)+10*rnd(0,3)]};
    let nums;do{nums=n===4?[...p(),...p()]:[...p(),notTen(11,69)];nums=shuffle(nums)}while(!badStart(nums));
    return {law:"KA",lk:K+" "+A,kind:"pairs",nums,q:"Schieb zwei Zahlen zusammen, die einen glatten Zehner ergeben."}},
  clever(){const a=notTen(3,9),b=notTen(21,78),c=10-a;
    const opts=shuffle([{h:`(${a} + ${c}) + ${b}`,ok:true},{h:`(${a} + ${b}) + ${c}`,ok:false},{h:`${a} + (${b} + ${c})`,ok:false}]);
    return {law:"KA",lk:K+" "+A,kind:"mc",q:"Wie rechnest du am geschicktesten?",show:`<div class="eq"><span>${a} + ${b} + ${c}</span></div>`,opts,
      ex:`Erst ${c} nach vorne tauschen (${K}), dann zusammen klammern (${A}): ${a} + ${c} = 10, und 10 + ${b} = ${a+b+c}. Alle drei Wege geben ${a+b+c}, aber der erste ist am leichtesten.`}},
  clever100(){const a=pick([25,75,40,60,35,65,45,55]),c=100-a,b=notTen(13,89);
    return {law:"KA",lk:K+" "+A,kind:"kp",q:"Rechne geschickt im Kopf.",show:`<div class="eq"><span>${a} + ${b} + ${c}</span><span>=</span><span class="slot" id="slot">?</span></div>`,ans:String(a+b+c),
      ex:`${a} + ${c} = 100. Tauschen und klammern: (${a} + ${c}) + ${b} = 100 + ${b} = ${a+b+c}.`}},

  /* --- Detektivin: welches Gesetz? --- */
  which(){const a=rnd(4,60),b=rnd(3,40),c=rnd(2,30);const v=pick(["K","A","N","X","X2"]);
    const M={K:[`${a} + ${b} = ${b} + ${a}`,"K",`Die Zahlen haben die Plätze getauscht: Kommutativgesetz ${K}.`],
      A:[`(${a} + ${b}) + ${c} = ${a} + (${b} + ${c})`,"A",`Gleiche Reihenfolge, nur die Klammer ist umgezogen: Assoziativgesetz ${A}.`],
      N:[pick([`${a} + 0 = ${a}`,`0 + ${a} = ${a}`]),"N",`Plus 0 ändert nichts: Gesetz vom neutralen Element ${N}.`],
      X:[`${a+b} − ${b} = ${b} − ${a+b}`,"X",`Das stimmt gar nicht: Beim Minus darf man nicht tauschen.`],
      X2:[`${a} + 0 = 0`,"X",`Das stimmt nicht: ${a} + 0 = ${a}. Richtig wäre a + 0 = a.`]}[v];
    return {law:v[0]==="X"?null:v,lk:"Welches?",kind:"mc",q:"Welches Gesetz steckt dahinter?",show:`<div class="eq"><span>${M[0]}</span></div>`,g2:true,
      opts:[{h:`${K} tauschen`,ok:M[1]==="K"},{h:`${A} Klammer`,ok:M[1]==="A"},{h:`${N} Null`,ok:M[1]==="N"},{h:"Stimmt nicht!",ok:M[1]==="X"}],ex:M[2]}},
  name(){const v=pick(["K","A","N"]);const nm={K:"Kommutativgesetz",A:"Assoziativgesetz",N:"Gesetz vom neutralen Element"};
    const f={K:"a + b = b + a",A:"(a + b) + c = a + (b + c)",N:"a + 0 = a"};
    return {law:v,lk:"Welches?",kind:"mc",q:"Wie heißt dieses Gesetz?",show:`<div class="formel">${f[v]}</div>`,opts:shuffle(["K","A","N"].map(k=>({h:nm[k],ok:k===v}))),
      ex:`${f[v]} ist das ${nm[v]} (${{K,A,N}[v]}).`}},
  fach(){return {law:null,lk:"Fachwort",kind:"mc",q:"Wie heißen die Zahlen, die man addiert?",show:`<div class="eq"><span>5 + 6 = 11</span></div>`,
      opts:shuffle([{h:"Summanden",ok:true},{h:"Summen",ok:false},{h:"Faktoren",ok:false},{h:"Differenzen",ok:false}]),
      ex:"5 und 6 sind die <b>Summanden</b>. 5 + 6 ist die <b>Summe</b>, 11 ist der <b>Wert der Summe</b>."}}
};

/* ================= Kapitel 1: Regelheft ================= */
function regeln(){R=null;
  app.innerHTML=`<div class="chead"><button class="backb" id="cbk">${I.back}Alle Kapitel</button></div>

  <section class="panel">
    <h3>Erst die Fachwörter</h3>

    <div class="meta"><div class="mt"><span class="em">🎒</span><div><b>Stell dir vor: Murmeln in den Rucksack</b>Ob du zuerst 5 Murmeln und dann 6 einpackst oder zuerst 6 und dann 5: Im Rucksack sind am Ende immer 11.</div></div>

    <div class="formel">(a + b) + c = a + (b + c)</div>

    <p class="worte"><span class="wl">In Worten</span>Bei einer Summe aus drei Summanden ändert sich der Wert nicht, wenn man zuerst den 2. und 3. Summanden addiert statt den 1. und 2.</p>
    <div class="meta"><div class="mt"><span class="em">🎠</span><div><b>Stell dir vor: Die Klammer ist eine Karussell-Gondel</b>Wer zusammen in der Gondel sitzt, wird zuerst zusammengezählt. Egal, wer mit wem fährt: Am Ende steigen gleich viele aus.</div></div>

/* ================= Runde ================= */
let R=null;
function startRound(id){const c=chOf(id);
  const pool=c.types||ALL;let list=[];
  /* jede Aufgabenart mindestens einmal (wenn Platz), Rest zufällig, nie zweimal dieselbe Art hintereinander */
  const base=shuffle(c.types?Array.from(new Set(c.types)):pool).slice(0,c.n);
  while(base.length<c.n)base.push(pick(pool));
  list=shuffle(base);for(let i=1;i<list.length;i++)if(list[i]===list[i-1]){const j=list.findIndex((x,k)=>k>i&&x!==list[i]&&x!==list[i-1]);if(j>0)[list[i],list[j]]=[list[j],list[i]]}
  R={id,i:0,ok:0,res:[],miss:[],tasks:list.map(k=>T[k]())};R.n=R.tasks.length;showTask()}
function track(){$("#track").innerHTML=Array.from({length:R.n},(_,i)=>`<i class="${i<R.res.length?(R.res[i]?"ok":"no"):(i===R.i?"now":"")}"></i>`).join("")}
function showTask(){const t=R.tasks[R.i];R.locked=false;R.typed="";
  app.innerHTML=`<div class="topbar"><button id="quit" aria-label="Runde beenden"></button><div class="track" id="track"></div></div>
    <div class="q"><b>${t.q}</b><span class="lk">${t.lk}</span></div>
    <section class="stage" id="cb"></section>`;
  $("#quit").onclick=home;track();
  const cb=$("#cb");
  if(t.kind==="swap")return swapTask(t,cb);
  if(t.kind==="gon")return gonTask(t,cb);
  if(t.kind==="pairs")return pairsTask(t,cb);
  let h=`<div class="show">${t.show}</div>`;
  if(t.kind==="mc")h+=`<div class="opts ${t.g2?"g2":""}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.h}</button>`).join("")}</div>`;
  else h+=keypad();
  cb.innerHTML=h;
  if(t.kind==="mc")cb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const o=t.opts[+b.dataset.i];
    cb.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(t.opts[i].ok)x.classList.add("ok")});if(!o.ok)b.classList.add("bad");done(o.ok,t.ex)});
  else wireKeypad(cb,t.ans,4,(ok,typed)=>done(ok,(ok?"":`Richtig ist <b>${t.ans}</b>. `)+t.ex));
  scrollTo(0,0)}
function keypad(){return `<div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="del" aria-label="Löschen">${I.del}</button><button data-k="0">0</button><button class="ok" data-k="ok" disabled>OK</button></div>`}
/* Ziffernblock (eigener, damit keine Handy-Tastatur aufspringt) */
function wireKeypad(cb,ans,max,fin){R.kp=k=>{if(R.locked)return;
    if(k==="ok"){if(!R.typed)return;const ok=R.typed===ans;const sl=$("#slot");sl.classList.add(ok?"ok":"bad");cb.querySelectorAll(".kp button").forEach(b=>b.disabled=true);fin(ok,R.typed);return}
    if(k==="del")R.typed=R.typed.slice(0,-1);else if(R.typed.length<max)R.typed=(R.typed==="0"?"":R.typed)+k;
    const sl=$("#slot");sl.textContent=R.typed||"?";sl.classList.toggle("full",!!R.typed);cb.querySelector(".kp .ok").disabled=!R.typed};
  cb.querySelectorAll(".kp button").forEach(b=>b.onclick=()=>R.kp(b.dataset.k))}
document.addEventListener("keydown",e=>{if(!R||!R.kp||R.locked||e.metaKey||e.ctrlKey||e.altKey||!$(".kp"))return;
  if(/^[0-9]$/.test(e.key))R.kp(e.key);else if(e.key==="Backspace")R.kp("del");else if(e.key==="Enter"){e.preventDefault();R.kp("ok")}});

/* --- Tausch-Test: Zahlen ziehen, dann sagen, ob das Ergebnis gleich bleibt --- */
function swapTask(t,cb){R.kp=null;const r0=calc(t.a,t.op,t.b);let L=t.a,Rr=t.b,n=0;
  const res=(x,y)=>{const v=calc(x,t.op,y);return Number.isInteger(v)&&v>=0?v:null};
  cb.innerHTML=`<div class="show"><div class="zrow" id="sw"><button class="zt" data-i="0">${L}</button><span class="op">${t.op}</span><button class="zt" data-i="1">${Rr}</button><span class="op">=</span><span class="res" id="rs">${r0}</span></div>
    <p class="before" id="bf" hidden></p><p class="hint" id="hn">${I.hand}Zieh eine Zahl auf die andere, um sie zu tauschen.</p></div>
    <div class="opts g2" id="ans" hidden><button class="opt" data-v="1">Bleibt gleich</button><button class="opt" data-v="0">Ändert sich</button></div>`;
  const [z0,z1]=cb.querySelectorAll(".zt");
  pairTiles($("#sw"),()=>{if(R.locked)return;flipSwap(z0,z1,()=>{[L,Rr]=[Rr,L];z0.textContent=L;z1.textContent=Rr});sfxPop();n++;
    const v=res(L,Rr),rs=$("#rs"),same=v===r0;
    rs.textContent=v==null?"?":v;rs.className="res "+(L===t.a?"":(same?"same":"diff"));
    $("#bf").hidden=L===t.a;$("#bf").innerHTML=`Vorher: ${t.a} ${t.op} ${t.b} = ${r0}`+(v==null&&L!==t.a?`<br>${L} ${t.op} ${Rr} geht mit unseren Zahlen nicht auf.`:"");
    $("#hn").hidden=true;$("#ans").hidden=false});
  cb.querySelectorAll("#ans .opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const same=t.op==="+";const ok=(b.dataset.v==="1")===same;
    cb.querySelectorAll("#ans .opt").forEach(x=>{x.disabled=true;if((x.dataset.v==="1")===same)x.classList.add("ok")});if(!ok)b.classList.add("bad");
    const ex=same?`${t.a} + ${t.b} = ${t.b} + ${t.a} = ${r0}. Beim Plus darf man tauschen (${K}).`
      :t.op==="−"?`${t.a} − ${t.b} = ${r0}, aber ${t.b} − ${t.a} geht nicht auf. Beim Minus darf man <b>nicht</b> tauschen.`
      :`${t.a} : ${t.b} = ${r0}, aber ${t.b} : ${t.a} ist kleiner als 1. Beim Teilen darf man <b>nicht</b> tauschen.`;
    done(ok,ex)});
  scrollTo(0,0)}

/* --- Klammer-Gondel: auf ein Plus tippen, dann rechnen --- */
function gonTask(t,cb){let g=null;const ns=[t.x,t.y,t.z],tot=t.x+t.y+t.z;
  cb.innerHTML=`<div class="show"><div class="gline" id="gl"></div><div class="steps" id="gs"><span class="hint">${I.hand}Tipp auf ein Plus: Diese zwei Zahlen fahren zusammen in der Gondel.</span></div>
    <div class="eq"><span>=</span><span class="slot" id="slot">?</span></div></div>${keypad()}`;
  const paint=()=>{const p=i=>`<button class="plus ${g===i?"in":""}" data-g="${i}" aria-label="Klammer um ${ns[i]} und ${ns[i+1]}">+</button>`;
    $("#gl").innerHTML=g===0?`<span class="gon"><span class="br">(</span>${ns[0]} ${p(0)} ${ns[1]}<span class="br">)</span></span>${p(1)}<span>${ns[2]}</span>`
      :g===1?`<span>${ns[0]}</span>${p(0)}<span class="gon"><span class="br">(</span>${ns[1]} ${p(1)} ${ns[2]}<span class="br">)</span></span>`
      :`<span>${ns[0]}</span>${p(0)}<span>${ns[1]}</span>${p(1)}<span>${ns[2]}</span>`;
    if(g!=null){const s=ns[g]+ns[g+1],zehn=s%10===0;$("#gs").innerHTML=g===0?`= <b>${s}</b> + ${ns[2]}`:`= ${ns[0]} + <b>${s}</b>`;
      $("#gs").innerHTML+=`<div class="small">${zehn?"👍 Ein glatter Zehner, jetzt ist es leicht!":"Geht auch, aber mit der anderen Gondel wird es leichter."}</div>`}
    $("#gl").querySelectorAll(".plus").forEach(b=>b.onclick=()=>{if(R.locked)return;g=+b.dataset.g;paint();sfxPop();cb.querySelectorAll(".kp button:not(.ok)").forEach(x=>x.disabled=false)})};
  paint();cb.querySelectorAll(".kp button").forEach(b=>b.disabled=true);
  wireKeypad(cb,String(tot),4,(ok)=>{const bp=t.best,s=ns[bp]+ns[bp+1];
    const way=bp===0?`(${ns[0]} + ${ns[1]}) + ${ns[2]} = ${s} + ${ns[2]} = ${tot}`:`${ns[0]} + (${ns[1]} + ${ns[2]}) = ${ns[0]} + ${s} = ${tot}`;
    done(ok,(ok?"":`Richtig ist <b>${tot}</b>. `)+`Am leichtesten: ${way}. ${g===bp?"Du hast die geschickte Gondel gewählt!":"Die Klammer darf man umsetzen (A⁺), das Ergebnis bleibt gleich."}`)});
  scrollTo(0,0)}

/* --- Zahlen-Pärchen: zwei Zahlen zusammenschieben, die einen glatten Zehner geben --- */
function pairsTask(t,cb){R.kp=null;let nums=t.nums.slice(),miss=0;const tot=nums.reduce((a,b)=>a+b,0),log=[];
  cb.innerHTML=`<div class="show"><div class="zrow" id="pz"></div><p class="hint" id="ph">${I.hand}Zieh eine Zahl auf ihre Partnerin oder tipp beide an.</p><div class="steps" id="pl"></div></div>`;

    $("#pl").innerHTML=log.map(x=>`<div>${x}</div>`).join("")};
  const anyTen=()=>{for(let i=0;i<nums.length;i++)for(let j=i+1;j<nums.length;j++)if((nums[i]+nums[j])%10===0)return true;return false};
  paint();
  pairTiles($("#pz"),(a,b)=>{if(R.locked)return;const i=+a.dataset.i,j=+b.dataset.i,s=nums[i]+nums[j];
    if(s%10!==0&&anyTen()){miss++;sfxBad();[a,b].forEach(x=>{x.classList.remove("shake");x.offsetWidth;x.classList.add("shake")});

    log.push(`${nums[i]} + ${nums[j]} = <b>${s}</b>`);const lo=Math.min(i,j);nums=nums.filter((_,k)=>k!==i&&k!==j);nums.splice(lo,0,s);sfxPop();paint(lo);
    if(nums.length===1){R.locked=true;$("#ph").innerHTML=`Fertig! Zusammen sind es <b>${tot}</b>.`;
      setTimeout(()=>done(miss===0,`${t.nums.join(" + ")} = ${tot}. Tauschen (${K}) und neu klammern (${A}) darf man beim Plus, darum kannst du dir die Pärchen frei aussuchen.`+(miss?` Du hast ${miss}-mal ein Paar ohne glatten Zehner probiert.`:""),true),500)}
    else $("#ph").innerHTML=anyTen()?`${I.hand}Super! Weiter, welche zwei passen jetzt?`:`${I.hand}Jetzt den Rest zusammenschieben.`});
  scrollTo(0,0)}

function done(ok,ex,force){if(R.locked&&!force)return;R.locked=true;const t=R.tasks[R.i];
  R.res.push(ok);if(ok)R.ok++;else R.miss.push(t);
  ok?sfxOk():sfxBad();track();
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Stark!"]):"Nicht ganz"}</strong><p>${ex}</p>`;
  const nx=document.createElement("button");nx.className="next";nx.type="button";nx.textContent=R.i+1>=R.n?"Ergebnis":"Weiter";
  nx.onclick=()=>{R.i++;R.i>=R.n?endRound():showTask()};
  lwSheet($("#cb"),ok,[fb,nx])}
const LAWNAME={K:"Tauschen (K⁺)",A:"Klammer umsetzen (A⁺)",N:"Plus 0 (N⁺)",KA:"Geschickt rechnen (K⁺ und A⁺)"};
function endRound(){const n=R.n,ok=R.ok,q=ok/n;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
