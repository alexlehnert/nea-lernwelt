:root{color-scheme:light dark}

.q{display:flex;align-items:center;gap:10px}

.q b em{font-style:normal;color:var(--lw-c)}
.say{flex:none;width:52px;height:52px;border-radius:16px;border:2px solid var(--lw-line);border-bottom-width:4px;background:var(--lw-card);color:var(--lw-c);display:grid;place-items:center}

.bigstars svg{width:68px;height:68px}
.bigstars .s1{animation:pop .5s .1s both}.bigstars .s2{animation:pop .5s .35s both}.bigstars .s3{animation:pop .5s .6s both}

.missed ul{margin:6px 0 0;padding-left:20px}

<script>
"use strict";
const $=s=>document.querySelector(s);
const app=$("#app");
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];

function beep(fs,len,type,vol){const a=ac();if(!a)return;let t=a.currentTime+.02;fs.forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type=type||"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02);t+=len*.75})}
const sfxOk=()=>beep([1046.5,1318.5],.14);
const sfxBad=()=>beep([233,175],.18,"triangle",.12);

/* o: {cls:{id:"on"|"ok"|"bad"}, base:fn, tap, ov:{n,c}, sel:id, label:[id], deOn, mh} */
function mapSVG(o){o=o||{};const c=o.cls||{};
  const ps=L.map(l=>`<path class="ld ${c[l.id]||(o.base?o.base(l):"")}" data-l="${l.id}" d="${MAP.l[l.id].d}" fill-rule="evenodd"><title>${o.tap?"":esc(l.n)}</title></path>`).join("");
  // Luxemburg ist winzig: größere unsichtbare Tippfläche
  const hits=o.tap?`<circle class="hit" data-l="LUX" cx="${MAP.l.LUX.c[0]}" cy="${MAP.l.LUX.c[1]}" r="11"/>`:"";
  const ov=o.ov||{},out=[];
  // o.sel: das angetippte Land zeigt immer Namen und Hauptstadt
  const lay=(ov,id)=>{const l=LAND(id);
    if(ov.c){const [x,y]=MAP.cap[l.s],[dx,dy,a]=OVC[l.s];out.push(`<circle class="city ov" cx="${x}" cy="${y}" r="3.6"/>`+(ov.n&&l.s===l.n?"":`<text class="clbl" x="${x+dx}" y="${y+dy}" text-anchor="${a}">${esc(l.s)}</text>`))}
    if(ov.n){const [x,y]=OVN[id];out.push(`<text class="nlbl${o.sel===id?" hl":""}" x="${x}" y="${y}" text-anchor="middle">${esc(l.n)}</text>`)}};
  L.forEach(l=>l.id===o.sel?lay({n:true,c:true},l.id):lay(ov,l.id));
  if(ov.c){const [x,y]=MAP.cap.Berlin,[dx,dy,a]=OVC.Berlin;out.push(`<circle class="city ov" cx="${x}" cy="${y}" r="3.6"/><text class="clbl" x="${x+dx}" y="${y+dy}" text-anchor="${a}">Berlin</text>`)}
  // o.dots: Hauptstädte als Punkte ohne Namen, o.big: eine Stadt groß markiert
  (o.dots||[]).forEach(n=>{const [x,y]=MAP.cap[n];out.push(`<circle class="city" cx="${x}" cy="${y}" r="4"/>`)});
  if(o.big){const [x,y]=MAP.cap[o.big];out.push(`<circle class="city big" cx="${x}" cy="${y}" r="7"/>`)}
  const labels=(o.label||[]).map(id=>{const [x,y]=OVN[id];return `<text class="lbl" x="${x}" y="${y+4}" text-anchor="middle">${esc(LAND(id).n)}</text>`}).join("");
  const rose=o.rose===false?"":`<g class="rose" transform="translate(350,38)"><path d="M0,-17 L5,0 L0,-4 L-5,0Z"/><path d="M0,17 L5,0 L0,4 L-5,0Z" opacity=".35"/><path d="M-17,0 L0,5 L-4,0 L0,-5Z" opacity=".35"/><path d="M17,0 L0,5 L4,0 L0,-5Z" opacity=".35"/>
    <text y="-21" text-anchor="middle">N</text><text y="31" text-anchor="middle">S</text><text x="-27" y="4" text-anchor="middle">W</text><text x="27" y="4" text-anchor="middle">O</text></g>`;
  return `<div class="map ${o.tap?"tap":""}" style="${o.mh?"--mh:"+o.mh:""}"><svg viewBox="0 0 ${MAP.w} ${MAP.h}" role="img" aria-label="Karte von Deutschland und seinen 9 Nachbarländern">
    <rect class="sea" x="0" y="0" width="${MAP.w}" height="${MAP.h}"/><path class="ctx" d="${MAP.ctx}" fill-rule="evenodd"/>
    <text class="sealbl" x="82" y="100" text-anchor="middle">Nordsee</text><text class="sealbl" x="262" y="84" text-anchor="middle">Ostsee</text>
    <path class="de ${o.deOn?"on":""}" d="${MAP.l.DEU.d}" fill-rule="evenodd"/><text class="delbl" x="176" y="${ov.c?232:226}" text-anchor="middle" style="${o.deOn?"fill:#fff":""}">DEUTSCHLAND</text>
    ${ps}${out.join("")}${hits}${labels}${rose}</svg></div>`}

const wo=l=>`${Nm(l)} ${liegt(l)} im ${RN[l.r]} von Deutschland`;
function satz(l){return `${Nm(l)}. ${wo(l)}. Die Hauptstadt ist ${l.s}. ${l.f}`}
const ov=()=>S.ov||(S.ov={n:true,c:true});

/* ================= Aufgaben ================= */
const others=(l,k)=>shuffle(L.filter(x=>x!==l)).slice(0,k);
const T={
  lage(l){return {l,ch:"lage",kind:"map",q:`Wo ${liegt(l)} <em>${esc(nm(l))}</em>?`,say:`Wo ${liegt(l)} ${nm(l)}? Tippe das Land auf der Karte an.`}},
  name(l){const o=shuffle([l,...others(l,2)]);return {l,ch:"name",kind:"mc",q:"Wie heißt das Nachbarland, das leuchtet?",say:"Wie heißt das Nachbarland, das leuchtet?",
    map:{cls:{[l.id]:"on"},mh:"40vh"},opts:o.map(x=>({h:x.n,ok:x===l}))}},
  richtung(l){
    if(Math.random()<.55)return {l,ch:"richtung",kind:"mc",dirs:true,q:`In welcher Himmelsrichtung von Deutschland ${liegt(l)} <em>${esc(nm(l))}</em>?`,
      say:`In welcher Himmelsrichtung von Deutschland ${liegt(l)} ${nm(l)}?`,map:{cls:{[l.id]:"on"},mh:"36vh"},
      opts:["N","O","S","W"].map(r=>({h:RN[r],ok:r===l.r}))};
    const w=shuffle(L.filter(x=>x.r!==l.r)).slice(0,2),o=shuffle([l,...w]);
    return {l,ch:"richtung",kind:"mc",q:`Welches Nachbarland liegt im <em>${RN[l.r]}</em> von Deutschland?`,say:`Welches Nachbarland liegt im ${RN[l.r]} von Deutschland?`,
      map:{base:()=>"",mh:"36vh",deOn:true},opts:o.map(x=>({h:x.n,ok:x===l}))}},
  stadt(l){const k=rand(3),caps=L.map(x=>x.s);
    if(k===0){const o=shuffle([l,...others(l,2)]);return {l,ch:"stadt",kind:"mc",q:`Was ist die Hauptstadt <em>${esc(von(l))}</em>?`,say:`Was ist die Hauptstadt ${von(l)}?`,
      map:{cls:{[l.id]:"on"},mh:"36vh"},opts:o.map(x=>({h:x.s,ok:x===l}))}}
    if(k===1){const o=shuffle([l,...others(l,2)]);return {l,ch:"stadt",kind:"mc",q:`Von welchem Land ist <em>${esc(l.s)}</em> die Hauptstadt?`,say:`Von welchem Land ist ${l.s} die Hauptstadt?`,
      map:{big:l.s,mh:"36vh"},opts:o.map(x=>({h:x.n,ok:x===l}))}}
    return {l,ch:"stadt",kind:"map",city:true,q:`Wo liegt <em>${esc(l.s)}</em>?`,say:`Wo liegt die Stadt ${l.s}? Tippe das Land auf der Karte an.`,dots:caps}},
  nachbar(l){
    if(Math.random()<.15)return {l,ch:"nachbar",zahl:true,kind:"mc",q:"Wie viele Nachbarländer hat Deutschland?",say:"Wie viele Nachbarländer hat Deutschland?",
      opts:shuffle([7,9,12]).map(n=>({h:String(n),ok:n===9}))};
    const w=shuffle(KEIN).slice(0,2),o=shuffle([l.n,...w]);
    return {l,ch:"nachbar",kind:"mc",q:"Welches Land ist ein Nachbar von Deutschland?",say:"Welches Land ist ein Nachbar von Deutschland?",wrongs:w,opts:o.map(x=>({h:x,ok:x===l.n}))}}
};
/* Länder mit wenig Punkten kommen öfter dran */
function choose(ch,n){const out=[];let rest=L.slice();
  while(out.length<n){if(!rest.length)rest=L.filter(l=>l!==out[out.length-1]);
    const W=rest.map(l=>Math.pow(4-dots(ch==="mix"?"lage":ch,l.id),2)+.6);let r=Math.random()*W.reduce((a,b)=>a+b,0),k=0;while(r>W[k]&&k<W.length-1){r-=W[k];k++}
    out.push(rest[k]);rest.splice(k,1)}
  return out}

/* ================= Runde ================= */
let R=null;
function startRound(id){hush();const c=chOf(id);
  const tasks=choose(id,c.n).map(l=>T[id==="mix"?pick(["lage","lage","name","richtung","stadt","nachbar"]):id](l));
  R={id,i:0,ok:0,res:[],miss:[],tasks};R.n=tasks.length;showTask()}
function track(){$("#track").innerHTML=Array.from({length:R.n},(_,i)=>`<i class="${i<R.res.length?(R.res[i]?"ok":"no"):(i===R.i?"now":"")}"></i>`).join("")}
function showTask(){hush();const t=R.tasks[R.i];R.locked=false;
  app.innerHTML=`<div class="topbar"><button id="quit" aria-label="Runde beenden"></button><div class="track" id="track"></div></div>
    <div class="q"><b>${t.q}</b>${TTS.ok?`<button class="say" id="say" aria-label="Frage vorlesen">${I.spk}</button>`:""}</div>
    <section class="stage" id="cb"></section>`;
  $("#quit").onclick=home;track();
  const cb=$("#cb");
  if(t.kind==="map"){
    if(t.city)cb.insertAdjacentHTML("beforebegin",`<p class="small" style="margin-top:-6px">Tippe das Land an, in dem die Stadt liegt. Die Punkte sind die Hauptstädte.</p>`);
    cb.innerHTML=mapSVG({tap:true,mh:"62vh",dots:t.dots});
    cb.querySelectorAll("[data-l]").forEach(el=>el.addEventListener("click",()=>{if(R.locked)return;const ok=el.dataset.l===t.l.id;
      cb.innerHTML=mapSVG({mh:"62vh",cls:ok?{[t.l.id]:"ok"}:{[t.l.id]:"ok",[el.dataset.l]:"bad"},label:t.city?(ok?[]:[el.dataset.l]):ok?[t.l.id]:[t.l.id,el.dataset.l],
        dots:t.dots,sel:t.city?t.l.id:null});
      done(ok,ok?null:LAND(el.dataset.l))}))}
  else{cb.innerHTML=(t.map?mapSVG(t.map):"")+`<div class="opts ${t.dirs?"dirs":""}">${t.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.h)}</button>`).join("")}</div>`;
    cb.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.locked)return;const o=t.opts[+b.dataset.i];
      cb.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(t.opts[i].ok)x.classList.add("ok")});if(!o.ok)b.classList.add("bad");
      // Nach der Antwort zeigt die Karte das gemeinte Land
      if(t.ch==="stadt"){cb.querySelector(".map").outerHTML=mapSVG({mh:"36vh",cls:{[t.l.id]:"ok"},sel:t.l.id})}
      else if(t.ch==="nachbar"&&!t.zahl||t.ch==="richtung"&&!t.dirs){const m=cb.querySelector(".map"),h=mapSVG({mh:"36vh",cls:{[t.l.id]:"ok"},label:[t.l.id]});m?m.outerHTML=h:cb.insertAdjacentHTML("afterbegin",h)}
      done(o.ok,o.ok?null:o.h)})}
  if($("#say"))$("#say").onclick=()=>speak(t.say);
  if(S.ton)speak(t.say);
  scrollTo(0,0)}
function done(ok,wrong){if(R.locked)return;R.locked=true;const t=R.tasks[R.i],l=t.l;
  if(!t.zahl){const m=S.m[t.ch]=S.m[t.ch]||{};m[l.id]=ok?Math.min(3,(m[l.id]||0)+1):0}
  if(!S.seen.includes(l.id)&&!t.zahl)S.seen.push(l.id);save();
  R.res.push(ok);if(ok)R.ok++;else if(!t.zahl&&!R.miss.includes(l))R.miss.push(l);
  ok?sfxOk():sfxBad();track();
  let big,txt;
  if(t.zahl){big="Deutschland hat 9 Nachbarländer.";txt="Dänemark, Polen, Tschechien, Österreich, die Schweiz, Frankreich, Luxemburg, Belgien und die Niederlande."}
  else if(t.ch==="lage"){big=ok?`Das ${l.pl?"sind":"ist"} ${nm(l)}!`:`Das ${wrong.pl?"waren":"war"} ${nm(wrong)}.`;txt=ok?`${wo(l)}.`:`${Nm(l)} ${l.pl?"sind":"ist"} grün markiert. ${wo(l)}.`}
  else if(t.ch==="stadt"){big=`Die Hauptstadt ${von(l)} ist ${l.s}.`;
    txt=(t.city&&!ok?`Du hast ${nm(wrong)} angetippt. `:"")+(l.s===l.n?"Die Hauptstadt heißt genauso wie das Land. ":"")+`${wo(l)}.`}
  else if(t.ch==="name"){big=`Das ${l.pl?"sind":"ist"} ${nm(l)}.`;txt=l.f}
  else if(t.ch==="richtung"){big=`${wo(l)}.`;txt=(l.g?`Genauer gesagt im ${l.g}. `:"")+`Die Hauptstadt heißt ${l.s}.`}
  else{big=`${Nm(l)} ${l.pl?"sind":"ist"} ein Nachbar von Deutschland.`;txt=`${t.wrongs.join(" und ")} grenzen nicht an Deutschland. ${wo(l)}.`}
  const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"bad");fb.setAttribute("role","status");
  fb.innerHTML=`<strong>${ok?pick(["Richtig!","Super!","Genau!","Klasse!","Toll!"]):"Nicht ganz"}</strong><div class="big">${esc(big)}</div><p>${esc(txt)}</p>`;
  const extra=[];
  if(TTS.ok){const b=document.createElement("button");b.className="ghost";b.type="button";b.innerHTML=I.spk+"<span>Anhören</span>";b.onclick=()=>speak(big+" "+txt);extra.push(b)}
  const nx=document.createElement("button");nx.className="next";nx.type="button";nx.textContent=R.i+1>=R.n?"Ergebnis":"Weiter";
  nx.onclick=()=>{R.i++;R.i>=R.n?endRound():showTask()};
  lwSheet($("#cb"),ok,[fb,...extra,nx]);
  if(S.ton)speak(big)}
function endRound(){hush();const n=R.n,ok=R.ok,q=ok/n;const st=q>=.9?3:q>=.7?2:q>=.5?1:0;
  S.best[R.id]=Math.max(S.best[R.id]||0,st);save();
  const k=CH.findIndex(c=>c.id===R.id),nxt=CH[k+1];
  const cheer=["Weiter üben, du schaffst das!","Gut gemacht!","Stark!","Super, du kennst dich aus!"][st];
  const miss=R.miss,id=R.id;R=null;
  app.innerHTML=`<section class="result"><h2>${cheer}</h2><div class="bigstars">${[0,1,2].map(i=>I.star(i<st).replace("<svg",`<svg class="s${i+1}"`)).join("")}</div>
    <p style="font-size:1.15rem"><b>${ok} von ${n}</b> richtig</p>
    ${miss.length?`<div class="panel missed"><b>Diese übst du noch einmal:</b><ul>${miss.map(l=>`<li>${esc(l.n)}: im ${RN[l.r]}, Hauptstadt ${esc(l.s)}</li>`).join("")}</ul></div>`:""}
    <button class="go" id="again">Nochmal üben</button>
    ${nxt&&st>=2?`<button class="ghost" id="nx">Weiter: ${esc(nxt.t)}</button>`:""}
    <button class="ghost" id="hm">Alle Kapitel</button></section>`;
  if(st>=2)beep([523.25,659.25,783.99,1046.5],.2);
  if(S.ton)speak(cheer+` Du hast ${ok} von ${n} richtig.`);
  $("#again").onclick=()=>startRound(id);$("#hm").onclick=home;if($("#nx"))$("#nx").onclick=()=>openCh(nxt.id);
  scrollTo(0,0)}
